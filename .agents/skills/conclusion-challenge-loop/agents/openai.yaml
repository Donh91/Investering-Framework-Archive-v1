interface:
  display_name: Conclusion Challenge Loop
  short_description: Challenge material conclusions before assigning priority or spend.
  default_prompt: After a provisional high-value framework conclusion, verify actual sources and current original owner, test strongest countercase and economic decision divergence, then uphold, downgrade, reframe or block it once. Preserve the first verdict and report only a material change. Do not schedule, spend, trade, write, approve or merge.
policy:
  allow_implicit_invocation: false
