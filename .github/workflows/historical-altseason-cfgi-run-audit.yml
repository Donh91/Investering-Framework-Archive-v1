name: Historical Altseason CFGI Run Audit

on:
  workflow_run:
    workflows: ['Historical Altseason Lab Gate']
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit current reservation and decide whether one recovery dispatch is needed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reservation=00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION.json
          test -s "$reservation"
          python scripts/historical_lab/cfgi_idempotency_guard.py --mode check > /tmp/guard.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow historical-altseason-cfgi-enrichment.yml --limit 20 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url,event > /tmp/runs.json
          reserved_at="$(git log -1 --format=%cI -- "$reservation")"
          test -n "$reserved_at"
          RESERVATION_CREATED_AT="$reserved_at" python - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          reservation=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION.json').read_text())
          guard=json.loads(Path('/tmp/guard.json').read_text())
          runs=json.loads(Path('/tmp/runs.json').read_text())
          fp=reservation['input_fingerprint_sha256']
          assert reservation['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION_v1'
          assert reservation['semantics']=='ONE_DETERMINISTIC_RESERVATION_PER_PAID_INPUT_FINGERPRINT'
          assert fp==guard['input_fingerprint_sha256']
          reserved_at=datetime.fromisoformat(os.environ['RESERVATION_CREATED_AT'].replace('Z','+00:00'))
          recent=[]
          for r in runs:
              created=datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))
              if r.get('event')=='workflow_dispatch' and created>=reserved_at:
                  recent.append(r)
          billing=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/CFGI_BILLING.json')
          readiness=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/RESEARCH_READINESS_MANIFEST.json')
          action='DISPATCH'
          reason='RESERVED_FINGERPRINT_HAS_NO_PAID_RUN'
          if guard.get('skip_paid') is True:
              action='NO_DISPATCH'; reason='EXACT_COMPLETE_PRIOR_ENRICHMENT'
          elif billing.exists() or readiness.exists():
              action='NO_DISPATCH'; reason='PAID_OUTPUT_ALREADY_PRESENT'
          else:
              active=[r for r in recent if r.get('status') in {'queued','in_progress','waiting','pending','requested'}]
              success=[r for r in recent if r.get('status')=='completed' and r.get('conclusion')=='success']
              failed=[r for r in recent if r.get('status')=='completed' and r.get('conclusion') not in {None,'success','skipped'}]
              if active:
                  action='NO_DISPATCH'; reason='CURRENT_PAID_RUN_ACTIVE'
              elif success:
                  action='NO_DISPATCH'; reason='CURRENT_PAID_RUN_SUCCEEDED_AWAIT_PUBLISH'
              elif failed:
                  action='BLOCKED'; reason='CURRENT_PAID_RUN_FAILED_REVIEW_BEFORE_RETRY'
          out={
              'contract':'HISTORICAL_ALTSEASON_CFGI_RUN_ORCHESTRATION_AUDIT_v2',
              'workflow':'historical-altseason-cfgi-enrichment.yml',
              'reservation_fingerprint':fp,
              'reservation_created_at':os.environ['RESERVATION_CREATED_AT'],
              'idempotency_skip_paid':guard.get('skip_paid'),
              'action':action,
              'reason':reason,
              'recent_runs_since_reservation':recent,
              'all_recent_runs':runs,
              'automatic_paid_retry_after_failure':False,
          }
          path=Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_RUN_AUDIT.json')
          path.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          Path('/tmp/decision.txt').write_text(action+'\n')
          Path('/tmp/fingerprint.txt').write_text(fp+'\n')
          print(json.dumps({'action':action,'reason':reason,'fingerprint':fp,'recent_run_count':len(recent)},sort_keys=True))
          PY
          echo "action=$(cat /tmp/decision.txt)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(cat /tmp/fingerprint.txt)" >> "$GITHUB_OUTPUT"

      - name: Dispatch the already-reserved fingerprint exactly once when no paid run exists
        if: steps.decision.outputs.action == 'DISPATCH'
        env:
          GH_TOKEN: ${{ github.token }}
          RESERVED_FINGERPRINT: ${{ steps.decision.outputs.fingerprint }}
        run: |
          set -euo pipefail
          test -n "$RESERVED_FINGERPRINT"
          gh workflow run historical-altseason-cfgi-enrichment.yml --repo "$GITHUB_REPOSITORY" --ref main -f fingerprint="$RESERVED_FINGERPRINT"
          echo "HISTORICAL_CFGI_RECOVERY_DISPATCH_PASS $RESERVED_FINGERPRINT"

      - name: Refuse automatic retry after any paid-run failure
        if: steps.decision.outputs.action == 'BLOCKED'
        run: |
          echo 'A paid CFGI run failed after reservation. Automatic retry is forbidden until billing/run logs are reviewed.' >&2
          exit 1

      - name: Commit bounded orchestration audit under shared writer lock
        if: always() && steps.decision.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          path=00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_RUN_AUDIT.json
          git add "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: audit historical altseason CFGI run"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
