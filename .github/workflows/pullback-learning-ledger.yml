name: Pullback Learning Ledger

on:
  schedule:
    - cron: '55 * * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  learning:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adaptive pullback learning ledger
        run: python scripts/pullback_learning/pullback_learning_ledger.py
      - name: Validate learning contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('04_MARKET_LEARNING/pullback_learning/LATEST.json')
          d=json.loads(p.read_text())
          assert d['contract']=='PULLBACK_LEARNING_LATEST_v1'
          assert d['authority']['portfolio_execution'] is False
          assert d['authority']['canonical_market_state'] is False
          assert d['authority']['automatic_rule_changes'] is False
          assert d['authority']['research_only'] is True
          assert 'display_line' in d['data_ping_bridge']
          print(d['data_ping_bridge']['display_line'])
          PY
      - name: Commit learning observations and outcomes
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 04_MARKET_LEARNING/pullback_learning
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "learning: pullback ledger ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
