name: Blockscout Robinhood PRO smoke
on:
  push:
    paths:
      - ".github/workflows/blockscout-robinhood-pro-smoke.yml"
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Robinhood unified PRO endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone
          key=os.environ.get("BLOCKSCOUT_API_KEY","")
          ca="0xa92768863a55d8A0591709f7f5E594A249d36Ea3"
          tx="0xa5ffe87bd1e9b6b91f84bb237c2d6408a7df39cb0651f85760004712074585f3"
          endpoints={
            "address":f"https://api.blockscout.com/4663/api/v2/addresses/{ca}",
            "tx":f"https://api.blockscout.com/4663/api/v2/transactions/{tx}",
          }
          out={"contract":"BLOCKSCOUT_ROBINHOOD_PRO_SMOKE_v1","observed_at":datetime.now(timezone.utc).isoformat(),"secret_present":bool(key),"results":{}}
          for name,base in endpoints.items():
            url=base+"?"+urllib.parse.urlencode({"apikey":key})
            req=urllib.request.Request(url,headers={"User-Agent":"Investering-Framework-Blockscout-RH-Smoke/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=30) as resp:
                status=resp.status; body=resp.read()
            except urllib.error.HTTPError as exc:
              status=exc.code; body=exc.read()
            row={"status":status,"json":False,"keys":[]}
            try:
              payload=json.loads(body); row["json"]=True; row["keys"]=sorted(payload.keys()) if isinstance(payload,dict) else []
              if name=="address" and isinstance(payload,dict):
                row["hash"]=payload.get("hash"); row["is_contract"]=payload.get("is_contract"); row["is_verified"]=payload.get("is_verified")
              if name=="tx" and isinstance(payload,dict):
                row["hash"]=payload.get("hash"); row["method"]=payload.get("method"); row["tx_status"]=payload.get("status")
            except Exception:
              row["body_prefix"]=body[:120].decode("utf-8","replace")
            out["results"][name]=row
          out["success"]=bool(key) and all(r["status"]==200 and r["json"] for r in out["results"].values())
          p=pathlib.Path("research/api_agent/mcp/BLOCKSCOUT_ROBINHOOD_PRO_SMOKE_LATEST.json")
          p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Commit receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/api_agent/mcp/BLOCKSCOUT_ROBINHOOD_PRO_SMOKE_LATEST.json
          git diff --cached --quiet && exit 0
          git commit -m "test: record Robinhood Blockscout PRO smoke"
          git push
