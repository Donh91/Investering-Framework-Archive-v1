name: TypeSafe Jev Alpha Blind Replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jev-alpha-blind-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned TypeSafe SDK
        run: pip install "typesafe-sdk==0.7.0"
      - name: Verify secret without printing it
        run: test -n "$TYPESAFE_API_KEY"
      - name: Run synthetic blind replay execution canary
        run: |
          python scripts/api_agent/typesafe_jev_replay_runner.py \
            --input tests/fixtures/typesafe_jev/synthetic_blind_observation_v1.json \
            --output /tmp/jev_prediction.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/jev_prediction.json'))
          assert p['contract']=='JEV_ALPHA_LAB_CHALLENGER_PREDICTION_V1'
          assert p['challenger']=='JEV_1_13_0'
          assert p['predictions']['route'] in {'RETAIN','DEEP_DIVE','FRONTIER_REVIEW'}
          assert p['authority']['production_routing'] is False
          assert p['authority']['portfolio_action'] is False
          assert p['authority']['automatic_trading'] is False
          assert p['authority']['canonical_promotion'] is False
          assert p['prediction_sha256']
          print('JEV_ALPHA_BLIND_REPLAY_EXECUTION_PASS')
          PY
