name: Historical Altseason Free Publish

on:
  workflow_run:
    workflows: ['Historical Altseason Free Bootstrap']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated free-stage artifact from triggering run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: historical-altseason-free-stage
          path: /tmp/historical-altseason-free-stage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Refuse unbound manual publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'Manual publish is intentionally blocked because no immutable upstream artifact run is bound.' >&2
          exit 1

      - name: Install and revalidate free-stage artifacts
        run: |
          set -euo pipefail
          root=06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts
          test -d /tmp/historical-altseason-free-stage
          rm -rf "$root"
          mkdir -p "$root"
          cp -a /tmp/historical-altseason-free-stage/. "$root/"
          python - <<'PY'
          import csv,gzip,json
          from pathlib import Path
          root=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts')
          req=['FREE_SOURCE_AUDIT.json','TIME_INTEGRITY_AUDIT.json','hourly_features.csv.gz','alt_hourly_panel.csv.gz','EPISODE_CATALOG.json','EPISODE_FEATURE_MATRIX.jsonl.gz','EPISODE_MATRIX_COVERAGE.json','FREE_EVENT_PATHS.jsonl.gz','FREE_EVENT_PATHS_COVERAGE.json','BACKTEST_SUMMARY.json']
          for name in req:
              p=root/name
              assert p.exists() and p.is_file() and not p.is_symlink() and p.stat().st_size>0, name
          src=json.loads((root/'FREE_SOURCE_AUDIT.json').read_text())
          ti=json.loads((root/'TIME_INTEGRITY_AUDIT.json').read_text())
          cat=json.loads((root/'EPISODE_CATALOG.json').read_text())
          cov=json.loads((root/'FREE_EVENT_PATHS_COVERAGE.json').read_text())
          summary=json.loads((root/'BACKTEST_SUMMARY.json').read_text())
          tr=src.get('historical_transport_policy') or {}
          assert tr.get('contract')=='BINANCE_VISION_ARCHIVE_FIRST_TRANSPORT_v1'
          assert tr.get('archive_first') is True
          assert tr.get('deterministic_timestamp_reordering') is True
          assert tr.get('analysis_semantics_changed') is False
          assert ti['status']=='PASS'
          assert ti['strict_timestamp_lags'] is True
          assert ti['cross_window_lags_forbidden'] is True
          assert ti['row_offsets_treated_as_hours'] is False
          assert cat['authority']['automatic_rule_changes'] is False
          assert summary['free_hourly_feature_rows']>1000
          assert summary['episode_count']>0
          assert cov['events']
          print('FREE_STAGE_PUBLISH_REVALIDATION_PASS', summary['free_hourly_feature_rows'], summary['episode_count'])
          PY

      - name: Commit free-stage research artifacts under shared writer lock
        run: |
          set -euo pipefail
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          git add 06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/
          if git diff --cached --quiet; then
            echo 'No free-stage artifact changes'
            exit 0
          fi
          bad="$(git diff --cached --name-only | grep -v '^06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected staged paths:" >&2
            echo "$bad" >&2
            exit 1
          fi
          git commit -m "research: historical altseason free bootstrap ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo 'HISTORICAL_FREE_PUBLISH_REMOTE_READBACK_PASS'
