name: Historical Altseason Free Publish

on:
  workflow_run:
    workflows: ['Historical Altseason Free Bootstrap']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated free-stage artifact from triggering run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: historical-altseason-free-stage
          path: /tmp/historical-altseason-free-stage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Refuse unbound manual publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'Manual publish is intentionally blocked because no immutable upstream artifact run is bound.' >&2
          exit 1

      - name: Detect immutable paid terminal state
        id: terminal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/RESEARCH_READINESS_MANIFEST.json')
          locked=False
          if p.exists():
              try:
                  m=json.loads(p.read_text())
                  locked=(m.get('contract')=='RESEARCH_READINESS_MANIFEST_v3_1_PROVIDER_BOUNDED' and m.get('readiness_verdict')=='PASS' and not m.get('blockers'))
              except Exception:
                  locked=False
          with open('/tmp/terminal_lock','w') as fh: fh.write('true' if locked else 'false')
          print('HISTORICAL_ALTSEASON_TERMINAL_LOCK',locked)
          PY
          echo "locked=$(cat /tmp/terminal_lock)" >> "$GITHUB_OUTPUT"

      - name: Revalidate free-stage artifact without touching paid outputs
        if: steps.terminal.outputs.locked != 'true'
        env:
          FREE_STAGE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          src=/tmp/historical-altseason-free-stage
          root=06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts
          test -d "$src"
          python - <<'PY'
          import csv,gzip,hashlib,json,os
          from pathlib import Path
          src=Path('/tmp/historical-altseason-free-stage')
          req=['FREE_SOURCE_AUDIT.json','TIME_INTEGRITY_AUDIT.json','hourly_features.csv.gz','alt_hourly_panel.csv.gz','EPISODE_CATALOG.json','EPISODE_FEATURE_MATRIX.jsonl.gz','EPISODE_MATRIX_COVERAGE.json','FREE_EVENT_PATHS.jsonl.gz','FREE_EVENT_PATHS_COVERAGE.json','BACKTEST_SUMMARY.json']
          for name in req:
              p=src/name
              assert p.exists() and p.is_file() and not p.is_symlink() and p.stat().st_size>0, name
          s=json.loads((src/'FREE_SOURCE_AUDIT.json').read_text()); ti=json.loads((src/'TIME_INTEGRITY_AUDIT.json').read_text()); cat=json.loads((src/'EPISODE_CATALOG.json').read_text()); cov=json.loads((src/'FREE_EVENT_PATHS_COVERAGE.json').read_text()); summary=json.loads((src/'BACKTEST_SUMMARY.json').read_text())
          tr=s.get('historical_transport_policy') or {}
          assert tr.get('contract')=='BINANCE_VISION_ARCHIVE_FIRST_TRANSPORT_v1' and tr.get('archive_first') is True and tr.get('deterministic_timestamp_reordering') is True and tr.get('analysis_semantics_changed') is False
          assert ti['status']=='PASS' and ti['strict_timestamp_lags'] is True and ti['cross_window_lags_forbidden'] is True and ti['row_offsets_treated_as_hours'] is False
          assert cat['authority']['automatic_rule_changes'] is False and summary['free_hourly_feature_rows']>1000 and summary['episode_count']>0 and cov['events']
          panel=src/'alt_hourly_panel.csv.gz'
          with gzip.open(panel,'rt') as fh:
              first=next(csv.DictReader(fh)); assert first['liquidity_cohort_proxy'] in {'LOW','MID','HIGH'} and 'return_24h_pct' in first
          h=hashlib.sha256(panel.read_bytes()).hexdigest()
          pointer={'contract':'HISTORICAL_ALTSEASON_FREE_BULK_POINTER_v1','storage_class':'GITHUB_ACTIONS_ARTIFACT_BULK_NOT_GIT','artifact_name':'historical-altseason-free-stage','source_run_id':int(os.environ['FREE_STAGE_RUN_ID']),'retention_days':30,'required_for_cowork_bundle':True,'files':[{'name':'alt_hourly_panel.csv.gz','size_bytes':panel.stat().st_size,'sha256':h}],'authority':{'research_only':True,'portfolio_execution':False}}
          Path('/tmp/FREE_BULK_ARTIFACT_POINTER.json').write_text(json.dumps(pointer,indent=2,sort_keys=True)+'\n')
          print('FREE_STAGE_REVALIDATION_PASS',summary['free_hourly_feature_rows'],summary['episode_count'],pointer['source_run_id'],h)
          PY
          mkdir -p "$root"
          for name in FREE_SOURCE_AUDIT.json TIME_INTEGRITY_AUDIT.json hourly_features.csv.gz EPISODE_CATALOG.json EPISODE_FEATURE_MATRIX.jsonl.gz EPISODE_MATRIX_COVERAGE.json FREE_EVENT_PATHS.jsonl.gz FREE_EVENT_PATHS_COVERAGE.json BACKTEST_SUMMARY.json; do
            cp "$src/$name" "$root/$name"
          done
          cp /tmp/FREE_BULK_ARTIFACT_POINTER.json "$root/FREE_BULK_ARTIFACT_POINTER.json"
          rm -f "$root/alt_hourly_panel.csv.gz"
          test ! -e "$root/alt_hourly_panel.csv.gz"

      - name: Preserve immutable paid state
        if: steps.terminal.outputs.locked == 'true'
        run: |
          echo 'TERMINAL_V3_1_LOCK_ACTIVE - free artifact retained in Actions only; no research artifact paths modified.'

      - name: Commit allowlisted free metadata under shared writer lock
        if: steps.terminal.outputs.locked != 'true'
        run: |
          set -euo pipefail
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          allow='^(06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/(FREE_SOURCE_AUDIT.json|TIME_INTEGRITY_AUDIT.json|hourly_features.csv.gz|EPISODE_CATALOG.json|EPISODE_FEATURE_MATRIX.jsonl.gz|EPISODE_MATRIX_COVERAGE.json|FREE_EVENT_PATHS.jsonl.gz|FREE_EVENT_PATHS_COVERAGE.json|BACKTEST_SUMMARY.json|FREE_BULK_ARTIFACT_POINTER.json))$'
          git add 06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/
          if git diff --cached --quiet; then echo 'No free-stage artifact changes'; exit 0; fi
          bad="$(git diff --cached --name-only | grep -Ev "$allow" || true)"
          if [ -n "$bad" ]; then echo 'FREE_STAGE_ATTEMPTED_NON_ALLOWLIST_WRITE' >&2; echo "$bad" >&2; exit 1; fi
          git commit -m "research: historical altseason free metadata ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo 'HISTORICAL_FREE_PUBLISH_REMOTE_READBACK_PASS'
