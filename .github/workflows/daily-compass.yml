name: Official Daily Compass

on:
  pull_request:
    paths:
      - '.github/workflows/daily-compass.yml'
      - '.github/workflows/compass-outcomes.yml'
      - 'scripts/data_ping/native_handlekompas.py'
      - 'scripts/learning/compass_outcomes.py'
      - 'scripts/learning/decision_economics_ledger.py'
      - 'research/decision_economics/**'
      - 'tests/data_ping/test_official_daily_compass.py'
      - 'tests/learning/test_compass_outcomes.py'
      - 'tests/learning/test_decision_economics_ledger.py'
      - '04_MARKET_LEARNING/handlekompas/**'
      - '05_CYCLE_NAVIGATOR/site/**'
      - 'AGENTS.md'
  schedule:
    # Two investor-facing freezes at 08:17 and 20:17 Europe/Copenhagen.
    # GitHub cron is UTC-only, so both CET and CEST candidates are scheduled.
    # The slot gate below activates exactly one candidate per local slot.
    - cron: '17 6 * * *'
      timezone: 'UTC'
    - cron: '17 7 * * *'
      timezone: 'UTC'
    - cron: '17 18 * * *'
      timezone: 'UTC'
    - cron: '17 19 * * *'
      timezone: 'UTC'
  workflow_dispatch:
    inputs:
      run_reason:
        description: 'Optional governed run reason for recovery'
        required: false
        type: choice
        options:
          - ON_DEMAND
          - EVENT_DRIVEN
          - SCHEDULED_MORNING
          - SCHEDULED_EVENING
        default: ON_DEMAND

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run focused Compass tests
        run: |
          python -m py_compile scripts/data_ping/native_handlekompas.py scripts/learning/compass_outcomes.py scripts/learning/decision_economics_ledger.py
          python -m unittest tests.data_ping.test_native_handlekompas -v
          python -m unittest tests.data_ping.test_official_daily_compass -v
          python -m unittest tests.learning.test_compass_outcomes -v
          python -m unittest tests.learning.test_decision_economics_ledger -v
      - name: Deterministic current-state dry run
        run: |
          python scripts/data_ping/native_handlekompas.py --official-daily-compass --run-reason PR_VALIDATION --no-write > /tmp/compass.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/compass.json'))
          assert d['contract']=='OFFICIAL_DAILY_COMPASS_v1'
          assert d['schema_version']==2
          assert set(d['horizons'])=={'NEXT_12H','NEXT_1_3D','NEXT_5_7D','CYCLE_ALTCOINS_3_8W'}
          alt=d['horizons']['CYCLE_ALTCOINS_3_8W']
          if alt['expected_direction']=='UNAVAILABLE':
              assert alt.get('warning') is None
          else:
              assert alt['warning'] in {'NONE','PARABOLIC_ALTSEASON_WARNING','DISTRIBUTION_WARNING','EXIT_WARNING','STRUCTURAL_BREAKDOWN_WARNING'}
          assert [r['segment'] for r in d['capitalization_ladder']]==['BTC','ETH','LARGE_CAPS','MID_CAPS','SMALL_CAPS','MICROCAPS']
          p=d['protection_tracker']
          assert p['contract']=='COMPASS_PROTECTION_TRACKER_v1'
          assert p['pullback_risk_state'] in {'NORMAL','BUILDING','ELEVATED','HIGH','CONFIRMED','UNAVAILABLE'}
          assert p['distribution_risk'] in {'NONE','WARNING','CONFIRMED','UNKNOWN'}
          assert p['reentry_state'] in {'INACTIVE','WAIT_FOR_FLUSH','WAIT_FOR_RECLAIM','REVIEW','UNAVAILABLE'}
          assert p['authority']['portfolio_execution'] is False
          assert p['authority']['wallet_specific'] is False
          assert d['authority']['portfolio_execution'] is False
          assert d['authority']['post_hoc_rewrite'] is False
          assert d['market_reference'].get('btc_usdt') != 0 or d['market_reference'].get('btc_usdt') is None
          PY

  freeze:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Copenhagen schedule slot
        id: slot
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "reason=${{ inputs.run_reason || 'ON_DEMAND' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Europe/Copenhagen"))
          print(int(now.utcoffset().total_seconds()//3600))
          PY
          )
          cron='${{ github.event.schedule }}'
          active=false
          reason=
          case "$cron:$offset" in
            '17 6 * * *:2'|'17 7 * * *:1') active=true; reason=SCHEDULED_MORNING ;;
            '17 18 * * *:2'|'17 19 * * *:1') active=true; reason=SCHEDULED_EVENING ;;
          esac
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "COMPASS_SLOT_GATE cron=$cron cph_utc_offset=$offset active=$active reason=$reason"
      - name: Produce immutable Compass freeze
        if: steps.slot.outputs.active == 'true'
        shell: bash
        run: |
          reason="${{ steps.slot.outputs.reason }}"
          echo "COMPASS_RUN_REASON=$reason"
          python scripts/data_ping/native_handlekompas.py \
            --official-daily-compass \
            --run-reason "$reason" \
            --output-root 04_MARKET_LEARNING/handlekompas/official \
            | tee /tmp/official-compass-status.json
      - name: Validate pointer and public projection binding
        if: steps.slot.outputs.active == 'true'
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          status=json.load(open('/tmp/official-compass-status.json'))
          if status.get('status')=='EXISTING_DAILY_FREEZE':
              print('OFFICIAL_COMPASS_EXISTING_DAILY_FREEZE', status.get('compass_id'))
          pointer=json.loads(Path('04_MARKET_LEARNING/handlekompas/official/LATEST_COMPASS.json').read_text())
          freeze=Path(pointer['compass_path'])
          public=Path(pointer['public_projection_path'])
          assert freeze.exists() and public.exists()
          f=json.loads(freeze.read_text()); p=json.loads(public.read_text())
          assert f['compass_id']==pointer['compass_id']==p['compass_id']
          assert f['compass_sha256']==pointer['compass_sha256']
          assert p['projection_sha256']==pointer['public_projection_sha256']
          assert hashlib.sha256(freeze.read_bytes()).hexdigest()==pointer['compass_content_sha256']
          assert hashlib.sha256(public.read_bytes()).hexdigest()==pointer['public_projection_content_sha256']
          assert f['authority']['portfolio_execution'] is False
          assert 'source_bindings' not in p and 'evidence_snapshot' not in p
          assert p['protection_tracker']['contract']=='COMPASS_PROTECTION_TRACKER_v1'
          assert p['protection_tracker']['authority']['portfolio_execution'] is False
          assert p['protection_tracker']['authority']['wallet_specific'] is False
          protection_text=json.dumps(p['protection_tracker']).lower()
          assert not any(k in p['protection_tracker'] for k in ('wallet_address','holdings','positions','portfolio_actions'))
          assert not __import__('re').search(r'0x[a-f0-9]{8,}', protection_text)
          print('OFFICIAL_COMPASS_VALID', f['compass_id'], f['data_status'], p['protection_tracker']['pullback_risk_state'], p['protection_tracker']['reentry_state'])
          PY
      - name: Commit with remote readback proof
        if: steps.slot.outputs.active == 'true'
        shell: bash
        run: |
          git config user.name framework-data-bot
          git config user.email framework-data-bot@users.noreply.github.com
          git add 04_MARKET_LEARNING/handlekompas/official
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "learning: official daily Compass ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          local_sha=$(sha256sum 04_MARKET_LEARNING/handlekompas/official/LATEST_COMPASS.json | awk '{print $1}')
          remote_sha=$(git show origin/main:04_MARKET_LEARNING/handlekompas/official/LATEST_COMPASS.json | sha256sum | awk '{print $1}')
          [ "$local_sha" = "$remote_sha" ]
      - name: Publish current Compass to Cycle Navigator Pages
        if: steps.slot.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cycle-navigator-pages.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always() && steps.slot.outputs.active == 'true'
        with:
          name: official-daily-compass-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/official-compass-status.json
            04_MARKET_LEARNING/handlekompas/official/LATEST_COMPASS.json
            04_MARKET_LEARNING/handlekompas/official/PUBLIC_LATEST_COMPASS.json
          retention-days: 30
          if-no-files-found: warn

  incident:
    needs: freeze
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Open Compass incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "AUTOMATION FAILURE: Official Daily Compass ${GITHUB_RUN_ID}" --body "Official Daily Compass failed closed. No portfolio action was executed. Inspect the Native Handlekompas / Auto Market State owner chain. Run: ${GITHUB_RUN_ID}" || true
