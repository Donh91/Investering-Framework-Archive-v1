name: Owner-Bound Daily Director Manual

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - 'scripts/api_agent/**'
      - 'scripts/daily_capture/persist_raw_payloads.py'
      - 'tests/api_agent/**'
      - '04_MARKET_LEARNING/legacy_framework_knowledge_bootstrap_v1/**'
      - '.github/workflows/owner-bound-daily-director-manual.yml'
      - 'research/api_agent/**'
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run, explicit live Director, or single owner-only Astra High Task2 call
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live, astra-high-task2]
      owner_confirm:
        description: 'Required only for Astra High: ASTRA-TASK2-1596-ONE-POST'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  director:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'astra-high-task2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and compile
        run: |
          python -m unittest tests.api_agent.test_owner_bound_director_context
          python -m unittest tests.api_agent.test_manual_astra_task2_high_v1 -v
          python -m unittest tests.api_agent.test_manual_astra_task2_realdata_v2 -v
          python -m py_compile scripts/api_agent/manual_astra_task2_realdata_v2.py
          python -m py_compile scripts/api_agent/manual_astra_task2_high_v1.py
          python -m py_compile scripts/api_agent/build_owner_bound_director_context.py scripts/api_agent/check_delta_ready.py scripts/api_agent/materialize_forecast_candidates.py scripts/api_agent/api_gateway.py scripts/daily_capture/persist_raw_payloads.py
      - name: Build owner-bound context
        run: |
          mkdir -p owner-bound-director-input
          python scripts/api_agent/build_owner_bound_director_context.py \
            --capture-root 03_DAILY_CAPTURE_LOGS/captures \
            --legacy-root 04_MARKET_LEARNING/legacy_framework_knowledge_bootstrap_v1 \
            --output owner-bound-director-input/context.json
          echo 'Produce shadow evidence and unratified forecast candidates only. Legacy research is non-binding and may only be matched or contradicted by current evidence.' > owner-bound-director-input/prompt.txt
      - name: Run gateway dry
        if: github.event_name == 'pull_request' || inputs.mode == 'dry-run'
        run: python scripts/api_agent/api_gateway.py --task DAILY_DIRECTOR_SHADOW --registry research/api_agent/API_TASK_REGISTRY_v1.json --prompt-file owner-bound-director-input/prompt.txt --context-file owner-bound-director-input/context.json --output-dir owner-bound-director-output --intended-write-prefix research/api_agent/outputs/daily/ --dry-run
      - name: Run explicit live call
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/api_agent/api_gateway.py --task DAILY_DIRECTOR_SHADOW --registry research/api_agent/API_TASK_REGISTRY_v1.json --prompt-file owner-bound-director-input/prompt.txt --context-file owner-bound-director-input/context.json --output-dir owner-bound-director-output --intended-write-prefix research/api_agent/outputs/daily/
      - name: Verify owner binding and authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('owner-bound-director-input/context.json').read_text())
          o=json.loads(Path('owner-bound-director-output/output.json').read_text())
          r=json.loads(Path('owner-bound-director-output/receipt.json').read_text())
          assert c['contract'] in {'OWNER_BOUND_DAILY_DIRECTOR_CONTEXT_v2','OWNER_BOUND_DAILY_DIRECTOR_CONTEXT_v3','OWNER_BOUND_DAILY_DIRECTOR_CONTEXT_v4'}
          assert c['latest_capture']['run_id']
          assert c['legacy_research_context']['canonical_evidence'] is False
          assert c['legacy_research_context']['authority']=='RESEARCH_CONTEXT_ONLY'
          assert isinstance(o['forecast_candidates'],list)
          assert r['authority']['portfolio_action'] is False
          assert r['estimated_cost_usd'] <= 1.5
          print('OWNER_BOUND_DAILY_DIRECTOR_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: owner-bound-daily-director-${{ github.run_id }}
          path: |
            owner-bound-director-input/context.json
            owner-bound-director-output/
          retention-days: 14
          if-no-files-found: error

  astra-high-task2:
    # Owner-launched one-shot. Existing Director and autonomous Sol routes remain separate.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'astra-high-task2' &&
      inputs.owner_confirm == 'ASTRA-TASK2-1596-ONE-POST' &&
      github.actor == 'Donh91' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: manual-astra-high-task2-20261113-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test one-shot safety and compile without billing
        run: |
          python -m py_compile scripts/api_agent/manual_astra_task2_high_v1.py
          python -m unittest tests.api_agent.test_manual_astra_task2_high_v1 -v
      - name: Enforce existing monthly OpenAI budget and reserve before paid operation
        run: >-
          python scripts/api_agent/check_monthly_cost_guard.py
          --receipt-root research/api_agent/outputs
          --hard-stop-usd 40 --reserve-usd 4
          --new-request-upper-usd 0  # USD3 Astra pre-reserved in shared ledger
      - name: Prepare immutable public-only source bundle and price bound
        run: python scripts/api_agent/manual_astra_task2_high_v1.py prepare --output-dir runtime/astra-task2
      - name: Verify owner, native claim census and project model GET; reserve once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ASTRA_OWNER_CONFIRM: ${{ inputs.owner_confirm }}
        run: python scripts/api_agent/manual_astra_task2_high_v1.py reserve --output-dir runtime/astra-task2
      - name: Persist nonbillable one-use claim BEFORE any paid POST
        uses: actions/upload-artifact@v4
        with:
          name: astra-task2-20261113-one-paid-attempt-claim
          path: |
            runtime/astra-task2/claim.json
            runtime/astra-task2/source_manifest.json
          retention-days: 90
          if-no-files-found: error
      - name: Submit exactly ONE paid Astra High background Responses API call
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/api_agent/manual_astra_task2_high_v1.py submit --output-dir runtime/astra-task2
      - name: Persist attempt and response handle even on ambiguous failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-task2-20261113-attempt-${{ github.run_id }}
          path: |
            runtime/astra-task2/attempt.json
            runtime/astra-task2/response_handle.json
            runtime/astra-task2/source_manifest.json
          retention-days: 90
          if-no-files-found: warn
      - name: GET-only collection, no paid retry or duplicate POST
        if: success()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/api_agent/manual_astra_task2_high_v1.py collect --output-dir runtime/astra-task2
      - name: Preserve public research output, source hashes and cost receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-task2-20261113-research-${{ github.run_id }}
          path: |
            runtime/astra-task2/source_manifest.json
            runtime/astra-task2/response_handle.json
            runtime/astra-task2/receipt.json
            runtime/astra-task2/research_output.md
          retention-days: 90
          if-no-files-found: warn

  astra-realdata-task2-v2:
    # Explicit one-time owner issue_comment. No new schedulers, no TinyFish.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1596 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.login == 'Donh91' &&
      github.actor == 'Donh91' &&
      contains(github.event.comment.body, '[TASK2_ASTRA_REALDATA_V2_20261113]') &&
      contains(github.event.comment.body, 'owner_go=TASK2-ASTRA-V2-10USD')
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: owner-one-shot-astra-task2-realdata-v2-20261113
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real sources, 14 replay tests, and 12 paid-attempt safety tests
        run: |
          python -m py_compile scripts/api_agent/manual_astra_task2_realdata_v2.py
          python -m unittest tests.api_agent.test_manual_astra_task2_realdata_v2 -v
          python -m unittest discover -s tests/research -p 'test_task2_realdata_challenger_w39_w46_v1.py' -v
      - name: Enforce canonical shared budget including full USD10 reservation
        run: >-
          python scripts/api_agent/check_monthly_cost_guard.py
          --receipt-root research/api_agent/outputs
          --hard-stop-usd 40 --reserve-usd 4 --new-request-upper-usd 0
      - name: Build immutable broad PUBLIC Task2/HRE/Research Lab data and verified calculations
        run: python -m scripts.api_agent.manual_astra_task2_realdata_v2 prepare --out-dir runtime/task2-astra-realdata-v2
      - name: Verify owner, native GitHub issue and one-shot USD10; create durable claim
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.api_agent.manual_astra_task2_realdata_v2 reserve --out-dir runtime/task2-astra-realdata-v2
      - name: Persist original owner one-use claim BEFORE upload and paid Responses POST
        uses: actions/upload-artifact@v4
        with:
          name: task2-astra-realdata-v2-owner-claim
          path: |
            runtime/task2-astra-realdata-v2/source_manifest.json
            runtime/task2-astra-realdata-v2/claim.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload PUBLIC research ZIP as Code Interpreter file once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.api_agent.manual_astra_task2_realdata_v2 upload --out-dir runtime/task2-astra-realdata-v2
      - name: Submit exactly ONE Astra High + Code Interpreter research POST
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.api_agent.manual_astra_task2_realdata_v2 submit --out-dir runtime/task2-astra-realdata-v2
      - name: Persist response/attempt handles even if ambiguous HTTP network result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-astra-realdata-v2-attempt-${{ github.run_id }}
          path: |
            runtime/task2-astra-realdata-v2/file_upload_attempt.json
            runtime/task2-astra-realdata-v2/file_handle.json
            runtime/task2-astra-realdata-v2/paid_post_attempt.json
            runtime/task2-astra-realdata-v2/response_handle.json
            runtime/task2-astra-realdata-v2/source_manifest.json
          retention-days: 90
          if-no-files-found: warn
      - name: Retrieve or cancel existing response even if attempt-artifact upload failed
        # An artifact upload failure may not abandon a billable background response.
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if test -s runtime/task2-astra-realdata-v2/response_handle.json; then
            python -m scripts.api_agent.manual_astra_task2_realdata_v2 collect --out-dir runtime/task2-astra-realdata-v2
          elif test -f runtime/task2-astra-realdata-v2/paid_post_attempt.json; then
            echo 'PAID_POST_OUTCOME_UNKNOWN_NO_RESPONSE_HANDLE_NO_RETRY' >&2
            exit 1
          else
            echo 'NO_PAID_POST_ATTEMPT_NO_PROVIDER_RESPONSE'
          fi
      - name: Publish source-bound native completion receipt to original Task2 owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.api_agent.manual_astra_task2_realdata_v2 notify --out-dir runtime/task2-astra-realdata-v2
      - name: Preserve FULL source ZIP, manifest, prompt, actual receipts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-astra-realdata-v2-evidence-${{ github.run_id }}
          path: |
            runtime/task2-astra-realdata-v2/task2_astra_realdata_public_bundle_v2.zip
            runtime/task2-astra-realdata-v2/source_manifest.json
            runtime/task2-astra-realdata-v2/prompt.txt
            runtime/task2-astra-realdata-v2/claim.json
            runtime/task2-astra-realdata-v2/file_handle.json
            runtime/task2-astra-realdata-v2/response_handle.json
            runtime/task2-astra-realdata-v2/cancel_attempt.json
            runtime/task2-astra-realdata-v2/cancel_confirmation.json
            runtime/task2-astra-realdata-v2/cancel_unverified.json
            runtime/task2-astra-realdata-v2/receipt.json
            runtime/task2-astra-realdata-v2/research_output.md
          retention-days: 90
          if-no-files-found: warn
