name: T4 Microstructure Live Readback

on:
  pull_request:
    paths:
      - '.github/workflows/t4-microstructure-live-readback.yml'
      - 'research/programs/MARKET_ANTICIPATION_RESEARCH_PROGRAM_v1/T4_MICROSTRUCTURE_LIVE_READBACK_TRIGGER.txt'
      - 'scripts/data_terminal/binance_spot_microstructure_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run microstructure unit tests
        run: python -m unittest tests.data_terminal.test_binance_spot_microstructure_source
      - name: Compile source capture
        run: python -m py_compile scripts/data_terminal/binance_spot_microstructure_source.py tests/data_terminal/test_binance_spot_microstructure_source.py
      - name: Run explicit live microstructure capture
        run: python scripts/data_terminal/binance_spot_microstructure_source.py --output-dir binance-spot-microstructure-live-output
      - name: Verify artifact readback
        run: python -c "import importlib.util,pathlib,sys; p=pathlib.Path('scripts/data_terminal/binance_spot_microstructure_source.py'); s=importlib.util.spec_from_file_location('m',p); m=importlib.util.module_from_spec(s); sys.modules['m']=m; s.loader.exec_module(m); r=m.verify(pathlib.Path('binance-spot-microstructure-live-output')); print(r); raise SystemExit(0 if r['status']=='PASS' else 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: t4-microstructure-live-${{ github.run_id }}
          path: binance-spot-microstructure-live-output/
          retention-days: 30
          if-no-files-found: error
