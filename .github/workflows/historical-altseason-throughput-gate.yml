          assert addj['operational_health']['run_audit_daily_summary_readback_semantics']=='VERIFY_PUBLISH_RECEIPT_POST_PUSH_READBACK_PASS'
          assert addj['operational_health']['run_audit_daily_summary_artifact_semantics']=='VERIFY_PUBLISH_ARTIFACT_FRESH_FOR_UPSTREAM_RUN'
          assert addj['operational_health']['run_audit_daily_summary_audit_semantics']=='VERIFY_LATEST_APPEND_ONLY_AUDIT_ROW_FRESH_AND_NON_FAILURE'
