          assert addj['operational_health']['run_audit_daily_summary_scheduler_owner']=='historical-altseason-cfgi-run-audit.yml'
          assert addj['operational_health']['run_audit_daily_summary_scheduler_cron']=='23 5 * * *'
          assert addj['operational_health']['run_audit_daily_summary_scheduler_reason']=='FRESHNESS_OBSERVABILITY_WITHOUT_NEW_API_CALLS'
