name: Historical Altseason Throughput Safety Gate

on:
  pull_request:
    paths:
      - 'scripts/historical_lab/free_altseason_bootstrap_parallel.py'
      - 'scripts/historical_lab/cfgi_idempotency_guard.py'
      - '.github/workflows/historical-altseason-free-bootstrap.yml'
      - '.github/workflows/historical-altseason-free-publish.yml'
      - '.github/workflows/historical-altseason-cfgi-reservation.yml'
      - '.github/workflows/historical-altseason-cfgi-enrichment.yml'
      - '.github/workflows/historical-altseason-cfgi-publish.yml'
      - '.github/workflows/historical-altseason-cfgi-run-audit.yml'
      - '.github/workflows/historical-altseason-throughput-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/historical_lab/free_altseason_bootstrap_parallel.py'
      - 'scripts/historical_lab/cfgi_idempotency_guard.py'
      - '.github/workflows/historical-altseason-free-bootstrap.yml'
      - '.github/workflows/historical-altseason-free-publish.yml'
      - '.github/workflows/historical-altseason-cfgi-reservation.yml'
      - '.github/workflows/historical-altseason-cfgi-enrichment.yml'
      - '.github/workflows/historical-altseason-cfgi-publish.yml'
      - '.github/workflows/historical-altseason-cfgi-run-audit.yml'
      - '.github/workflows/historical-altseason-throughput-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile transport and idempotency helpers
        run: |
          python -m py_compile scripts/historical_lab/free_altseason_bootstrap_parallel.py
          python -m py_compile scripts/historical_lab/cfgi_idempotency_guard.py
          python -m py_compile scripts/historical_lab/free_altseason_bootstrap_resilient.py
          python -m py_compile scripts/historical_lab/cfgi_targeted_backfill.py
          python -m py_compile scripts/historical_lab/cfgi_readiness_postprocess.py
      - name: Prove transport-only archive-first parallelization contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/historical_lab/free_altseason_bootstrap_parallel.py').read_text()
          w=Path('.github/workflows/historical-altseason-free-bootstrap.yml').read_text()
          pub=Path('.github/workflows/historical-altseason-free-publish.yml').read_text()
          assert 'ThreadPoolExecutor' in p and 'MAX_WORKERS = 24' in p and 'DEFAULT_WORKERS = 12' in p
          assert 'prefer_daily_before = datetime(2022, 1, 1' in p and 'resilient._vision_daily' in p
          assert 'daily_rows.sort(key=lambda row: int(row[0]))' in p
          assert 'resilient.vision_klines = parallel_vision_klines' in p
          assert 'BINANCE_REST_BYPASSED_ARCHIVE_FIRST_REPRODUCIBILITY' in p
          assert 'BINANCE_VISION_ARCHIVE_FIRST_TRANSPORT_v1' in p
          assert '"archive_first": True' in p and 'analysis_semantics_changed": False' in p
          for forbidden in ['build_features =','build_episodes =','continuation_controls =','episode_drawdown_trigger_pct','episode_recovery_fraction']:
              assert forbidden not in p,forbidden
          assert 'free_altseason_bootstrap_parallel.py' in w
          assert "HISTORICAL_VISION_MAX_WORKERS: '12'" in w and 'timeout-minutes: 120' in w
          assert 'permissions:\n  contents: read' in w and 'git add ' not in w
          assert 'actions/upload-artifact@v4' in w and 'historical-altseason-free-stage' in w
          assert 'group: historical-altseason-free-bootstrap' in w
          assert 'group: framework-main-writer' in pub
          assert 'actions/download-artifact@v4' in pub and 'historical-altseason-free-stage' in pub
          assert 'git add 06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/' in pub
          assert 'git rebase --abort' in pub and 'git fetch origin main' in pub
          assert 'git merge-base --is-ancestor HEAD origin/main' in pub
          print('HISTORICAL_ARCHIVE_FIRST_SPLIT_TRANSPORT_PASS')
          PY
      - name: Prove deterministic reservation and explicit fingerprint-bound paid dispatch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/historical_lab/cfgi_idempotency_guard.py').read_text()
          reserve=Path('.github/workflows/historical-altseason-cfgi-reservation.yml').read_text()
          w=Path('.github/workflows/historical-altseason-cfgi-enrichment.yml').read_text()
          pub=Path('.github/workflows/historical-altseason-cfgi-publish.yml').read_text()
          audit=Path('.github/workflows/historical-altseason-cfgi-run-audit.yml').read_text()
          reservation_path='00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION.json'
          for required in ['CFGI_TARGETED_INPUT_FINGERPRINT_v1','EXACT_COMPLETE_PRIOR_ENRICHMENT','RESEARCH_READINESS_MANIFEST.json','historical_findings_max_classification','FORWARD_TEST','automatic_promotion']:
              assert required in p,required
          assert "workflows: ['Historical Altseason Free Publish']" in reserve
          assert 'group: framework-main-writer' in reserve and 'actions: write' in reserve
          assert 'ONE_DETERMINISTIC_RESERVATION_PER_PAID_INPUT_FINGERPRINT' in reserve
          assert 'CFGI_RESERVATION_UNCHANGED' in reserve and reservation_path in reserve
          assert 'cfgi_idempotency_guard.py --mode check' in reserve
          assert "steps.reservation.outputs.changed == 'true'" in reserve
          assert 'gh workflow run historical-altseason-cfgi-enrichment.yml' in reserve
          assert reservation_path in w
          assert 'workflow_dispatch:' in w and 'fingerprint:' in w
          assert 'DISPATCH_FINGERPRINT' in w
          assert "dispatched==reservation['input_fingerprint_sha256']==guard['input_fingerprint_sha256']" in w
          assert 'Verify CFGI secret only after reservation binding passes' in w
          assert 'cfgi_idempotency_guard.py --mode check' in w
          assert "steps.idempotency.outputs.skip_paid != 'true'" in w
          assert "steps.idempotency.outputs.skip_paid == 'true'" in w
          assert 'cfgi_idempotency_guard.py --mode stamp' in w
          assert 'BINANCE_VISION_ARCHIVE_FIRST_TRANSPORT_v1' in w
          assert 'HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION_v1' in w
          dispatch_pre=w.index('Verify dispatch fingerprint, deterministic reservation and final free stage before secret access')
          secret=w.index('Verify CFGI secret only after reservation binding passes')
          guard=w.index('Check exact paid-input idempotency')
          paid_step=w.index('Target CFGI only after objective episode selection and reservation')
          assert dispatch_pre < secret < guard < paid_step
          assert 'permissions:\n  contents: read' in w and 'git add ' not in w
          assert 'actions/upload-artifact@v4' in w and 'historical-altseason-cfgi-stage' in w
          assert 'group: historical-altseason-cfgi-enrichment' in w
          assert 'group: framework-main-writer' in pub and 'actions: write' in pub
          assert 'actions/download-artifact@v4' in pub and 'historical-altseason-cfgi-stage' in pub
          assert 'RESEARCH_READINESS_MANIFEST.json' in pub
          assert 'git add 06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/' in pub
          assert 'FREE_BULK_ARTIFACT_POINTER.json' in pub and 'alt_hourly_panel.csv.gz' in pub
          assert 'gh workflow run cowork-historical-altseason-bundle.yml' in pub
          assert "steps.publish.outputs.published == 'true'" in pub
          assert "workflows: ['Historical Altseason Lab Gate']" in audit
          assert 'actions: write' in audit and 'group: framework-main-writer' in audit
          assert 'RESERVED_FINGERPRINT_HAS_NO_PAID_RUN' in audit
          assert 'CURRENT_PAID_RUN_FAILED_REVIEW_BEFORE_RETRY' in audit
          assert 'automatic_paid_retry_after_failure' in audit
          assert 'gh workflow run historical-altseason-cfgi-enrichment.yml' in audit
          print('CFGI_EXPLICIT_DISPATCH_IDEMPOTENCY_PASS')
          PY
      - name: Prove compute-publish writer boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          free=Path('.github/workflows/historical-altseason-free-bootstrap.yml').read_text()
          free_pub=Path('.github/workflows/historical-altseason-free-publish.yml').read_text()
          reserve=Path('.github/workflows/historical-altseason-cfgi-reservation.yml').read_text()
          paid=Path('.github/workflows/historical-altseason-cfgi-enrichment.yml').read_text()
          paid_pub=Path('.github/workflows/historical-altseason-cfgi-publish.yml').read_text()
          audit=Path('.github/workflows/historical-altseason-cfgi-run-audit.yml').read_text()
          for compute in [free,paid]:
              assert 'contents: write' not in compute
              assert 'git push' not in compute and 'git commit' not in compute and 'git add ' not in compute
          for writer in [free_pub,reserve,paid_pub,audit]:
              assert 'contents: write' in writer
              assert 'group: framework-main-writer' in writer
              assert 'git push origin HEAD:main' in writer
          for pub in [free_pub,paid_pub]: assert 'git diff --cached --quiet' in pub
          print('HISTORICAL_COMPUTE_RESERVE_PUBLISH_WRITER_BOUNDARY_PASS')
          PY
      - name: Ensure no market-policy edits are present in helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          combined='\n'.join([Path('scripts/historical_lab/free_altseason_bootstrap_parallel.py').read_text(),Path('scripts/historical_lab/cfgi_idempotency_guard.py').read_text()])
          for token in ['portfolio_action','DEPLOY','REDUCE','BUY','SELL','canonical_market_state =','automatic_rule_changes = True']:
              assert token not in combined,token
          print('NO_MARKET_POLICY_SEMANTICS_PASS')
          PY
