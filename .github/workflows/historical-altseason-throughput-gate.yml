name: Historical Altseason Throughput Safety Gate

on:
  pull_request:
    paths:
      - 'scripts/historical_lab/free_altseason_bootstrap_parallel.py'
      - 'scripts/historical_lab/cfgi_idempotency_guard.py'
      - '.github/workflows/historical-altseason-free-bootstrap.yml'
      - '.github/workflows/historical-altseason-free-publish.yml'
      - '.github/workflows/historical-altseason-cfgi-enrichment.yml'
      - '.github/workflows/historical-altseason-cfgi-publish.yml'
      - '.github/workflows/historical-altseason-throughput-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/historical_lab/free_altseason_bootstrap_parallel.py'
      - 'scripts/historical_lab/cfgi_idempotency_guard.py'
      - '.github/workflows/historical-altseason-free-bootstrap.yml'
      - '.github/workflows/historical-altseason-free-publish.yml'
      - '.github/workflows/historical-altseason-cfgi-enrichment.yml'
      - '.github/workflows/historical-altseason-cfgi-publish.yml'
      - '.github/workflows/historical-altseason-throughput-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile transport and idempotency helpers
        run: |
          python -m py_compile scripts/historical_lab/free_altseason_bootstrap_parallel.py
          python -m py_compile scripts/historical_lab/cfgi_idempotency_guard.py
          python -m py_compile scripts/historical_lab/free_altseason_bootstrap_resilient.py
          python -m py_compile scripts/historical_lab/cfgi_targeted_backfill.py
          python -m py_compile scripts/historical_lab/cfgi_readiness_postprocess.py

      - name: Prove transport-only archive-first parallelization contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/historical_lab/free_altseason_bootstrap_parallel.py').read_text()
          w=Path('.github/workflows/historical-altseason-free-bootstrap.yml').read_text()
          pub=Path('.github/workflows/historical-altseason-free-publish.yml').read_text()
          add_cmd='git'+' add '+'06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/'
          shared='group: '+'framework-main-writer'
          assert 'ThreadPoolExecutor' in p
          assert 'MAX_WORKERS = 24' in p
          assert 'DEFAULT_WORKERS = 12' in p
          assert 'prefer_daily_before = datetime(2022, 1, 1' in p
          assert 'resilient._vision_daily' in p
          assert 'daily_rows.sort(key=lambda row: int(row[0]))' in p
          assert 'resilient.vision_klines = parallel_vision_klines' in p
          assert 'BINANCE_REST_BYPASSED_ARCHIVE_FIRST_REPRODUCIBILITY' in p
          assert 'BINANCE_VISION_ARCHIVE_FIRST_TRANSPORT_v1' in p
          assert '"archive_first": True' in p
          assert 'analysis_semantics_changed": False' in p
          for forbidden in ['build_features =', 'build_episodes =', 'continuation_controls =', 'episode_drawdown_trigger_pct', 'episode_recovery_fraction']:
              assert forbidden not in p, forbidden
          assert 'free_altseason_bootstrap_parallel.py' in w
          assert "HISTORICAL_VISION_MAX_WORKERS: '12'" in w
          assert 'timeout-minutes: 120' in w
          assert "transport.get('archive_first') is True" in w
          assert 'permissions:\n  contents: read' in w
          assert ('git'+' add ') not in w
          assert 'actions/upload-artifact@v4' in w
          assert 'historical-altseason-free-stage' in w
          assert 'group: historical-altseason-free-bootstrap' in w
          assert shared in pub
          assert 'actions/download-artifact@v4' in pub
          assert 'historical-altseason-free-stage' in pub
          assert add_cmd in pub
          assert 'git rebase --abort' in pub
          assert 'git fetch origin main' in pub
          assert 'git merge-base --is-ancestor HEAD origin/main' in pub
          print('HISTORICAL_ARCHIVE_FIRST_SPLIT_TRANSPORT_PASS')
          PY

      - name: Prove CFGI idempotency and split paid-stage contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/historical_lab/cfgi_idempotency_guard.py').read_text()
          w=Path('.github/workflows/historical-altseason-cfgi-enrichment.yml').read_text()
          pub=Path('.github/workflows/historical-altseason-cfgi-publish.yml').read_text()
          add_cmd='git'+' add '+'06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/'
          shared='group: '+'framework-main-writer'
          for required in [
              'CFGI_TARGETED_INPUT_FINGERPRINT_v1',
              'EXACT_COMPLETE_PRIOR_ENRICHMENT',
              'RESEARCH_READINESS_MANIFEST.json',
              'historical_findings_max_classification',
              'FORWARD_TEST',
              'automatic_promotion',
          ]:
              assert required in p, required
          assert 'cfgi_idempotency_guard.py --mode check' in w
          assert "steps.idempotency.outputs.skip_paid != 'true'" in w
          assert "steps.idempotency.outputs.skip_paid == 'true'" in w
          assert 'cfgi_idempotency_guard.py --mode stamp' in w
          assert 'BINANCE_VISION_ARCHIVE_FIRST_TRANSPORT_v1' in w
          paid_step=w.index('Target CFGI only after objective episode selection')
          preflight=w.index('Verify final archive-first free stage, authority and CFGI secret before paid calls')
          guard=w.index('Check exact paid-input idempotency')
          assert preflight < guard < paid_step
          assert 'permissions:\n  contents: read' in w
          assert ('git'+' add ') not in w
          assert 'actions/upload-artifact@v4' in w
          assert 'historical-altseason-cfgi-stage' in w
          assert 'group: historical-altseason-cfgi-enrichment' in w
          assert shared in pub
          assert 'actions/download-artifact@v4' in pub
          assert 'historical-altseason-cfgi-stage' in pub
          assert 'RESEARCH_READINESS_MANIFEST.json' in pub
          assert add_cmd in pub
          assert 'git rebase --abort' in pub
          assert 'git fetch origin main' in pub
          assert 'git merge-base --is-ancestor HEAD origin/main' in pub
          print('CFGI_IDEMPOTENCY_SPLIT_PUBLISH_PASS')
          PY

      - name: Prove compute-publish writer boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          free=Path('.github/workflows/historical-altseason-free-bootstrap.yml').read_text()
          free_pub=Path('.github/workflows/historical-altseason-free-publish.yml').read_text()
          paid=Path('.github/workflows/historical-altseason-cfgi-enrichment.yml').read_text()
          paid_pub=Path('.github/workflows/historical-altseason-cfgi-publish.yml').read_text()
          write_perm='contents: '+'write'
          push_cmd='git'+' push '+'origin HEAD:main'
          commit_cmd='git'+' commit'
          add_prefix='git'+' add '
          shared='group: '+'framework-main-writer'
          for compute in [free,paid]:
              assert write_perm not in compute
              assert ('git'+' push') not in compute
              assert commit_cmd not in compute
              assert add_prefix not in compute
          for pub in [free_pub,paid_pub]:
              assert write_perm in pub
              assert shared in pub
              assert push_cmd in pub
              assert 'git diff --cached --quiet' in pub
          print('HISTORICAL_COMPUTE_PUBLISH_WRITER_BOUNDARY_PASS')
          PY

      - name: Ensure no market-policy edits are present in helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          combined='\n'.join([
              Path('scripts/historical_lab/free_altseason_bootstrap_parallel.py').read_text(),
              Path('scripts/historical_lab/cfgi_idempotency_guard.py').read_text(),
          ])
          forbidden=[
              'portfolio_action', 'DEPLOY', 'REDUCE', 'BUY', 'SELL',
              'canonical_market_state =', 'automatic_rule_changes = True'
          ]
          for token in forbidden:
              assert token not in combined, token
          print('NO_MARKET_POLICY_SEMANTICS_PASS')
          PY
