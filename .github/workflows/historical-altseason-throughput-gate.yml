name: Historical Altseason Throughput Gate

on:
  pull_request:
    paths:
      - '.github/workflows/historical-altseason-*.yml'
      - 'scripts/historical_altseason/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  throughput-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate live topology, lifecycle, and writer safety
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('.'); text=lambda p:(root/p).read_text()
          free=text('.github/workflows/historical-altseason-free-bootstrap.yml'); reserve=text('.github/workflows/historical-altseason-cfgi-reservation.yml'); paid=text('.github/workflows/historical-altseason-cfgi-enrichment.yml'); free_pub=text('.github/workflows/historical-altseason-free-publish.yml'); paid_pub=text('.github/workflows/historical-altseason-cfgi-publish.yml'); audit=text('.github/workflows/historical-altseason-cfgi-run-audit.yml'); term=text('.github/workflows/historical-altseason-cfgi-terminal-publish.yml'); finalize=text('.github/workflows/historical-altseason-cfgi-terminal-finalize.yml')
          write_perm='contents:'+' write'; push_main='git push origin HEAD:'+'main'
          assert 'Historical Altseason Lab Gate' in free and 'workflow_run:' in free and 'contents: read' in free
          for retired in (reserve,paid):
              assert 'framework-lifecycle: RETIRED' in retired and 'schedule:' not in retired
              assert 'contents: read' in retired and write_perm not in retired and push_main not in retired
          assert 'contents: read' in finalize and write_perm not in finalize and push_main not in finalize
          assert 'Historical Altseason Free Bootstrap' in free_pub and 'workflow_run:' in free_pub
          assert 'Historical Altseason CFGI Enrichment' in paid_pub and 'workflow_run:' in paid_pub
          for writer in (free_pub,paid_pub,audit,term):
              assert write_perm in writer and push_main in writer and 'group: framework-main-writer' in writer
              assert 'git fetch origin main' in writer and 'git rebase origin/main' in writer
          print('PASS')
          PY
