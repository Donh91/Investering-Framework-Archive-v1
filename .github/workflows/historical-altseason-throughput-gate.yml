          assert addj['operational_health']['run_audit_daily_summary_state_pass_conditions'] == [
              'LATEST_AUDIT_FRESH',
              'LATEST_AUDIT_NON_FAILURE_STATUS',
              'LATEST_AUDIT_MAIN_REF_MATCH',
              'LATEST_AUDIT_POST_PUSH_READBACK_PASS',
              'TERMINAL_EVIDENCE_FRESH_WHEN_PRESENT',
          ]
          assert addj['operational_health']['run_audit_daily_summary_next_action_semantics'] == {
              'PASS':'NO_ACTION',
              'INCOMPLETE':'CONTINUE_EXISTING_CHAIN',
