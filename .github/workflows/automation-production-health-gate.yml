name: Automation Production Health Gate

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/health/**'
      - 'scripts/remediation/**'
      - 'scripts/governance/**'
      - 'scripts/architecture/**'
      - 'scripts/orchestration/build_framework_handoff_manifest.py'
      - 'research/codex/**'
      - '.agents/skills/codex-intake/**'
      - 'tests/health/**'
      - 'tests/remediation/**'
      - 'tests/governance/**'
      - 'tests/lib/**'
      - '09_SOURCE_QA/incidents/**'
      - 'research/architecture_health/GITHUB_ACTIONS_USAGE_SNAPSHOT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest 'pandas>=2.2,<3' 'jsonschema>=4.22,<5'
      - name: Compile health, remediation and handoff code
        run: |
          python -m py_compile \
            scripts/health/build_automation_health.py \
            scripts/health/build_automation_health_runtime.py \
            scripts/health/build_actions_budget_guard.py \
            scripts/health/build_architecture_health.py \
            scripts/health/build_operations_dashboard.py \
            scripts/health/check_writer_trigger_safety.py \
            scripts/health/automation_health_resolution.py \
            scripts/remediation/auto_verify_post_fix.py \
            scripts/remediation/merge_codex_research_intake.py \
            scripts/remediation/write_codex_research_transition_receipt.py \
            scripts/remediation/write_codex_research_completion_receipt.py \
            scripts/governance/check_append_only_evidence.py \
            scripts/governance/check_test_collection_truth.py \
            scripts/architecture/build_latest_handoff.py \
            scripts/orchestration/build_framework_handoff_manifest.py
      - name: Enforce append-only evidence history
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}"
          python scripts/governance/check_append_only_evidence.py \
            --repo-root . \
            --base-ref "origin/${{ github.base_ref }}" \
            --head-ref HEAD
      - name: Prove repository tests are globally collectable
        shell: bash
        run: |
          python -m pytest --collect-only --import-mode=importlib -q tests | tee /tmp/repository-test-collection.txt
          python scripts/governance/check_test_collection_truth.py \
            --repo-root . \
            --collection-file /tmp/repository-test-collection.txt \
            --root tests
      - name: Execute critical governance tests
        run: |
          python -m pytest -q --import-mode=importlib tests/governance tests/lib
          python -m unittest \
            tests.data_ping.test_native_handlekompas \
            tests.data_ping.test_official_daily_compass \
            tests.data_ping.test_compass_event_refresh \
            tests.learning.test_compass_outcomes \
            tests.learning.test_decision_economics_ledger -v
      - name: Validate current Actions budget snapshot fail-safe state
        run: |
          python scripts/health/build_actions_budget_guard.py \
            --snapshot research/architecture_health/GITHUB_ACTIONS_USAGE_SNAPSHOT.json \
            --json-output /tmp/actions-budget.json \
            --md-output /tmp/actions-budget.md \
            --now 2026-09-30T12:00:00Z
          python - <<'PY'
          import json
          data=json.load(open('/tmp/actions-budget.json'))
          assert data['contract']=='GITHUB_ACTIONS_BUDGET_STATE_v1'
          assert data['state']=='CRITICAL'
          assert data['protected_a_blocked'] is True
          assert data['usage_snapshot']['used_minutes']==3000
          assert data['usage_snapshot']['included_minutes']==3000
          print('ACTIONS_BUDGET_GUARD_FIXTURE_PASS')
          PY
      - name: Validate main writer configuration
        run: python scripts/health/check_writer_trigger_safety.py --workflow-root .github/workflows --output /tmp/writer-trigger-safety.json
      - name: Run health and Codex intake unit tests
        run: |
          python -m pytest -q \
            tests/health/test_actions_budget_guard.py \
            tests/health/test_automation_production_health.py \
            tests/health/test_automation_health_production_scope.py \
            tests/health/test_architecture_health_v2_1.py \
            tests/health/test_operations_dashboard.py \
            tests/health/test_writer_trigger_safety_v2.py \
            tests/health/test_observer_and_orchestration_semantics.py \
            tests/health/test_codex_research_intake.py \
            tests/health/test_canonical_automation_health_writer.py \
            tests/health/test_automation_health_resolution.py \
            tests/remediation/test_auto_verify_post_fix.py \
            tests/governance/test_append_only_evidence.py \
            tests/governance/test_test_collection_truth.py
      - name: Verify Task2 seven-day source-clock continuity and real frozen daily receipt
        run: |
          python -m pytest -q tests/research/test_task2_hourly_source_7d_rollup_v1.py
          python 04_MARKET_LEARNING/handlekompas/research/2026-10-21__task2_hourly_source_7d_rollup_v1.py \
            --latest research/architecture_health/LATEST_HOURLY_SOURCE_SLA.json \
            --archive /tmp/task2-seven-day-daily \
            --rollup /tmp/task2-seven-day-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          daily=json.loads(Path('research/architecture_health/LATEST_HOURLY_SOURCE_SLA.json').read_text())
          output=json.loads(Path('/tmp/task2-seven-day-summary.json').read_text())
          assert output['contract']=='TASK2_HOURLY_SOURCE_7DAY_CONTINUITY_v1'
          assert output['denominator_due_hours']==168
          assert output['measured_days']==1
          assert output['on_time_rate'] is None
          assert output['status']=='INCOMPLETE_DO_NOT_CALCULATE_RATE'
          assert output['scientific_admission'].startswith('BLOCKED_')
          assert output['days'][-1]['day']==daily['utc_due_day']
          print('TASK2_LIVE_DAILY_REPLAY_RESEARCH_ONLY_PASS')
          PY
      - name: Run static repository inventory without API
        run: |
          python scripts/health/build_automation_health.py --workflow-root .github/workflows --json-output /tmp/automation-health.json --md-output /tmp/automation-health.md || code=$?
          test "${code:-0}" -ne 2
          python - <<'PY'
          import json
          data=json.load(open('/tmp/automation-health.json'))
          assert data['contract'] in {'AUTOMATION_PRODUCTION_HEALTH_v2','AUTOMATION_PRODUCTION_HEALTH_v2_1'}
          assert data['workflow_count'] >= 1
          assert len(data['workflows']) == data['workflow_count']
          PY
