name: Cross Repo Agent Context Gate

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - '00_ARCHIVE_CONTROL/CROSS_REPO_*'
      - '00_ARCHIVE_CONTROL/ARCHIVE_MAP_AND_ROUTING.md'
      - '00_ARCHIVE_CONTROL/INDEX_ADDENDUM_REGISTRY.md'
      - '00_ARCHIVE_CONTROL/SKILL_REGISTRY.md'
      - '00_ARCHIVE_CONTROL/work_handoffs/2026-08-23_round3/**'
      - '00_FMOS/ARCHITECTURE.md'
      - '00_FMOS/AUTOMATION_ORCHESTRATION_ARCHITECTURE_v2.md'
      - '00_FMOS/CONTINUITY_LEARNING_ARCHITECTURE_v1.md'
      - '00_FMOS/WP00_PATH_OWNER_REGISTRY_v1.md'
      - '.agents/skills/**/SKILL.md'
      - '.agents/skills/s1-pr-repair-learning/references/**'
      - 'tests/agents/test_s1_pr_repair_learning_skill.py'
      - '07_PROMPTS_AND_AGENTS/codex/2026-08-22__codex-research-intake-and-execution-ledger-v1__operational.md'
      - 'research/codex/README.md'
      - 'research/specialists/**'
      - '00_ARCHIVE_CONTROL/source_recovery_controller_v1/POLICY.json'
      - 'scripts/research/validate_source_provenance_recovery_controller.py'
      - '06_RESEARCH_LAB/round3_new_information_v1/**'
      - 'changelog/2026-08-23__cross-repo-agent-context-integration-receipt.md'
      - 'scripts/governance/validate_cross_repo_agent_context.py'
      - 'scripts/governance/validate_round3_runtime_reconciliation.py'
      - '.agents/skills/s1-pr-repair-learning/references/**'
      - 'tests/agents/test_s1_pr_repair_learning_skill.py'
      - 'tools/s1-release-control/**'
      - '.github/workflows/cross-repo-agent-context-gate.yml'
  push:
    branches: [main]
    paths:
      - '00_ARCHIVE_CONTROL/CROSS_REPO_*'
      - '06_RESEARCH_LAB/round3_new_information_v1/**'
      - 'scripts/governance/validate_cross_repo_agent_context.py'
      - 'scripts/governance/validate_round3_runtime_reconciliation.py'
      - '.github/workflows/cross-repo-agent-context-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile validators
        run: python -m py_compile scripts/governance/validate_cross_repo_agent_context.py scripts/governance/validate_round3_runtime_reconciliation.py
      - name: Validate cross-repository context
        run: python scripts/governance/validate_cross_repo_agent_context.py
      - name: Validate Round 3 runtime reconciliation
        run: python scripts/governance/validate_round3_runtime_reconciliation.py
      - name: Verify S1 original-PR repair skill source and casebook
        run: python -m unittest -v tests.agents.test_s1_pr_repair_learning_skill
      - name: Set up Node 22 for S1 source regression tests
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify S1 Release Control exact PR HEAD and fail-closed regressions
        if: github.event_name == 'pull_request'
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$EXACT_HEAD_SHA"
          git checkout --detach "$EXACT_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
          echo "S1_EXACT_SOURCE_HEAD=$EXACT_HEAD_SHA"
          node --test \
            tools/s1-release-control/test-discovery-inventory-v1.mjs \
            tools/s1-release-control/test-agent-work-hub-v1.mjs \
            tools/s1-release-control/test-history-core-v1.mjs \
            tools/s1-release-control/test-static.mjs
