name: CRE Shadow Bootstrap Tests
on:
  pull_request:
    paths:
      - '06_RESEARCH_LAB/compass_research_engine_v1/**'
      - 'scripts/security/cre_shadow_guard.py'
      - 'tests/security/test_cre_shadow_guard.py'
      - '.github/workflows/cre-shadow-tests.yml'
      - '.github/CODEOWNERS'

permissions:
  contents: read

concurrency:
  group: cre-shadow-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scope and file types
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # After bootstrap, execute the BASE's trusted guard, never a PR-supplied override.
          # The initial bootstrap has no trusted base guard and remains owner-review-only.
          if git cat-file -e "$BASE_SHA:scripts/security/cre_shadow_guard.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/security/cre_shadow_guard.py" > "$RUNNER_TEMP/cre_guard_base.py"
            python "$RUNNER_TEMP/cre_guard_base.py" --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            echo "BOOTSTRAP_OWNER_REVIEW_REQUIRED: no base guard, no autonomous merge"
            python scripts/security/cre_shadow_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi
      - name: Verify required test suites exist
        run: |
          test -s 06_RESEARCH_LAB/compass_research_engine_v1/test_public_receipt.py
          test -s 06_RESEARCH_LAB/compass_research_engine_v1/test_persistence_baseline.py
          test -s tests/security/test_cre_shadow_guard.py
      - name: Compile and execute real positive/negative tests
        run: |
          python -m py_compile 06_RESEARCH_LAB/compass_research_engine_v1/*.py scripts/security/cre_shadow_guard.py
          python -m unittest discover -s 06_RESEARCH_LAB/compass_research_engine_v1 -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_cre_shadow_guard.py' -v
