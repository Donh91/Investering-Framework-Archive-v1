name: Nansen Free API Account Check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nansen-free-api-account-check.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Nansen API key without spending credits
        env:
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NANSEN_API_KEY:-}" ]; then
            echo "NANSEN_SECRET_PRESENT=false"
            exit 2
          fi
          echo "::add-mask::$NANSEN_API_KEY"
          echo "NANSEN_SECRET_PRESENT=true"
          code=$(curl -sS -o account.json -w "%{http_code}" -H "apiKey: $NANSEN_API_KEY" "https://api.nansen.ai/api/v1/account")
          echo "ACCOUNT_HTTP=$code"
          test "$code" = "200"
          python -c 'import json; o=json.load(open("account.json")); print("ACCOUNT_JSON_VALID=true"); print("ACCOUNT_KEYS="+",".join(sorted(o)[:20]) if isinstance(o,dict) else "ACCOUNT_TYPE="+type(o).__name__)'
          echo "NANSEN_ACCOUNT_TEST=PASS"
