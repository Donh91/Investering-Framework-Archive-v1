name: Forecast Skill Admission Gate

on:
  pull_request:
    paths:
      - 'scripts/learning/build_model_calibration_ledger.py'
      - 'scripts/learning/build_forecast_replication_eligibility.py'
      - 'scripts/learning/build_forecast_skill_admission.py'
      - 'scripts/lib/forecast_evidence_class.py'
      - 'scripts/learning/audit_forecast_evidence_class_boundary.py'
      - 'tests/learning/test_forecast_settlement_eligibility.py'
      - 'tests/learning/test_forecast_skill_admission.py'
      - 'tests/learning/test_forecast_evidence_class_boundary.py'
      - '.github/workflows/continuity-learning-maintenance.yml'
      - '.github/workflows/forecast-skill-admission-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile skill admission modules
        run: |
          python -m py_compile \
            scripts/learning/build_model_calibration_ledger.py \
            scripts/learning/build_forecast_replication_eligibility.py \
            scripts/learning/build_forecast_skill_admission.py \
            scripts/lib/forecast_evidence_class.py \
            scripts/learning/audit_forecast_evidence_class_boundary.py \
            tests/learning/test_forecast_skill_admission.py
      - name: Settlement compatibility and skill admission regressions
        run: |
          python tests/learning/test_forecast_settlement_eligibility.py -v
          python tests/learning/test_forecast_evidence_class_boundary.py -v
          python tests/learning/test_forecast_skill_admission.py -v
      - name: Existing accountability and replay guards
        run: |
          python tests/learning/test_accountability_loop_v1.py -q
          python tests/learning/test_historical_replay_guard.py -q
          python tests/learning/test_forecast_outcome_supersession.py -q
      - name: Production workflow skill boundary guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/continuity-learning-maintenance.yml').read_text()
          required=[
              'Build calibration ledger and settlement-only eligibility',
              'Audit forecast evidence-class separation',
              'Build independent replication eligibility',
              'Build fail-closed forecast skill admission',
              'FORECAST_EVIDENCE_CLASS_AUDIT.json',
              'FORECAST_REPLICATION_ELIGIBILITY.json',
              'FORECAST_SKILL_ADMISSION.json',
              '--min-independent-forecasts 20',
              '--max-disagreement-rate 0.05',
              '--min-effective-n 20',
          ]
          for item in required:
              assert item in text, item
          skill_step=text[text.index('Build fail-closed forecast skill admission'):text.index('Build agent handoff and owner reliability')]
          assert '--power-audit' not in skill_step, 'do not pretend a canonical effective-N audit exists'
          assert '--calibration-audit' not in skill_step, 'do not pretend a preregistered calibration audit exists'
          PY
