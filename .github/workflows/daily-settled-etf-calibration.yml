name: Daily Settled ETF Calibration

on:
  schedule:
    - cron: '5 8 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  settled-etf:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve first finalized Farside candidate
        shell: bash
        run: |
          mkdir -p etf-lifecycle
          date -u +%FT%TZ > etf-lifecycle/first_start.txt
          python scripts/data_terminal/farside_etf_owner.py --output-dir etf-owner-first --history-limit 10
          date -u +%FT%TZ > etf-lifecycle/first_complete.txt

      - name: Wait for publication stability check
        run: sleep 65

      - name: Retrieve second finalized Farside candidate
        shell: bash
        run: |
          date -u +%FT%TZ > etf-lifecycle/second_start.txt
          python scripts/data_terminal/farside_etf_owner.py --output-dir etf-owner-second --history-limit 10
          date -u +%FT%TZ > etf-lifecycle/second_complete.txt

      - name: Require stable settled BTC and ETH rows with full reported-total accounting
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          first = json.loads(Path('etf-owner-first/owner_snapshot.json').read_text())
          second = json.loads(Path('etf-owner-second/owner_snapshot.json').read_text())
          assert first.get('status') == 'PASS', first
          assert second.get('status') == 'PASS', second
          assert first.get('unknown_cells_are_not_imputed') is True, first
          assert second.get('unknown_cells_are_not_imputed') is True, second

          def normalize_row(row):
              asset = row.get('asset')
              assert asset in {'BTC', 'ETH'}, row
              assert row.get('session_final') is True, row
              assert row.get('total_parity') is True, row
              assert row.get('reported_total') is not None, row
              assert row.get('unknown_cells_fully_accounted_by_reported_total') is True, row
              return {
                  'asset': asset,
                  'date': row.get('date'),
                  'fund_headers': row.get('fund_headers'),
                  'fund_values': row.get('fund_values'),
                  'unknown_fund_cells': row.get('unknown_fund_cells', []),
                  'unknown_fund_cell_count': int(row.get('unknown_fund_cell_count', 0)),
                  'reported_total': row.get('reported_total'),
                  'calculated_total': row.get('calculated_total'),
                  'total_parity': row.get('total_parity'),
                  'session_final': row.get('session_final'),
                  'unknown_cells_fully_accounted_by_reported_total': True,
              }

          def history(snapshot):
              out = {}
              for asset, rows in (snapshot.get('history_rows') or {}).items():
                  for raw in rows:
                      row = normalize_row(raw)
                      assert row['asset'] == asset, row
                      out[(asset, row['date'])] = row
              return out

          first_history = history(first)
          second_history = history(second)
          common = sorted(set(first_history) & set(second_history))
          assert common, {'first': list(first_history), 'second': list(second_history)}
          for key in common:
              assert first_history[key] == second_history[key], {'key': key, 'first': first_history[key], 'second': second_history[key]}

          sessions = sorted({date for asset, date in common if ('BTC', date) in second_history and ('ETH', date) in second_history})
          assert sessions, common

          now = datetime.now(timezone.utc)
          root = Path('03_DAILY_CAPTURE_LOGS/etf')
          day = root / now.strftime('%Y/%m/%d')
          day.mkdir(parents=True, exist_ok=True)
          materialized = []

          for session_date in sessions:
              rows = [second_history[('BTC', session_date)], second_history[('ETH', session_date)]]
              body = {
                  'contract': 'DAILY_SETTLED_ETF_CALIBRATION_v2',
                  'authority': 'SHADOW_CALIBRATION_INPUT_ONLY',
                  'session_date': session_date,
                  'retrieved_at_utc': second.get('retrieved_at_utc'),
                  'verification': {
                      'retrieval_count': 2,
                      'minimum_separation_seconds': 60,
                      'rows_identical_across_retrievals': True,
                      'all_fund_cells_known': all(row['unknown_fund_cell_count'] == 0 for row in rows),
                      'unknown_cells_imputed': False,
                      'unknown_cells_fully_accounted_by_reported_total': True,
                      'total_parity_required': True,
                      'source': 'FARSIDE_CANONICAL_ALL_DATA_TABLES',
                  },
                  'rows': rows,
                  'source_hashes_first': first.get('source_hashes', {}),
                  'source_hashes_second': second.get('source_hashes', {}),
                  'canonical_data_ping': False,
                  'framework_state_change': False,
                  'portfolio_action': False,
              }
              signature = hashlib.sha256(json.dumps(rows, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              body['row_signature_sha256'] = signature

              existing_path = None
              for path in root.rglob('*.json'):
                  if path.name == 'LATEST.json':
                      continue
                  try:
                      old = json.loads(path.read_text())
                  except Exception:
                      continue
                  if old.get('session_date') == session_date and old.get('row_signature_sha256') == signature:
                      existing_path = path
                      break
              if existing_path is None:
                  existing_path = day / f"{now.strftime('%H%M%S')}_{session_date}.json"
                  existing_path.write_text(json.dumps(body, indent=2, sort_keys=True) + '\n')
              materialized.append((session_date, existing_path, signature, body))

          verification_completed_at_utc = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          Path('etf-lifecycle/verification_completed.txt').write_text(verification_completed_at_utc + '\n')
          session_date, latest_path, signature, latest_body = materialized[-1]
          pointer = {
              'contract': 'DAILY_SETTLED_ETF_LATEST_POINTER_v2',
              'path': str(latest_path),
              'session_date': session_date,
              'retrieved_at_utc': latest_body['retrieved_at_utc'],
              'verification_completed_at_utc': verification_completed_at_utc,
              'row_signature_sha256': signature,
              'status': 'PASS',
              'history_sessions_materialized': len(materialized),
          }
          (root / 'LATEST.json').write_text(json.dumps(pointer, indent=2, sort_keys=True) + '\n')
          print(json.dumps(pointer, sort_keys=True))
          PY

      - name: Emit and validate lifecycle receipt
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          pointer = json.loads(Path('03_DAILY_CAPTURE_LOGS/etf/LATEST.json').read_text())
          now = datetime.now(timezone.utc)
          out = Path('03_DAILY_CAPTURE_LOGS/evidence_lifecycle/settled_etf') / now.strftime('%Y/%m/%d') / f"gh-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}.json"
          second_start = Path('etf-lifecycle/second_start.txt').read_text().strip()
          second_complete = Path('etf-lifecycle/second_complete.txt').read_text().strip()
          validated = Path('etf-lifecycle/verification_completed.txt').read_text().strip()
          args = [
              sys.executable, 'scripts/evidence_lifecycle/write_lifecycle_receipt.py',
              '--output', str(out),
              '--source-run-id', f"gh-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              '--evidence-lane', 'SETTLED_ETF',
              '--repo-head-sha', os.environ['GITHUB_SHA'],
              '--source-lineage', 'FARSIDE_CANONICAL_ALL_DATA_TABLES double-read',
              '--artifact-hash', pointer.get('row_signature_sha256',''),
              '--validator-run-id', f"gh-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}:settled-etf-parity",
              '--timestamp', f'retrieval_start_time={second_start}',
              '--timestamp', f'retrieval_complete_time={second_complete}',
              '--timestamp', f'provenance_validation_time={validated}',
          ]
          subprocess.run(args, check=True)
          subprocess.run([sys.executable, 'scripts/evidence_lifecycle/validate_lifecycle_receipt.py', str(out)], check=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-settled-etf-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            etf-owner-first/
            etf-owner-second/
            etf-lifecycle/
          retention-days: 14
          if-no-files-found: warn

      - name: Commit compact settled ETF calibration with verified readback
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 03_DAILY_CAPTURE_LOGS/etf 03_DAILY_CAPTURE_LOGS/evidence_lifecycle/settled_etf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: log settled ETF calibration ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  notify:
    needs: settled-etf
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish sanitized incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 09_SOURCE_QA/incidents
          FILE="09_SOURCE_QA/incidents/INCIDENT_daily-settled-etf-${GITHUB_RUN_ID}.md"
          printf '# AUTOMATION INCIDENT\n\nWorkflow: Daily Settled ETF Calibration\nRun: %s\nTimestamp UTC: %s\nStatus: FAILED\nInspect Actions logs. No secrets are included.\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > "$FILE"
          git config user.name framework-incident-bot
          git config user.email framework-incident-bot@users.noreply.github.com
          git add "$FILE" && git commit -m "incident: settled ETF ${GITHUB_RUN_ID}" && git pull --rebase origin main && git push origin HEAD:main
          gh issue create --title "AUTOMATION FAILURE: Daily Settled ETF ${GITHUB_RUN_ID}" --body-file "$FILE" || true
