name: Daily Settled ETF Calibration

on:
  schedule:
    - cron: '5 8 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  settled-etf:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve first finalized Farside candidate
        run: python scripts/data_terminal/farside_etf_owner.py --output-dir etf-owner-first

      - name: Wait for publication stability check
        run: sleep 65

      - name: Retrieve second finalized Farside candidate
        run: python scripts/data_terminal/farside_etf_owner.py --output-dir etf-owner-second

      - name: Require complete stable settled BTC and ETH rows
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          first = json.loads(Path('etf-owner-first/owner_snapshot.json').read_text())
          second = json.loads(Path('etf-owner-second/owner_snapshot.json').read_text())

          assert first.get('status') == 'PASS', first
          assert second.get('status') == 'PASS', second

          def normalized(snapshot):
              rows = {}
              for row in snapshot.get('rows', []):
                  asset = row.get('asset')
                  assert asset in {'BTC', 'ETH'}, row
                  assert row.get('session_final') is True, row
                  assert row.get('total_parity') is True, row
                  # A displayed total can tie while Farside is still publishing issuer cells.
                  # Zero unknown/dash cells is mandatory for settled calibration ownership.
                  assert row.get('fund_values') and all(value is not None for value in row['fund_values']), row
                  rows[asset] = {
                      'asset': asset,
                      'date': row.get('date'),
                      'fund_headers': row.get('fund_headers'),
                      'fund_values': row.get('fund_values'),
                      'reported_total': row.get('reported_total'),
                      'calculated_total': row.get('calculated_total'),
                      'total_parity': row.get('total_parity'),
                      'session_final': row.get('session_final'),
                  }
              assert set(rows) == {'BTC', 'ETH'}, rows
              assert rows['BTC']['date'] == rows['ETH']['date'], rows
              return rows

          first_rows = normalized(first)
          second_rows = normalized(second)
          assert first_rows == second_rows, {'first': first_rows, 'second': second_rows}

          session_date = second_rows['BTC']['date']
          body = {
              'contract': 'DAILY_SETTLED_ETF_CALIBRATION_v1',
              'authority': 'SHADOW_CALIBRATION_INPUT_ONLY',
              'session_date': session_date,
              'retrieved_at_utc': second.get('retrieved_at_utc'),
              'verification': {
                  'retrieval_count': 2,
                  'minimum_separation_seconds': 60,
                  'rows_identical_across_retrievals': True,
                  'all_fund_cells_known': True,
                  'total_parity_required': True,
                  'source': 'FARSIDE_CANONICAL_TABLES',
              },
              'rows': [second_rows['BTC'], second_rows['ETH']],
              'source_hashes_first': first.get('source_hashes', {}),
              'source_hashes_second': second.get('source_hashes', {}),
              'canonical_data_ping': False,
              'framework_state_change': False,
              'portfolio_action': False,
          }
          signature = hashlib.sha256(
              json.dumps(body['rows'], sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          body['row_signature_sha256'] = signature

          now = datetime.now(timezone.utc)
          root = Path('03_DAILY_CAPTURE_LOGS/etf')
          day = root / now.strftime('%Y/%m/%d')
          day.mkdir(parents=True, exist_ok=True)

          existing_same = False
          for path in root.rglob('*.json'):
              if path.name == 'LATEST.json':
                  continue
              try:
                  old = json.loads(path.read_text())
              except Exception:
                  continue
              if old.get('session_date') == session_date and old.get('row_signature_sha256') == signature:
                  existing_same = True
                  existing_path = path
                  break

          if existing_same:
              materialized = existing_path
          else:
              materialized = day / f"{now.strftime('%H%M%S')}_{session_date}.json"
              materialized.write_text(json.dumps(body, indent=2, sort_keys=True) + '\n')

          pointer = {
              'contract': 'DAILY_SETTLED_ETF_LATEST_POINTER_v1',
              'path': str(materialized),
              'session_date': session_date,
              'retrieved_at_utc': body['retrieved_at_utc'],
              'row_signature_sha256': signature,
              'status': 'PASS',
          }
          (root / 'LATEST.json').write_text(json.dumps(pointer, indent=2, sort_keys=True) + '\n')
          print(json.dumps(pointer, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-settled-etf-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            etf-owner-first/
            etf-owner-second/
          retention-days: 14
          if-no-files-found: warn

      - name: Commit compact settled ETF calibration with verified readback
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 03_DAILY_CAPTURE_LOGS/etf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: log settled ETF calibration ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  notify:
    needs: settled-etf
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish sanitized incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 09_SOURCE_QA/incidents
          FILE="09_SOURCE_QA/incidents/INCIDENT_daily-settled-etf-${GITHUB_RUN_ID}.md"
          printf '# AUTOMATION INCIDENT\n\nWorkflow: Daily Settled ETF Calibration\nRun: %s\nTimestamp UTC: %s\nStatus: FAILED\nInspect Actions logs. No secrets are included.\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > "$FILE"
          git config user.name framework-incident-bot
          git config user.email framework-incident-bot@users.noreply.github.com
          git add "$FILE" && git commit -m "incident: settled ETF ${GITHUB_RUN_ID}" && git pull --rebase origin main && git push origin HEAD:main
          gh issue create --title "AUTOMATION FAILURE: Daily Settled ETF ${GITHUB_RUN_ID}" --body-file "$FILE" || true
