name: Native Handlekompas

on:
  pull_request:
    paths:
      - '.github/workflows/native-handlekompas.yml'
      - '.github/workflows/provider-budget-readback.yml'
      - 'scripts/data_ping/native_handlekompas.py'
      - 'scripts/research/task2_r1_original_admission.py'
      - 'tests/research/test_task2_r1_original_admission.py'
      - 'scripts/cycle_navigator/build_weekly_cycle_navigator.py'
      - 'scripts/learning/compass_outcomes.py'
      - 'scripts/learning/decision_economics_ledger.py'
      - 'scripts/health/provider_budget_status.py'
      - 'tests/data_ping/test_native_handlekompas.py'
      - 'tests/data_ping/test_official_daily_compass.py'
      - 'tests/learning/test_compass_outcomes.py'
      - 'tests/learning/test_decision_economics_ledger.py'
      - 'research/decision_economics/**'
      - 'tests/health/test_provider_budget_status.py'
      - '03_WEEKLY_OPERATIONS/provider_budget/**'
      - '04_MARKET_LEARNING/handlekompas/**'
      - '02_DATA_PING/operational_handoffs/NATIVE_ZERO_MANUAL_FEED*'
  schedule:
    # Fallback watchdog only. Entry Signal Ledger explicitly dispatches the primary production run.
    - cron: '57 * * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  # Read-only PR validation must not compete with serialized main writers.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'framework-market-owner-writer' }}
  queue: max
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # R1 tests check exact historical Git object revisions, not shallow HEAD.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test Handlekompas
        run: |
          python -m py_compile scripts/data_ping/native_handlekompas.py scripts/cycle_navigator/build_weekly_cycle_navigator.py scripts/learning/compass_outcomes.py scripts/learning/decision_economics_ledger.py scripts/health/provider_budget_status.py
          python -m unittest tests.data_ping.test_native_handlekompas -v
          python -m unittest tests.data_ping.test_official_daily_compass -v
          python -m unittest tests.learning.test_compass_outcomes -v
          python -m unittest tests.learning.test_decision_economics_ledger -v
          python -m unittest tests.health.test_provider_budget_status -v
      - name: Validate research-only original Task 2 R1 clock and SHA admissions
        run: |
          if [ -f scripts/research/task2_r1_original_admission.py ] && [ -f tests/research/test_task2_r1_original_admission.py ]; then
            python -m unittest tests.research.test_task2_r1_original_admission -v
            # Frozen R1 scientific admission artifact is source-only and
            # must exactly match generator output under the declared Git
            # historical context, not synthetic PR merge HEAD.
            python scripts/research/task2_r1_original_admission.py --context-ref 5a41cd3043bb582524f15fe9fde6f52792246a54 --output /tmp/task2_r1_original_admission_v2.json
            cmp -s /tmp/task2_r1_original_admission_v2.json 04_MARKET_LEARNING/handlekompas/research/2026-10-15__TASK2_R1_NATIVE_V3_ORIGINAL_ADMISSION_v2.json
            echo 'Task2 R1 v2 exact immutable-context artifact parity verified'
          fi
      - name: Validate Task 2 original-maturity cohort source-only research receipt
        # PR-only source and count checks. The owner's original ZIP remains
        # outside the public repository and is reverified by the CLI separately.
        run: |
          python -m py_compile 04_MARKET_LEARNING/handlekompas/research/2026-10-16__task2_matured314_reproduce_v1.py
          python -m unittest tests.research.test_task2_matured314_reproduce -v
      - name: Research-only original frozen vote replay (changed-file PR only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)
          if ! echo "$changed" | grep -Eq '(2026-10-16__task2_matured314_original_frozen_votes_v1.py|test_task2_matured314_original_frozen_votes.py)'; then
            echo "TASK2_VOTE_REPLAY_CLEAN_NOOP_UNCHANGED_PR"
            exit 0
          fi
          python -m unittest tests.research.test_task2_matured314_original_frozen_votes -v
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Donh91/Investering-Framework-Archive-v1/actions/artifacts/11829371964/zip" \
            --output /tmp/task2_original_issued_forecasts.zip
          python 04_MARKET_LEARNING/handlekompas/research/2026-10-16__task2_matured314_original_frozen_votes_v1.py \
            --root . --artifact /tmp/task2_original_issued_forecasts.zip \
            --output /tmp/task2_matured314_vote_family_aggregate.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/task2_matured314_vote_family_aggregate.json'))
          assert x["original_matured_directional"]==314
          assert x["original_matured_abstentions"]==44
          assert x["original_forecast_files_replayed"]==125
          frozen=json.load(open('04_MARKET_LEARNING/handlekompas/research/2026-10-16__TASK2_ORIGINAL_MATURED314_FROZEN_VOTE_FAMILY_RECEIPT_v1.json'))
          assert frozen["original_zip_sha256"]==x["original_zip_sha256"]
          assert frozen["original_ledger_sha256"]==x["original_csv_sha256"]
          assert frozen["result"]=={"file_count":x["original_forecast_files_replayed"],
                                    "by_family":x["family_comparison"],
                                    "by_asset_horizon":x["by_asset_horizon"]}
          print("TASK2_ORIGINAL_SOURCE_RECEIPT_BYTE_PARITY_VERIFIED")
          assert x["status"].startswith("EXPOST_")
          assert all(v["available_n"]<=314 for v in x["family_comparison"].values())
          assert not any(x["authority"].values())
          print("TASK2_VOTES_ACTUAL_ORIGINAL_REPLAY_PASS",
                json.dumps({"file_count":x["original_forecast_files_replayed"],
                            "by_family":x["family_comparison"],
                            "by_asset_horizon":x["by_asset_horizon"]},sort_keys=True))
          PY
          rm -f /tmp/task2_original_issued_forecasts.zip /tmp/task2_matured314_vote_family_aggregate.json
      - name: Validate repository state readback when available
        shell: bash
        run: |
          if [ -f 04_MARKET_LEARNING/entry_signals/auto_market_state/LATEST.json ]; then
            args=(--no-write)
            if [ -f 03_WEEKLY_OPERATIONS/provider_budget/LATEST.json ]; then
              args+=(--budget-status 03_WEEKLY_OPERATIONS/provider_budget/LATEST.json)
            fi
            python scripts/data_ping/native_handlekompas.py "${args[@]}" > /tmp/handlekompas.json
            python - <<'PY'
          import json
          d=json.load(open('/tmp/handlekompas.json'))
          assert d['contract']=='NATIVE_HANDLEKOMPAS_v1'
          assert d['source']['packet_sha256']
          assert d['manual_market_data_required'] is False
          assert d['authority']['portfolio_execution'] is False
          assert d['authority']['canonical_state_change'] is False
          assert d['authority']['market_threshold_change'] is False
          assert d['authority']['owner_switch'] is False
          assert d['action']['NOW'] in {'GRADUATED_TOPUP_ACTIVE','PREPARE','HOLD_WAIT','HOLD_DEFENSIVE_WAIT','HOLD_WAIT_DATA_DEGRADED'}
          assert 'DATA_HEALTH' in d and 'BUDGET_HEALTH' in d
          PY
          fi

  readback:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate latest Handlekompas
        shell: bash
        run: |
          python -m unittest tests.data_ping.test_native_handlekompas -v
          python -m unittest tests.health.test_provider_budget_status -v
          args=(--output-root 04_MARKET_LEARNING/handlekompas)
          if [ -f 03_WEEKLY_OPERATIONS/provider_budget/LATEST.json ]; then
            args+=(--budget-status 03_WEEKLY_OPERATIONS/provider_budget/LATEST.json)
          fi
          python scripts/data_ping/native_handlekompas.py "${args[@]}" | tee /tmp/handlekompas-status.json
      - name: Validate source/hash/authority binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('/tmp/handlekompas-status.json').read_text())
          pointer=json.loads(Path('04_MARKET_LEARNING/handlekompas/LATEST.json').read_text())
          packet=json.loads(Path(pointer['handlekompas_path']).read_text())
          assert pointer['handlekompas_sha256']==status['sha256']==packet['handlekompas_sha256']
          assert pointer['source_packet_sha256']==packet['source']['packet_sha256']
          assert packet['manual_market_data_required'] is False
          assert packet['authority']['portfolio_execution'] is False
          assert packet['authority']['market_threshold_change'] is False
          if Path('03_WEEKLY_OPERATIONS/provider_budget/LATEST.json').exists():
              budget=json.loads(Path('03_WEEKLY_OPERATIONS/provider_budget/LATEST.json').read_text())
              assert budget['contract']=='PROVIDER_BUDGET_STATUS_v1'
              assert packet['BUDGET_HEALTH']['source']=='BOUND_EXTERNAL_BUDGET_STATUS'
          print('NATIVE_HANDLEKOMPAS_VALID', packet['action']['NOW'], packet['DATA_HEALTH']['status'], packet['BUDGET_HEALTH']['status'])
          PY
      - name: Commit with remote readback proof
        shell: bash
        run: |
          git config user.name framework-data-bot
          git config user.email framework-data-bot@users.noreply.github.com
          git add 04_MARKET_LEARNING/handlekompas
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "learning: native Handlekompas ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          local_sha=$(sha256sum 04_MARKET_LEARNING/handlekompas/LATEST.json | awk '{print $1}')
          remote_sha=$(git show origin/main:04_MARKET_LEARNING/handlekompas/LATEST.json | sha256sum | awk '{print $1}')
          [ "$local_sha" = "$remote_sha" ]
      - name: Publish fresh Native context to Cycle Navigator Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --workflow cycle-navigator-pages.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting")] | length')
          if [ "$active" -gt 0 ]; then
            echo "CYCLE_NAVIGATOR_PAGES_HANDOFF_ALREADY_ACTIVE count=$active"
          else
            gh workflow run cycle-navigator-pages.yml --ref main
            echo "CYCLE_NAVIGATOR_PAGES_HANDOFF_DISPATCHED source_native_run=${GITHUB_RUN_ID}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-handlekompas-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/handlekompas-status.json
            03_WEEKLY_OPERATIONS/provider_budget/LATEST.json
            04_MARKET_LEARNING/handlekompas/LATEST.json
          retention-days: 14
          if-no-files-found: warn

  incident:
    needs: readback
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Open Handlekompas incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "AUTOMATION FAILURE: Native Handlekompas ${GITHUB_RUN_ID}" --body "Native Handlekompas failed. Manual market-data feeding is not required. Inspect the owner/Auto Market State/provider-budget chain. Run: ${GITHUB_RUN_ID}" || true
