name: Shadow Registry Native Proof Once

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[SR_NATIVE_PROOF]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch current-main Shadow Registry Weekly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run shadow-registry-weekly.yml --repo "$GITHUB_REPOSITORY" --ref main
