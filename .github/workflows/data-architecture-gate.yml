name: Data Architecture Gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline DexPaprika source identity and malformed-provider controls
        run: |
          python -m py_compile 04_RESEARCH_LAB/auto_trading/research_inputs/2026-10-18_dexpaprika_archify_source_qa/source_qa_v1.py 04_RESEARCH_LAB/auto_trading/research_inputs/2026-10-18_dexpaprika_archify_source_qa/test_source_qa_v1.py
          python 04_RESEARCH_LAB/auto_trading/research_inputs/2026-10-18_dexpaprika_archify_source_qa/test_source_qa_v1.py
      - name: Verify Situation Room owner-primary fact anchor, original source, and shadow firewall
        run: |
          python -m py_compile scripts/data_terminal/situation_room_shadow_bridge.py tests/data_terminal/test_situation_room_source_fact_anchor_v1.py
          python -m unittest tests.data_terminal.test_situation_room_source_fact_anchor_v1 -v
      - name: Verify offline News OSS event/PIT challenger regression controls
        run: |
          python -m py_compile scripts/research/news_oss_event_challenger.py tests/research/test_news_oss_event_challenger.py
          python -m unittest -v tests.research.test_news_oss_event_challenger
      - name: Verify S3 Relay/solver infrastructure fail-closed regression controls
        run: |
          python -m py_compile scripts/research/memes_alpha/adversarial_operator_counting.py scripts/research/memes_alpha/adversarial_operator_enrichment.py tests/research/memes_alpha/test_adversarial_operator_counting.py tests/research/memes_alpha/test_adversarial_operator_enrichment.py
          python -m unittest -v tests.research.memes_alpha.test_adversarial_operator_counting tests.research.memes_alpha.test_adversarial_operator_enrichment
      - name: Validate Task2 Challenger A sqrt-time volatility band (research only)
        run: |
          python -m py_compile scripts/research/task2_challenger_a_sqrt_t_vol_band_v1.py tests/research/test_task2_challenger_a_sqrt_t_vol_band_v1.py
          python -m unittest -v tests.research.test_task2_challenger_a_sqrt_t_vol_band_v1
      - name: Validate Task 2 archive-first E1/E2/E3 diagnostics and evidence firewall
        run: |
          python -m py_compile scripts/research/task2_archive_first_edge_matrix_v1.py tests/research/test_task2_archive_first_edge_matrix_v1.py
          python -m unittest tests.research.test_task2_archive_first_edge_matrix_v1 -v
          python scripts/research/task2_archive_first_edge_matrix_v1.py --as-of-utc 2026-11-06T14:30:00Z --output /tmp/task2_archive_first_matrix.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/task2_archive_first_matrix.json').read_text())
          assert r['contract']=='TASK2_ARCHIVE_FIRST_EDGE_EVIDENCE_MATRIX_v1'
          assert r['scientific_verdict']=='INSUFFICIENT_EVIDENCE'
          assert r['E2_rotation']['matured_7d_rows']==r['E2_rotation']['matured_7d_positive']+r['E2_rotation']['matured_7d_negative']
          assert r['E2_rotation']['independent_market_event_family_n'] is None
          assert not r['canonical_promotion_allowed'] and not r['automatic_model_weight_change'] and not r['portfolio_execution']
          print('TASK2_ARCHIVE_FIRST_OWNER_RECEIPT_SENSITIVITY_PASS')
          print('E2 rows',r['E2_rotation']['matured_7d_rows'],'original 28d blocks',r['E2_rotation']['fixed_28d_block_n'])
          PY
      - name: Verify Task 2 R0 pinned-source Git-object fail-closed cases
        run: node 04_MARKET_LEARNING/handlekompas/research/2026-10-14__task2_r0_git_object_reconcile_v1_1.test.mjs
      - name: Verify Kompas Pro 14-horizon source owner and G0/G1/G4 partial status ledger
        run: python -m unittest -v tests.learning.test_kompas_pro_internal_horizon_v2
      - name: Run onchain options REA synthetic positive and negative controls (research only)
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile 04_RESEARCH_LAB/external_specialist_dissection/onchain_options_2026_11/sector_metrics.py 04_RESEARCH_LAB/external_specialist_dissection/onchain_options_2026_11/test_sector_metrics.py
          python -m unittest discover -s 04_RESEARCH_LAB/external_specialist_dissection/onchain_options_2026_11 -p 'test_sector_metrics.py' -v 2>&1 | tee /tmp/options-rea-tests.log
          grep -Eq '^Ran 13 tests in ' /tmp/options-rea-tests.log
          grep -qx 'OK' /tmp/options-rea-tests.log
      - name: Verify 0xArchive E0 offline source-clock and privacy admission cases
        run: |
          python -m py_compile scripts/research/oxarchive_e0_source_preflight_v1.py tests/research/test_oxarchive_e0_source_preflight_v1.py
          python -m unittest tests.research.test_oxarchive_e0_source_preflight_v1 -v
      - run: python -m unittest tests.data_storage.test_durable_promotion_controller tests.data_storage.test_storage_telemetry
      - run: python scripts/data_storage/storage_telemetry.py --root . --output storage-telemetry.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-telemetry-${{ github.run_id }}
          path: storage-telemetry.json
          retention-days: 7
      - name: S1 native privacy scan of the PR diff (S1_DIFF_SCAN_V1, exact head blobs)
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        env:
          S1_PRIVACY_SCAN_MODE: shadow
        run: python scripts/governance/s1_native_privacy_scan_step_v1.py
