name: Meme Alpha RED Cohort Schema Probe

on:
  pull_request:
    paths:
      - 'research/api_agent/meme_alpha/experiments/red_cohort_schema_probe_v1.py'
      - '.github/workflows/meme-alpha-red-cohort-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-cohort-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout research revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pinned Zenodo release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/red-cohort /tmp/red-results
          URL='https://zenodo.org/records/21765387/files/RED-COHORT-2026-v1_1_1.zip?download=1'
          curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 20 "$URL" -o /tmp/red-cohort/RED-COHORT-2026-v1_1_1.zip
          echo '172198eade99f702f1da0bfdd4cf3079  /tmp/red-cohort/RED-COHORT-2026-v1_1_1.zip' | md5sum -c -
          sha256sum /tmp/red-cohort/RED-COHORT-2026-v1_1_1.zip | tee /tmp/red-results/SHA256SUMS

      - name: Probe schema and joinability
        run: |
          python research/api_agent/meme_alpha/experiments/red_cohort_schema_probe_v1.py \
            --zip /tmp/red-cohort/RED-COHORT-2026-v1_1_1.zip \
            --out /tmp/red-results/red_cohort_schema_probe_v1.json

      - name: Emit bounded result
        run: |
          python - <<'PY'
          import json
          p='/tmp/red-results/red_cohort_schema_probe_v1.json'
          d=json.load(open(p))
          print(json.dumps({
            'archive': d['archive'],
            'catalogue_rows': d['catalogue']['rows'],
            'intra_rows': d['intra_launch']['rows'],
            'joinability': d['joinability'],
            'catalogue_top_level_keys': d['catalogue']['top_level_keys'],
            'intra_top_level_keys': d['intra_launch']['top_level_keys'],
          }, indent=2))
          PY

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: meme-alpha-red-cohort-schema-v1
          path: /tmp/red-results/
          retention-days: 30
