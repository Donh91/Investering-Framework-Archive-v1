name: Automation Production Health

on:
  schedule:
    - cron: '30 5 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '30 17 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: framework-main-writer
  queue: max
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GitHub Actions budget guard
        id: actions_budget
        run: |
          python scripts/health/build_actions_budget_guard.py \
            --snapshot research/architecture_health/GITHUB_ACTIONS_USAGE_SNAPSHOT.json \
            --json-output research/architecture_health/LATEST_ACTIONS_BUDGET.json \
            --md-output research/architecture_health/LATEST_ACTIONS_BUDGET.md
          state="$(python -c 'import json; print(json.load(open("research/architecture_health/LATEST_ACTIONS_BUDGET.json"))["state"])')"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Surface non-normal Actions budget state
        if: steps.actions_budget.outputs.state != 'NORMAL'
        run: cat research/architecture_health/LATEST_ACTIONS_BUDGET.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build complete production health report
        id: health
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/health/build_automation_health_runtime.py \
            --workflow-root .github/workflows \
            --repo "${GITHUB_REPOSITORY}" \
            --token "${GITHUB_TOKEN}" \
            --json-output research/architecture_health/LATEST_AUTOMATION_HEALTH.json \
            --md-output research/architecture_health/LATEST_AUTOMATION_HEALTH.md
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Measure prior UTC day hourly source first-commit deadline
        shell: bash
        run: |
          set -euo pipefail
          OUT="research/architecture_health/LATEST_HOURLY_SOURCE_SLA.json"
          DAY="$(date -u -d 'yesterday' +%F)"
          # Research evidence only: committer clock is not provider/push first-known.
          if python 04_MARKET_LEARNING/handlekompas/research/2026-10-13__task15_source_publication_chronology_v1.py \
              --root . \
              --ref HEAD \
              --daily-hourly-owner-sla-day "$DAY" \
              --out "$OUT"; then
            echo "Hourly owner source-clock SLA: measured (research only)" >> "$GITHUB_STEP_SUMMARY"
          else
            # No fake zero/green. Do not block the fleet health observer
            # just because retrospective research-source history is unavailable.
            python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          path=Path("research/architecture_health/LATEST_HOURLY_SOURCE_SLA.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "contract":"TASK2_HOURLY_SOURCE_COMMIT_CLOCK_SLA_v1",
              "utc_due_day":(datetime.now(timezone.utc).date()-timedelta(days=1)).isoformat(),
              "measurement_status":"UNAVAILABLE",
              "reason":"SOURCE_GIT_HISTORY_OR_VALIDATION_UNAVAILABLE",
              "authority":{"research_only":True,"original_outcome_rescore":False,
                           "model_promotion":False,"portfolio_action":False}
          },sort_keys=True)+"\n",encoding="utf-8")
          PY
            echo "::warning::Research source SLA unavailable; no fabricated on-time/late rate"
          fi
      - name: Freeze first daily source-clock receipt and reconcile seven-day window
        shell: bash
        run: |
          set -euo pipefail
          python 04_MARKET_LEARNING/handlekompas/research/2026-10-21__task2_hourly_source_7d_rollup_v1.py \
            --latest research/architecture_health/LATEST_HOURLY_SOURCE_SLA.json \
            --archive research/architecture_health/hourly_source_sla/daily \
            --rollup research/architecture_health/LATEST_HOURLY_SOURCE_7D.json
          echo "Seven-day continuity: research-only Git committer proxy, NOT provider PIT." >> "$GITHUB_STEP_SUMMARY"
      - name: Build architecture health after automation audit
        run: |
          python scripts/health/build_architecture_health.py \
            --repo-root . \
            --json-output research/architecture_health/LATEST_ARCHITECTURE_HEALTH.json \
            --md-output research/architecture_health/LATEST_ARCHITECTURE_HEALTH.md
      - name: Record immutable health status and resolve recovered health incidents
        run: |
          python scripts/health/automation_health_resolution.py record \
            --repo-root . \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$(git rev-parse HEAD)"
          python scripts/health/automation_health_resolution.py resolve \
            --repo-root . \
            --run-id "$GITHUB_RUN_ID"
      - name: Materialize incident when production health is RED
        if: steps.health.outputs.exit_code != '0'
        run: |
          mkdir -p 09_SOURCE_QA/incidents
          cp research/architecture_health/LATEST_AUTOMATION_HEALTH.md \
            "09_SOURCE_QA/incidents/INCIDENT_automation-production-health-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.md"
      - name: Commit health, incidents and verify main readback
        shell: bash
        run: |
          git config user.name 'framework-health-bot'
          git config user.email 'framework-health-bot@users.noreply.github.com'
          git add research/architecture_health 09_SOURCE_QA/incidents
          python scripts/governance/check_append_only_evidence.py --repo-root . --cached
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "health: audit automation production state ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          for path in \
            research/architecture_health/LATEST_AUTOMATION_HEALTH.json \
            research/architecture_health/LATEST_AUTOMATION_HEALTH.md \
            research/architecture_health/LATEST_HOURLY_SOURCE_SLA.json \
            research/architecture_health/LATEST_HOURLY_SOURCE_7D.json; do
            local_sha=$(sha256sum "$path" | awk '{print $1}')
            remote_sha=$(git show "origin/main:$path" | sha256sum | awk '{print $1}')
            [ "$local_sha" = "$remote_sha" ]
          done
      - name: Dispatch canonical Operations Dashboard refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --workflow operations-dashboard.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting")] | length')
          if [ "$active" -gt 0 ]; then
            echo "OPERATIONS_DASHBOARD_REFRESH_ALREADY_ACTIVE count=$active"
            exit 0
          fi
          gh workflow run operations-dashboard.yml --ref main
          echo "OPERATIONS_DASHBOARD_REFRESH_DISPATCHED source_health_run=${GITHUB_RUN_ID}"
      - name: Open one sanitized incident issue for RED health
        if: steps.health.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="AUTOMATION HEALTH RED"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file research/architecture_health/LATEST_AUTOMATION_HEALTH.md
          else
            gh issue comment "$existing" --body "Health remains RED at run ${GITHUB_RUN_ID}. See latest committed health report."
          fi
      - name: Record observed fleet status without failing the observer
        shell: bash
        run: |
          if [ "${{ steps.health.outputs.exit_code }}" = "0" ]; then
            echo "### Fleet status: GREEN or AMBER" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Fleet status: RED" >> "$GITHUB_STEP_SUMMARY"
            echo "The health observer completed successfully, durably published the RED report and notified the incident channel." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-production-health-${{ github.run_id }}
          path: |
            research/architecture_health/LATEST_AUTOMATION_HEALTH.json
            research/architecture_health/LATEST_AUTOMATION_HEALTH.md
            research/architecture_health/LATEST_ACTIONS_BUDGET.json
            research/architecture_health/LATEST_ACTIONS_BUDGET.md
            research/architecture_health/LATEST_HOURLY_SOURCE_SLA.json
            research/architecture_health/LATEST_HOURLY_SOURCE_7D.json
            research/architecture_health/hourly_source_sla/daily/
            research/architecture_health/history/
          retention-days: 14
          if-no-files-found: error
