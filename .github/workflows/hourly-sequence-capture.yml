name: Hourly Sequence Capture

on:
  schedule:
    - cron: '55 11 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '55 23 * * *'
      timezone: 'Europe/Copenhagen'
    # Final ISO-week catch-up after Sunday 24:00 UTC (02:00 CPH during CEST).
    - cron: '10 2 * * 1'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  sequence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize last 26 completed hours
        run: |
          python scripts/daily_capture/build_hourly_sequence.py \
            --output-root 03_DAILY_CAPTURE_LOGS/hourly \
            --raw-output hourly-sequence-output \
            --lookback-hours 26
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-sequence-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: hourly-sequence-output/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit compact hourly sequence with verified readback
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 03_DAILY_CAPTURE_LOGS/hourly
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: materialize hourly sequence ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  notify:
    needs: sequence
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish sanitized incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 09_SOURCE_QA/incidents
          FILE="09_SOURCE_QA/incidents/INCIDENT_hourly-sequence-${GITHUB_RUN_ID}.md"
          printf '# AUTOMATION INCIDENT\n\nWorkflow: Hourly Sequence Capture\nRun: %s\nTimestamp UTC: %s\nStatus: FAILED\nInspect Actions logs. No secrets are included.\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > "$FILE"
          git config user.name framework-incident-bot
          git config user.email framework-incident-bot@users.noreply.github.com
          git add "$FILE" && git commit -m "incident: hourly sequence ${GITHUB_RUN_ID}" && git pull --rebase origin main && git push origin HEAD:main
          gh issue create --title "AUTOMATION FAILURE: Hourly Sequence ${GITHUB_RUN_ID}" --body-file "$FILE" || true
