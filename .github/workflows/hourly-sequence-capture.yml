name: Hourly Sequence Capture

on:
  schedule:
    # Materialize each newly completed UTC 1H owner candle shortly after close.
    # :12 avoids the globally congested top-of-hour schedule window while still
    # leaving the owner evidence comfortably inside the public 90-minute freshness SLA.
    # UTC is deliberate: the underlying Binance/OKX hourly candles are UTC-aligned,
    # so DST transitions must not skip or duplicate a source hour.
    - cron: '12 * * * *'
      timezone: 'UTC'
  workflow_dispatch:
    inputs:
      chain_entry_signal:
        description: 'Dispatch Entry Signal after an on-demand Hourly run'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: framework-market-owner-writer
  queue: max
  cancel-in-progress: false

jobs:
  sequence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_commit_sha: ${{ steps.persist_hourly.outputs.source_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize last 26 completed hours
        run: |
          python scripts/daily_capture/build_hourly_sequence.py \
            --output-root 03_DAILY_CAPTURE_LOGS/hourly \
            --raw-output hourly-sequence-output \
            --lookback-hours 26
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-sequence-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: hourly-sequence-output/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit compact hourly sequence with verified readback
        id: persist_hourly
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 03_DAILY_CAPTURE_LOGS/hourly
          if ! git diff --cached --quiet; then
            git commit -m "data: materialize hourly sequence ${GITHUB_RUN_ID}"
            pushed=false
            for attempt in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
              sleep $((attempt * 5))
            done
            [ "$pushed" = true ]
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "source_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Catch up immutable Challenger A SHADOW after hourly main readback
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          # This is part of the EXISTING hourly sequence owner writer lock.
          # Only retry after an original CN freeze has landed on main.
          # Missing bars fail closed; future hourly runs retry on Monday only.
          git fetch origin main
          git pull --ff-only origin main
          ISO_WEEK="$(python - <<'PY'
          import datetime as dt,json
          from pathlib import Path
          p=json.loads(Path('05_CYCLE_NAVIGATOR/LATEST_CYCLE_NAVIGATOR_POINTER.json').read_text())
          year,week=int(p['iso_year']),int(p['iso_week'])
          expected=Path(f'05_CYCLE_NAVIGATOR/weekly/{year}/W{week:02d}')
          if Path(p['week_dir'])!=expected:
              raise SystemExit('CHALLENGER_ISSUE_POINTER_WEEK_PATH_MISMATCH')
          now=dt.datetime.now(dt.timezone.utc)
          if now.isoweekday()!=1 or (now.isocalendar().year,now.isocalendar().week)!=(year,week):
              raise SystemExit('CHALLENGER_ISSUE_OUTSIDE_ORIGINAL_MONDAY_NO_BACKFILL')
          if p.get('status') not in ('READY','DEGRADED'):
              raise SystemExit('CHALLENGER_ISSUE_INVALID_CN_SOURCE_STATUS')
          if not (expected/'CYCLE_NAVIGATOR_FORECAST_FREEZE.json').is_file():
              raise SystemExit('CHALLENGER_ISSUE_NO_ORIGINAL_CN_FREEZE')
          print(f'{year}-W{week:02d}')
          PY
          )"
          YEAR="${ISO_WEEK%%-W*}"
          WEEK="${ISO_WEEK##*-W}"
          ISSUE_REL="06_RESEARCH_LAB/task2_challenger_a/issued/${YEAR}/W${WEEK}/CHALLENGER_A_FROZEN_ISSUANCE.json"
          if git cat-file -e "origin/main:${ISSUE_REL}" 2>/dev/null; then
            # Never amend or relabel a first-published original.
            echo "CHALLENGER_A_ALREADY_ON_MAIN_NOOP:${ISO_WEEK}"
            exit 0
          fi
          if [ -e "${ISSUE_REL}" ]; then
            echo "CHALLENGER_A_LOCAL_UNATTESTED_FILE_NO_OVERWRITE:${ISSUE_REL}" >&2
            exit 1
          fi
          python scripts/research/task2_challenger_a_sqrt_t_vol_band_v1.py issue \
            --repo-root . --week "${ISO_WEEK}" --output "${ISSUE_REL}"
          python - "${ISSUE_REL}" "${ISO_WEEK}" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          if (r.get('contract')!='TASK2_CHALLENGER_A_SQRT_T_VOL_BAND_v1'
              or r.get('week')!=sys.argv[2]
              or r.get('source',{}).get('clock_class')!='MAIN_FIRST_PARENT_COMMITTER_CLOCK_NOT_HTTP_DELIVERY'
              or r.get('source',{}).get('first_http_delivery')!='UNKNOWN'):
              raise SystemExit('CHALLENGER_A_ISSUANCE_SOURCE_CONTRACT_FAIL')
          PY
          git config user.name framework-cycle-navigator-bot
          git config user.email framework-cycle-navigator-bot@users.noreply.github.com
          git add -- "${ISSUE_REL}"
          if git diff --cached --quiet; then
            echo 'CHALLENGER_A_ISSUE_EMPTY_UNEXPECTED' >&2
            exit 1
          fi
          git commit -m "research(task2): freeze Challenger A first-main ${ISO_WEEK} shadow issuance"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt*5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          python - "${ISSUE_REL}" "${ISO_WEEK}" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/research')
          from task2_challenger_a_sqrt_t_vol_band_v1 import read_frozen_main_issuance
          rel,week=sys.argv[1:]
          y,w=map(int,week.split('-W'))
          original,proof=read_frozen_main_issuance(Path('.'),y,w)
          remote=subprocess.run(['git','show','origin/main:'+rel],check=True,capture_output=True).stdout
          local=Path(rel).read_bytes()
          if local!=remote or original['week']!=week:
              raise SystemExit('CHALLENGER_A_REMOTE_MAIN_ORIGINAL_READBACK_FAIL')
          Path('runtime_challenger_a_issue_receipt.json').write_text(
              json.dumps({'contract':'CHALLENGER_A_FIRST_MAIN_ISSUER_RECEIPT_v1',
                          'week':week,'first_main_commit':proof['first_main_commit'],
                          'first_main_blob_sha':proof['first_main_blob_sha'],
                          'first_main_utc':proof['first_main_utc'],
                          'first_http_delivery':'UNKNOWN',
                          'authority':'SHADOW_ONLY_NO_PROMOTION'},sort_keys=True)+'\n')
          PY
          echo "CHALLENGER_A_FIRST_MAIN_ISSUE_SOURCE_READBACK_PASS:${ISO_WEEK}"

      - name: Preflight actual newly completed owner hour
        id: hourly_public_hour
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Deterministic tests and exact owner-pointer freshness BEFORE dispatch.
          python3 scripts/cycle_navigator/verify_hourly_pages_handoff.py --self-test
          hour=$(python3 scripts/cycle_navigator/verify_hourly_pages_handoff.py --source-only | awk '$1=="CN_HOURLY_NEW_SOURCE_HOUR" {print $2}')
          test -n "$hour"
          echo "hour=$hour" >> "$GITHUB_OUTPUT"
      - name: Publish updated hourly observations to Cycle Navigator Pages
        if: steps.hourly_public_hour.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Bot pushes do not start the Pages push trigger. This existing
          # workflow_dispatch is the bounded handoff after source persistence.
          # Dispatch with the exact source-issued hour, not just a best-effort fire-and-forget hint.
          # The existing Pages job validates the real CDN after deploy.
          gh workflow run cycle-navigator-pages.yml --ref main \
            -f expected_hour_utc="${{ steps.hourly_public_hour.outputs.hour }}"
          echo "CN_PAGES_HOURLY_HANDOFF_DISPATCHED_NOT_DELIVERED source_commit=${{ steps.persist_hourly.outputs.source_commit_sha }} expected_hour=${{ steps.hourly_public_hour.outputs.hour }}"
      - name: Dispatch Entry Signal after hourly owner publish
        if: github.event_name != 'workflow_dispatch' || inputs.chain_entry_signal == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --workflow entry-signal-ledger.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length')
          if [ "$active" -gt 0 ]; then
            echo "ENTRY_SIGNAL_HANDOFF_ALREADY_ACTIVE count=$active"
          else
            gh workflow run entry-signal-ledger.yml --ref main
            echo "ENTRY_SIGNAL_HANDOFF_DISPATCHED source_hourly_run=${GITHUB_RUN_ID}"
          fi


  intraday:
    # This dependency remains inside the SAME latency-critical market-owner writer lock.
    # No independently pending Intraday run can be displaced between source and research.
    needs: sequence
    if: github.ref == 'refs/heads/main' && needs.sequence.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sequence.outputs.source_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen successful Hourly publication
        shell: bash
        env:
          HOURLY_SOURCE_COMMIT: ${{ needs.sequence.outputs.source_commit_sha }}
        run: |
          test -n "$HOURLY_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$HOURLY_SOURCE_COMMIT"
          git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/intraday-execution
      - name: Commit prospective observations
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 04_MARKET_LEARNING/intraday_execution
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "learning: intraday execution ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  notify:
    needs: sequence
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish sanitized incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 09_SOURCE_QA/incidents
          FILE="09_SOURCE_QA/incidents/INCIDENT_hourly-sequence-${GITHUB_RUN_ID}.md"
          printf '# AUTOMATION INCIDENT\n\nWorkflow: Hourly Sequence Capture\nRun: %s\nTimestamp UTC: %s\nStatus: FAILED\nInspect Actions logs. No secrets are included.\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > "$FILE"
          git config user.name framework-incident-bot
          git config user.email framework-incident-bot@users.noreply.github.com
          git add "$FILE" && git commit -m "incident: hourly sequence ${GITHUB_RUN_ID}" && git pull --rebase origin main && git push origin HEAD:main
          gh issue create --title "AUTOMATION FAILURE: Hourly Sequence ${GITHUB_RUN_ID}" --body-file "$FILE" || true
