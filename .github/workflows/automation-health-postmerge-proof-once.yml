name: Automation Health Post-Merge Proof Once

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  launch:
    if: contains(github.event.head_commit.message, '[AH732_PROOF]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current-main Automation Production Health
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run automation-production-health.yml --ref main
