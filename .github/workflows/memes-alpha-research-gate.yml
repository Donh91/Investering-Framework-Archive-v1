name: Memes Alpha Research Gate

on:
  pull_request:
    paths:
      - 'scripts/research/memes_alpha/**'
      - 'tests/research/memes_alpha/**'
      - 'research/memes_alpha/**'
      - '.github/workflows/memes-alpha-research*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic Memes v3 regressions
        run: python -m unittest discover -s tests/research/memes_alpha -p 'test_*.py' -v
      - name: Assert no private identifiers in tracked public Memes Alpha artifacts
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/research/memes_alpha')
          from core import validate_public_payload
          root=Path('research/memes_alpha')
          checked=0
          if root.exists():
              for p in root.rglob('*.json'):
                  validate_public_payload(json.loads(p.read_text()))
                  checked += 1
          print('MEMES_ALPHA_PUBLIC_LEAKAGE_GATE_PASS', checked)
          PY
