name: Rich Breadth Checkpoint

on:
  schedule:
    # Normal tactical cadence: every 4 hours, Europe/Copenhagen.
    - cron: '18 2,6,10,14,18,22 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: framework-main-writer
  queue: max
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture rich point-in-time breadth
        run: python scripts/daily_capture/rich_breadth_checkpoint.py --output-root 03_DAILY_CAPTURE_LOGS/breadth_rich
      - name: Emit and validate lifecycle receipt
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path('03_DAILY_CAPTURE_LOGS/breadth_rich/LATEST.json').read_text())
          lc = payload.get('lifecycle') or {}
          now = datetime.now(timezone.utc)
          out = Path('03_DAILY_CAPTURE_LOGS/evidence_lifecycle/breadth_rich') / now.strftime('%Y/%m/%d') / f"gh-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}.json"
          args = [
              sys.executable, 'scripts/evidence_lifecycle/write_lifecycle_receipt.py',
              '--output', str(out),
              '--source-run-id', f"gh-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              '--evidence-lane', 'BREADTH_RICH',
              '--repo-head-sha', os.environ['GITHUB_SHA'],
              '--source-lineage', 'COINGECKO_MARKET_CAP top100 breadth owner',
          ]
          for field in ('retrieval_start_time','retrieval_complete_time','normalization_time'):
              if lc.get(field):
                  args += ['--timestamp', f"{field}={lc[field]}"]
          subprocess.run(args, check=True)
          subprocess.run([sys.executable, 'scripts/evidence_lifecycle/validate_lifecycle_receipt.py', str(out)], check=True)
          PY
      - name: Commit rich breadth evidence
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 03_DAILY_CAPTURE_LOGS/breadth_rich 03_DAILY_CAPTURE_LOGS/evidence_lifecycle/breadth_rich
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: capture rich breadth ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Recover breadth-blocked Auto Market State
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          needs_recovery=$(python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone

          def show_json(path):
              raw = subprocess.check_output(
                  ["git", "show", f"origin/main:{path}"],
                  text=True,
              )
              return json.loads(raw)

          def parse_utc(value):
              if not isinstance(value, str) or not value:
                  return None
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)

          try:
              pointer = show_json("04_MARKET_LEARNING/entry_signals/auto_market_state/LATEST.json")
              packet_path = pointer.get("packet_path")
              packet = show_json(packet_path) if isinstance(packet_path, str) and packet_path else {}
              breadth = show_json("03_DAILY_CAPTURE_LOGS/breadth_rich/LATEST.json")
          except Exception as exc:
              print(f"false")
              raise SystemExit(0)

          blockers = packet.get("blockers") if isinstance(packet.get("blockers"), list) else []
          health = ((packet.get("source_health") or {}).get("breadth") or {})
          packet_time = parse_utc(pointer.get("packet_generated_at_utc"))
          breadth_time = parse_utc(
              breadth.get("retrieved_at_utc")
              or breadth.get("retrieval_timestamp")
              or ((breadth.get("observation") or {}).get("retrieval_timestamp_utc"))
          )
          recoverable_breadth_block = (
              pointer.get("decision_context_status") == "DEGRADED"
              and "breadth" in blockers
          )
          fresh_owner_arrived = (
              packet_time is not None
              and breadth_time is not None
              and breadth_time > packet_time
          )
          print("true" if recoverable_breadth_block and fresh_owner_arrived else "false")
          PY
          )
          if [ "$needs_recovery" != "true" ]; then
            echo "BREADTH_RECOVERY_NOOP no recoverable breadth blocker cleared by this checkpoint"
            exit 0
          fi
          active=$(gh run list --workflow entry-signal-ledger.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length')
          if [ "$active" -gt 0 ]; then
            echo "BREADTH_RECOVERY_ALREADY_ACTIVE count=$active"
            exit 0
          fi
          gh workflow run entry-signal-ledger.yml --ref main
          echo "BREADTH_RECOVERY_ENTRY_SIGNAL_DISPATCHED source_breadth_run=${GITHUB_RUN_ID}"
