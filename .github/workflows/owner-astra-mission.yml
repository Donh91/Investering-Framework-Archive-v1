# Generic owner Astra mission launcher. ONE paid Responses POST per reviewed mission, never a retry.
# Launch: the owner (Donh91) posts on issue #1156 exactly
#   OWNER_LAUNCH_ASTRA_MISSION <mission_id> <bundle_sha256>
# A mission is a reviewed folder 06_RESEARCH_LAB/astra_missions/<mission_id>/ on main plus its row in
# research/api_agent/coordination/API_PENDING_BILLING_RISK_V1.json astra_mission_reservations. A new mission
# needs no change here. The comment body is never interpolated into a shell: the script reads the event file.
# offline: pull_request only, no secrets, no network: tests and an exact preview of every mission.
# verify:  issue_comment only, no secrets, read-only token: event, mission, bundle hash, model policy, guard.
# paid:    issue_comment only; secrets. Durable one-use claim on #1156 (comment + mission-named artifact) before the POST.
# recover: issue_comment OWNER_COLLECT_ASTRA_MISSION <mission_id> <response_id>; secrets; GET only, never a model POST.
name: Owner Astra mission
on:
  pull_request:
    paths:
      - '.github/workflows/owner-astra-mission.yml'
      - 'scripts/research/owner_astra_mission_v1.py'
      - 'tests/research/test_owner_astra_mission_v1.py'
      - 'scripts/research/astra_worklike_pilot_v1.py'
      - 'scripts/research/astra_worklike_oracle_v1.py'
      - 'tests/research/test_astra_worklike_pilot_v1.py'
      - 'tests/research/test_astra_worklike_oracle_v1.py'
      - 'scripts/api_agent/astra_build_admit_v1.py'
      - 'scripts/api_agent/astra_build_sandbox_v1.py'
      - 'scripts/api_agent/astra_build_cost_v1.py'
      - 'scripts/api_agent/astra_build_receipt_v1.py'
      - 'scripts/api_agent/astra_build_driver_v1.py'
      - 'tests/api_agent/test_astra_build_driver_v1.py'
      - 'tests/api_agent/test_astra_build_receipt_v1.py'
      - 'tests/api_agent/test_astra_build_cost_v1.py'
      - 'tests/api_agent/test_astra_build_admit_v1.py'
      - 'tests/api_agent/test_astra_build_sandbox_v1.py'
      - 'scripts/api_agent/astra_mission_reservations_v1.py'
      - 'scripts/api_agent/check_monthly_cost_guard.py'
      - 'scripts/api_agent/api_gateway.py'
      - 'research/api_agent/coordination/API_PENDING_BILLING_RISK_V1.json'
      - 'research/api_agent/coordination/SOL_MAX_SHARED_MODEL_POLICY_V1.json'
      - '06_RESEARCH_LAB/astra_missions/**'
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline YAML test dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: No-network trigger, claim, guard and no-retry tests
        run: >-
          python -m unittest tests.research.test_owner_astra_mission_v1
          tests.research.test_astra_worklike_pilot_v1
          tests.research.test_astra_worklike_oracle_v1
          tests.api_agent.test_astra_build_admit_v1
          tests.api_agent.test_astra_build_sandbox_v1
          tests.api_agent.test_astra_build_cost_v1
          tests.api_agent.test_astra_build_receipt_v1
          tests.api_agent.test_astra_build_driver_v1 -v
      - name: Exact request preview of every mission, NO network
        run: python scripts/research/owner_astra_mission_v1.py preview-all --out runtime/astra-mission-preview

  worklike-smoke:
    # Disposable PR runner, deterministic reference and false-success control only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect Work-like pilot changes
        id: relevant
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/astra-worklike-changed.txt"
          if grep -Eq '^([.]github/workflows/owner-astra-mission[.]yml$|scripts/research/(owner_astra_mission_v1|astra_worklike_.*)[.]py$|tests/research/test_astra_worklike_.*[.]py$|scripts/api_agent/astra_build_.*[.]py$|tests/api_agent/test_astra_build_.*[.]py$|06_RESEARCH_LAB/astra_missions/ASTRA-KOMPAS-L04-WORKLIKE-PILOT-S1-20261120/)' "$RUNNER_TEMP/astra-worklike-changed.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.relevant.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Pull exact public Python image before sandbox
        if: steps.relevant.outputs.run == 'true'
        run: |
          docker pull --platform linux/amd64 python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b)" = linux/amd64
      - name: Execute native synthetic sandbox and negative control
        if: steps.relevant.outputs.run == 'true'
        run: python -m scripts.research.astra_worklike_oracle_v1 smoke --out runtime/astra-worklike-smoke/receipt.json
      - name: Execute BUILD_v1 real offline sandbox, network denial and mutant
        if: steps.relevant.outputs.run == 'true'
        run: python -m scripts.api_agent.astra_build_sandbox_v1 smoke --out runtime/astra-build-smoke/receipt.json
      - uses: actions/upload-artifact@v4
        if: steps.relevant.outputs.run == 'true'
        with:
          name: astra-worklike-smoke-${{ github.run_id }}
          path: runtime/astra-worklike-smoke/receipt.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: steps.relevant.outputs.run == 'true'
        with:
          name: astra-build-smoke-${{ github.run_id }}
          path: runtime/astra-build-smoke/receipt.json
          if-no-files-found: error
          retention-days: 90

  build-toolchain-audit:
    # Strictly PR-only, owner-source worktree, no key or write authority.
    # Source-bound IMAGE CANDIDATE. A successful build does not lift BUILD HOLD.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'build/astra-build-hold-lift-h1-h6-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build reviewed dependency candidate outside any paid job
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --file scripts/api_agent/docker/astra-build-toolchain-v1.Dockerfile.txt \
            --tag astra-build-toolchain-audit:v1 .
          image_id=$(docker image inspect --format '{{.Id}}' astra-build-toolchain-audit:v1)
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 256m --pids-limit 32 \
            astra-build-toolchain-audit:v1 python -m pytest --version
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 256m --pids-limit 32 \
            astra-build-toolchain-audit:v1 node --version
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 256m --pids-limit 32 \
            astra-build-toolchain-audit:v1 git --version
          mkdir -p runtime/astra-build-toolchain-evidence
          build_inputs_sha256=$(
            sha256sum scripts/api_agent/docker/astra-build-toolchain-v1.Dockerfile.txt \
              scripts/api_agent/docker/astra-build-requirements.lock.txt \
              scripts/api_agent/docker/inspect_astra_toolchain_lock_v1.py \
              | LC_ALL=C sort | sha256sum | cut -d' ' -f1
          )
          printf '{"contract":"ASTRA_BUILD_TOOLCHAIN_CANDIDATE_v1","image_id":"%s","build_inputs_sha256":"%s","lock_sha256":"70852b54dc8bd5af2c70403a5316bda21eaa6a949f710a0451981360c96b5e38","activation":"HOLD_NO_PAID_BUILD","test_command_completed":false}\n' "$image_id" "$build_inputs_sha256" \
            > runtime/astra-build-toolchain-evidence/image_candidate.json
      - name: Generate candidate wheel-hash lock from reviewed no-secret toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/astra-build-toolchain-evidence/wheels
          docker run --rm --network bridge --pull never \
            --mount "type=bind,src=$PWD/runtime/astra-build-toolchain-evidence,dst=/out" \
            astra-build-toolchain-audit:v1 sh -ec \
            'python -m pip freeze > /out/requirements-resolved.txt && \
             python -m pip download --no-cache-dir --only-binary=:all: --no-deps \
               -r /out/requirements-resolved.txt -d /out/wheels'
          python scripts/api_agent/docker/inspect_astra_toolchain_lock_v1.py \
            --freeze runtime/astra-build-toolchain-evidence/requirements-resolved.txt \
            --wheels runtime/astra-build-toolchain-evidence/wheels \
            --lock-out runtime/astra-build-toolchain-evidence/requirements.lock.candidate.txt
          cmp -s scripts/api_agent/docker/astra-build-requirements.lock.txt \
            runtime/astra-build-toolchain-evidence/requirements.lock.candidate.txt
          sha256sum scripts/api_agent/docker/astra-build-requirements.lock.txt
          echo "SOURCE_LOCK_EQUALS_NATIVE_WHEEL_HASH_CENSUS_NO_RELEASE"
      - name: Read separate pristine public main checkout
        uses: actions/checkout@v4
        with:
          ref: main
          path: runtime/pristine-main
          persist-credentials: false
      - name: Independent no-secret M1 and M3 baseline probe
        shell: bash
        run: |
          set -euo pipefail
          image_id=$(docker image inspect --format '{{.Id}}' astra-build-toolchain-audit:v1)
          pristine_sha=$(git -C runtime/pristine-main rev-parse HEAD)
          python -m scripts.api_agent.astra_build_baseline_probe_v1 \
            --pristine runtime/pristine-main \
            --sha "$pristine_sha" --image-id "$image_id" \
            --out runtime/astra-build-toolchain-evidence/pristine-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-build-toolchain-candidate-${{ github.run_id }}
          path: runtime/astra-build-toolchain-evidence/
          if-no-files-found: warn
          retention-days: 30

  verify:
    if: >-
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 1156 && github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'Donh91' && github.actor == 'Donh91' &&
      github.event.comment.author_association == 'OWNER' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      startsWith(github.event.comment.body, 'OWNER_LAUNCH_ASTRA_MISSION ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact owner event, mission, bundle hash, model policy and cost bound, NO network
        run: python scripts/research/owner_astra_mission_v1.py prepare --out runtime/astra-mission
      - name: Shared cost guard with this mission's own reservation
        run: >-
          python scripts/api_agent/check_monthly_cost_guard.py
          --receipt-root research/api_agent/outputs
          --hard-stop-usd "$(cat runtime/astra-mission/guard_hard_stop_usd.txt)" --reserve-usd 4
          --new-request-upper-usd 0
          --owner-astra-mission-id "$(cat runtime/astra-mission/guard_mission_id.txt)"

  paid:
    needs: verify
    if: >-
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 1156 && github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'Donh91' && github.actor == 'Donh91' &&
      github.event.comment.author_association == 'OWNER' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      startsWith(github.event.comment.body, 'OWNER_LAUNCH_ASTRA_MISSION ')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      issues: write
      actions: read
    concurrency:
      group: owner-astra-mission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact request, verify owner event, mission and reservation
        run: python scripts/research/owner_astra_mission_v1.py prepare --out runtime/astra-mission
      - name: Mission-named claim artifact (durable second consumption record)
        id: claimname
        run: python scripts/research/owner_astra_mission_v1.py claim-artifact-name --out runtime/astra-mission
      - name: Shared cost guard with this mission's own reservation
        run: >-
          python scripts/api_agent/check_monthly_cost_guard.py
          --receipt-root research/api_agent/outputs
          --hard-stop-usd "$(cat runtime/astra-mission/guard_hard_stop_usd.txt)" --reserve-usd 4
          --new-request-upper-usd 0
          --owner-astra-mission-id "$(cat runtime/astra-mission/guard_mission_id.txt)"
          > runtime/astra-mission/guard_result.json
      - name: Guard result, provider model GET, durable one-use claim and readback
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/research/owner_astra_mission_v1.py reserve --out runtime/astra-mission --guard-json runtime/astra-mission/guard_result.json
      - name: Preserve pre-POST evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.claimname.outputs.claim_artifact }}
          path: |
            runtime/astra-mission/claim.json
            runtime/astra-mission/budget_guard.json
            runtime/astra-mission/source_manifest.json
            runtime/astra-mission/request.json
          retention-days: 90
          if-no-files-found: error
      - name: Mark the irreversible single attempt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/research/owner_astra_mission_v1.py mark_attempt --out runtime/astra-mission
      - name: ONE Astra POST, no retry
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/research/owner_astra_mission_v1.py submit --out runtime/astra-mission
      - name: GET-only collection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/research/owner_astra_mission_v1.py collect --out runtime/astra-mission
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-mission-evidence-${{ github.run_id }}
          path: |
            runtime/astra-mission/claim.json
            runtime/astra-mission/budget_guard.json
            runtime/astra-mission/source_manifest.json
            runtime/astra-mission/request.json
            runtime/astra-mission/attempt.json
            runtime/astra-mission/submission_started.json
            runtime/astra-mission/handle.json
            runtime/astra-mission/pending.json
            runtime/astra-mission/receipt.json
            runtime/astra-mission/archive/
          retention-days: 90
          if-no-files-found: warn
      - name: Short completion comment on #1156 (claimed runs only, no model text)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/research/owner_astra_mission_v1.py report --out runtime/astra-mission

  recover:
    # GET-only recovery of a paid run that ended before collection. Never POSTs to the model API.
    if: >-
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 1156 && github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'Donh91' && github.actor == 'Donh91' &&
      github.event.comment.author_association == 'OWNER' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      startsWith(github.event.comment.body, 'OWNER_COLLECT_ASTRA_MISSION ')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      issues: write
    concurrency:
      group: owner-astra-mission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GET-only recovery collection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/research/owner_astra_mission_v1.py recover --out runtime/astra-mission
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-mission-evidence-${{ github.run_id }}
          path: |
            runtime/astra-mission/source_manifest.json
            runtime/astra-mission/handle.json
            runtime/astra-mission/pending.json
            runtime/astra-mission/receipt.json
            runtime/astra-mission/archive/
          retention-days: 90
          if-no-files-found: warn
      - name: Short result comment on #1156 (no model text)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/research/owner_astra_mission_v1.py report --out runtime/astra-mission

  worklike-sandbox:
    # Separate ephemeral runner. Only the fixed pilot's successful collected artifact is admitted.
    # No provider key, write token, repository checkout inside the container, or further paid call.
    needs: [paid, recover]
    if: >-
      always() && github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 1156 && github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'Donh91' && github.actor == 'Donh91' &&
      github.event.comment.author_association == 'OWNER' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      ((needs.paid.result == 'success' &&
      startsWith(github.event.comment.body, 'OWNER_LAUNCH_ASTRA_MISSION ASTRA-KOMPAS-L04-WORKLIKE-PILOT-S1-20261120 ')) ||
      (needs.recover.result == 'success' &&
      startsWith(github.event.comment.body, 'OWNER_COLLECT_ASTRA_MISSION ASTRA-KOMPAS-L04-WORKLIKE-PILOT-S1-20261120 ')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: astra-mission-evidence-${{ github.run_id }}
          path: runtime/astra-worklike-input
      - name: Pull exact public Python image before sandbox
        run: |
          docker pull --platform linux/amd64 python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b)" = linux/amd64
      - name: Admit native receipt and independently execute candidate in bounded sandbox
        run: >-
          python -m scripts.research.astra_worklike_oracle_v1 verify
          --input runtime/astra-worklike-input --out runtime/astra-worklike-result/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-worklike-result-${{ github.run_id }}
          path: runtime/astra-worklike-result/receipt.json
          if-no-files-found: warn
          retention-days: 90

  build-sandbox:
    # BUILD_v1 downstream of one owner-approved and claimed paid request.
    # No key, write token, model-chosen shell, PR writer, repair POST or auto-merge.
    needs: [paid]
    if: >-
      always() && github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 1156 && github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'Donh91' && github.actor == 'Donh91' &&
      github.event.comment.author_association == 'OWNER' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && needs.paid.result == 'success' &&
      (startsWith(github.event.comment.body, 'OWNER_LAUNCH_ASTRA_MISSION ASTRA-BUILD-M1-20261121-S1 ') ||
       startsWith(github.event.comment.body, 'OWNER_LAUNCH_ASTRA_MISSION ASTRA-BUILD-M2-20261121-S1 ') ||
       startsWith(github.event.comment.body, 'OWNER_LAUNCH_ASTRA_MISSION ASTRA-BUILD-M3-20261121-S1 '))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source-reviewed hash-locked toolchain BEFORE any model artifacts
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --file scripts/api_agent/docker/astra-build-toolchain-v1.Dockerfile.txt \
            --tag astra-build-runtime:reviewed .
          image_id=$(docker image inspect --format '{{.Id}}' astra-build-runtime:reviewed)
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" = linux/amd64
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 256m --memory-swap 256m \
            --cpus 0.5 --pids-limit 32 "$image_id" python -m pytest --version
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 256m --memory-swap 256m \
            --cpus 0.5 --pids-limit 32 "$image_id" node --version
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 256m --memory-swap 256m \
            --cpus 0.5 --pids-limit 32 "$image_id" git --version
          echo "ASTRA_BUILD_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: astra-mission-evidence-${{ github.run_id }}
          path: runtime/astra-build-input
      - name: Bind exact original provider receipt and execute only fixed BUILD tests
        run: >-
          python -m scripts.api_agent.astra_build_driver_v1
          --repo . --artifact runtime/astra-build-input
          --out runtime/astra-build-result/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-build-result-${{ github.run_id }}
          path: runtime/astra-build-result/receipt.json
          if-no-files-found: warn
          retention-days: 90
