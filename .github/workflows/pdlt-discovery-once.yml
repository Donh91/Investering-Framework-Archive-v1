name: PDLT discovery from bootstrap once

# METHODS FAIL-CLOSE — 2026-08-10
# Discovery is intentionally non-runnable until the Phase II / Claude P2
# selection-and-holdout defects are repaired prospectively and validated.
# Keeping workflow_dispatch preserves audit visibility while the job itself
# fails closed. No schedule is present, so no automatic discovery can run.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: PDLT discovery frozen pending methods repair
        run: |
          echo 'PDLT_DISCOVERY_FROZEN_METHODS_REPAIR_REQUIRED'
          exit 78
