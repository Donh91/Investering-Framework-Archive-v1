name: PDLT discovery from bootstrap once

# METHODS FAIL-CLOSE — 2026-08-10
# Discovery is intentionally non-runnable until the Phase II / Claude P2
# selection-and-holdout defects are repaired prospectively and validated.
# There is no schedule. A manual dispatch emits an explicit blocked state and
# fails with exit 78 so automation health cannot misread the freeze as recovery.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  discovery_frozen:
    runs-on: ubuntu-latest
    steps:
      - name: PDLT discovery frozen pending methods repair
        run: |
          echo 'PDLT_DISCOVERY_FROZEN_METHODS_REPAIR_REQUIRED'
          exit 78
