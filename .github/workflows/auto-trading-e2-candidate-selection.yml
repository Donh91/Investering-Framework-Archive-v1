name: Auto Trading E2 Candidate Selection

on:
  pull_request:
    paths:
      - 'scripts/experiments/ai_candidate_selection_e2.py'
      - 'tests/experiments/test_ai_candidate_selection_e2.py'
      - 'research/experiment_lifecycle/e2/requests/AT-E2-CANDIDATE-SELECTION-v3.json'
      - '.github/workflows/auto-trading-e2-candidate-selection.yml'
  push:
    branches: [main]
    paths:
      - 'research/experiment_lifecycle/e2/requests/AT-E2-CANDIDATE-SELECTION-v3.json'
  workflow_dispatch:
    inputs:
      mode:
        description: deterministic preflight or bounded live candidate-selection gate
        required: true
        default: preflight
        type: choice
        options: [preflight, live-e2-v3]

permissions:
  contents: read

concurrency:
  group: auto-trading-e2-candidate-selection-v3
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bounded E2 v3 harness
        run: |
          python -m py_compile \
            scripts/experiments/ai_candidate_selection_e2.py \
            scripts/experiments/ai_compiler_reliability_e2.py \
            scripts/experiments/ai_compiler_vs_policy_e2.py \
            scripts/experiments/ai_compiler_vs_policy_e2_hourly_adapter.py \
            scripts/experiments/agent_handoff_contract.py \
            tests/experiments/test_ai_candidate_selection_e2.py
      - name: Run focused unit and falsifier regressions
        run: python -m unittest tests.experiments.test_ai_candidate_selection_e2 -v
      - name: Run production-data dry preflight without model calls
        run: |
          rm -rf /tmp/at-e2-v3-preflight
          python scripts/experiments/ai_candidate_selection_e2.py \
            --request research/experiment_lifecycle/e2/requests/AT-E2-CANDIDATE-SELECTION-v3.json \
            --repo-root . \
            --output-dir /tmp/at-e2-v3-preflight \
            --dry-run
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/at-e2-v3-preflight/result.json').read_text())
          assert r['contract']=='AUTO_TRADING_E2_CANDIDATE_SELECTION_RESULT_v1'
          assert r['experiment_id']=='AT-E2-CANDIDATE-SELECTION-v3'
          assert r['issue']==966
          assert r['status']=='COMPLETE'
          assert r['selection']['structured_selection_success_rate']==1.0
          assert r['selection']['candidate_admission_rate']==1.0
          assert r['selection']['modal_candidate_share']==1.0
          assert r['selection']['modal_candidate_id']=='C03'
          assert r['candidate_set_sha256']=='d470bf21cd79994ac59e97ddc4fd706944e0a613cd21dc362897d777d340f3d4'
          assert r['api']['selection_calls']==10
          assert r['api']['total_cost_usd']==0.0
          assert r['economic_scoring_performed'] is False
          assert r['direct_policy_arm_performed'] is False
          assert r['capital_ready'] is False
          assert r['no_retroactive_rescore'] is True
          assert r['no_post_result_prompt_tuning'] is True
          assert all(v is False for v in r['authority'].values())
          print('AUTO_TRADING_E2_V3_PREFLIGHT_PASS')
          PY

  live-e2-v3:
    needs: preflight
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live-e2-v3')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute frozen research-only candidate-selection trial
        run: |
          rm -rf /tmp/at-e2-v3-live
          python scripts/experiments/ai_candidate_selection_e2.py \
            --request research/experiment_lifecycle/e2/requests/AT-E2-CANDIDATE-SELECTION-v3.json \
            --repo-root . \
            --output-dir /tmp/at-e2-v3-live \
            | tee /tmp/at-e2-v3-live-summary.log
      - name: Verify identity, no-economics boundary, authority and cost
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/at-e2-v3-live/result.json').read_text())
          assert r['contract']=='AUTO_TRADING_E2_CANDIDATE_SELECTION_RESULT_v1'
          assert r['experiment_id']=='AT-E2-CANDIDATE-SELECTION-v3'
          assert r['issue']==966
          assert r['status']=='COMPLETE'
          assert r['api']['model']=='gpt-5.6-luna'
          assert r['api']['selection_calls']==10
          assert r['api']['total_cost_usd'] <= r['api']['hard_cost_stop_usd'] <= 0.05
          assert r['candidate_set_sha256']=='d470bf21cd79994ac59e97ddc4fd706944e0a613cd21dc362897d777d340f3d4'
          assert r['economic_scoring_performed'] is False
          assert r['direct_policy_arm_performed'] is False
          assert r['capital_ready'] is False
          assert r['no_retroactive_rescore'] is True
          assert r['no_post_result_prompt_tuning'] is True
          assert all(v is False for v in r['authority'].values())
          print('AUTO_TRADING_E2_V3_LIVE_AUTHORITY_PASS')
          PY
      - name: Emit immutable result bytes for retention readback
        shell: bash
        run: |
          echo "E2_V3_RESULT_B64=$(base64 -w0 /tmp/at-e2-v3-live/result.json)"
          echo "E2_V3_CALLS_B64=$(base64 -w0 /tmp/at-e2-v3-live/calls.jsonl)"
          echo "E2_V3_DESIGN_B64=$(base64 -w0 /tmp/at-e2-v3-live/design_summary.json)"
          echo "E2_V3_CANDIDATES_B64=$(base64 -w0 /tmp/at-e2-v3-live/candidate_set.json)"
      - uses: actions/upload-artifact@v4
        with:
          name: auto-trading-e2-candidate-selection-v3-${{ github.run_id }}
          path: |
            /tmp/at-e2-v3-live/result.json
            /tmp/at-e2-v3-live/calls.jsonl
            /tmp/at-e2-v3-live/design_summary.json
            /tmp/at-e2-v3-live/candidate_set.json
            /tmp/at-e2-v3-live-summary.log
          retention-days: 30
          if-no-files-found: error
