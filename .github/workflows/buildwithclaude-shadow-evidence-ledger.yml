name: BuildWithClaude Shadow Evidence Ledger Validation

on:
  pull_request:
    paths:
      - '06_RESEARCH_LAB/buildwithclaude_shadow_round1_v1/**'
      - 'scripts/research/shadow_guardrail_probe.py'
      - 'scripts/research/validate_buildwithclaude_shadow_round1.py'
      - '.github/workflows/buildwithclaude-shadow-evidence-ledger.yml'
      - '.github/workflows/buildwithclaude-shadow-round1.yml'
      - '.github/workflows/buildwithclaude-shadow-prospective-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and validate BuildWithClaude shadow contracts
        run: |
          python -m py_compile \
            scripts/research/shadow_guardrail_probe.py \
            scripts/research/validate_buildwithclaude_shadow_round1.py
          python scripts/research/validate_buildwithclaude_shadow_round1.py
          python scripts/research/shadow_guardrail_probe.py --mode self-test
      - name: Validate persisted evidence authority and distinct-version semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('06_RESEARCH_LAB/buildwithclaude_shadow_round1_v1')
          evidence = root / 'evidence'
          rows = []
          for path in sorted(evidence.glob('*.json')):
              row = json.loads(path.read_text(encoding='utf-8'))
              assert row.get('authority') == 'RESEARCH_ONLY_NON_CANONICAL', path
              assert row.get('canonical_effect') is False, path
              assert row.get('portfolio_execution') is False, path
              rows.append((path, row))

          prospective = [row for _, row in rows if row.get('evidence_class') == 'PROSPECTIVE_WEEKLY_CURRENT_MAIN']
          target_shas = {row.get('target_sha256') for row in prospective if row.get('target_sha256')}
          assert len(rows) >= 1
          assert len(prospective) >= 1
          assert len(target_shas) <= len(prospective)

          lifecycle = json.loads((root / 'BUILDWITHCLAUDE_SHADOW_LIFECYCLE_2026-09-02.json').read_text(encoding='utf-8'))
          assert lifecycle['decision'] == 'CONTINUE_SHADOW_EVENT_DRIVEN_NO_WEEKLY_WRITER'
          assert lifecycle['promotion_permitted'] is False
          assert lifecycle['authority'] == 'RESEARCH_ONLY_NON_CANONICAL'
          assert lifecycle['weekly_direct_main_writer_active'] is False
          assert lifecycle['event_driven_observer_active'] is True

          print(json.dumps({
              'status': 'PASS',
              'persisted_rows': len(rows),
              'prospective_rows': len(prospective),
              'distinct_target_versions': len(target_shas),
              'interpretation': 'Repeated rows for the same target SHA are stability observations, not additional real-change evidence.'
          }, sort_keys=True))
          PY
