name: TypeSafe Jev Stress and Token Benchmark
on:
  pull_request:
    paths:
      - 'scripts/api_agent/typesafe_jev_*'
      - 'tests/api_agent/test_typesafe_jev_stress.py'
      - '.github/workflows/typesafe_jev_stress_token_benchmark.yml'
  workflow_dispatch:
    inputs:
      run_live_jev:
        description: 'Run live Jev canary'
        required: true
        default: false
        type: boolean
      run_sol_token_benchmark:
        description: 'Run one bounded GPT-5.6 Sol API token benchmark'
        required: true
        default: false
        type: boolean
      run_live_falsification:
        description: 'Run bounded 20-call Jev injection/repeatability matrix'
        required: true
        default: false
        type: boolean
      run_real_shadow_pilot:
        description: 'Run one real immutable Alpha Lab observation through Jev, shadow-only'
        required: true
        default: false
        type: boolean
      observation_path:
        description: 'Repo-relative immutable MEME_ALPHA_G2_G3_SHADOW_OBSERVATION_v1 JSON path'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  deterministic-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run replay stress suite
        run: python tests/api_agent/test_typesafe_jev_stress.py
  live-jev:
    env:
      PYTHONPATH: ${{ github.workspace }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    if: github.event_name == 'workflow_dispatch' && (inputs.run_live_jev || inputs.run_live_falsification)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install "typesafe-sdk==0.7.0"
      - run: test -n "$TYPESAFE_API_KEY"
      - name: Run live synthetic Jev replay
        run: python scripts/api_agent/typesafe_jev_replay_runner.py --input tests/fixtures/typesafe_jev/synthetic_blind_observation_v1.json --output /tmp/prediction.json --repeat 5 --adversarial-suite --representation-suite
      - name: Preserve sanitized falsification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jev-live-falsification
          path: /tmp/prediction.json
          retention-days: 14
  sol-token-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_sol_token_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BENCH_MODEL: gpt-5.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify secret without printing it
        run: test -n "$OPENAI_API_KEY"
      - name: One-shot Sol token benchmark
        run: python scripts/api_agent/openai_sol_token_benchmark.py

  real-shadow-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_shadow_pilot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      OBSERVATION_PATH: ${{ inputs.observation_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install "typesafe-sdk==0.7.0"
      - name: Validate pilot boundary
        shell: bash
        run: |
          test -n "$TYPESAFE_API_KEY"
          test -n "$OBSERVATION_PATH"
          case "$OBSERVATION_PATH" in
            research/api_agent/meme_alpha/*|tests/fixtures/typesafe_jev/*) ;;
            *) echo "Observation path outside approved Alpha Lab/JEV evidence roots" >&2; exit 2 ;;
          esac
          test -f "$OBSERVATION_PATH"
      - name: Run one real shadow Jev decision
        run: python scripts/api_agent/typesafe_jev_replay_runner.py --input "$OBSERVATION_PATH" --output /tmp/real-shadow-prediction.json --repeat 1
      - name: Preserve sanitized shadow prediction
        uses: actions/upload-artifact@v4
        with:
          name: jev-real-shadow-pilot
          path: /tmp/real-shadow-prediction.json
          retention-days: 30
