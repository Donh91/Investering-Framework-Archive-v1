name: Weekly API Calibration Shadow

on:
  schedule:
    - cron: '10 0 * * 1'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-api-calibration-shadow
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce monthly API cost guard
        run: python scripts/api_agent/check_monthly_cost_guard.py --receipt-root research/api_agent/outputs --hard-stop-usd 20 --reserve-usd 0.50
      - name: Build weekly context
        run: |
          mkdir -p runtime/weekly-calibration
          python scripts/api_agent/build_weekly_calibration_context.py \
            --weekly-pointer 03_DAILY_CAPTURE_LOGS/weekly/LATEST_WEEKLY_CALIBRATION.json \
            --daily-output-root research/api_agent/outputs/daily \
            --output runtime/weekly-calibration/context.json
          cat > runtime/weekly-calibration/prompt.txt <<'EOF'
          Audit the supplied weekly capture pack and Daily Director rows. Identify repeated sequences, early deterioration, failed confirmations, specialist disagreement and data-quality limits. Separate directional accuracy, timing, confidence calibration, false positives, false negatives and opportunity cost. Produce a shadow calibration handoff for RAW and Master Monday. Do not alter frozen forecasts, thresholds, model weights, framework state or portfolio action.
          EOF
      - name: Run Terra weekly calibration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/api_agent/api_gateway.py \
            --task WEEKLY_CALIBRATION_SHADOW \
            --registry research/api_agent/API_TASK_REGISTRY_v1.json \
            --prompt-file runtime/weekly-calibration/prompt.txt \
            --context-file runtime/weekly-calibration/context.json \
            --output-dir runtime/weekly-calibration/output
      - name: Materialize weekly handoff
        run: |
          WEEK=$(date -u +%G/W%V)
          DEST="research/api_agent/outputs/weekly/${WEEK}"
          mkdir -p "$DEST"
          cp runtime/weekly-calibration/context.json "$DEST/WEEKLY_CONTEXT.json"
          cp runtime/weekly-calibration/output/output.json "$DEST/WEEKLY_CALIBRATION_OUTPUT.json"
          cp runtime/weekly-calibration/output/receipt.json "$DEST/WEEKLY_CALIBRATION_RECEIPT.json"
          cp runtime/weekly-calibration/output/output.json research/api_agent/outputs/weekly/LATEST_WEEKLY_API_CALIBRATION.json
      - name: Commit weekly evidence
        shell: bash
        run: |
          git config user.name 'framework-api-agent'
          git config user.email 'framework-api-agent@users.noreply.github.com'
          git add research/api_agent/outputs/weekly
          git commit -m "ai: materialize weekly calibration shadow ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-api-calibration-${{ github.run_id }}
          path: runtime/weekly-calibration/
          retention-days: 14
