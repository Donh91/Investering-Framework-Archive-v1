name: Historical Shadow Validation Stage1 Manifest

on:
  push:
    branches:
      - research/historical-shadow-validation-stage1-20260822
    paths:
      - '06_RESEARCH_LAB/historical_sensor_recovery_v1/validation_v1/**'
      - '.github/workflows/historical-shadow-validation-stage1-manifest.yml'

permissions:
  contents: write

jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build deterministic SHA-256 manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('06_RESEARCH_LAB/historical_sensor_recovery_v1/validation_v1')
          required = [
              '01_SOURCE_INVENTORY.json',
              '02_SENSOR_PROVENANCE_MATRIX.json',
              '03_HISTORICAL_EVENT_LEDGER.csv',
              '04_MARKET_OUTCOME_LEDGER.csv',
              '05_SENSOR_OUTCOME_JOIN.csv',
              '06_REDUNDANCY_DEPENDENCE_MATRIX.csv',
              '07_NEGATIVE_CONTROLS.csv',
              '08_DATA_GAPS_AND_UNTESTABLE.md',
              '09_CODEX_RECONSTRUCTION_REPORT.md',
              '10_RESEARCH_THREAD_HANDOFF.md',
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f'Missing required artifacts: {missing}')
          artifacts=[]
          for name in required:
              p=root/name
              b=p.read_bytes()
              artifacts.append({'path': name, 'bytes': len(b), 'sha256': hashlib.sha256(b).hexdigest()})
          manifest={
              'contract':'HISTORICAL_SHADOW_SENSOR_VALIDATION_MANIFEST_v1',
              'authority':'RESEARCH_ONLY_NON_CANONICAL',
              'executor':'CHATGPT_GITHUB_RECONSTRUCTION_UNDER_CODEX_HANDOFF_CONTRACT',
              'codex_authorship':False,
              'source_commit':'${{ github.sha }}',
              'artifact_count_excluding_manifest':len(artifacts),
              'eligible_exact_historical_sensor_events':0,
              'performance_statistics_authorized':False,
              'scientific_ceiling':'PROSPECTIVE_TEST_JUSTIFIED',
              'artifacts':artifacts,
              'manifest_self_hash_excluded_reason':'A hash embedded in the same manifest is self-referential; this manifest authenticates all ten non-manifest Stage-1 artifacts.'
          }
          (root/'MANIFEST.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          PY
      - name: Validate manifest contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('06_RESEARCH_LAB/historical_sensor_recovery_v1/validation_v1/MANIFEST.json')
          m=json.loads(p.read_text())
          assert m['authority']=='RESEARCH_ONLY_NON_CANONICAL'
          assert m['codex_authorship'] is False
          assert m['artifact_count_excluding_manifest']==10
          assert m['eligible_exact_historical_sensor_events']==0
          assert m['performance_statistics_authorized'] is False
          assert m['scientific_ceiling']=='PROSPECTIVE_TEST_JUSTIFIED'
          assert len(m['artifacts'])==10
          print('HISTORICAL_SHADOW_STAGE1_MANIFEST_PASS')
          PY
      - name: Commit manifest only
        shell: bash
        run: |
          git config user.name 'framework-research-bot'
          git config user.email 'framework-research-bot@users.noreply.github.com'
          git add -- 06_RESEARCH_LAB/historical_sensor_recovery_v1/validation_v1/MANIFEST.json
          if git diff --cached --quiet; then
            echo 'Manifest unchanged'
            exit 0
          fi
          git commit -m 'research: materialize historical shadow validation manifest'
          git push origin HEAD:${{ github.ref_name }}
