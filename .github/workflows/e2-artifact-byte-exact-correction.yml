name: E2 Artifact Byte Exact Correction

on:
  push:
    branches:
      - agent/task-20260914-e2-911-byte-exact-correction
    paths:
      - '.github/workflows/e2-artifact-byte-exact-correction.yml'

permissions:
  actions: read
  contents: write

jobs:
  restore-source-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_DIR: research/experiment_lifecycle/e2/results/AT-E2-911-v1
      EXPECTED_ZIP_SHA256: 9c2e629fd8052041eb77e5dc9edd5e86271843461d3a60f261aa3e5e69669afb
      EXPECTED_ZIP_SIZE: '26596'
      EXPECTED_RESULT_SHA256: fbf5879f1c359cb16b74a0206d7c0ad067420b18be580cdbd720e187d0bb06b1
      EXPECTED_RESULT_SIZE: '8479'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download original GitHub Actions artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10326688832/zip" \
            -o /tmp/e2-source.zip
          test "$(wc -c < /tmp/e2-source.zip)" = "${EXPECTED_ZIP_SIZE}"
          echo "${EXPECTED_ZIP_SHA256}  /tmp/e2-source.zip" | sha256sum -c -

      - name: Materialize exact source ZIP and result bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TARGET_DIR}"
          cp /tmp/e2-source.zip "${TARGET_DIR}/auto-trading-e2-911-v1-34787756305.zip"
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          target = Path(os.environ['TARGET_DIR']) / 'result.json'
          with ZipFile('/tmp/e2-source.zip') as z:
              target.write_bytes(z.read('at-e2-live/result.json'))
          PY
          test "$(wc -c < "${TARGET_DIR}/auto-trading-e2-911-v1-34787756305.zip")" = "${EXPECTED_ZIP_SIZE}"
          echo "${EXPECTED_ZIP_SHA256}  ${TARGET_DIR}/auto-trading-e2-911-v1-34787756305.zip" | sha256sum -c -
          test "$(wc -c < "${TARGET_DIR}/result.json")" = "${EXPECTED_RESULT_SIZE}"
          echo "${EXPECTED_RESULT_SHA256}  ${TARGET_DIR}/result.json" | sha256sum -c -

      - name: Commit exact source bytes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "framework-data-bot"
          git config user.email "framework-data-bot@users.noreply.github.com"
          git add "${TARGET_DIR}/auto-trading-e2-911-v1-34787756305.zip" "${TARGET_DIR}/result.json"
          git rm .github/workflows/e2-artifact-byte-exact-correction.yml
          git commit -m "AUTO_TRADING: restore E2-911 exact artifact bytes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
