name: Cowork Historical Altseason Research Bundle

on:
  push:
    branches: [main]
    paths:
      - '06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/RESEARCH_READINESS_MANIFEST.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cowork-historical-altseason-bundle
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile compact handoff builder
        run: |
          python -m py_compile scripts/cowork/build_historical_altseason_bundle.py
          python -m py_compile scripts/cowork/build_historical_altseason_bundle_max_value.py

      - name: Build GitHub-native research handoff ZIP
        run: python scripts/cowork/build_historical_altseason_bundle_max_value.py

      - name: Validate compact handoff, readiness and cumulative provenance
        run: |
          set -euo pipefail
          root=dist/cowork_historical_altseason
          test -s "$root/HISTORICAL_ALTSEASON_COWORK_INPUT_BUNDLE.zip"
          test -s "$root/COWORK_INPUT_MANIFEST.json"
          test -s "$root/COWORK_INPUT_BUNDLE_SHA256.txt"
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('dist/cowork_historical_altseason')
          m=json.loads((root/'COWORK_INPUT_MANIFEST.json').read_text())
          assert m['contract']=='COWORK_GITHUB_NATIVE_HANDOFF_MANIFEST_v2'
          assert m['delivery_model']=='COMPACT_INSTRUCTIONS_PLUS_DIRECT_GITHUB_READ'
          assert m['repo']=='Donh91/Investering-Framework-Archive-v1'
          assert m['authoritative_ref']=='main'
          assert m['readiness_verdict']=='PASS'
          assert m['automatic_promotion'] is False
          assert m['historical_findings_max_classification']=='FORWARD_TEST'
          assert m['heavy_bulk_delivery']=='BOUND_GITHUB_ACTIONS_ARTIFACT_VIA_FREE_BULK_ARTIFACT_POINTER'
          cb=m['cfgi_cumulative_billing']
          assert cb['cumulative_actual_credits_used']<=cb['hard_cap_credits']
          assert cb['final_credits_remaining']>=cb['minimum_reserve_credits']
          sources={x['source_path'] for x in m['files']}
          required_sources={
            '07_PROMPTS_AND_AGENTS/historical_altseason_pullback/COWORK_OPUS5_MASTER_RESEARCH_PROMPT.md',
            '07_PROMPTS_AND_AGENTS/historical_altseason_pullback/COWORK_OPUS5_LAUNCH_INSTRUCTION.md',
            '07_PROMPTS_AND_AGENTS/historical_altseason_pullback/COWORK_OPUS5_MAX_VALUE_SIDECARS.md',
            '07_PROMPTS_AND_AGENTS/historical_altseason_pullback/COWORK_GITHUB_RESEARCH_MAP.md',
            '06_RESEARCH_LAB/historical_altseason_pullback_v1/INTRADAY_EXECUTION_COWORK_ADDENDUM.md',
            '06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/RESEARCH_READINESS_MANIFEST.json',
            '06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/CFGI_BILLING.json',
            '06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/CFGI_CUMULATIVE_BILLING.json',
            '06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/FREE_BULK_ARTIFACT_POINTER.json',
            '00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json',
          }
          assert required_sources <= sources
          assert not any(x.endswith('alt_hourly_panel.csv.gz') for x in sources)
          zip_path=root/'HISTORICAL_ALTSEASON_COWORK_INPUT_BUNDLE.zip'
          expected=(root/'COWORK_INPUT_BUNDLE_SHA256.txt').read_text().split()[0]
          actual=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          assert actual==expected
          with zipfile.ZipFile(zip_path) as zf:
              assert zf.testzip() is None
              names=set(zf.namelist())
              assert not any(n.endswith('/alt_hourly_panel.csv.gz') for n in names)
              map_name='COWORK_RESEARCH_HANDOFF/07_PROMPTS_AND_AGENTS/historical_altseason_pullback/COWORK_GITHUB_RESEARCH_MAP.md'
              text=zf.read(map_name).decode()
              for token in ['GitHub is the authoritative research universe','FREE_BULK_ARTIFACT_POINTER.json','04_MARKET_LEARNING/intraday_execution/','scripts/intraday_execution/']:
                  assert token in text, token
          print('COWORK_GITHUB_NATIVE_HANDOFF_V2_PASS',len(sources),actual,cb['cumulative_actual_credits_used'])
          PY

      - name: Upload one-click Cowork research handoff
        uses: actions/upload-artifact@v4
        with:
          name: historical-altseason-cowork-research-input
          path: |
            dist/cowork_historical_altseason/HISTORICAL_ALTSEASON_COWORK_INPUT_BUNDLE.zip
            dist/cowork_historical_altseason/COWORK_INPUT_MANIFEST.json
            dist/cowork_historical_altseason/COWORK_INPUT_BUNDLE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
