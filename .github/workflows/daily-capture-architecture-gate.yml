name: Daily Capture Architecture Gate

on:
  pull_request:
    paths:
      - 'scripts/daily_capture/**'
      - 'tests/daily_capture/**'
      - '.github/workflows/daily-raw-owner-capture.yml'
      - '.github/workflows/weekly-raw-calibration-bridge.yml'
      - '.github/workflows/daily-capture-architecture-gate.yml'
      - '03_DAILY_CAPTURE_LOGS/**'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.daily_capture.test_daily_capture_pipeline
      - run: python -m py_compile scripts/daily_capture/build_capture_index.py scripts/daily_capture/build_weekly_calibration.py scripts/daily_capture/persist_raw_payloads.py
      - name: Validate schedule and authority boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          daily=Path('.github/workflows/daily-raw-owner-capture.yml').read_text();weekly=Path('.github/workflows/weekly-raw-calibration-bridge.yml').read_text()
          assert daily.count("timezone: 'Europe/Copenhagen'")==5
          assert 'retention-days: 14' in daily
          assert 'persist_raw_payloads.py' in daily
          assert '03_DAILY_CAPTURE_LOGS/raw' in daily
          assert '03_DAILY_CAPTURE_LOGS/captures' in daily
          assert '03_DAILY_CAPTURE_LOGS/weekly' in weekly
          assert 'OPENAI_API_KEY' not in daily+weekly
          print('DAILY_CAPTURE_ARCHITECTURE_PASS')
          PY
