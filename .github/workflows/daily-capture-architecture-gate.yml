name: Daily Capture Architecture Gate

on:
  pull_request:
    paths:
      - 'scripts/daily_capture/**'
      - 'scripts/data_terminal/farside_etf_owner.py'
      - 'scripts/master_monday/**'
      - 'scripts/orchestration/weekly_orchestration_controller.py'
      - 'research/master_monday_preflight/**'
      - 'research/pullback_forensics/**'
      - 'research/experiment_lifecycle/RESEARCH_EXECUTION_TOPOLOGY_v1.json'
      - 'tests/daily_capture/**'
      - 'backtest_engine/blind_dual_run.py'
      - 'tests/backtest_engine/test_blind_dual_run_v2.py'
      - '04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/prospective_dual_run_v2/**'
      - '.github/workflows/daily-raw-owner-capture.yml'
      - '.github/workflows/hourly-sequence-capture.yml'
      - '.github/workflows/daily-settled-etf-calibration.yml'
      - '.github/workflows/sunday-market-close-and-cfgi.yml'
      - '.github/workflows/weekly-raw-calibration-bridge.yml'
      - '.github/workflows/weekly-api-calibration-shadow.yml'
      - '.github/workflows/master-monday-remaining-gaps.yml'
      - '.github/workflows/daily-capture-architecture-gate.yml'
      - '03_DAILY_CAPTURE_LOGS/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      hourly_source: ${{ steps.classify.outputs.hourly_source }}
      farside_source: ${{ steps.classify.outputs.farside_source }}
      pullback_forensics_source: ${{ steps.classify.outputs.pullback_forensics_source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify component-specific live verification scope
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python scripts/daily_capture/classify_verification_scope.py \
              --all \
              --github-output "${GITHUB_OUTPUT}"
          else
            test -n "${BASE_SHA}"
            test -n "${HEAD_SHA}"
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | tee /tmp/daily-capture-changed-files.txt
            python scripts/daily_capture/classify_verification_scope.py \
              --github-output "${GITHUB_OUTPUT}" < /tmp/daily-capture-changed-files.txt
          fi

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic daily capture, Pullback Forensics, verification-scope, Master Monday correction and blinded dual-run tests
        run: |
          python -m unittest \
            tests.daily_capture.test_verification_scope \
            tests.daily_capture.test_pullback_forensics_collector \
            tests.daily_capture.test_daily_capture_pipeline \
            tests.daily_capture.test_weekly_market_close_endpoint \
            tests.daily_capture.test_master_monday_final_correction \
            tests.backtest_engine.test_blind_dual_run_v2 -v
      - name: Compile capture, Pullback Forensics, verification-scope and Master Monday modules
        run: |
          python -m py_compile \
            scripts/daily_capture/classify_verification_scope.py \
            scripts/daily_capture/pullback_forensics_collector.py \
            scripts/daily_capture/build_capture_index.py \
            scripts/daily_capture/build_hourly_sequence.py \
            scripts/daily_capture/build_weekly_calibration.py \
            scripts/daily_capture/persist_raw_payloads.py \
            scripts/daily_capture/build_weekly_market_close_package.py \
            scripts/daily_capture/materialize_blind_dual_run.py \
            scripts/data_terminal/farside_etf_owner.py \
            scripts/master_monday/build_preflight_package_v3.py \
            scripts/orchestration/weekly_orchestration_controller.py \
            backtest_engine/blind_dual_run.py
      - name: Validate schedules, passive-capture topology, storage, verification routing, blinding and authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          daily=Path('.github/workflows/daily-raw-owner-capture.yml').read_text()
          hourly=Path('.github/workflows/hourly-sequence-capture.yml').read_text()
          weekly=Path('.github/workflows/weekly-raw-calibration-bridge.yml').read_text()
          weekly_api=Path('.github/workflows/weekly-api-calibration-shadow.yml').read_text()
          gaps=Path('.github/workflows/master-monday-remaining-gaps.yml').read_text()
          etf=Path('.github/workflows/daily-settled-etf-calibration.yml').read_text()
          gate=Path('.github/workflows/daily-capture-architecture-gate.yml').read_text()
          router=Path('scripts/daily_capture/classify_verification_scope.py').read_text()
          close=Path('scripts/daily_capture/build_weekly_market_close_package.py').read_text()
          pfr=Path('scripts/daily_capture/pullback_forensics_collector.py').read_text()
          hourly_builder=Path('scripts/daily_capture/build_hourly_sequence.py').read_text()
          weekly_builder=Path('scripts/daily_capture/build_weekly_calibration.py').read_text()
          controller=Path('scripts/orchestration/weekly_orchestration_controller.py').read_text()
          preflight=Path('scripts/master_monday/build_preflight_package_v3.py').read_text()
          blind=Path('backtest_engine/blind_dual_run.py').read_text()
          topology=json.loads(Path('research/experiment_lifecycle/RESEARCH_EXECUTION_TOPOLOGY_v1.json').read_text())
          sequential=json.loads(Path('research/experiment_lifecycle/SEQUENTIAL_RESEARCH_QUEUE_v1.json').read_text())
          deep=json.loads(Path('research/api_agent/deep_research/DEEP_RESEARCH_QUEUE_v1.json').read_text())

          # Source-appropriate cadence: 5 ephemeral anchors, 2 regular hourly materializations
          # plus one final Monday catch-up, 2 weekly builds, one settled ETF owner check.
          assert daily.count("timezone: 'Europe/Copenhagen'")==5
          assert hourly.count("timezone: 'Europe/Copenhagen'")==3
          assert weekly.count("timezone: 'Europe/Copenhagen'")==2
          assert etf.count("timezone: 'Europe/Copenhagen'")==1

          # Live market evidence must be durable before any downstream research can fail.
          anchor_commit=daily.index('Commit live anchor before downstream research')
          pfr_capture=daily.index('Capture passive Pullback Forensics evidence')
          pfr_commit=daily.index('Commit passive Pullback Forensics evidence independently')
          dual_run=daily.index('Materialize blinded Full-vs-Reduced prospective evidence')
          assert anchor_commit < pfr_capture < pfr_commit < dual_run
          assert daily.count('pullback_forensics_collector.py')==1
          assert daily.count('id: pullback_forensics')==1
          assert 'Missing forensic evidence remains UNKNOWN' in daily
          assert '03_DAILY_CAPTURE_LOGS/pullback_forensics' in daily
          assert 'id: dual_run' in daily and 'continue-on-error: true' in daily
          assert 'Market observation remains valid shadow calibration evidence' in daily
          assert daily.count('materialize_blind_dual_run.py')==1
          assert 'prospective_dual_run_v2/evidence' in daily

          # Topology B-tight: one global experimental slot remains binding.
          assert topology['status']=='RATIFIED'
          assert topology['global_policy']['global_experiment_execution_slots']==1
          assert topology['global_policy']['one_active_execution_stage_only_remains_binding'] is True
          assert topology['lanes']['EXPERIMENT_EXECUTION']['counts_against_global_experiment_slot'] is True
          assert topology['lanes']['PASSIVE_EVIDENCE_CAPTURE']['counts_against_global_experiment_slot'] is False
          assert topology['lanes']['RESEARCH_CONTEXT']['counts_against_global_experiment_slot'] is False
          assert topology['lanes']['PASSIVE_EVIDENCE_CAPTURE']['allowlist'][0]['new_workflow'] is False
          assert topology['lanes']['PASSIVE_EVIDENCE_CAPTURE']['allowlist'][0]['new_paid_calls'] is False
          assert sequential['policy']['one_active_execution_stage_only'] is True
          assert sequential['policy']['passive_maturation_may_overlap'] is True
          assert deep['research_kind']=='RESEARCH_QUESTION_NOT_FORWARD_TEST'
          assert deep['canonical_boundaries']['does_not_create_new_active_test'] is True
          assert deep['canonical_boundaries']['does_not_create_outcome_rows'] is True

          # Pullback Forensics is raw/passive research evidence, not a signal engine.
          assert 'SHADOW_RESEARCH_ONLY' in pfr
          assert 'PASSIVE_EVIDENCE_CAPTURE' in pfr
          assert 'counts_against_experiment_execution_slot' in pfr
          assert 'MONEYNESS_BUCKET_SKEW_NOT_25_DELTA' in pfr
          assert 'LEGACY_REST_STILL_LIVE_SOURCE_FRAGILE' in pfr
          assert 'DEFERRED_FULLY_BACKFILLABLE' in pfr
          assert 'DEFERRED_ARCHITECTURE_CADENCE_MISMATCH' in pfr
          assert 'OPENAI_API_KEY' not in pfr and 'CFGI_API_KEY' not in pfr

          # Storage and source boundaries.
          assert 'retention-days: 14' in daily and 'retention-days: 14' in hourly and 'retention-days: 14' in etf
          assert daily.count('persist_raw_payloads.py')==1
          assert '--max-monthly-compressed-bytes 30000000' in daily
          assert "if: env.SCHEDULE_ID == '13 6 * * *' || github.event_name == 'workflow_dispatch'" in daily
          assert 'binance_spot_owner_collector.py' not in daily
          assert '03_DAILY_CAPTURE_LOGS/hourly' in hourly
          assert '03_DAILY_CAPTURE_LOGS/captures' in daily

          # Verification layering: deterministic tests always run for this broad gate,
          # while external source calls are separate jobs selected by exact owning paths.
          assert 'Classify component-specific live verification scope' in gate
          assert "needs.scope.outputs.hourly_source == 'true'" in gate
          assert "needs.scope.outputs.farside_source == 'true'" in gate
          assert "needs.scope.outputs.pullback_forensics_source == 'true'" in gate
          assert 'scripts/master_monday' not in router
          assert '03_DAILY_CAPTURE_LOGS' not in router
          assert '.github/workflows/hourly-sequence-capture.yml' in router
          assert '.github/workflows/daily-settled-etf-calibration.yml' in router
          assert 'pullback_forensics_collector.py' in router

          # Hourly lane self-heals one missed regular run and stores already-returned Binance flow fields.
          assert '--lookback-hours 26' in hourly
          assert "cron: '10 2 * * 1'" in hourly
          for field in ('quote_volume','trade_count','taker_buy_quote_volume','taker_sell_quote_volume','taker_buy_quote_share'):
              assert field in hourly_builder, field
          assert 'forward_fill' in hourly_builder and 'interpolation' in hourly_builder

          # Final weekly build occurs after the Monday catch-up and targets the completed ISO week.
          assert "cron: '25 2 * * 1'" in weekly
          assert '--hourly-root 03_DAILY_CAPTURE_LOGS/hourly' in weekly
          assert '--etf-root 03_DAILY_CAPTURE_LOGS/etf' in weekly
          assert '--previous-week' in weekly
          for horizon in ('4','12','24','48','72'):
              assert horizon in weekly_builder
          assert 'WEEKLY_HOURLY_ENRICHED.csv' in weekly_builder
          assert 'WEEKLY_SEQUENCE_FACTS.json' in weekly_builder
          assert 'max_contiguous_gap_hours' in weekly_builder
          assert 'DAY1_2' in weekly_builder and 'DAY3_4' in weekly_builder and 'DAY5_7' in weekly_builder

          # Weekly API freeze is self-sufficient, v2.2-aware and accepts the final close pointer contract.
          assert "cron: '40 2 * * 1'" in weekly_api
          assert 'build_weekly_calibration.py' in weekly_api and '--previous-week' in weekly_api
          assert 'MASTER_MONDAY_ACTION_REGISTRY_v2.json' in weekly_api
          assert 'build_preflight_package_v3.py' in weekly_api and 'build_preflight_package_v3.py' in gaps
          assert '03_DAILY_CAPTURE_LOGS/weekly research/master_monday_preflight' in weekly_api
          assert 'WEEKLY_MARKET_CLOSE_POINTER_v3' in controller
          assert 'PRE_ACTIVATION_HISTORICAL_GAP' in preflight
          assert 'CONFIDENCE_REDUCING' in preflight

          # ETF lane retrieves twice, preserves stable dashes as null, and only accepts them when total parity fully accounts for them.
          assert etf.count('farside_etf_owner.py')==2
          assert 'sleep 65' in etf
          assert 'unknown_cells_fully_accounted_by_reported_total' in etf
          assert 'unknown_cells_imputed' in etf
          assert 'first_history[key] == second_history[key]' in etf
          assert 'rows_identical_across_retrievals' in etf
          assert 'history_sessions_materialized' in etf
          assert '03_DAILY_CAPTURE_LOGS/etf' in etf

          # Deliberate cadence boundaries: no AI/API interpretation or fake hourly slow data.
          assert 'OPENAI_API_KEY' not in daily+hourly+weekly+etf+blind+pfr
          assert 'CFGI_API_KEY' not in hourly+pfr
          assert 'stablecoin' not in hourly.lower()
          assert 'defillama' not in hourly.lower()
          assert 'requests.' not in blind and 'urllib' not in blind and 'http://' not in blind and 'https://' not in blind
          assert 'score_shadow_period' not in blind
          assert 'LEGACY_MINIMAL' in blind and 'EXCLUDED_UNRECOVERABLE' in blind
          assert 'https://data-api.binance.vision' in close
          assert 'https://api.binance.com' not in close
          print('DAILY_CAPTURE_V2_2_PULLBACK_FORENSICS_TOPOLOGY_PASS')
          PY

  live-hourly-source-smoke:
    needs: scope
    if: needs.scope.outputs.hourly_source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove live hourly spot, spot-flow and derivatives coverage without writing repository state
        run: |
          RESULT=$(python scripts/daily_capture/build_hourly_sequence.py --output-root /tmp/hourly-sequence --raw-output /tmp/hourly-source --lookback-hours 4)
          echo "$RESULT"
          python - "$RESULT" <<'PY'
          import csv,json,sys
          from pathlib import Path
          result=json.loads(sys.argv[1])
          assert result['spot_complete_hours'] >= 3, result
          assert result['spot_flow_complete_hours'] >= 3, result
          assert result['derivatives_oi_complete_hours'] >= 3, result
          rows=[]
          for path in Path('/tmp/hourly-sequence').glob('*/*/*.csv'):
              with path.open(newline='') as fh: rows.extend(csv.DictReader(fh))
          assert len(rows) >= 3
          required=(
              'btc_long_short_ratio','eth_long_short_ratio','btc_open_interest','eth_open_interest',
              'btc_quote_volume','eth_quote_volume','btc_trade_count','eth_trade_count',
              'btc_taker_buy_quote_share','eth_taker_buy_quote_share'
          )
          assert all(all(row.get(k) not in (None,'') for k in required) for row in rows), rows
          print('LIVE_HOURLY_V2_2_SOURCE_COVERAGE_PASS')
          PY

  live-farside-source-smoke:
    needs: scope
    if: needs.scope.outputs.farside_source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove live Farside BTC and ETH schema without writing repository state
        run: |
          python scripts/data_terminal/farside_etf_owner.py --output-dir /tmp/farside-live --history-limit 3
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot=json.loads(Path('/tmp/farside-live/owner_snapshot.json').read_text())
          assert snapshot.get('status') == 'PASS', snapshot
          assert snapshot.get('unknown_cells_are_not_imputed') is True, snapshot
          expected={
              'BTC': ['IBIT','FBTC','BITB','ARKB','BTCO','EZBC','BRRR','HODL','BTCW','MSBT','GBTC','BTC'],
              'ETH': ['ETHA','ETHB','FETH','ETHW','TETH','ETHV','QETH','EZET','ETHE','ETH'],
          }
          rows={row.get('asset'): row for row in snapshot.get('rows', [])}
          assert set(rows) == {'BTC','ETH'}, rows
          for asset, funds in expected.items():
              row=rows[asset]
              assert row.get('fund_headers') == funds, row
              assert row.get('headers') == ['Date', *funds, 'Total'], row
              assert row.get('session_final') is True, row
              assert row.get('total_parity') is True, row
              assert row.get('unknown_cells_fully_accounted_by_reported_total') is True, row
              assert row.get('reported_total') is not None, row
              assert row.get('header_mode') in {
                  'DIRECT_DATE_TOTAL',
                  'SOURCE_TWO_ROW_TICKER_HEADER',
                  'CANONICAL_ASSET_SCHEMA_EXACT_WIDTH_FALLBACK',
              }, row
              source_hash=(snapshot.get('source_hashes') or {}).get(asset, '')
              assert len(source_hash) == 64, snapshot
          print('LIVE_FARSIDE_BTC_ETH_SCHEMA_PASS')
          PY

  live-pullback-forensics-source-smoke:
    needs: scope
    if: needs.scope.outputs.pullback_forensics_source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove live OKX contract units and Deribit moneyness-skew source semantics without writing repository state
        run: |
          python scripts/daily_capture/pullback_forensics_collector.py --output-root /tmp/pullback-forensics --run-id pr-source-smoke
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot=json.loads(Path('/tmp/pullback-forensics/LATEST.json').read_text())
          assert snapshot.get('authority',{}).get('can_affect_canonical_state') is False, snapshot
          assert snapshot.get('authority',{}).get('can_affect_portfolio_action') is False, snapshot
          assert snapshot.get('topology_class') == 'PASSIVE_EVIDENCE_CAPTURE', snapshot
          assert snapshot.get('counts_against_experiment_execution_slot') is False, snapshot
          assert snapshot.get('errors') == [], snapshot
          for asset in ('BTC','ETH'):
              liq=snapshot['lane1_liquidations'][asset]
              meta=liq['instrument_metadata']
              assert meta['instId'] == f'{asset}-USDT-SWAP', meta
              assert str(meta['ctType']).lower() == 'linear', meta
              assert str(meta['ctMult']) == '1', meta
              assert float(meta['ctVal']) > 0, meta
              assert liq['source_stability'] == 'LEGACY_REST_STILL_LIVE_SOURCE_FRAGILE', liq
              assert liq['current_response_aggregates']['aggregates_are_lower_bound'] is True, liq
              assert liq['current_response_aggregates']['page_truncated'] == 'UNKNOWN', liq
              assert liq['source_receipts']['instrument']['http_status'] == 200, liq
              assert liq['source_receipts']['liquidations']['http_status'] == 200, liq

              skew=snapshot['lane2b_moneyness_skew'][asset]
              assert skew['status'] == 'PASS', skew
              assert skew['method'] == 'MONEYNESS_BUCKET_SKEW_NOT_25_DELTA', skew
              assert skew['expiries_1_to_60d'], skew
              assert all(1 <= row['days_to_expiry'] <= 60 for row in skew['expiries_1_to_60d']), skew
              assert skew['source_receipts']['summary']['http_status'] == 200, skew
              assert skew['source_receipts']['instruments']['http_status'] == 200, skew
          print('LIVE_PULLBACK_FORENSICS_SOURCE_SEMANTICS_PASS')
          PY
