name: HCEL O1 Independent E1 E3 Verify
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: framework-main-writer
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.event.issue.number == 1476 &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '[HCEL_O1_INDEPENDENT_VERIFY]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify
        run: |
          python -m py_compile scripts/research/hcel_o1_independent_verify.py
          python scripts/research/hcel_o1_independent_verify.py --output /tmp/hcel_independent.json
      - name: Persist
        run: |
          set -euo pipefail
          dest="06_RESEARCH_LAB/m6_replay/2026-10-05__HCEL-O1-independent-E1-E3-continuity-v1.json"
          cp /tmp/hcel_independent.json "$dest"
          git config user.name 'research-lab-hcel[bot]'
          git config user.email 'research-lab-hcel@users.noreply.github.com'
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "research: independently verify HCEL E1 E3 continuity"
            pushed=0
            for n in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((n*3))
            done
            [ "$pushed" -eq 1 ] || exit 1
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
          fi
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/comment.md
          import json
          p="06_RESEARCH_LAB/m6_replay/2026-10-05__HCEL-O1-independent-E1-E3-continuity-v1.json"
          o=json.load(open(p))
          print("## HCEL O-1 independent E1/E3 verifier")
          print()
          print("Independent continuity-safe implementation completed.")
          for cost,v in o["scalars"].items():
              print(f"- cost {cost}: E1 WC={v['E1']['WC']:.5f}, E3 WC={v['E3']['WC']:.5f}; E1 WA={v['E1']['WA']:.5f}, E3 WA={v['E3']['WA']:.5f}")
          print()
          print(f"Artifact: `{p}`")
          PY
          gh issue comment 1476 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
