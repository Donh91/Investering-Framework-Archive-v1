name: Research Parallel Lanes Skill Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.agents/skills/research-parallel-lanes/**'
      - '.agents/skills/skill-quality-gate/agents/openai.yaml'
      - '.agents/skills/typesafe-ai/agents/openai.yaml'
      - '.agents/skills/s1-pr-repair-learning/agents/openai.yaml'
      - '00_ARCHIVE_CONTROL/SKILL_REGISTRY.md'
      - '00_ARCHIVE_CONTROL/SKILL_ROUTING_INDEX.json'
      - 'scripts/research/validate_parallel_research_manifest_v1.py'
      - 'scripts/research/task2_realdata_challenger_w39_w46_v1.py'
      - 'tests/research/test_task2_realdata_challenger_w39_w46_v1.py'
      - 'scripts/research/task2_cn_all_archives_provenance_v1.py'
      - 'tests/research/test_task2_cn_all_archives_provenance_v1.py'
      - '06_RESEARCH_LAB/hugging_face_task2_audit_20261022/kompas_scientific_edge_program_v2_1/ASTRA_HIGH_*'
      - '06_RESEARCH_LAB/hugging_face_task2_audit_20261022/kompas_scientific_edge_program_v2_1/TASK2_REALDATA_*'
      - 'tests/agent_skills/test_research_parallel_lanes_manifest_v1.py'
      - '07_PROMPTS_AND_AGENTS/skill_quality_gate/candidates/hre/**'
      - 'tests/agent_skills/test_hre_source_clock_reference_v1.py'
      - 'research/historical_reality_engine/**'
      - 'scripts/research/validate_historical_reality_program_v1.py'
      - 'tests/research/test_historical_reality_program_v1.py'
      - 'tests/research/test_hre_shadow_transfer_v1.py'
      - 'scripts/research/hre_native_replay_pilot_v1.py'
      - 'tests/research/test_hre_native_replay_pilot_v1.py'
      - 'scripts/research/alpha_precision_harvest_observer_v1.py'
      - 'tests/research/test_alpha_precision_harvest_observer_v1.py'
      - '04_RESEARCH_LAB/external_specialist_dissection/alpha_precision_20261107/OWNER_ROUTING_V1.json'
      - '04_RESEARCH_LAB/external_specialist_dissection/2026-11-07__ALPHA_RESEARCH_PRECISION_PARALLEL_LANES_v1.json'
      - '.github/workflows/autonomous-research-governance-loop.yml'
      - '.github/workflows/research-parallel-lanes-skill-ci.yml'

permissions:
  contents: read

jobs:
  routing-architecture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing canonical skill registry and routing validator
        run: python scripts/agent_skills/validate_skill_architecture.py
      - name: Validate example 3-lane research plan
        run: |
          python scripts/research/validate_parallel_research_manifest_v1.py \
            .agents/skills/research-parallel-lanes/references/EXAMPLE_MISSION.json

  alpha-precision-owner-handoff-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static manifest, no autonomous dispatch, no scientific promotion
        run: |
          python scripts/research/validate_parallel_research_manifest_v1.py 04_RESEARCH_LAB/external_specialist_dissection/2026-11-07__ALPHA_RESEARCH_PRECISION_PARALLEL_LANES_v1.json
          python -m unittest discover -s tests/research -p test_alpha_precision_harvest_observer_v1.py -v
          python scripts/research/alpha_precision_harvest_observer_v1.py --output "$RUNNER_TEMP/alpha-precision-owner-observation.json"

  hre-clock-reference-and-candidate-static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source-clock method and strictly unregistered shadow candidate
        run: python -m unittest discover -s tests/agent_skills -p test_hre_source_clock_reference_v1.py -v

  scientific-evidence-and-boundary-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial manifest, timing and authority regressions
        run: |
          python -m unittest discover \
            -s tests/agent_skills \
            -p test_research_parallel_lanes_manifest_v1.py -v

  hre-owner-gated-program-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate historical replay program source, authority and dependency safety
        run: python scripts/research/validate_historical_reality_program_v1.py
      - name: Adversarial tests for fake execution, future leakage, self-authorization and fabricated outcomes
        run: python -m unittest discover -s tests/research -p test_historical_reality_program_v1.py -v
      - name: Verify future shadow transfer and bounded paid model control are not prematurely activated
        run: python -m unittest discover -s tests/research -p test_hre_shadow_transfer_v1.py -v

  hre-replay-source-qa:
    if: startsWith(github.event.pull_request.title, 'research(hre):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no-lookahead and source safety with native tests
        run: python -m unittest discover -s tests/research -p test_hre_native_replay_pilot_v1.py -v
      - name: Validate SHA256 upstream Binance spot hourly February/March 2020 and September/October 2025
        run: |
          mkdir -p "$RUNNER_TEMP/hre"
          python scripts/research/hre_native_replay_pilot_v1.py --lane source --output "$RUNNER_TEMP/hre/source_receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hre-retrospective-source-qa
          path: ${{ runner.temp }}/hre/source_receipt.json
          retention-days: 30
          if-no-files-found: warn

  hre-replay-crisis-baselines:
    if: startsWith(github.event.pull_request.title, 'research(hre):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently replay March 2020 and October 2025 price-only risk controls
        run: |
          mkdir -p "$RUNNER_TEMP/hre"
          python scripts/research/hre_native_replay_pilot_v1.py --lane crisis --output "$RUNNER_TEMP/hre/crisis_receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hre-retrospective-crisis-baselines
          path: ${{ runner.temp }}/hre/crisis_receipt.json
          retention-days: 30
          if-no-files-found: warn

  hre-replay-cn-weekly-controls:
    if: startsWith(github.event.pull_request.title, 'research(hre):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently benchmark frozen 7 daily close and low/high ranges in 2021
        run: |
          mkdir -p "$RUNNER_TEMP/hre"
          python scripts/research/hre_native_replay_pilot_v1.py --lane weekly --output "$RUNNER_TEMP/hre/weekly_receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hre-retrospective-weekly-ranges
          path: ${{ runner.temp }}/hre/weekly_receipt.json
          retention-days: 30
          if-no-files-found: warn

  hre-extended-2022-terra-ftx:
    if: startsWith(github.event.pull_request.title, 'research(hre2):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent Terra and FTX source-verified historical daily crisis controls
        run: |
          mkdir -p "$RUNNER_TEMP/hre"
          python -m unittest discover -s tests/research -p test_hre_native_replay_pilot_v1.py -v
          python scripts/research/hre_native_replay_pilot_v1.py --lane extended --episode terra_2022 --output "$RUNNER_TEMP/hre/terra_2022.json"
          python scripts/research/hre_native_replay_pilot_v1.py --lane extended --episode ftx_2022 --output "$RUNNER_TEMP/hre/ftx_2022.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hre-retrospective-2022-terra-ftx
          path: ${{ runner.temp }}/hre/*.json
          retention-days: 30
          if-no-files-found: warn

  hre-extended-2023-2024-2026:
    if: startsWith(github.event.pull_request.title, 'research(hre2):')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent USDC, August volatility and February risk historical controls
        run: |
          mkdir -p "$RUNNER_TEMP/hre"
          python scripts/research/hre_native_replay_pilot_v1.py --lane extended --episode usdc_2023 --output "$RUNNER_TEMP/hre/usdc_2023.json"
          python scripts/research/hre_native_replay_pilot_v1.py --lane extended --episode aug_2024 --output "$RUNNER_TEMP/hre/aug_2024.json"
          python scripts/research/hre_native_replay_pilot_v1.py --lane extended --episode feb_2026 --output "$RUNNER_TEMP/hre/feb_2026.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hre-retrospective-2023-2024-2026
          path: ${{ runner.temp }}/hre/*.json
          retention-days: 30
          if-no-files-found: warn

  task2-native-price-range-baselines:
    if: startsWith(github.event.pull_request.title, 'research(task2):')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original frozen CN range, no-hindsight clock, interval width and risk source contracts
        run: |
          python -m py_compile scripts/research/task2_realdata_challenger_w39_w46_v1.py
          python -m unittest discover -s tests/research -p 'test_task2_realdata_challenger_w39_w46_v1.py' -v
      - name: Execute original 2026 W39-W45 versus same-clock baseline ranges
        run: |
          mkdir -p "$RUNNER_TEMP/task2-realdata-forecast"
          python scripts/research/task2_realdata_challenger_w39_w46_v1.py --repo-root . --lane forecast --out-dir "$RUNNER_TEMP/task2-realdata-forecast"
      - name: Preserve original price-range evidence and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-realdata-range-native
          path: ${{ runner.temp }}/task2-realdata-forecast/
          retention-days: 30
          if-no-files-found: warn

  task2-native-hourly-risk-negatives:
    if: startsWith(github.event.pull_request.title, 'research(task2):')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute actual 1176-hour source-qualified BTC/ETH counterfactual replay
        run: |
          mkdir -p "$RUNNER_TEMP/task2-realdata-risk"
          python scripts/research/task2_realdata_challenger_w39_w46_v1.py --repo-root . --lane risk --out-dir "$RUNNER_TEMP/task2-realdata-risk"
      - name: Preserve independent actual controls and decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-realdata-risk-native
          path: ${{ runner.temp }}/task2-realdata-risk/
          retention-days: 30
          if-no-files-found: warn

  task2-cn-all-archives-provenance:
    if: startsWith(github.event.pull_request.title, 'research(cnarchive):')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all 10 fail-closed CN, legacy and Task2 history source tests
        run: |
          python -m py_compile scripts/research/task2_cn_all_archives_provenance_v1.py
          python -m unittest discover -s tests/research -p 'test_task2_cn_all_archives_provenance_v1.py' -v
      - name: Generate actual source-pinned early CN and Master Monday census
        run: |
          mkdir -p "$RUNNER_TEMP/cnarchive"
          python scripts/research/task2_cn_all_archives_provenance_v1.py --asof "2026-11-13T12:59:00Z" --output "$RUNNER_TEMP/cnarchive/all_cn_census.json"
      - name: Preserve historical original issues and all data quality exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-cn-all-archives-source-census
          path: ${{ runner.temp }}/cnarchive/all_cn_census.json
          retention-days: 90
          if-no-files-found: warn
