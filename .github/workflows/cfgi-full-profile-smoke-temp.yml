name: CFGI Full Profile Smoke TEMP

on:
  push:
    branches: [agent/cfgi-live-delta-scorecard-v1]
    paths:
      - '.github/workflows/cfgi-full-profile-smoke-temp.yml'
      - 'scripts/data_terminal/cfgi_owner_collector.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CFGI_API_KEY: ${{ secrets.CFGI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full 4H profile
        run: |
          python scripts/data_terminal/cfgi_owner_collector.py \
            --output-dir cfgi-owner-output \
            --symbols MARKET,BTC,ETH \
            --timeframe 4h \
            --fields score,volatility,volume,impulse,technical,social,dominance,trends,whales,orders \
            --limit 1
      - name: Verify full profile and billing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snap=json.loads(Path('cfgi-owner-output/owner_snapshot.json').read_text())
          rec=json.loads(Path('cfgi-owner-output/receipt.json').read_text())
          expected={'score','volatility','volume','impulse','technical','social','dominance','trends','whales','orders'}
          assert snap['contract']=='CFGI_OWNER_SNAPSHOT_v2'
          assert set(snap['fields'])==expected
          assert len(snap['rows'])==3
          assert rec['status'] in {'PASS','DEGRADED'}
          assert rec['billing']['expected_credits']==30
          assert rec['billing']['credits_used'] in {None,30}
          assert rec['billing']['credits_remaining'] is None or rec['billing']['credits_remaining']>=0
          print(json.dumps({'status':'CFGI_FULL_PROFILE_PASS','billing':rec['billing']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cfgi-full-profile-smoke-${{ github.run_id }}
          path: cfgi-owner-output/
          retention-days: 7
