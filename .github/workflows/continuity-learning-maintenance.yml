name: Continuity and Learning Maintenance

on:
  schedule:
    - cron: '45 23 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize new forecast candidates
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          for out in Path('research/api_agent/outputs').rglob('DAILY_DIRECTOR_OUTPUT.json'):
              receipt=out.with_name('DAILY_DIRECTOR_RECEIPT.json')
              if receipt.exists():
                  subprocess.run(['python','scripts/api_agent/materialize_forecast_candidates.py','--output',str(out),'--receipt',str(receipt),'--pending-root','research/api_agent/forecast_candidates/PENDING'],check=True)
          PY
      - name: Mature ratified forecasts
        run: python scripts/learning/outcome_maturation_engine.py --forecast-root research/api_agent/forecast_candidates/FROZEN --evidence-root 03_DAILY_CAPTURE_LOGS/captures --output-root research/api_agent/forecast_candidates/MATURED
      - name: Build calibration ledger
        run: python scripts/learning/build_model_calibration_ledger.py --forecast-root research/api_agent/forecast_candidates/FROZEN --outcome-root research/api_agent/forecast_candidates/MATURED --output research/api_agent/MODEL_CALIBRATION_LEDGER.csv
      - name: Build agent handoff and owner reliability
        run: python scripts/architecture/build_latest_handoff.py --repo-root .
      - name: Commit maintained state
        run: |
          git config user.name framework-learning-bot
          git config user.email framework-learning-bot@users.noreply.github.com
          git add LATEST_HANDOFF.json LATEST_HANDOFF.md research/api_agent/forecast_candidates research/api_agent/MODEL_CALIBRATION_LEDGER.csv 03_DAILY_CAPTURE_LOGS/weekly/RELIABILITY_LEDGER.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "learning: maintain continuity surfaces ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt*5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  notify:
    needs: maintain
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create incident record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 09_SOURCE_QA/incidents
          FILE="09_SOURCE_QA/incidents/INCIDENT_continuity-learning-${GITHUB_RUN_ID}.md"
          printf '# AUTOMATION INCIDENT\n\nWorkflow: Continuity and Learning Maintenance\nRun: %s\nTimestamp UTC: %s\nStatus: FAILED\nNo secrets are included.\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > "$FILE"
          git config user.name framework-incident-bot
          git config user.email framework-incident-bot@users.noreply.github.com
          git add "$FILE"
          git commit -m "incident: continuity learning ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
          gh issue create --title "AUTOMATION FAILURE: Continuity and Learning Maintenance ${GITHUB_RUN_ID}" --body-file "$FILE" || true
