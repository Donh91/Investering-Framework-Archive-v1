name: Continuity and Learning Maintenance

on:
  schedule:
    - cron: '45 23 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize forecast candidates and write census
        run: |
          python scripts/learning/materialize_forecast_candidates_batch.py \
            --outputs-root research/api_agent/outputs \
            --pending-root research/api_agent/forecast_candidates/PENDING \
            --census-output research/api_agent/forecast_candidates/LATEST_FORECAST_MATERIALIZATION_CENSUS.json
      - name: Process prospective owner ratification packets
        run: |
          mkdir -p research/api_agent/forecast_candidates/{RATIFICATION_INBOX,RATIFICATION_TERMINAL,FROZEN}
          python scripts/learning/process_forecast_ratifications.py \
            --pending-root research/api_agent/forecast_candidates/PENDING \
            --packet-root research/api_agent/forecast_candidates/RATIFICATION_INBOX \
            --terminal-root research/api_agent/forecast_candidates/RATIFICATION_TERMINAL \
            --frozen-root research/api_agent/forecast_candidates/FROZEN \
            --capture-root 03_DAILY_CAPTURE_LOGS/captures \
            --repo-root .
      - name: Build outcome-free ratification queue for framework owner
        run: |
          python scripts/learning/build_forecast_ratification_queue.py \
            --pending-root research/api_agent/forecast_candidates/PENDING \
            --terminal-root research/api_agent/forecast_candidates/RATIFICATION_TERMINAL \
            --output research/api_agent/forecast_candidates/LATEST_RATIFICATION_QUEUE.json

      - name: Build T13 study admissions before outcome access
        run: |
          python scripts/learning/build_forecast_study_admissions.py \
            --forecast-root research/api_agent/forecast_candidates/FROZEN \
            --candidate-root research/api_agent/forecast_candidates/PENDING \
            --study-root research/api_agent/forecast_skill \
            --activation research/api_agent/forecast_skill/COHORT_ACTIVATION_v1.json \
            --preregistration 06_RESEARCH_LAB/forward_tests/forecast_skill_preregistration/FORECAST_SKILL_PREREGISTRATION_v1_3_1.json \
            --endpoint-erratum 06_RESEARCH_LAB/forward_tests/forecast_skill_preregistration/FORECAST_SKILL_PREREGISTRATION_v1_3_2_ERRATUM.json
      - name: Build outcome-blind due-time technical revalidation
        run: |
          python scripts/learning/build_forecast_study_revalidation.py \
            --forecast-root research/api_agent/forecast_candidates/FROZEN \
            --study-root research/api_agent/forecast_skill \
            --activation research/api_agent/forecast_skill/COHORT_ACTIVATION_v1.json \
            --preregistration 06_RESEARCH_LAB/forward_tests/forecast_skill_preregistration/FORECAST_SKILL_PREREGISTRATION_v1_3_1.json \
            --endpoint-erratum 06_RESEARCH_LAB/forward_tests/forecast_skill_preregistration/FORECAST_SKILL_PREREGISTRATION_v1_3_2_ERRATUM.json
      - name: Persist outcome-blind T13 barrier before any settlement source call
        run: |
          git config user.name framework-learning-bot
          git config user.email framework-learning-bot@users.noreply.github.com
          git add research/api_agent/forecast_candidates research/api_agent/forecast_skill
          if git diff --cached --quiet; then
            git pull --ff-only origin main
          else
            git commit -m "learning: freeze outcome-blind T13 state ${GITHUB_RUN_ID}"
            pushed=false
            for attempt in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
              sleep $((attempt*5))
            done
            [ "$pushed" = true ]
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify durable T13 admission and revalidation barrier
        run: |
          python scripts/learning/validate_forecast_skill_study_admission.py \
            --forecast-root research/api_agent/forecast_candidates/FROZEN \
            --candidate-root research/api_agent/forecast_candidates/PENDING \
            --study-root research/api_agent/forecast_skill \
            --activation research/api_agent/forecast_skill/COHORT_ACTIVATION_v1.json \
            --preregistration 06_RESEARCH_LAB/forward_tests/forecast_skill_preregistration/FORECAST_SKILL_PREREGISTRATION_v1_3_1.json \
            --endpoint-erratum 06_RESEARCH_LAB/forward_tests/forecast_skill_preregistration/FORECAST_SKILL_PREREGISTRATION_v1_3_2_ERRATUM.json \
            --repo-root .

      - name: Resolve exact settlement evidence for ratified price forecasts
        run: |
          mkdir -p research/api_agent/forecast_candidates/{SETTLEMENT_EVIDENCE,SETTLEMENT_RAW,SETTLEMENT_BINDINGS,MATURED}
          python scripts/learning/forecast_settlement_price_owner.py \
            --forecast-root research/api_agent/forecast_candidates/FROZEN \
            --output-root research/api_agent/forecast_candidates/SETTLEMENT_EVIDENCE \
            --raw-root research/api_agent/forecast_candidates/SETTLEMENT_RAW
      - name: Mature exact-settlement ratified forecasts
        run: |
          python scripts/learning/mature_exact_settlement_forecasts.py \
            --forecast-root research/api_agent/forecast_candidates/FROZEN \
            --settlement-evidence-root research/api_agent/forecast_candidates/SETTLEMENT_EVIDENCE \
            --output-root research/api_agent/forecast_candidates/MATURED \
            --binding-root research/api_agent/forecast_candidates/SETTLEMENT_BINDINGS \
            --repo-root . \
            --max-evidence-lag-hours 24
      - name: Isolate non-exact ratified forecasts for legacy maturation
        run: |
          python scripts/learning/build_non_exact_forecast_subset.py \
            --forecast-root research/api_agent/forecast_candidates/FROZEN \
            --output-root runtime/api-agent-non-exact-forecast-subset
      - name: Mature remaining non-exact ratified forecasts
        run: |
          python scripts/learning/outcome_maturation_engine.py \
            --forecast-root runtime/api-agent-non-exact-forecast-subset \
            --evidence-root 03_DAILY_CAPTURE_LOGS/captures \
            --output-root research/api_agent/forecast_candidates/MATURED
      - name: Build calibration ledger and settlement eligibility
        run: |
          python scripts/learning/build_model_calibration_ledger.py \
            --forecast-root research/api_agent/forecast_candidates/FROZEN \
            --outcome-root research/api_agent/forecast_candidates/MATURED \
            --output research/api_agent/MODEL_CALIBRATION_LEDGER.csv \
            --eligibility-output research/api_agent/MODEL_CALIBRATION_SETTLEMENT_ELIGIBILITY.json
      - name: Maintain T13 scientific status and execute final test at most once
        run: |
          python scripts/learning/run_forecast_skill_confirmatory_test.py \
            --study-root research/api_agent/forecast_skill \
            --outcome-root research/api_agent/forecast_candidates/MATURED \
            --activation research/api_agent/forecast_skill/COHORT_ACTIVATION_v1.json \
            --preregistration 06_RESEARCH_LAB/forward_tests/forecast_skill_preregistration/FORECAST_SKILL_PREREGISTRATION_v1_3_1.json \
            --endpoint-erratum 06_RESEARCH_LAB/forward_tests/forecast_skill_preregistration/FORECAST_SKILL_PREREGISTRATION_v1_3_2_ERRATUM.json
      - name: Build agent handoff and owner reliability
        run: python scripts/architecture/build_latest_handoff.py --repo-root .
      - name: Commit maintained state
        run: |
          git config user.name framework-learning-bot
          git config user.email framework-learning-bot@users.noreply.github.com
          git add LATEST_HANDOFF.json LATEST_HANDOFF.md research/api_agent/forecast_candidates research/api_agent/forecast_skill research/api_agent/MODEL_CALIBRATION_LEDGER.csv research/api_agent/MODEL_CALIBRATION_SETTLEMENT_ELIGIBILITY.json 03_DAILY_CAPTURE_LOGS/weekly/RELIABILITY_LEDGER.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "learning: maintain continuity surfaces ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt*5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  notify:
    needs: maintain
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create incident record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 09_SOURCE_QA/incidents
          FILE="09_SOURCE_QA/incidents/INCIDENT_continuity-learning-${GITHUB_RUN_ID}.md"
          printf '# AUTOMATION INCIDENT\n\nWorkflow: Continuity and Learning Maintenance\nRun: %s\nTimestamp UTC: %s\nStatus: FAILED\nNo secrets are included.\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > "$FILE"
          git config user.name framework-incident-bot
          git config user.email framework-incident-bot@users.noreply.github.com
          git add "$FILE"
          git commit -m "incident: continuity learning ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
          gh issue create --title "AUTOMATION FAILURE: Continuity and Learning Maintenance ${GITHUB_RUN_ID}" --body-file "$FILE" || true
