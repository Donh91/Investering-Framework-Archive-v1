name: Codex Research Intake Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - 'research/codex/intake/**/*.json'
      - 'research/codex/transitions/*.json'
      - 'research/codex/completions/*.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: codex-research-intake-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch remediation maturation immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run remediation-maturation.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
          echo "Research/Codex state change dispatched to Remediation Maturation Controller." >> "$GITHUB_STEP_SUMMARY"
