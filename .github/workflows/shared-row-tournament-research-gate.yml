name: Shared Row Tournament Research Gate

on:
  pull_request:
    paths:
      - '06_RESEARCH_LAB/shared_row_model_tournament_v1/**'
      - '04_MARKET_LEARNING/shadow_registry/REGISTRY.json'
      - '04_MARKET_LEARNING/shadow_registry/SHARED_ROW_TOURNAMENT_POINTER.json'
      - 'scripts/research/prospective_evidence_controller.py'
      - 'scripts/research/shared_row_tournament_*.py'
      - '.github/workflows/shared-row-*.yml'
      - '.github/workflows/research-owner-*.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/research/prospective_evidence_controller.py scripts/research/shared_row_tournament_maturation.py scripts/research/shared_row_tournament_weekly.py scripts/research/shared_row_tournament_relevance.py scripts/research/shared_row_tournament_monitor.py
      - run: python 06_RESEARCH_LAB/shared_row_model_tournament_v1/pipeline/validate_tournament_contract.py
      - run: python scripts/research/prospective_evidence_controller.py --status-only
      - run: python scripts/research/shared_row_tournament_monitor.py
