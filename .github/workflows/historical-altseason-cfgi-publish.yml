name: Historical Altseason CFGI Publish

on:
  workflow_run:
    workflows: ['Historical Altseason CFGI Enrichment']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated CFGI stage from triggering run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: historical-altseason-cfgi-stage
          path: /tmp/historical-altseason-cfgi-stage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Refuse unbound manual publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'Manual publish is intentionally blocked because no immutable upstream CFGI artifact run is bound.' >&2
          exit 1

      - name: Install CFGI outputs without replacing current free-stage storage metadata
        run: |
          set -euo pipefail
          root=06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts
          src=/tmp/historical-altseason-cfgi-stage
          test -d "$src"
          test -s "$root/FREE_BULK_ARTIFACT_POINTER.json"
          test ! -e "$root/alt_hourly_panel.csv.gz"
          for name in CFGI_BILLING.json CFGI_CUMULATIVE_BILLING.json CFGI_COVERAGE.json CFGI_FIELD_COVERAGE.json cfgi_targeted.jsonl.gz CFGI_EVENT_SIGNATURES.json CFGI_EVENT_PATHS.jsonl.gz RESEARCH_READINESS_MANIFEST.json; do
            test -s "$src/$name"
            cp "$src/$name" "$root/$name"
          done
          python scripts/historical_lab/cfgi_readiness_postprocess_v2.py
          rm -f "$root/alt_hourly_panel.csv.gz"
          test ! -e "$root/alt_hourly_panel.csv.gz"

      - name: Revalidate current-storage CFGI readiness artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts')
          cfg=json.loads(Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/config.json').read_text())
          g=cfg['cfgi']; a=cfg['authority']; r=cfg['readiness']
          req=list(r['free_stage_required_artifacts'])+list(r['cfgi_stage_required_artifacts'])+['RESEARCH_READINESS_MANIFEST.json','CFGI_CUMULATIVE_BILLING.json']
          for name in sorted(set(req)):
              p=root/name; assert p.exists() and p.is_file() and not p.is_symlink() and p.stat().st_size>0,name
          assert not (root/'alt_hourly_panel.csv.gz').exists()
          pointer=json.loads((root/'FREE_BULK_ARTIFACT_POINTER.json').read_text())
          assert pointer['contract']=='HISTORICAL_ALTSEASON_FREE_BULK_POINTER_v1'
          assert pointer['storage_class']=='GITHUB_ACTIONS_ARTIFACT_BULK_NOT_GIT'
          assert pointer['required_for_cowork_bundle'] is True
          assert pointer['files'] and pointer['files'][0]['name']=='alt_hourly_panel.csv.gz'
          assert pointer['files'][0]['sha256']
          b=json.loads((root/'CFGI_BILLING.json').read_text())
          cb=json.loads((root/'CFGI_CUMULATIVE_BILLING.json').read_text())
          assert b['status']=='PASS'
          assert cb['status']=='PASS'
          assert cb['cumulative_actual_credits_used'] <= g['expected_credit_hard_cap']
          assert cb['final_credits_remaining'] >= g['minimum_credits_reserve']
          assert b.get('input_fingerprint_sha256')
          fc=json.loads((root/'CFGI_FIELD_COVERAGE.json').read_text())
          assert fc['exact_relative_hour_semantics'] is True
          assert fc['diagnostics']['no_silent_fallback'] is True
          with gzip.open(root/'CFGI_EVENT_PATHS.jsonl.gz','rt',encoding='utf-8') as fh:
              rows=[json.loads(x) for x in fh if x.strip()]
          m=json.loads((root/'RESEARCH_READINESS_MANIFEST.json').read_text())
          assert m['contract']=='RESEARCH_READINESS_MANIFEST_v2'
          assert m['readiness_verdict']=='PASS',m.get('blockers')
          assert not m.get('blockers')
          assert m['cfgi']['scaffold_symbol_hours']==m['cfgi']['expected_symbol_hours']==len(rows)
          missing=[x for x in rows if not x['observed_exact_hour']]
          assert m['cfgi']['missing_exact_symbol_hours']==len(missing)
          assert m['cfgi']['missingness_policy']=='EXPLICIT_MISSING_NOT_FILLED_NOT_INTERPOLATED_NOT_A_GLOBAL_BLOCKER'
          assert m['automatic_promotion'] is False
          assert m['historical_findings_max_classification']=='FORWARD_TEST'
          assert a['research_only'] is True and a['portfolio_execution'] is False
          assert a['canonical_market_state'] is False and a['automatic_rule_changes'] is False
          print('CFGI_STORAGE_SAFE_PUBLISH_V2_PASS',len(rows),len(missing),cb['cumulative_actual_credits_used'],cb['final_credits_remaining'],pointer['source_run_id'])
          PY

      - name: Commit CFGI research metadata under shared writer lock
        id: publish
        run: |
          set -euo pipefail
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          git add 06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/
          if git diff --cached --quiet; then
            echo 'No CFGI artifact changes'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad="$(git diff --cached --name-only | grep -v '^06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/' || true)"
          if [ -n "$bad" ]; then echo "Unexpected staged paths:" >&2; echo "$bad" >&2; exit 1; fi
          if git diff --cached --name-only | grep -qx '06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/alt_hourly_panel.csv.gz'; then
            echo 'Bulk panel must never be staged into Git' >&2; exit 1
          fi
          git commit -m "research: targeted CFGI altseason enrichment ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo 'published=true' >> "$GITHUB_OUTPUT"
          echo 'HISTORICAL_CFGI_PUBLISH_REMOTE_READBACK_PASS'

      - name: Explicitly dispatch compact Cowork handoff after readiness publication
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cowork-historical-altseason-bundle.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'COWORK_BUNDLE_EXPLICIT_DISPATCH_PASS'
