name: Evidence Closure Gate

on:
  pull_request:
    paths:
      - '.github/workflows/evidence-closure-gate.yml'
      - '.github/workflows/daily-stablecoin-liquidity.yml'
      - '.github/workflows/rich-breadth-checkpoint.yml'
      - 'scripts/data_terminal/defillama_stablecoin_owner.py'
      - 'scripts/data_terminal/top100_breadth_owner_collector.py'
      - 'scripts/daily_capture/rich_breadth_checkpoint.py'
      - 'scripts/api_agent/augment_director_context_v2.py'
      - 'research/evidence_gap/EVIDENCE_SOURCE_CAPABILITY_REGISTRY_v1.json'
      - 'tests/api_agent/test_evidence_closure_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile evidence closure code
        run: |
          python -m py_compile \
            scripts/data_terminal/defillama_stablecoin_owner.py \
            scripts/data_terminal/top100_breadth_owner_collector.py \
            scripts/daily_capture/rich_breadth_checkpoint.py \
            scripts/api_agent/augment_director_context_v2.py
      - name: Run closure regression tests
        run: |
          python -m pytest -q \
            tests/api_agent/test_evidence_closure_v1.py \
            tests/api_agent/test_api_intelligence_v2.py
      - name: Enforce evidence-only boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/evidence_gap/ADAPTIVE_EVIDENCE_GAP_POLICY_v1.json').read_text())
          c=json.loads(Path('research/evidence_gap/EVIDENCE_SOURCE_CAPABILITY_REGISTRY_v1.json').read_text())
          assert p['authority']['can_change_market_rules'] is False
          assert p['authority']['can_change_thresholds'] is False
          assert p['authority']['can_change_weights'] is False
          assert p['authority']['can_create_portfolio_action'] is False
          assert c['capabilities']['LIVE_BREADTH']['historical_backfill'] is False
          assert c['capabilities']['STABLECOIN_LIQUIDITY']['historical_backfill'] is True
          print('PASS')
          PY
