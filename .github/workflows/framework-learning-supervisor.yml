name: Framework Learning Supervisor

on:
  pull_request:
    paths:
      - '.github/workflows/framework-learning-supervisor.yml'
      - 'scripts/api_agent/senior_repair_audit_dispatch.py'
      - 'scripts/framework_intelligence/framework_learning_supervisor.py'
      - 'scripts/framework_intelligence/weekly_forensics_v1.py'
      - 'scripts/framework_intelligence/weekly_forensics_replay_v1.py'
      - 'scripts/framework_intelligence/operational_memory_v1.py'
      - 'scripts/framework_intelligence/operational_memory_post_production_audit_v1.py'
      - 'scripts/framework_intelligence/operational_memory_fail_to_codex_intake_v1.py'
      - 'scripts/orchestration/build_framework_handoff_manifest.py'
      - 'tests/framework_intelligence/test_framework_learning_supervisor.py'
      - 'tests/framework_intelligence/test_weekly_forensics_v1.py'
      - 'tests/framework_intelligence/test_weekly_forensics_replay_v1.py'
      - 'tests/framework_intelligence/test_operational_memory_v1.py'
      - 'tests/framework_intelligence/test_operational_memory_post_production_audit_v1.py'
      - 'tests/framework_intelligence/test_operational_memory_fail_to_codex_intake_v1.py'
      - '00_FMOS/FRAMEWORK_INTELLIGENCE_AND_LEARNING_LOOP_v1.md'
      - '00_FMOS/WEEKLY_FORENSICS_META_HEALTH_v1.md'
      - '00_FMOS/OPERATIONAL_MEMORY_AND_RETRIEVAL_v1.md'
  schedule:
    - cron: '35 4 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '35 9 * * 1'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile learning stack
        run: |
          python -m py_compile \
            scripts/api_agent/senior_repair_audit_dispatch.py \
            scripts/framework_intelligence/framework_learning_supervisor.py \
            scripts/framework_intelligence/weekly_forensics_v1.py \
            scripts/framework_intelligence/weekly_forensics_replay_v1.py \
            scripts/framework_intelligence/operational_memory_v1.py \
            scripts/framework_intelligence/operational_memory_post_production_audit_v1.py \
            scripts/framework_intelligence/operational_memory_fail_to_codex_intake_v1.py \
            scripts/orchestration/build_framework_handoff_manifest.py
      - name: Run learning tests
        run: |
          python -m unittest \
            tests.framework_intelligence.test_framework_learning_supervisor \
            tests.framework_intelligence.test_weekly_forensics_v1 \
            tests.framework_intelligence.test_weekly_forensics_replay_v1 \
            tests.framework_intelligence.test_operational_memory_v1 \
            tests.framework_intelligence.test_operational_memory_post_production_audit_v1 \
            tests.framework_intelligence.test_operational_memory_fail_to_codex_intake_v1 -v
      - name: Dry-run current repository state, operational preflight and production audit
        run: |
          rm -rf runtime/framework-learning-supervisor runtime/operational-memory runtime/opmem-preflight.json runtime/opmem-audit.json runtime/opmem-audit.md
          python scripts/framework_intelligence/framework_learning_supervisor.py \
            --repo-root . \
            --output-root runtime/framework-learning-supervisor
          python scripts/framework_intelligence/operational_memory_v1.py \
            --repo-root . \
            --output-root runtime/operational-memory \
            harvest --max-commits 120
          python scripts/framework_intelligence/operational_memory_v1.py \
            --repo-root . \
            --output-root runtime/operational-memory \
            preflight \
            --task 'repair framework learning workflow' \
            --path '.github/workflows/framework-learning-supervisor.yml' \
            --output runtime/opmem-preflight.json >/tmp/opmem-preflight.stdout
          python scripts/framework_intelligence/operational_memory_post_production_audit_v1.py \
            --repo-root . \
            --operational-root runtime/operational-memory \
            --output runtime/opmem-audit.json \
            --markdown-output runtime/opmem-audit.md \
            --fail-on-fail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime/framework-learning-supervisor')
          s=json.loads((root/'LATEST_SUPERVISOR_STATE.json').read_text())
          p=json.loads((root/'LATEST_MASTER_MONDAY_LEARNING_PACKET.json').read_text())
          q=json.loads((root/'LATEST_DELEGATION_QUEUE.json').read_text())
          om=Path('runtime/operational-memory')
          h=json.loads((om/'LATEST_OPERATIONAL_MEMORY_HEALTH.json').read_text())
          st=json.loads((om/'LATEST_OPERATIONAL_MEMORY_STATE.json').read_text())
          pf=json.loads(Path('runtime/opmem-preflight.json').read_text())
          audit=json.loads(Path('runtime/opmem-audit.json').read_text())
          assert s['canonical_effect'] is False
          assert s['portfolio_execution'] is False
          assert s['master_monday_live_influence'] is False
          assert p['live_consumption_allowed'] is False
          assert q['authority']=='PROPOSAL_ONLY'
          assert h['status']=='PASS', h
          assert h['source_of_truth']=='CURRENT_GITHUB_MAIN'
          assert h['memory_role']=='DERIVED_ACCELERATION_LAYER_ONLY'
          assert st['authority']['canonical_effect'] is False
          assert st['authority']['automatic_skill_activation'] is False
          assert pf['authority']['canonical_effect'] is False
          assert pf['telemetry']['no_savings_claim_without_measurement'] is True
          assert audit['status'] in ('PASS','WARN'), audit
          assert audit['memory_reuse_allowed'] is True
          assert audit['automatic_escalation_required'] is False
          assert audit['authority']['canonical_effect'] is False
          PY

  senior-repair-audit:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1156 &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '[SENIOR_REPAIR_AUDIT]')
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded senior audit machinery
        run: |
          python -m py_compile scripts/api_agent/api_gateway.py scripts/api_agent/check_api_lane_budget.py scripts/api_agent/check_monthly_cost_guard.py scripts/api_agent/senior_repair_audit_dispatch.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('research/api_agent/API_TASK_REGISTRY_v1.json').read_text())
          policy=json.loads(Path('research/api_agent/API_INTELLIGENCE_POLICY_v2.json').read_text())
          task=registry['tasks']['SENIOR_REPAIR_AUDIT']
          assert task['model']=='gpt-6-sol'
          assert task['reasoning_effort']=='high'
          assert task['invocation_mode']=='EVENT_DRIVEN_OWNER_GATED_ONLY'
          assert task['advisory_only'] is True
          assert task['automatic_code_write'] is False
          assert task['automatic_merge'] is False
          assert registry['single_run_hard_stop_usd']==3.0
          assert policy['monthly_hard_stop_usd']==40.0
          assert policy['lane_caps_usd']['SENIOR_REPAIR_AUDIT']==10.0
          assert policy['senior_repair_audit']['periodic_schedule'] is False
          PY
      - name: Deduplicate exact issue-comment trigger
        id: dedupe
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          dest="research/api_agent/outputs/senior_repair_audit/issue-1156/comment-${COMMENT_ID}"
          if [ -f "$dest/SENIOR_REPAIR_AUDIT.json" ]; then
            echo "run_audit=false" >> "$GITHUB_OUTPUT"
            echo "dest=$dest" >> "$GITHUB_OUTPUT"
          else
            echo "run_audit=true" >> "$GITHUB_OUTPUT"
            echo "dest=$dest" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce senior lane and global API budgets
        if: steps.dedupe.outputs.run_audit == 'true'
        run: |
          python scripts/api_agent/check_api_lane_budget.py \
            --receipt-root research/api_agent/outputs \
            --task SENIOR_REPAIR_AUDIT \
            --cap-usd 10.0 \
            --reserve-usd 0.50
          python scripts/api_agent/check_monthly_cost_guard.py \
            --receipt-root research/api_agent/outputs \
            --hard-stop-usd 40 \
            --reserve-usd 4.0
      - name: Build bounded fresh-main audit packet
        if: steps.dedupe.outputs.run_audit == 'true'
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          rm -rf runtime/senior-repair-audit
          python scripts/api_agent/senior_repair_audit_dispatch.py build \
            --repo-root . \
            --output-dir runtime/senior-repair-audit \
            --issue-number "$ISSUE_NUMBER" \
            --comment-id "$COMMENT_ID"
      - name: Run one GPT-6 Sol senior audit
        id: senior_api_call
        if: steps.dedupe.outputs.run_audit == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/api_agent/api_gateway.py \
            --task SENIOR_REPAIR_AUDIT \
            --registry research/api_agent/API_TASK_REGISTRY_v1.json \
            --prompt-file runtime/senior-repair-audit/prompt.txt \
            --context-file runtime/senior-repair-audit/context.json \
            --output-dir runtime/senior-repair-audit/output \
            --intended-write-prefix research/api_agent/outputs/senior_repair_audit/
      - name: Persist API attempt cost evidence
        if: always() && steps.dedupe.outputs.run_audit == 'true'
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          test -f runtime/senior-repair-audit/output/receipt.json
          test -f runtime/senior-repair-audit/output/output.json
          attempt="research/api_agent/outputs/senior_repair_audit/attempts/comment-${COMMENT_ID}/run-${GITHUB_RUN_ID}"
          mkdir -p "$attempt"
          cp runtime/senior-repair-audit/output/receipt.json "$attempt/receipt.json"
          cp runtime/senior-repair-audit/output/output.json "$attempt/output.json"
          cp runtime/senior-repair-audit/context_manifest.json "$attempt/context_manifest.json"
          git config user.name 'framework-learning-supervisor[bot]'
          git config user.email 'framework-learning-supervisor@users.noreply.github.com'
          git add "$attempt"
          git commit -m "audit: account GPT-6 Sol attempt issue-1156 comment-${COMMENT_ID} run-${GITHUB_RUN_ID}"
          pushed=false
          for attempt_no in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt_no * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          for rel in receipt.json output.json context_manifest.json; do
            git show "origin/main:$attempt/$rel" > "/tmp/attempt-$rel"
            cmp -s "$attempt/$rel" "/tmp/attempt-$rel" || { echo "senior_audit_attempt_readback_mismatch:$rel"; exit 1; }
          done
      - name: Validate senior audit receipt and output
        if: steps.dedupe.outputs.run_audit == 'true'
        run: python scripts/api_agent/senior_repair_audit_dispatch.py validate --output-dir runtime/senior-repair-audit
      - name: Persist immutable senior audit evidence
        if: steps.dedupe.outputs.run_audit == 'true'
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          dest="research/api_agent/outputs/senior_repair_audit/issue-1156/comment-${COMMENT_ID}"
          receipt_path="research/api_agent/outputs/senior_repair_audit/attempts/comment-${COMMENT_ID}/run-${GITHUB_RUN_ID}/receipt.json"
          mkdir -p "$dest"
          cp runtime/senior-repair-audit/output/output.json "$dest/SENIOR_REPAIR_AUDIT.json"
          cp runtime/senior-repair-audit/context_manifest.json "$dest/context_manifest.json"
          python scripts/api_agent/senior_repair_audit_dispatch.py completion \
            --output-dir runtime/senior-repair-audit \
            --receipt-path "$receipt_path" \
            --output "$dest/receipt_pointer.json"
          git config user.name 'framework-learning-supervisor[bot]'
          git config user.email 'framework-learning-supervisor@users.noreply.github.com'
          git add "$dest"
          git commit -m "audit: GPT-6 Sol senior repair review issue-1156 comment-${COMMENT_ID}"
          pushed=false
          for attempt_no in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt_no * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          for rel in SENIOR_REPAIR_AUDIT.json receipt_pointer.json context_manifest.json; do
            git show "origin/main:$dest/$rel" > "/tmp/$rel"
            cmp -s "$dest/$rel" "/tmp/$rel" || { echo "senior_audit_main_readback_mismatch:$rel"; exit 1; }
          done
      - name: Report senior audit result to reliability owner
        if: steps.dedupe.outputs.run_audit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          path="research/api_agent/outputs/senior_repair_audit/issue-1156/comment-${COMMENT_ID}"
          receipt_path="research/api_agent/outputs/senior_repair_audit/attempts/comment-${COMMENT_ID}/run-${GITHUB_RUN_ID}/receipt.json"
          python scripts/api_agent/senior_repair_audit_dispatch.py report \
            --output-dir runtime/senior-repair-audit \
            --comment-id "$COMMENT_ID" \
            --persisted-path "$path" \
            --receipt-path "$receipt_path" \
            --output runtime/senior-repair-audit/report.md
          gh issue comment 1156 --repo "$GITHUB_REPOSITORY" --body-file runtime/senior-repair-audit/report.md
      - name: Report duplicate trigger as NOOP
        if: steps.dedupe.outputs.run_audit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh issue comment 1156 --repo "$GITHUB_REPOSITORY" --body "SENIOR_REPAIR_AUDIT duplicate trigger $COMMENT_ID: NOOP, immutable receipt already exists."
  operate:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate learning and operational-memory firewalls
        run: |
          python -m py_compile \
            scripts/framework_intelligence/framework_learning_supervisor.py \
            scripts/framework_intelligence/operational_memory_v1.py \
            scripts/framework_intelligence/operational_memory_post_production_audit_v1.py \
            scripts/framework_intelligence/operational_memory_fail_to_codex_intake_v1.py \
            scripts/orchestration/build_framework_handoff_manifest.py
          python -m unittest \
            tests.framework_intelligence.test_framework_learning_supervisor \
            tests.framework_intelligence.test_operational_memory_v1 \
            tests.framework_intelligence.test_operational_memory_post_production_audit_v1 \
            tests.framework_intelligence.test_operational_memory_fail_to_codex_intake_v1 -v
      - name: Build persistent learning, operational memory and autonomous audit
        run: |
          if [ ! -f research/framework_learning/weekly_forensics/replay/LATEST_REPLAY_BASELINE.json ]; then
            python scripts/framework_intelligence/weekly_forensics_replay_v1.py --repo-root . --weeks 12
          fi
          if [ "$(TZ=Europe/Copenhagen date +%u)" = "1" ]; then
            python scripts/framework_intelligence/weekly_forensics_v1.py \
              --repo-root . \
              --output-root research/framework_learning/weekly_forensics \
              --mode FINAL
          fi
          python scripts/framework_intelligence/framework_learning_supervisor.py \
            --repo-root . \
            --output-root research/framework_learning
          python scripts/framework_intelligence/operational_memory_v1.py \
            --repo-root . \
            --output-root research/framework_learning/operational_memory \
            harvest --max-commits 250
          python scripts/framework_intelligence/operational_memory_post_production_audit_v1.py \
            --repo-root . \
            --operational-root research/framework_learning/operational_memory \
            --output research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT.json \
            --markdown-output research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT.md
          python scripts/orchestration/build_framework_handoff_manifest.py \
            --repo-root . \
            --output research/framework_handoffs/LATEST_FRAMEWORK_HANDOFF_MANIFEST.json
      - name: Assert advisory-only authority and handoff binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/framework_learning')
          s=json.loads((root/'LATEST_SUPERVISOR_STATE.json').read_text())
          p=json.loads((root/'LATEST_MASTER_MONDAY_LEARNING_PACKET.json').read_text())
          q=json.loads((root/'LATEST_DELEGATION_QUEUE.json').read_text())
          om=root/'operational_memory'
          h=json.loads((om/'LATEST_OPERATIONAL_MEMORY_HEALTH.json').read_text())
          st=json.loads((om/'LATEST_OPERATIONAL_MEMORY_STATE.json').read_text())
          audit=json.loads((om/'LATEST_OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT.json').read_text())
          handoff=json.loads(Path('research/framework_handoffs/LATEST_FRAMEWORK_HANDOFF_MANIFEST.json').read_text())
          assert s['canonical_effect'] is False
          assert s['portfolio_execution'] is False
          assert s['master_monday_live_influence'] is False
          assert p['live_consumption_allowed'] is False
          assert q['authority']=='PROPOSAL_ONLY'
          assert p['scientific_status']=='FORECAST_SKILL_UNPROVEN'
          assert h['status']=='PASS', h
          assert st['authority']['automatic_promotion'] is False
          assert st['authority']['automatic_skill_activation'] is False
          assert audit['authority']['canonical_effect'] is False
          assert audit['authority']['automatic_promotion'] is False
          assert audit['memory_reuse_allowed'] is (audit['status'] != 'FAIL')
          assert handoff['operational_memory_policy']['memory_may_override_current_main'] is False
          assert handoff['operational_memory_policy']['post_production_audit_required'] is True
          assert handoff['operational_memory_policy']['memory_reuse_requires_audit_not_fail'] is True
          for key in ('OPERATIONAL_MEMORY_HEALTH','OPERATIONAL_MEMORY_AUDIT','OPERATIONAL_MEMORY_INDEX','OPERATIONAL_PROCEDURAL_CANDIDATES'):
            assert key in handoff['agent_read_order']['CODEX_OPERATIONAL_PREFLIGHT'], key
            assert key in handoff['agent_read_order']['ASTRA_RESEARCH_ROUTING'], key
          PY
      - name: Manage Operational Memory audit escalation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: '[AUTO] Operational Memory production audit failure'
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          title=os.environ['ISSUE_TITLE']
          run_url=f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          audit_path=Path('research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT.json')
          try:
              audit=json.loads(audit_path.read_text())
              status=audit.get('status','FAIL')
          except Exception:
              audit={'status':'FAIL','failures':['audit_file_missing_or_invalid'],'warnings':[],'source_head_sha':os.environ.get('GITHUB_SHA')}
              status='FAIL'

          raw=subprocess.check_output(['gh','issue','list','--repo',repo,'--state','open','--limit','100','--json','number,title'],text=True)
          issues=json.loads(raw)
          existing=next((x for x in issues if x.get('title')==title),None)

          if status=='FAIL':
              body=(
                  'Operational Memory post-production audit failed. Memory reuse for this run is blocked.\n\n'
                  f"Run: {run_url}\n"
                  f"Source head: `{audit.get('source_head_sha')}`\n"
                  f"Failures: `{json.dumps(audit.get('failures') or [], sort_keys=True)}`\n"
                  f"Warnings: `{json.dumps(audit.get('warnings') or [], sort_keys=True)}`\n\n"
                  'This issue is automation-owned. A healthy later Supervisor run will close it automatically.'
              )
              if existing:
                  subprocess.run(['gh','issue','comment',str(existing['number']),'--repo',repo,'--body',body],check=True)
              else:
                  subprocess.run(['gh','issue','create','--repo',repo,'--title',title,'--body',body],check=True)
          elif existing:
              body=f"Recovered automatically on {run_url}. Audit status: `{status}`. Closing automation-owned incident."
              subprocess.run(['gh','issue','comment',str(existing['number']),'--repo',repo,'--body',body],check=True)
              subprocess.run(['gh','issue','close',str(existing['number']),'--repo',repo],check=True)
          PY
      - name: Route failed audit to bounded Codex remediation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path('research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT.json')
          try:
              audit=json.loads(path.read_text())
              valid=audit.get('contract')=='OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT_v1'
          except Exception:
              audit={}
              valid=False
          if not valid:
              head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              audit={
                  'contract':'OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT_v1',
                  'generated_at_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
                  'status':'FAIL',
                  'source_head_sha':head,
                  'failures':['audit_file_missing_or_invalid'],
                  'warnings':[],
                  'memory_reuse_allowed':False,
              }
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          Path('/tmp/opmem-audit-status').write_text(str(audit.get('status') or 'FAIL'))
          PY

          result="$(python scripts/framework_intelligence/operational_memory_fail_to_codex_intake_v1.py --repo-root .)"
          echo "$result"
          export OPMEM_ROUTE_RESULT="$result"
          status="$(cat /tmp/opmem-audit-status 2>/dev/null || echo FAIL)"
          if [ "$status" != "FAIL" ]; then
            exit 0
          fi

          path="$(python - <<'PY'
          import json,os
          print(json.loads(os.environ['OPMEM_ROUTE_RESULT']).get('path') or '')
          PY
          )"
          created="$(python - <<'PY'
          import json,os
          print('true' if json.loads(os.environ['OPMEM_ROUTE_RESULT']).get('created') else 'false')
          PY
          )"

          if [ "$created" = "true" ]; then
            [ -n "$path" ]
            git config user.name 'framework-learning-supervisor[bot]'
            git config user.email 'framework-learning-supervisor@users.noreply.github.com'
            git add "$path"
            git commit -m "remediation: queue operational memory audit ${GITHUB_RUN_ID}" -- "$path"
            git stash push -u -m "operational-memory-failed-products-${GITHUB_RUN_ID}" >/dev/null || true
            pushed=false
            for attempt in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
              sleep $((attempt * 5))
            done
            [ "$pushed" = true ]
          fi

          gh workflow run remediation-maturation.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Enforce Operational Memory audit gate
        if: always()
        run: |
          status="$(cat /tmp/opmem-audit-status 2>/dev/null || echo FAIL)"
          if [ "$status" = "FAIL" ]; then
            echo 'operational_memory_audit_failed'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT.json')
          if not p.exists():
              raise SystemExit('operational_memory_audit_missing')
          audit=json.loads(p.read_text())
          if audit.get('memory_reuse_allowed') is not True:
              raise SystemExit('operational_memory_reuse_not_allowed')
          PY
      - name: Commit learning products with bounded retry and main readback
        run: |
          set -euo pipefail
          git config user.name 'framework-learning-supervisor[bot]'
          git config user.email 'framework-learning-supervisor@users.noreply.github.com'
          git add research/framework_learning research/framework_handoffs/LATEST_FRAMEWORK_HANDOFF_MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: refresh framework learning supervisor ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          for rel in \
            research/framework_learning/LATEST_SUPERVISOR_STATE.json \
            research/framework_learning/LATEST_MASTER_MONDAY_LEARNING_PACKET.json \
            research/framework_learning/LATEST_DELEGATION_QUEUE.json \
            research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_STATE.json \
            research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_HEALTH.json \
            research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_INDEX.json \
            research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT.json \
            research/framework_learning/operational_memory/LATEST_OPERATIONAL_MEMORY_POST_PRODUCTION_AUDIT.md \
            research/framework_handoffs/LATEST_FRAMEWORK_HANDOFF_MANIFEST.json; do
            tmp="/tmp/main-$(basename "$rel")"
            git show origin/main:"$rel" > "$tmp"
            cmp -s "$rel" "$tmp" || { echo "framework_learning_main_readback_mismatch:$rel"; exit 1; }
          done
