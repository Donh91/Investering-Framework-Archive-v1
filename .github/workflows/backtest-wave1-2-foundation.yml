name: Backtest Wave 1.2 Foundation

on:
  pull_request:
    paths:
      - "backtest_engine/**"
      - "tests/backtest_engine/**"
      - ".github/workflows/backtest-wave1-2-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave1-2-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Wave 1.2 unit tests
        run: |
          PYTHONPATH=. python -m unittest discover -s tests/backtest_engine -p 'test_*.py' -v
