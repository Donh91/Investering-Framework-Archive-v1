name: Cycle Navigator Internal Precision

on:
  workflow_run:
    workflows: ["Cycle Navigator Weekly Publication"]
    types: [completed]
  schedule:
    - cron: '15 10 * * 1'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  internal-precision:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build internal precision freeze, settlement and compact box
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/cycle_navigator/build_internal_precision.py \
            --repo-root . \
            --model gpt-5.6-terra \
            --max-output-tokens 5000 \
            | tee runtime_cn_internal_precision.json

      - name: Validate zero silent omissions and immutable source binding
        run: |
          set -euo pipefail
          python scripts/cycle_navigator/validate_internal_precision.py \
            --repo-root . \
            | tee runtime_cn_internal_precision_validation.json

      - name: Commit internal precision archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name framework-cycle-navigator-bot
          git config user.email framework-cycle-navigator-bot@users.noreply.github.com
          git add 05_CYCLE_NAVIGATOR/weekly \
                  05_CYCLE_NAVIGATOR/track_record
          if git diff --cached --quiet; then
            echo 'NO_INTERNAL_PRECISION_DIFF'
            exit 0
          fi
          git commit -m "cycle-navigator: settle internal precision and freeze next claims"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt*5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Durable readback of internal precision package
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          ptr=json.loads(Path('05_CYCLE_NAVIGATOR/LATEST_CYCLE_NAVIGATOR_POINTER.json').read_text())
          root=Path(ptr['week_dir'])
          paths=[
            root/'CYCLE_NAVIGATOR_INTERNAL_PRECISION_FREEZE.json',
            root/'CYCLE_NAVIGATOR_INTERNAL_PRECISION_SCORECARD.json',
            root/'CYCLE_NAVIGATOR_INTERNAL_PRECISION_BOX.md',
            root/'CYCLE_NAVIGATOR_INTERNAL.md',
            Path('05_CYCLE_NAVIGATOR/track_record/CN_INTERNAL_PRECISION_LEDGER.jsonl'),
            Path('05_CYCLE_NAVIGATOR/track_record/CN_INTERNAL_PARAMETER_LEDGER.jsonl'),
          ]
          rows=[]
          for p in paths:
              path=str(p)
              blob=subprocess.run(['git','rev-parse',f'origin/main:{path}'],capture_output=True,text=True,check=True).stdout.strip()
              rows.append({'path':path,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'blob_sha':blob})
          Path('runtime_cn_internal_readback_manifest.json').write_text(json.dumps({'artifacts':rows},sort_keys=True,separators=(',',':'))+'\n')
          PY
          python scripts/orchestration/verify_durable_readback.py \
            --manifest runtime_cn_internal_readback_manifest.json \
            --ref origin/main \
            --output runtime_cn_internal_readback_receipt.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-navigator-internal-precision-${{ github.run_id }}
          path: runtime_cn_internal_*.json
          retention-days: 30
