name: CN vNext draft preview smoke check

on:
  pull_request:
    paths:
      - '05_CYCLE_NAVIGATOR/site/vnext-preview/**'
      - '.github/workflows/cn-vnext-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect isolated mobile prototype and compile inline JavaScript
        run: node 05_CYCLE_NAVIGATOR/site/vnext-preview/check-preview.mjs
      - name: Validate premium interactive preview, source bundle and contracts
        run: node 05_CYCLE_NAVIGATOR/site/vnext-preview/check-premium.mjs
      - name: Verify official public feed parity and negative source/risk/score scenarios
        run: node 05_CYCLE_NAVIGATOR/site/vnext-preview/test-official-feed-parity.mjs
      - name: Verify source-only Bull Bear scale and reject unsupported synthetic signals
        run: node 05_CYCLE_NAVIGATOR/site/vnext-preview/test-official-bullbear.mjs
      - name: Verify Pullback source week, exact onset evidence and fail-closed ETA
        run: node 05_CYCLE_NAVIGATOR/site/vnext-preview/test-official-pullback-eta.mjs
      - name: Verify progressive official Pullback stages without fabricated imminent risk
        run: node 05_CYCLE_NAVIGATOR/site/vnext-preview/test-official-pullback-stage.mjs
      - name: Verify source-only investor Pullback horizons, impact and uncalibrated odds
        run: node 05_CYCLE_NAVIGATOR/site/vnext-preview/test-official-pullback-investor-view.mjs
      - name: Verify all 10 source-bound PATH stages and conditional gates
        run: node 05_CYCLE_NAVIGATOR/site/vnext-preview/test-official-path.mjs
      - name: Bundle production-style Vite preview and retain immutable PR artifact
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node 05_CYCLE_NAVIGATOR/site/vnext-preview/verify-vite-bundle.mjs --artifact-dir "$RUNNER_TEMP/cn-vnext-preview"
      - name: Open standalone offline HTML in real headless Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"
          mkdir -p "$RUNNER_TEMP/cn-vnext-browser-qa"
          timeout 35s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3500 --window-size=430,932 --dump-dom "file://$RUNNER_TEMP/cn-vnext-preview/CYCLE_NAVIGATOR_OFFLINE_PREVIEW.html#cn-path-week" > "$RUNNER_TEMP/cn-vnext-browser-qa/rendered.html" 2> "$RUNNER_TEMP/cn-vnext-browser-qa/chrome.log"
          grep -q 'cn-chart-forecast-midpoint' "$RUNNER_TEMP/cn-vnext-browser-qa/rendered.html"
          grep -q 'cn-chart-close-path' "$RUNNER_TEMP/cn-vnext-browser-qa/rendered.html"
          grep -q 'cn-chart-weekday' "$RUNNER_TEMP/cn-vnext-browser-qa/rendered.html"
          grep -q 'data-asset="ETH"' "$RUNNER_TEMP/cn-vnext-browser-qa/rendered.html"
          timeout 35s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3500 --window-size=430,932 --screenshot="$RUNNER_TEMP/cn-vnext-browser-qa/PATH_CHROME_430.png" "file://$RUNNER_TEMP/cn-vnext-preview/CYCLE_NAVIGATOR_OFFLINE_PREVIEW.html#cn-path-week" >/dev/null 2>> "$RUNNER_TEMP/cn-vnext-browser-qa/chrome.log"
          test -s "$RUNNER_TEMP/cn-vnext-browser-qa/PATH_CHROME_430.png"
          echo "PASS: Browser executed self-contained offline archived preview, rendered both price paths and screenshot"
      - name: Preserve standalone browser QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: cn-vnext-browser-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/cn-vnext-browser-qa/PATH_CHROME_430.png
          if-no-files-found: error
          retention-days: 7
      - name: Archive the exact tested GitHub preview without deploying
        uses: actions/upload-artifact@v4
        with:
          name: cn-vnext-source-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/cn-vnext-preview/
          if-no-files-found: error
          retention-days: 7
      - name: No production deployment
        run: echo 'PR artifact only. No Pages deployment, production signal, or AppDeploy needed.'
