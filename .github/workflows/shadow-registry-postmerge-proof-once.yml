name: Shadow Registry Post-Merge Proof Once

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  launch:
    if: contains(github.event.head_commit.message, '[SR711_PROOF]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current-main Shadow Registry weekly workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run shadow-registry-weekly.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'SHADOW_REGISTRY_CURRENT_MAIN_DISPATCHED'
