name: historical-research-vault-gate

on:
  pull_request:
    paths:
      - 'research/historical_research_vault/**'
      - 'scripts/research/historical_research_vault.py'
      - 'tests/test_historical_research_vault.py'
      - 'research/dataset_registry/DATASET_REGISTRY_v1.json'
      - 'research/README.md'
      - '.github/workflows/historical-research-vault-gate.yml'
  workflow_dispatch:
    inputs:
      network_probe:
        description: 'Run bounded public-source probes into runner temp only'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate vault contracts
        run: python scripts/research/historical_research_vault.py validate
      - name: Unit tests
        run: python -m pytest -q tests/test_historical_research_vault.py

  bounded-network-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.network_probe == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create temporary capture root
        run: mkdir -p "$RUNNER_TEMP/historical_research_vault"
      - name: growthepie bounded capture
        run: |
          python scripts/research/historical_research_vault.py collect-growthepie \
            --chain base \
            --metric stables_mcap \
            --output-root "$RUNNER_TEMP/historical_research_vault/growthepie"
      - name: Coin Metrics bounded capture
        run: |
          python scripts/research/historical_research_vault.py collect-coinmetrics \
            --assets btc,eth \
            --start-time 2026-08-01 \
            --end-time 2026-09-01 \
            --output-root "$RUNNER_TEMP/historical_research_vault/coinmetrics"
      - name: CoinGecko metadata-only probe
        run: |
          python scripts/research/historical_research_vault.py probe-coingecko \
            --coin bitcoin > "$RUNNER_TEMP/historical_research_vault/coingecko_probe.json"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-research-vault-bounded-probe
          path: ${{ runner.temp }}/historical_research_vault
          retention-days: 14
