name: Historical Altseason CFGI Terminal Publish

on:
  workflow_run:
    workflows: ['Historical Altseason CFGI Terminal Finalize']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - name: Download exact terminal stage from triggering run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cfgi-terminal
          mkdir -p /tmp/cfgi-terminal
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name historical-altseason-cfgi-terminal-stage --dir /tmp/cfgi-terminal
          test -s /tmp/cfgi-terminal/RESEARCH_READINESS_MANIFEST.json
          test -s /tmp/cfgi-terminal/CFGI_MARKET_GAPFILL_BILLING.json
      - name: Validate exact terminal artifact before write
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cfgi-terminal')
          m=json.loads((p/'RESEARCH_READINESS_MANIFEST.json').read_text())
          g=json.loads((p/'CFGI_MARKET_GAPFILL_BILLING.json').read_text())
          assert m['contract']=='RESEARCH_READINESS_MANIFEST_v3_1_PROVIDER_BOUNDED'
          assert m['readiness_verdict']=='PASS' and not m['blockers']
          assert m['cfgi']['market_historical_availability']=='NOT_TESTABLE_PROVIDER_UNAVAILABLE'
          assert m['cfgi']['symbol_coverage']['MARKET']['asof_available_slots']==0
          assert m['cfgi']['symbol_coverage']['BTC']['asof_available_slots']>0
          assert m['cfgi']['symbol_coverage']['ETH']['asof_available_slots']>0
          assert g['status']=='TERMINAL_PROVIDER_NO_HISTORICAL_ROWS'
          assert g['no_additional_paid_retry_authorized'] is True
          print('TERMINAL_STAGE_PREWRITE_PASS')
          PY
      - name: Publish terminal finalized artifacts to main
        run: |
          set -euo pipefail
          root=06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts
          cp -a /tmp/cfgi-terminal/. "$root/"
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          git add "$root"
          if git diff --cached --quiet; then echo 'Terminal artifacts already current'; exit 0; fi
          git commit -m "research: finalize provider-bounded CFGI v3.1 ${{ github.event.workflow_run.id }}"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          git diff --cached --quiet
          echo 'CFGI_TERMINAL_V3_1_PUBLISHED'
