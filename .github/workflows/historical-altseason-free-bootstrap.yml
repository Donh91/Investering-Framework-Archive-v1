name: Historical Altseason Free Bootstrap

on:
  workflow_run:
    workflows: ['Historical Altseason Lab Gate']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HISTORICAL_VISION_MAX_WORKERS: '12'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build free historical dataset and outcome catalogue
        run: |
          python scripts/historical_lab/free_altseason_bootstrap_parallel.py
          python scripts/historical_lab/free_event_postprocess.py
      - name: Validate artifacts and research-only authority
        run: |
          python - <<'PY'
          import csv,gzip,json
          from pathlib import Path
          root=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts')
          req=[
            'FREE_SOURCE_AUDIT.json','TIME_INTEGRITY_AUDIT.json','hourly_features.csv.gz','alt_hourly_panel.csv.gz',
            'EPISODE_CATALOG.json','EPISODE_FEATURE_MATRIX.jsonl.gz','EPISODE_MATRIX_COVERAGE.json',
            'FREE_EVENT_PATHS.jsonl.gz','FREE_EVENT_PATHS_COVERAGE.json','BACKTEST_SUMMARY.json'
          ]
          for x in req:
            p=root/x; assert p.exists() and p.stat().st_size>0, x
          a=json.loads((root/'FREE_SOURCE_AUDIT.json').read_text())
          t=json.loads((root/'TIME_INTEGRITY_AUDIT.json').read_text())
          c=json.loads((root/'EPISODE_CATALOG.json').read_text())
          s=json.loads((root/'BACKTEST_SUMMARY.json').read_text())
          pc=json.loads((root/'FREE_EVENT_PATHS_COVERAGE.json').read_text())
          assert a['authority']['research_only'] is True
          assert a['authority']['portfolio_execution'] is False
          transport=a.get('historical_transport_policy') or {}
          assert transport.get('contract')=='BINANCE_VISION_ARCHIVE_FIRST_TRANSPORT_v1'
          assert transport.get('archive_first') is True
          assert transport.get('pre_2022_resolution')=='DAILY_ARCHIVES_PREFERRED'
          assert transport.get('deterministic_timestamp_reordering') is True
          assert transport.get('analysis_semantics_changed') is False
          assert c['authority']['automatic_rule_changes'] is False
          assert t['status']=='PASS'
          assert t['strict_timestamp_lags'] is True
          assert t['cross_window_lags_forbidden'] is True
          assert t['row_offsets_treated_as_hours'] is False
          assert s['free_hourly_feature_rows'] > 1000
          assert s['episode_count'] > 0
          assert pc['events']
          with gzip.open(root/'hourly_features.csv.gz','rt') as fh:
            r=csv.DictReader(fh); first=next(r)
            for k in ['research_window_id','continuity_segment_id','gap_from_previous_feature_hours','segment_reset','breadth_24h_delta_6h','breadth_24h_accel_6h']:
              assert k in first, k
          with gzip.open(root/'alt_hourly_panel.csv.gz','rt') as fh:
            r=csv.DictReader(fh); first=next(r)
            assert first['liquidity_cohort_proxy'] in {'LOW','MID','HIGH'}
            assert 'return_24h_pct' in first
          print('FREE_BOOTSTRAP_VALIDATION_PASS', s['free_hourly_feature_rows'], s['episode_count'])
          PY
      - name: Commit immutable research artifacts safely
        run: |
          set -euo pipefail
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          git add 06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/
          if git diff --cached --quiet; then
            echo 'No artifact changes'
            exit 0
          fi
          bad="$(git diff --cached --name-only | grep -v '^06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected staged paths:" >&2
            echo "$bad" >&2
            exit 1
          fi
          git commit -m "research: historical altseason free bootstrap ${GITHUB_RUN_ID}"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            exit 1
          fi
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
