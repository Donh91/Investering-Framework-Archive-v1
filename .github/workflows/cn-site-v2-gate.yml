name: Cycle Navigator Site v2 Gate
on:
  pull_request:
    paths:
      - '05_CYCLE_NAVIGATOR/site/**'
      - '05_CYCLE_NAVIGATOR/LATEST_CYCLE_NAVIGATOR_POINTER.json'
      - '05_CYCLE_NAVIGATOR/**/CYCLE_NAVIGATOR_MACHINE_PACKAGE.json'
      - '.github/workflows/cycle-navigator-pages.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public product contract
        run: node 05_CYCLE_NAVIGATOR/site/validate-v2.mjs
      - name: Run production-equivalent build chain
        run: |
          node 05_CYCLE_NAVIGATOR/site/build-public.mjs
          node 05_CYCLE_NAVIGATOR/site/build-score-bundle.mjs
          node 05_CYCLE_NAVIGATOR/site/build-live-observation.mjs
          node 05_CYCLE_NAVIGATOR/site/build-social-card.mjs
      - name: Verify required output and privacy
        run: |
          test -f 05_CYCLE_NAVIGATOR/site/dist/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/history-scoreboard.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          ! grep -R 'Donh91\|Investering-Framework-Archive-v1\|week_dir' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
      - name: Verify action-first v3 product shell
        run: |
          grep -q 'public-product.js' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'data-tab="now"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'data-tab="path"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'data-tab="score"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'data-tab="how"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'HANDLEKOMPAS · WHAT SHOULD I DO NOW?' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Bitcoin to microcaps' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'NEXT HOURLY DATA CYCLE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Forecast first. Outcome later.' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
