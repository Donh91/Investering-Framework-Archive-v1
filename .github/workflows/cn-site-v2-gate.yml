name: Cycle Navigator Public Product Gate
on:
  pull_request:
    paths:
      - '05_CYCLE_NAVIGATOR/site/**'
      - '04_MARKET_LEARNING/handlekompas/research/rolling_14d/daily/**'
      - '05_CYCLE_NAVIGATOR/LATEST_CYCLE_NAVIGATOR_POINTER.json'
      - '05_CYCLE_NAVIGATOR/**/CYCLE_NAVIGATOR_MACHINE_PACKAGE.json'
      - '05_CYCLE_NAVIGATOR/public_series/**'
      - '05_CYCLE_NAVIGATOR/public_scorecards/**'
      - '05_CYCLE_NAVIGATOR/forward_range_ledger/CN_FORWARD_RANGE_LEDGER_v2.jsonl'
      - '05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_SITE_PUBLIC_FREEZE_RECEIPT.json'
      - 'scripts/cycle_navigator/build_public_live_precision.py'
      - 'scripts/cycle_navigator/build_graph_history.py'
      - 'tests/cycle_navigator/test_graph_history.py'
      - '05_CYCLE_NAVIGATOR/graph_history/**'
      - '05_CYCLE_NAVIGATOR/CANONICAL_SCORE_AND_LINEAGE.md'
      - 'scripts/cycle_navigator/validate_public_series.py'
      - '.github/workflows/cycle-navigator-pages.yml'
      - '.github/workflows/hourly-sequence-capture.yml'
      - 'scripts/cycle_navigator/verify_hourly_pages_handoff.py'
      - '.github/workflows/native-handlekompas.yml'
      - '.github/workflows/cn-site-v2-gate.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify Hourly-to-public-CDN source provenance and fail-closed negative controls
        run: python3 scripts/cycle_navigator/verify_hourly_pages_handoff.py --self-test
      - name: Verify public homepage alias and exact CDN parity negative controls
        run: node 05_CYCLE_NAVIGATOR/site/tests/verify-pages-parity.mjs --self-test
      - name: Verify Premium v2.1 isolated source contracts (no dependencies)
        run: npm test --prefix 05_CYCLE_NAVIGATOR/site/premium-v2
      - name: Validate and build
        run: |
          python3 scripts/cycle_navigator/validate_public_series.py
          python3 05_CYCLE_NAVIGATOR/site/tests/test_public_hourly_curve.py
          node 05_CYCLE_NAVIGATOR/site/validate-v2.mjs
          node 05_CYCLE_NAVIGATOR/site/build-public.mjs
          node --test 05_CYCLE_NAVIGATOR/site/tests/pullback-research-readback.test.mjs
          node --test 05_CYCLE_NAVIGATOR/site/tests/pullback-pages-run-block.test.mjs
          node 05_CYCLE_NAVIGATOR/site/build-pullback-research.mjs
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/pullback-research.json
          node 05_CYCLE_NAVIGATOR/site/validate-compass-site-v5.mjs
          node 05_CYCLE_NAVIGATOR/site/tests/official-compass-freshness.test.mjs
          node 05_CYCLE_NAVIGATOR/site/tests/full-stack-readback.test.mjs
          node 05_CYCLE_NAVIGATOR/site/build-score-bundle.mjs
          node 05_CYCLE_NAVIGATOR/site/build-live-observation.mjs
          python3 scripts/cycle_navigator/build_public_live_precision.py
          python3 scripts/cycle_navigator/check_publication_lineage.py --self-test
          python3 scripts/cycle_navigator/check_publication_lineage.py
          node 05_CYCLE_NAVIGATOR/site/build-social-card.mjs
      - name: Validate optional Graph History without blocking canonical SITE Product Gate
        id: graph_history
        continue-on-error: true
        run: |
          python3 tests/cycle_navigator/test_graph_history.py
          python3 scripts/cycle_navigator/build_graph_history.py --repo-root . --mode public
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/graph-history/timeline.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/graph-history/index.html
      - name: Quarantine failed optional graph artifacts and disclose degraded state
        if: steps.graph_history.outcome == 'failure'
        run: |
          rm -f 05_CYCLE_NAVIGATOR/site/dist/data/graph-history/timeline.json
          rm -f 05_CYCLE_NAVIGATOR/site/dist/graph-history/index.html
          echo "::warning::GRAPH_HISTORY_STALLED: optional Graph History failed; canonical product gate remains effective"
          echo "GRAPH_HISTORY_STALLED: optional Graph History validation failed" >> "$GITHUB_STEP_SUMMARY"
      - name: Prove isolated NEXT Vite build and preserve entire canonical artifact
        run: node 05_CYCLE_NAVIGATOR/site/premium-v2/stage-next.mjs
      - name: Verify actual NEXT Pages-prefix browser behavior at 390/430
        run: node 05_CYCLE_NAVIGATOR/site/premium-v2/next-browser.test.mjs
      - name: Verify browser failures cannot bypass mobile release gate
        run: node 05_CYCLE_NAVIGATOR/site/tests/browser-startup-negative.test.mjs
      - name: Verify real 390/430 Premium Chrome mobile behavior
        run: node 05_CYCLE_NAVIGATOR/site/tests/premium-mobile-browser.test.mjs
      - name: Verify public investor product
        run: |
          test -f 05_CYCLE_NAVIGATOR/site/dist/legacy/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/vnext/index.html
          grep -q '<base href="./vnext/">' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'PREMIUM LIVE' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'role="tablist"' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'id="view-overview"' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'id="view-compass"' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'id="view-results"' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'href="../legacy/"' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'src="./app.js' 05_CYCLE_NAVIGATOR/site/dist/legacy/index.html
          ! grep -q 'PREMIUM PREVIEW' 05_CYCLE_NAVIGATOR/site/dist/index.html
          ! grep -q 'src="./app.js"' 05_CYCLE_NAVIGATOR/site/dist/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/legacy/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/history-scoreboard.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          test -f 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.css
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/public-freezes/index.json
          grep -q 'Frozen Monday. Scored live. Verified after close.' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'FROZEN PRICE RANGES' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'FROZEN MONDAY PATH' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'WEEKLY TRACK RECORD' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'WEEKLY TRACK RECORD' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'CN_PUBLIC_LIVE_PRICE_PRECISION_v1' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          grep -q '"freshness_sla_minutes": 90' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          ! grep -q 'weekly-score.js' 05_CYCLE_NAVIGATOR/site/dist/legacy/index.html
          grep -q 'data-tab="now"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'data-tab="path"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'data-tab="proof"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'MARKET COMPASS' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'The market journey.' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q '1 · MARKET CYCLE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q '2 · THIS WEEK’S ROTATION' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'ALTSEASON IGNITION' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Small caps begin to participate' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'ALTSEASON WATCH' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Only if confirmation arrives' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'LIVE SIGNALS REFRESHING' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'CN_COMPASS_WEEKLY_ALIGNMENT_v1' 05_CYCLE_NAVIGATOR/site/dist/data/compass.json
          grep -q '"status": "ALIGNED"' 05_CYCLE_NAVIGATOR/site/dist/data/compass.json
          grep -q 'Broad altseason' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'CURRENT CHECKPOINT' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'path-overview-v3' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q 'NO STRUCTURED LONG-CYCLE PHASE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q "source:'MONDAY BASE CASE'" 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Mania / euphoria' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Distribution' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Exit / protection' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'CN_PATH_CYCLE_ROTATION_v3' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'NO SUPPORTED ETA' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'conditional windows need confirmation and are not countdowns' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'market-cycle-v3' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q 'THE MARKET JOURNEY' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'NEXT GATE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'function publicPathText' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'cycle-journey-step.next' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q 'rotation-line-v3' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q 'cycle-watch-v3' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          ! grep -q 'DECISION WINDOWS' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q '3 · ALTCOIN CYCLE TIMER' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'rotation-readout-v3' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q 'cycle-journey-rail' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q 'workflow_dispatch:' .github/workflows/cycle-navigator-pages.yml
          ! grep -q 'workflow_run:' .github/workflows/cycle-navigator-pages.yml
          grep -q 'gh workflow run cycle-navigator-pages.yml --ref main' .github/workflows/native-handlekompas.yml
          grep -q 'NO SUPPORTED ETA' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/compass.json
          grep -q 'completed forecasts with score evidence' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'SINCE LAST CN' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'WHY THIS CALL' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'LAST COMPLETED FORECAST' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'HISTORICAL WEEKLY AVERAGE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Price Range' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'MARKET / STRUCTURE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Analysis only' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Waiting for evidence' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'What the system actually watches' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'HANDLEKOMPAS ·' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'MASTER MONDAY →' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -R 'Donh91\|Investering-Framework-Archive-v1\|week_dir' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
      - name: Promote one original Graph B and source-owned Kompas PRO to root with rollback
        run: node 05_CYCLE_NAVIGATOR/site/premium-v2/promote-root.mjs
      - name: Verify one original Graph B and one Kompas PRO on 390/430 canonical Chrome
        run: node 05_CYCLE_NAVIGATOR/site/premium-v2/next-browser.test.mjs --root
