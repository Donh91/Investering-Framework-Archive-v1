name: Cycle Navigator Public Product Gate
on:
  pull_request:
    paths:
      - '05_CYCLE_NAVIGATOR/site/**'
      - '05_CYCLE_NAVIGATOR/LATEST_CYCLE_NAVIGATOR_POINTER.json'
      - '05_CYCLE_NAVIGATOR/**/CYCLE_NAVIGATOR_MACHINE_PACKAGE.json'
      - '05_CYCLE_NAVIGATOR/public_series/**'
      - '05_CYCLE_NAVIGATOR/public_scorecards/**'
      - '05_CYCLE_NAVIGATOR/forward_range_ledger/CN_FORWARD_RANGE_LEDGER_v2.jsonl'
      - '05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_SITE_PUBLIC_FREEZE_RECEIPT.json'
      - 'scripts/cycle_navigator/build_public_live_precision.py'
      - '05_CYCLE_NAVIGATOR/CANONICAL_SCORE_AND_LINEAGE.md'
      - 'scripts/cycle_navigator/validate_public_series.py'
      - '.github/workflows/cycle-navigator-pages.yml'
      - '.github/workflows/cn-site-v2-gate.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate and build
        run: |
          python3 scripts/cycle_navigator/validate_public_series.py
          node 05_CYCLE_NAVIGATOR/site/validate-v2.mjs
          node 05_CYCLE_NAVIGATOR/site/build-public.mjs
          node 05_CYCLE_NAVIGATOR/site/build-score-bundle.mjs
          node 05_CYCLE_NAVIGATOR/site/build-live-observation.mjs
          python3 scripts/cycle_navigator/build_public_live_precision.py
          node 05_CYCLE_NAVIGATOR/site/build-social-card.mjs
      - name: Verify public investor product
        run: |
          test -f 05_CYCLE_NAVIGATOR/site/dist/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/history-scoreboard.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          test -f 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.css
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/public-freezes/index.json
          grep -q 'Frozen Monday. Scored live. Verified after close.' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'FROZEN PRICE RANGES' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'FROZEN MONDAY PATH' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'WEEKLY TRACK RECORD' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'WEEKLY TRACK RECORD' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'CN_PUBLIC_LIVE_PRICE_PRECISION_v1' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          grep -q '"freshness_sla_minutes": 90' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          ! grep -q 'weekly-score.js' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'data-tab="now"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'data-tab="path"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'data-tab="proof"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'MARKET COMPASS' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Cycle. Rotation. Altcoin timing.' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q '1 · MARKET CYCLE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q '2 · ROTATION' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q '3 · ALTCOIN CYCLE TIMER' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'ALTSEASON IGNITION' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Small-cap expansion begins' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Mania / euphoria' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Distribution' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Exit / protection' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'CN_PATH_THREE_TRACK_v2' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'NO SUPPORTED ETA' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'no browser countdown math' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'market-cycle-v2' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q 'rotation-rail-v2' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q 'altcoin-timer-v2' 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q "github.event.workflow_run.head_branch == 'main'" .github/workflows/cycle-navigator-pages.yml
          grep -q "github.event.workflow_run.conclusion == 'success'" .github/workflows/cycle-navigator-pages.yml
          ! grep -q "github.event.workflow_run.event == 'workflow_run'" .github/workflows/cycle-navigator-pages.yml
          grep -q 'NO SUPPORTED ETA' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/compass.json
          grep -q 'completed forecasts with score evidence' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'SINCE LAST CN' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'WHY THIS CALL' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'LAST COMPLETED FORECAST' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'HISTORICAL WEEKLY AVERAGE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Price Range' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'MARKET / STRUCTURE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Analysis only' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Waiting for evidence' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'What the system actually watches' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'HANDLEKOMPAS ·' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'MASTER MONDAY →' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -R 'Donh91\|Investering-Framework-Archive-v1\|week_dir' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
