name: Cycle Navigator Public Product Gate
on:
  pull_request:
    paths:
      - '05_CYCLE_NAVIGATOR/site/**'
      - '05_CYCLE_NAVIGATOR/LATEST_CYCLE_NAVIGATOR_POINTER.json'
      - '05_CYCLE_NAVIGATOR/**/CYCLE_NAVIGATOR_MACHINE_PACKAGE.json'
      - '.github/workflows/cycle-navigator-pages.yml'
      - '.github/workflows/cn-site-v2-gate.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate and build
        run: |
          node 05_CYCLE_NAVIGATOR/site/validate-v2.mjs
          node 05_CYCLE_NAVIGATOR/site/build-public.mjs
          node 05_CYCLE_NAVIGATOR/site/build-score-bundle.mjs
          node 05_CYCLE_NAVIGATOR/site/build-live-observation.mjs
          node 05_CYCLE_NAVIGATOR/site/build-social-card.mjs
      - name: Verify public product
        run: |
          test -f 05_CYCLE_NAVIGATOR/site/dist/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/history-scoreboard.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          grep -q 'CYCLE COMPASS · WHAT SHOULD I DO NOW?' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'CAPITAL ROTATION · NOW' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'NEXT UPDATE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'PRICE RANGES' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'MARKET & CYCLE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'MARKET DATA' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'LIVE CYCLE COMPASS' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'HANDLEKOMPAS · WHAT SHOULD I DO NOW?' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'MASTER MONDAY' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -R 'Donh91\|Investering-Framework-Archive-v1\|week_dir' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
