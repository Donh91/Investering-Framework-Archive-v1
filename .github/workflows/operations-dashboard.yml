name: Operations Dashboard

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '0 18 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh producer pointers and freeze consumer handoff snapshot
        run: |
          python scripts/architecture/build_latest_handoff.py --repo-root .
          mkdir -p runtime/consumer-receipts
          python scripts/orchestration/build_framework_handoff_manifest.py \
            --repo-root . \
            --output runtime/consumer-receipts/OPERATIONS_DASHBOARD_HANDOFF.json
      - name: Build operations dashboard
        run: |
          python scripts/health/build_operations_dashboard.py \
            --repo-root . \
            --json-output research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.json \
            --md-output research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.md
          python scripts/orchestration/consumer_receipt.py \
            --repo-root . \
            --manifest runtime/consumer-receipts/OPERATIONS_DASHBOARD_HANDOFF.json \
            --consumer OPERATIONS_DASHBOARD \
            --target research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.json \
            --self-hash-field dashboard_sha256 \
            --max-manifest-age-seconds 900 \
            --declared LATEST_HANDOFF \
            --declared AUTOMATION_HEALTH \
            --declared ARCHITECTURE_HEALTH \
            --declared EXPERIMENT_REGISTRY \
            --declared EXPERIMENT_RECEIPT_SYNC \
            --declared EXPERIMENT_DISPATCH \
            --declared REMEDIATION_QUEUE
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path('research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.json')
          value=json.loads(path.read_text())
          value.pop('dashboard_sha256',None)
          receipt=value.get('consumer_receipt') if isinstance(value.get('consumer_receipt'),dict) else {}
          if receipt.get('consumption_state')!='VERIFIED':
              if value.get('overall_status')=='GREEN': value['overall_status']='AMBER'
              actions=value.get('required_actions') if isinstance(value.get('required_actions'),list) else []
              if not any(row.get('system')=='consumer_receipt' for row in actions if isinstance(row,dict)):
                  actions.append({'priority':'P1','system':'consumer_receipt','reason':receipt.get('reasons') or [receipt.get('reason') or 'CONSUMPTION_UNVERIFIED']})
              value['required_actions']=sorted(actions,key=lambda row:(row.get('priority','P9'),row.get('system','')))
          raw=lambda v:json.dumps(v,sort_keys=True,separators=(',',':')).encode()
          value['dashboard_sha256']=hashlib.sha256(raw(value)).hexdigest()
          path.write_text(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n')
          PY
          cp research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.json LATEST_OPERATIONS_DASHBOARD.json
          cp research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.md LATEST_OPERATIONS_DASHBOARD.md
      - name: Commit dashboard and verify remote bytes
        shell: bash
        run: |
          git config user.name 'framework-operations-bot'
          git config user.email 'framework-operations-bot@users.noreply.github.com'
          git add LATEST_HANDOFF.json LATEST_HANDOFF.md \
                  03_DAILY_CAPTURE_LOGS/weekly/RELIABILITY_LEDGER.csv \
                  research/operations_dashboard \
                  LATEST_OPERATIONS_DASHBOARD.json LATEST_OPERATIONS_DASHBOARD.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: refresh operations dashboard ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          for path in \
            research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.json \
            research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.md \
            LATEST_OPERATIONS_DASHBOARD.json \
            LATEST_OPERATIONS_DASHBOARD.md; do
            local_sha=$(sha256sum "$path" | awk '{print $1}')
            remote_sha=$(git show "origin/main:$path" | sha256sum | awk '{print $1}')
            [ "$local_sha" = "$remote_sha" ]
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-dashboard-${{ github.run_id }}
          path: |
            research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.json
            research/operations_dashboard/LATEST_OPERATIONS_DASHBOARD.md
            runtime/consumer-receipts/OPERATIONS_DASHBOARD_HANDOFF.json
          retention-days: 14
          if-no-files-found: error
