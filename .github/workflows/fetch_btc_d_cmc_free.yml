name: Fetch free CoinMarketCap BTC dominance history

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/btc-d-recovery-trigger/**"

permissions:
  contents: read

jobs:
  fetch-btc-d:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, preserve and validate BTC dominance
        run: python scripts/fetch_btc_d_cmc_free.py

      - name: Probe missing 2023-01-05 from daily and hourly source intervals
        run: python scripts/probe_cmc_btc_d_gap.py

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTC_D_COINMARKETCAP_DIRECT_2023_CURRENT
          path: btc_d_output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload source-gap probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTC_D_CMC_GAP_PROBE_2023_01_05
          path: btc_d_gap_probe/
          if-no-files-found: error
          retention-days: 7
