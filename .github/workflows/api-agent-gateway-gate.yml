name: API Agent Gateway Gate

on:
  pull_request:
    paths:
      - 'research/api_agent/**'
      - 'scripts/api_agent/**'
      - 'scripts/cycle_navigator/build_internal_precision.py'
      - 'tests/cycle_navigator/test_internal_precision_api_budget.py'
      - '.github/workflows/cycle-navigator-internal-precision.yml'
      - 'scripts/architecture/build_latest_handoff.py'
      - 'tests/api_agent/**'
      - '.github/workflows/api-agent-gateway-gate.yml'
      - '.github/workflows/research-lab-sol-dispatch.yml'
      - '.github/workflows/daily-director-shadow.yml'
      - '.github/workflows/weekly-sol-adversarial-review.yml'
      - '.github/workflows/research-execution-coordinator.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Normal main smoke mode; owner-only endgame branch triggers its one-time job regardless of this UI value
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live-smoke]

permissions:
  contents: read

jobs:
  gateway-gate:
    # For this finite OWNER-SPECIFIC branch, any manual dispatch is the Terra Max one-shot.
    # GitHub mobile has twice submitted UI 'live-smoke' as normal dry-run behavior.
    # Branch+owner+attempt+durable claim control payment, not a fragile dropdown.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref != 'refs/heads/chore/model-class-currency-20261027' ||
      github.actor != 'Donh91'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic tests
        run: |
          python -m unittest \
            tests.api_agent.test_api_gateway \
            tests.api_agent.test_capability_router \
            tests.api_agent.test_forecast_candidate_backlog \
            tests.api_agent.test_api_intelligence_v2 \
            tests.api_agent.test_director_learning_context \
            tests.api_agent.test_director_situation_room_shadow \
            tests.api_agent.test_daily_director_conflict_budget \
            tests.api_agent.test_daily_director_workflow_contract \
            tests.api_agent.test_terra_max_endgame_context \
            tests.api_agent.test_terra_high_p0_once \
            tests.api_agent.test_legacy_paid_job_retirement \
            tests.api_agent.test_endgame_semantic_report -v
      - name: Verify GPT-6.1 Sol owner release and no-repeat paid admission
        run: |
          python -m py_compile scripts/api_agent/research_lab_sol_dispatch.py
          python -m unittest -v tests.api_agent.test_research_lab_sol_paid_admission
      - name: Run CN paid API preflight, receipt and fail-closed regression tests
        run: |
          python -m py_compile scripts/cycle_navigator/build_internal_precision.py
          python -m unittest -v tests.cycle_navigator.test_internal_precision_api_budget
      - name: Compile and CLI-smoke gateway, capability routing, intelligence and forecast backlog machinery
        run: |
          python -m py_compile \
            scripts/api_agent/api_gateway.py \
            scripts/api_agent/senior_repair_audit_dispatch.py \
            scripts/api_agent/capability_router.py \
            scripts/api_agent/capability_routed_api_gateway.py \
            scripts/api_agent/augment_director_context_v2.py \
            scripts/api_agent/augment_director_learning_context.py \
            scripts/api_agent/augment_director_compounding_learning_context.py \
            scripts/api_agent/augment_director_situation_room_shadow.py \
            scripts/api_agent/check_director_freshness.py \
            scripts/api_agent/detect_api_conflict.py \
            scripts/api_agent/check_api_lane_budget.py \
            scripts/api_agent/deep_research_retry_v2.py \
            scripts/api_agent/run_deep_research_task.py \
            scripts/api_agent/materialize_forecast_candidates.py \
            scripts/architecture/build_latest_handoff.py \
            tests/api_agent/test_capability_router.py \
            tests/api_agent/test_api_intelligence_v2.py \
            tests/api_agent/test_forecast_candidate_backlog.py \
            tests/api_agent/test_director_learning_context.py \
            tests/api_agent/test_director_situation_room_shadow.py \
            tests/api_agent/test_daily_director_conflict_budget.py \
            tests/api_agent/test_daily_director_workflow_contract.py
          python scripts/api_agent/capability_router.py --help >/dev/null
          python scripts/api_agent/capability_routed_api_gateway.py --help >/dev/null
      - name: Prepare bounded smoke inputs
        run: |
          mkdir -p api-agent-input
          cat > api-agent-input/prompt.txt <<'EOF'
          Review the supplied synthetic specialist states. Preserve disagreement and return only the required structured shadow output.
          EOF
          cat > api-agent-input/context.json <<'EOF'
          {"synthetic":true,"specialists":[{"id":"macro","state":"TAILWIND"},{"id":"breadth","state":"CONTRACTING"},{"id":"spot","state":"RANGE"}]}
          EOF
      - name: Dry-run gateway
        if: github.event_name == 'pull_request' || inputs.mode == 'dry-run'
        run: |
          python scripts/api_agent/api_gateway.py \
            --task DAILY_DIRECTOR_SHADOW \
            --registry research/api_agent/API_TASK_REGISTRY_v1.json \
            --prompt-file api-agent-input/prompt.txt \
            --context-file api-agent-input/context.json \
            --output-dir api-agent-output \
            --intended-write-prefix research/api_agent/outputs/daily/ \
            --dry-run
      - name: Dry-run GPT-6.1 Sol senior repair audit lane
        if: github.event_name == 'pull_request' || inputs.mode == 'dry-run'
        run: |
          python scripts/api_agent/api_gateway.py \
            --task SENIOR_REPAIR_AUDIT \
            --registry research/api_agent/API_TASK_REGISTRY_v1.json \
            --prompt-file api-agent-input/prompt.txt \
            --context-file api-agent-input/context.json \
            --output-dir senior-repair-audit-output \
            --intended-write-prefix research/api_agent/outputs/senior_repair_audit/ \
            --dry-run
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('senior-repair-audit-output/receipt.json').read_text())
          assert r['model']=='gpt-6.1-sol'
          assert r['reasoning_effort']=='high'
          assert r['allowed_write_prefix']=='research/api_agent/outputs/senior_repair_audit/'
          assert r['intended_write_prefix']==r['allowed_write_prefix']
          assert r['authority']['framework_state_change'] is False
          assert r['authority']['model_weight_change'] is False
          assert r['authority']['portfolio_action'] is False
          assert r['authority']['self_merge'] is False
          PY

      - name: Controlled live smoke call
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live-smoke'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/api_agent/api_gateway.py \
            --task DAILY_DIRECTOR_SHADOW \
            --registry research/api_agent/API_TASK_REGISTRY_v1.json \
            --prompt-file api-agent-input/prompt.txt \
            --context-file api-agent-input/context.json \
            --output-dir api-agent-output \
            --intended-write-prefix research/api_agent/outputs/daily/
      - name: Verify receipt authority and enforced prefix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('api-agent-output/receipt.json').read_text())
          assert r['authority']['portfolio_action'] is False
          assert r['authority']['framework_state_change'] is False
          assert r['authority']['model_weight_change'] is False
          assert r['estimated_cost_usd'] <= 3.0
          assert r['allowed_write_prefix']=='research/api_agent/outputs/daily/'
          assert r['intended_write_prefix']==r['allowed_write_prefix']
          assert r['untrusted_input_envelope'] is True
          p=json.loads(Path('research/api_agent/API_INTELLIGENCE_POLICY_v2.json').read_text())
          assert p['monthly_hard_stop_usd']==40.0
          assert p['director_schedule']['maximum_runs_per_day']==4
          assert all(v is False for v in p['authority'].values())
          print('API_AGENT_GATEWAY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: api-agent-gateway-${{ github.run_id }}
          path: api-agent-output/
          retention-days: 7
          if-no-files-found: error


  terra-max-endgame-once:
    # One finite owner-approved endgame dispatch. GitHub UI mode is NOT a trusted
    # control: an exact owner+branch manual event is the only dispatch path.
    # Paid claim step independently requires first-run-attempt and a unique GitHub
    # issue #1156 bot-created marker BEFORE the single model request.
    if: >-
      false &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/chore/model-class-currency-20261027' &&
      github.actor == 'Donh91'
    concurrency:
      group: terra-max-owner-endgame-20261027-once
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: No paid rerun, even if Actions job conditional is evaluated differently
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || { echo 'NO_PAID_RERUN'; exit 1; }
      - name: Freeze exact current public main and compile bounded machinery
        run: |
          git fetch origin main
          git rev-parse refs/remotes/origin/main
          python -m py_compile scripts/api_agent/api_gateway.py scripts/api_agent/terra_max_endgame_context.py scripts/api_agent/terra_max_endgame_claim.py
          python -m unittest tests.api_agent.test_terra_max_endgame_context -v
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/api_agent/API_TASK_REGISTRY_v1.json').read_text())
          t=r['tasks']['TERRA_MAX_ENDGAME_ONCE']
          assert t['model']=='gpt-6.1-terra' and t['reasoning_effort']=='max'
          assert t['max_attempts']==1 and t['manual_only'] is True
          assert t['automatic_code_write'] is False and t['automatic_merge'] is False
          assert t['allowed_write_prefix']=='research/api_agent/outputs/terra_max_endgame/'
          assert r['monthly_hard_stop_usd']==40 and r['single_run_hard_stop_usd']==3
          PY

      - name: Enforce existing monthly USD 40 stop against latest main receipts
        run: |
          git worktree add --detach /tmp/terra-source-main refs/remotes/origin/main
          python scripts/api_agent/check_monthly_cost_guard.py \
            --receipt-root /tmp/terra-source-main/research/api_agent/outputs \
            --hard-stop-usd 40 --reserve-usd 4.0

      - name: Prepare fresh-main and public Pages evidence packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/api_agent/terra_max_endgame_context.py \
            --repo-root . --output-dir runtime/terra-max-endgame

      - name: Fail closed if source packet or public readback incomplete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('runtime/terra-max-endgame/manifest.json').read_text())
          assert r['contract']=='TERRA_MAX_ENDGAME_GITHUB_ONCE_v1'
          assert r['source_missing_count']==0, 'REQUIRED_PUBLIC_SOURCE_MISSING'
          assert r['public_readback_success_count']==2, 'PAGES_LINEAGE_READBACK_UNAVAILABLE'
          assert r['source_file_count']==15
          assert r['api_calls_from_packet_builder']==0
          assert r['automatic_code_write'] is False
          assert r['automatic_merge'] is False
          PY

      - name: Dry-run existing strict API gateway at zero cost
        run: |
          python scripts/api_agent/api_gateway.py \
            --task TERRA_MAX_ENDGAME_ONCE \
            --registry research/api_agent/API_TASK_REGISTRY_v1.json \
            --prompt-file runtime/terra-max-endgame/prompt.txt \
            --context-file runtime/terra-max-endgame/context.json \
            --output-dir runtime/terra-max-endgame/dry \
            --intended-write-prefix research/api_agent/outputs/terra_max_endgame/ \
            --dry-run

      - name: Check model availability with no inference
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request
          key=os.environ.get('OPENAI_API_KEY')
          if not key: raise SystemExit('OPENAI_API_KEY_NOT_CONFIGURED')
          req=urllib.request.Request(
            'https://api.openai.com/v1/models/gpt-6.1-terra',
            headers={'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req, timeout=18) as resp:
            if resp.status!=200: raise SystemExit('MODEL_ACCESS_BLOCKED')
          print('TERRA_MODEL_READ_ACCESS_PASS_NO_INFERENCE')
          PY

      - name: Claim single durable paid liability before calling OpenAI
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python scripts/api_agent/terra_max_endgame_claim.py \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$(git rev-parse refs/remotes/origin/main)" \
            > runtime/terra-max-endgame/claim.json

      - name: 'ONE API call: GPT-6.1 Terra Max endgame'
        id: paid_call
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/api_agent/api_gateway.py \
            --task TERRA_MAX_ENDGAME_ONCE \
            --registry research/api_agent/API_TASK_REGISTRY_v1.json \
            --prompt-file runtime/terra-max-endgame/prompt.txt \
            --context-file runtime/terra-max-endgame/context.json \
            --output-dir runtime/terra-max-endgame/live \
            --intended-write-prefix research/api_agent/outputs/terra_max_endgame/

      - name: Validate receipt, without claiming an implemented repair
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/terra-max-endgame/live')
          r=json.loads((p/'receipt.json').read_text())
          o=json.loads((p/'output.json').read_text())
          assert r['status']=='PASS'
          assert r['model']=='gpt-6.1-terra' and r['reasoning_effort']=='max'
          assert r['attempt_count']==1 and r['estimated_cost_usd']<=3.0
          assert o['forecast_candidates']==[]
          assert not any(r['authority'].values())
          m=json.loads(Path('runtime/terra-max-endgame/manifest.json').read_text())
          assert len(m['source_commit_sha'])==40
          print('STRUCTURED_API_RECEIPT_PASS_NOT_PRODUCTION_CLOSURE')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terra-max-endgame-once-${{ github.run_id }}
          path: runtime/terra-max-endgame/
          retention-days: 30
          if-no-files-found: warn

      - name: Report one-time run receipt to existing owner issue
        if: always() && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f runtime/terra-max-endgame/live/receipt.json ]; then
            state=$(python -c "import json;print(json.load(open('runtime/terra-max-endgame/live/receipt.json'))['status'])")
          else
            state="NO_DURABLE_PAID_RECEIPT_CHARGE_UNKNOWN"
          fi
          gh issue comment 1156 --repo "$GITHUB_REPOSITORY" \
            --body "Terra Max one-time endgame API: gateway_receipt_status=$state; substantive_result=NOT_VERIFIED_BY_LEGACY_REPORT. Never auto-retry. Frozen source, detailed scientific/repair proposal and exact model/cost receipt available under this Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . No code was automatically merged or marked production verified."

  terra-high-p0-once:
    # Owner-authorized single-use P0 only. This is a PR-scoped one-time API step,
    # not a scheduler or production source-writer. Existing PR #1823 only.
    if: >-
      false &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1823 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/model-class-currency-20261027' &&
      github.actor == 'Donh91'
    concurrency:
      group: owner-terra-high-p0-one-time-20261027
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact owner and bounded P0 task without paid inference
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1" || { echo 'NO_PAID_RERUN'; exit 1; }
          python -m unittest tests.api_agent.test_terra_high_p0_once tests.api_agent.test_api_gateway -v
          python -m py_compile scripts/api_agent/terra_high_p0_once.py scripts/api_agent/api_gateway.py
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path("research/api_agent/API_TASK_REGISTRY_v1.json").read_text())
          t=reg["tasks"]["TERRA_HIGH_P0_OWNER_ONCE"]
          assert t["model"] == "gpt-6.1-terra"
          assert t["reasoning_effort"] == "high"
          assert t["max_attempts"] == 1
          assert t["max_output_tokens"] == 12000
          assert t["allowed_write_prefix"] == "research/api_agent/outputs/terra_high_p0_once/"
          assert t["automatic_code_write"] is False and t["automatic_merge"] is False
          assert reg["monthly_hard_stop_usd"] == 40 and reg["single_run_hard_stop_usd"] == 3
          PY
      - name: Check existing P0 owner claim and skip if consumed
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          allowed=$(python - <<'PY'
          from scripts.api_agent.terra_high_p0_once import existing_claim
          print("false" if existing_claim() else "true")
          PY
          )
          test "$allowed" = "true" -o "$allowed" = "false"
          echo "run_p0=$allowed" >> "$GITHUB_OUTPUT"
          echo "TERRA_HIGH_P0_NOT_YET_CLAIMED=$allowed"
      - name: Enforce monthly and P0 lane budgets from current production main
        if: steps.admit.outputs.run_p0 == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/terra-high-p0-main refs/remotes/origin/main
          python scripts/api_agent/check_monthly_cost_guard.py \
            --receipt-root /tmp/terra-high-p0-main/research/api_agent/outputs \
            --hard-stop-usd 40 --reserve-usd 4.0
          python scripts/api_agent/check_api_lane_budget.py \
            --receipt-root /tmp/terra-high-p0-main/research/api_agent/outputs \
            --task TERRA_HIGH_P0_OWNER_ONCE --cap-usd 0.75 --reserve-usd 0.20
      - name: Build one P0 frozen source and current public Pages packet
        if: steps.admit.outputs.run_p0 == 'true'
        run: |
          mkdir -p runtime/terra-high-p0
          python scripts/api_agent/terra_high_p0_once.py build \
            --output-dir runtime/terra-high-p0
          python scripts/api_agent/api_gateway.py \
            --task TERRA_HIGH_P0_OWNER_ONCE \
            --registry research/api_agent/API_TASK_REGISTRY_v1.json \
            --prompt-file runtime/terra-high-p0/prompt.txt \
            --context-file runtime/terra-high-p0/context.json \
            --output-dir runtime/terra-high-p0/dry \
            --intended-write-prefix research/api_agent/outputs/terra_high_p0_once/ \
            --dry-run
      - name: Verify provider Terra 6.1 model access without inference
        if: steps.admit.outputs.run_p0 == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os,urllib.request
          key=os.environ.get("OPENAI_API_KEY")
          if not key: raise SystemExit("OPENAI_API_KEY_MISSING")
          q=urllib.request.Request("https://api.openai.com/v1/models/gpt-6.1-terra", headers={"Authorization":"Bearer "+key})
          with urllib.request.urlopen(q,timeout=20) as r:
            if r.status!=200: raise SystemExit("TERRA_HIGH_MODEL_UNAVAILABLE")
          print("TERRA_HIGH_MODEL_ACCESS_VERIFIED_NO_CHARGE")
          PY
      - name: Durably claim ONE P0 High paid attempt in existing supervisor issue
        if: steps.admit.outputs.run_p0 == 'true'
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/api_agent/terra_high_p0_once.py claim \
            --run-id "$GITHUB_RUN_ID" \
            --main-sha "$(git rev-parse refs/remotes/origin/main)" \
            > runtime/terra-high-p0/claim.json
      - name: ONE paid GPT-6.1 Terra High P0 repair call
        if: steps.admit.outputs.run_p0 == 'true' && steps.claim.outcome == 'success'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/api_agent/api_gateway.py \
            --task TERRA_HIGH_P0_OWNER_ONCE \
            --registry research/api_agent/API_TASK_REGISTRY_v1.json \
            --prompt-file runtime/terra-high-p0/prompt.txt \
            --context-file runtime/terra-high-p0/context.json \
            --output-dir runtime/terra-high-p0/live \
            --intended-write-prefix research/api_agent/outputs/terra_high_p0_once/
      - name: Require accepted one-shot P0 receipt and no output authority
        if: steps.admit.outputs.run_p0 == 'true' && steps.claim.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runtime/terra-high-p0/live")
          receipt=json.loads((root/"receipt.json").read_text())
          output=json.loads((root/"output.json").read_text())
          assert receipt["status"]=="PASS", "P0_MODEL_OUTPUT_NOT_ACCEPTED_DO_NOT_RETRY"
          assert receipt["model"]=="gpt-6.1-terra" and receipt["reasoning_effort"]=="high"
          assert receipt["attempt_count"]==1 and receipt["estimated_cost_usd"]<=3.0
          assert output["forecast_candidates"]==[]
          assert all(v is False for v in receipt["authority"].values())
          assert len(output["evidence_against"])<=2
          print("TERRA_HIGH_P0_RECEIPT_PASS_ADVISORY_ONLY")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.admit.outputs.run_p0 == 'true'
        with:
          name: terra-high-p0-once-${{ github.run_id }}
          path: runtime/terra-high-p0/
          retention-days: 30
          if-no-files-found: warn
      - name: Report single P0 API receipt on existing supervisor issue
        if: always() && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f runtime/terra-high-p0/live/receipt.json ]; then
            state=$(python -c "import json;print(json.load(open('runtime/terra-high-p0/live/receipt.json'))['status'])")
            cost=$(python -c "import json;print(json.load(open('runtime/terra-high-p0/live/receipt.json'))['estimated_cost_usd'])")
          else
            state="CHARGE_UNKNOWN"
            cost="UNKNOWN"
          fi
          gh issue comment 1156 --repo "$GITHUB_REPOSITORY" \
            --body "Terra 6.1 HIGH P0 one-time API: gateway_receipt_status=$state; substantive_result=NOT_VERIFIED_BY_LEGACY_REPORT (estimated USD $cost). This is advisory, NOT a deployed data-chain repair. One paid attempt only, never auto-retry. Frozen source, output and receipt artifact: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . Continue P0 under existing GitHub PR owners; no AppDeploy or parallel workflow."

