name: Remediation Maturation Controller

on:
  schedule:
    - cron: '15 6 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '15 18 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  mature:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build remediation queue
        run: |
          python scripts/remediation/build_remediation_maturation.py \
            --repo-root . \
            --output-dir research/remediation
          cp research/remediation/LATEST_REMEDIATION_QUEUE.json LATEST_REMEDIATION_QUEUE.json
          cp research/remediation/LATEST_CODEX_READY_TASKS.json LATEST_CODEX_READY_TASKS.json
          cp research/remediation/LATEST_NEEDS_MORE_EVIDENCE.json LATEST_NEEDS_MORE_EVIDENCE.json
      - name: Commit queue and verify remote bytes
        shell: bash
        run: |
          git config user.name 'framework-remediation-bot'
          git config user.email 'framework-remediation-bot@users.noreply.github.com'
          git add research/remediation LATEST_REMEDIATION_QUEUE.json LATEST_CODEX_READY_TASKS.json LATEST_NEEDS_MORE_EVIDENCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "remediation: mature operational findings ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          for path in LATEST_REMEDIATION_QUEUE.json LATEST_CODEX_READY_TASKS.json LATEST_NEEDS_MORE_EVIDENCE.json; do
            local_sha=$(sha256sum "$path" | awk '{print $1}')
            remote_sha=$(git show "origin/main:$path" | sha256sum | awk '{print $1}')
            [ "$local_sha" = "$remote_sha" ]
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-maturation-${{ github.run_id }}
          path: research/remediation/
          retention-days: 14
          if-no-files-found: error
