name: Remediation Maturation Controller

on:
  schedule:
    - cron: '45 5 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '45 17 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  mature:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build remediation queue and merge research intake
        run: |
          python scripts/remediation/build_remediation_maturation.py \
            --repo-root . \
            --output-dir research/remediation
          python scripts/remediation/merge_codex_research_intake.py \
            --repo-root . \
            --output-dir research/remediation
          cp research/remediation/LATEST_REMEDIATION_QUEUE.json LATEST_REMEDIATION_QUEUE.json
          cp research/remediation/LATEST_CODEX_READY_TASKS.json LATEST_CODEX_READY_TASKS.json
          cp research/remediation/LATEST_NEEDS_MORE_EVIDENCE.json LATEST_NEEDS_MORE_EVIDENCE.json
          cp research/codex/LATEST_CODEX_EXECUTION_STATE.json LATEST_CODEX_EXECUTION_STATE.json
      - name: Commit queue and verify remote bytes
        shell: bash
        run: |
          git config user.name 'framework-remediation-bot'
          git config user.email 'framework-remediation-bot@users.noreply.github.com'
          git add \
            research/remediation \
            research/codex/LATEST_CODEX_EXECUTION_STATE.json \
            research/codex/LATEST_CODEX_INTAKE_STATUS.json \
            research/codex/CODEX_EXECUTION_LEDGER.jsonl \
            LATEST_REMEDIATION_QUEUE.json \
            LATEST_CODEX_READY_TASKS.json \
            LATEST_NEEDS_MORE_EVIDENCE.json \
            LATEST_CODEX_EXECUTION_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "remediation: mature operational findings ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          for path in LATEST_REMEDIATION_QUEUE.json LATEST_CODEX_READY_TASKS.json LATEST_NEEDS_MORE_EVIDENCE.json LATEST_CODEX_EXECUTION_STATE.json; do
            local_sha=$(sha256sum "$path" | awk '{print $1}')
            remote_sha=$(git show "origin/main:$path" | sha256sum | awk '{print $1}')
            [ "$local_sha" = "$remote_sha" ]
          done
      - name: Publish one deduplicated Codex-ready work queue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          task_count=$(python - <<'PY'
          import json
          print(len(json.load(open('LATEST_CODEX_READY_TASKS.json')).get('tasks', [])))
          PY
          )
          title="CODEX READY REMEDIATION QUEUE"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ "$task_count" -gt 0 ]; then
            python - <<'PY' > /tmp/codex-ready.md
          import json
          d=json.load(open('LATEST_CODEX_READY_TASKS.json'))
          print('# Codex-ready remediation queue\n')
          print(f"Generated: `{d.get('generated_at_utc')}`\n")
          print('Use `LATEST_CODEX_READY_TASKS.json` as the machine authority. Research candidates can enter this same queue through the governed intake contract. Re-read fresh task evidence, run the task-specific binding command, and stop as a clean no-op if the precondition no longer holds. Do not broaden change scope, modify market rules, self-merge or bypass tests.\n')
          for t in d.get('tasks', []):
              print(f"## {t.get('workflow')} / {t.get('finding')}")
              print(f"- Signature: `{t.get('signature')}`")
              print(f"- Source: `{t.get('source_type', 'AUTOMATION_HEALTH')}`")
              if t.get('candidate_id'):
                  print(f"- Candidate: `{t.get('candidate_id')}`")
              if t.get('requested_priority'):
                  print(f"- Priority: `{t.get('requested_priority')}`")
              print(f"- Run: `{t.get('latest_run_id')}`")
              print(f"- Objective: {t.get('objective')}")
              print(f"- Precondition: {t.get('precondition')}")
              print(f"- Clean no-op: {t.get('clean_noop_condition')}")
              print(f"- Stop: {t.get('stop_condition')}")
              print(f"- Post-fix gate: `{t.get('post_fix_gate')}`")
              print(f"- Fresh-state binding: `{t.get('fresh_state_preflight_command')}`\n")
          PY
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --body-file /tmp/codex-ready.md
            else
              gh issue comment "$existing" --body-file /tmp/codex-ready.md
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body "No CODEX_READY tasks remain at run ${GITHUB_RUN_ID}. Close only after post-fix observation confirms resolution or a task is explicitly cleared as no-change."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-maturation-${{ github.run_id }}
          path: |
            research/remediation/
            research/codex/LATEST_CODEX_EXECUTION_STATE.json
            research/codex/LATEST_CODEX_INTAKE_STATUS.json
            research/codex/CODEX_EXECUTION_LEDGER.jsonl
          retention-days: 14
          if-no-files-found: error
