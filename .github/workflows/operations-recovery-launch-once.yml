name: Operations Recovery Launch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operations-recovery-launch-once.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: operations-recovery-launch-once
  cancel-in-progress: false

jobs:
  dispatch-current-definitions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Dispatch current Hourly Sequence definition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "launcher_sha=${GITHUB_SHA}"
          gh workflow run hourly-sequence-capture.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 4
          echo '--- Hourly Sequence workflow_dispatch runs ---'
          gh run list --repo "$GITHUB_REPOSITORY" --workflow hourly-sequence-capture.yml --event workflow_dispatch --limit 3 --json databaseId,createdAt,status,conclusion,headSha,url

          echo '## Operations Recovery Launch' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- hourly-sequence-capture.yml: dispatched on main' >> "$GITHUB_STEP_SUMMARY"
          echo '- downstream path: Hourly workflow includes T12 register + predict steps' >> "$GITHUB_STEP_SUMMARY"
          echo '- repository writes from launcher: none' >> "$GITHUB_STEP_SUMMARY"
          echo '- launcher lifecycle: one-shot on introducing push only' >> "$GITHUB_STEP_SUMMARY"
