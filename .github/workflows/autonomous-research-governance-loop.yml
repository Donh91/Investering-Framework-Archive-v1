name: Autonomous Research Governance Loop

on:
  schedule:
    - cron: '30 7 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  queue: max
  cancel-in-progress: false

jobs:
  governance-loop:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governance stack before mutation
        run: |
          python scripts/research/validate_research_governance_bindings.py
          python scripts/research/validate_research_memory_novelty_gate.py
          python scripts/research/validate_research_decision_impact_router.py
          python scripts/research/validate_independent_research_adversarial_sentinel.py
          python scripts/research/validate_research_meta_orchestrator.py
          python scripts/research/validate_research_governance_integration.py
          python -m unittest discover -s tests/research -p test_alpha_precision_harvest_observer_v1.py -v
      - name: Memory and novelty gate
        run: python scripts/research/research_memory_novelty_gate.py
      - name: Decision-impact and VOI route
        run: python scripts/research/research_decision_impact_router.py
      - name: Independent adversarial sentinel
        run: python scripts/research/independent_research_adversarial_sentinel.py
      - name: Meta-orchestrate surviving research work
        run: python scripts/research/research_meta_orchestrator.py
      - name: Publish deterministic Claude research audit candidates, no dispatch
        id: claude_advisory_feed
        continue-on-error: true
        run: |
          python -m unittest discover -s tests/research -p test_claude_advisory_feed_v1.py -v
          python scripts/research/build_claude_advisory_feed_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('00_ARCHIVE_CONTROL/research_governance_v1/claude_advisory_feed/LATEST.json')
          x=json.loads(p.read_text())
          assert x['contract']=='CLAUDE_ORIGINAL_OWNER_ADVISORY_FEED_v1'
          assert x['automatic_execution'] is False
          assert x['automatic_paid_dispatch'] is False
          assert x['claude_invoked'] is False
          assert x['canonical_effect'] is False
          assert x['portfolio_execution'] is False
          assert x['candidate_count']==len(x['candidates'])
          print('CLAUDE_ADVISORY_RESEARCH_ONLY_READBACK_PASS',x['candidate_count'])
          PY
      - name: Fail closed optional Claude advisory source when unavailable
        if: steps.claude_advisory_feed.outcome == 'failure'
        shell: bash
        run: |
          # The advisory-only feature must NEVER block canonical daily
          # novelty/VOI/sentinel/meta or leave a stale trusted feed on main.
          rm -f 00_ARCHIVE_CONTROL/research_governance_v1/claude_advisory_feed/LATEST.json
          echo "::warning::CLAUDE_ADVISORY_FEED_UNAVAILABLE; original Research Governance continues. Never mark Claude invoked."
      - name: Observe Alpha Precision existing owners without spending or dispatch
        run: python scripts/research/alpha_precision_harvest_observer_v1.py
      - name: Verify binding-aware governance state before commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('00_ARCHIVE_CONTROL/research_governance_v1/meta_orchestrator_v1/STATE.json')
          s=json.loads(p.read_text())
          assert s['canonical_effect'] is False
          assert s['portfolio_execution'] is False
          assert s['paid_data_authorized'] is False
          assert s['binding_integrity'] in {'PRIMARY_COMPLETE','DEGRADED_PRIMARY_FALLBACK'}
          if s['binding_integrity']!='PRIMARY_COMPLETE':
              assert s['primary_action']=='WAIT_FOR_BINDING_COMPLETENESS'
              assert s['active_heavy_workstreams']==[]
          print('GOVERNANCE_PRODUCTION_BINDING_READBACK_PASS',s['binding_integrity'],s['primary_action'])
          PY
      - name: Commit research-only governance state with verified readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          git add 00_ARCHIVE_CONTROL/research_governance_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: advance autonomous research governance"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
