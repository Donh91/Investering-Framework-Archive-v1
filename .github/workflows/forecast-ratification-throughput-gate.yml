name: Forecast Ratification Throughput Gate

on:
  pull_request:
    paths:
      - 'scripts/lib/forecast_ratification_contract.py'
      - 'scripts/lib/forecast_candidate_grouping.py'
      - 'scripts/lib/forecast_ratification_baseline.py'
      - 'scripts/learning/forecast_ratification_freezer.py'
      - 'scripts/learning/ratify_forecast_candidate.py'
      - 'scripts/learning/process_forecast_ratifications.py'
      - 'scripts/learning/build_forecast_ratification_queue.py'
      - 'tests/learning/test_forecast_ratification_throughput.py'
      - 'tests/learning/test_forecast_candidate_grouping.py'
      - 'tests/learning/test_forecast_ratification_baseline.py'
      - 'scripts/api_agent/materialize_forecast_candidates.py'
      - 'tests/api_agent/test_forecast_candidate_backlog.py'
      - '.github/workflows/continuity-learning-maintenance.yml'
      - '.github/workflows/forecast-ratification-throughput-gate.yml'
      - '06_RESEARCH_LAB/forecast_accountability/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ratification-throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile ratification modules
        run: |
          python -m py_compile \
            scripts/lib/forecast_ratification_contract.py \
            scripts/lib/forecast_candidate_grouping.py \
            scripts/lib/forecast_ratification_baseline.py \
            scripts/learning/forecast_ratification_freezer.py \
            scripts/learning/ratify_forecast_candidate.py \
            scripts/learning/process_forecast_ratifications.py \
            scripts/learning/build_forecast_ratification_queue.py \
            tests/learning/test_forecast_ratification_throughput.py \
            tests/learning/test_forecast_candidate_grouping.py \
            tests/learning/test_forecast_ratification_baseline.py
      - name: Prospective ratification integration regressions
        run: |
          python tests/learning/test_forecast_ratification_throughput.py -v
          python tests/learning/test_forecast_candidate_grouping.py -v
          python tests/learning/test_forecast_ratification_baseline.py -v
      - name: Direct ratifier CLI must be disabled
        run: |
          set +e
          python scripts/learning/ratify_forecast_candidate.py > /tmp/ratifier.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'DIRECT_RATIFIER_CLI_DISABLED_USE_PROCESS_FORECAST_RATIFICATIONS' /tmp/ratifier.out
      - name: Existing forecast candidate backlog regressions
        run: python tests/api_agent/test_forecast_candidate_backlog.py -v
      - name: Existing exact settlement regressions
        run: |
          python tests/learning/test_forecast_settlement_price_owner.py -q
          python tests/learning/test_mature_exact_settlement_forecasts.py -q
          python tests/learning/test_build_non_exact_forecast_subset.py -q
      - name: Historical replay immutability guard
        run: python tests/learning/test_historical_replay_guard.py -q
      - name: Live pending population cutover census without outcomes
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path('.')
          sys.path.insert(0,str(root/'scripts/lib'))
          from forecast_candidate_grouping import classified_candidate_groups
          groups=classified_candidate_groups(root/'research/api_agent/forecast_candidates/PENDING')
          counts={}
          for group in groups.values():
              classification=group['classification']
              counts[classification]=counts.get(classification,0)+1
          result={
              'distinct_candidate_ids':len(groups),
              'classifications':counts,
              'legacy_candidate_ids':sum(v for k,v in counts.items() if k.startswith('LEGACY_PRE_CUTOVER')),
              'post_cutover_candidate_ids':counts.get('POST_CUTOVER_SINGLE',0),
          }
          print(json.dumps(result,sort_keys=True))
          assert result['legacy_candidate_ids'] > 0, 'expected_frozen_legacy_backlog_for_cutover_guard'
          # classified_candidate_groups itself fails if any post-cutover candidate_id has multiple paths.
          PY
      - name: Production workflow epistemic separation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/continuity-learning-maintenance.yml').read_text()
          required=[
              'Process prospective owner ratification packets',
              'Build outcome-free ratification queue for framework owner',
              'Resolve exact settlement evidence for ratified price forecasts',
              'Mature exact-settlement ratified forecasts',
              'Isolate non-exact ratified forecasts for legacy maturation',
              'runtime/api-agent-non-exact-forecast-subset',
              'LATEST_RATIFICATION_QUEUE.json',
              'RATIFICATION_INBOX',
              'RATIFICATION_TERMINAL',
          ]
          for item in required: assert item in workflow, item
          assert workflow.index('Process prospective owner ratification packets') < workflow.index('Build outcome-free ratification queue for framework owner')
          assert workflow.index('Mature exact-settlement ratified forecasts') < workflow.index('Mature remaining non-exact ratified forecasts')
          legacy_tail=workflow[workflow.index('Mature remaining non-exact ratified forecasts'):]
          assert '--forecast-root runtime/api-agent-non-exact-forecast-subset' in legacy_tail
          assert '--forecast-root research/api_agent/forecast_candidates/FROZEN' not in legacy_tail.split('- name: Build calibration ledger',1)[0]
          processor=Path('scripts/learning/process_forecast_ratifications.py').read_text()
          queue=Path('scripts/learning/build_forecast_ratification_queue.py').read_text()
          shim=Path('scripts/learning/ratify_forecast_candidate.py').read_text()
          grouping=Path('scripts/lib/forecast_candidate_grouping.py').read_text()
          baseline=Path('scripts/lib/forecast_ratification_baseline.py').read_text()
          assert 'outcome-root' not in processor
          assert 'outcome-root' not in queue
          assert 'PACKET_RECORDING_TOLERANCE_MINUTES' in processor
          assert 'CANDIDATE_RECORDING_TOLERANCE_MINUTES' in processor
          assert 'RATIFICATION_PRECEDES_CANDIDATE_GIT_RECORD' in processor
          assert 'LEGACY_PRE_CUTOVER_HINDSIGHT_INELIGIBLE' in processor
          assert 'LEGACY_PRE_CUTOVER_DIVERGENT_DUPLICATE_HINDSIGHT_INELIGIBLE' in processor
          assert 'EXPIRED_NO_OWNER_DECISION' in processor
          assert 'outcome_data_read": False' in processor
          assert 'outcome_data_included": False' in queue
          assert 'POST_CUTOVER_DUPLICATE_CANDIDATE_ID' in grouping
          assert 'DIRECT_RATIFIER_CLI_DISABLED_USE_PROCESS_FORECAST_RATIFICATIONS' in shim
          assert 'LATEST.json' in baseline
          assert 'AMBIGUOUS_BASELINE_CAPTURE_AT_DECISION' in baseline
          assert 'LATEST_IMMUTABLE_ARCHIVED_CAPTURE_AT_OR_BEFORE_OWNER_DECISION' in processor
          PY
