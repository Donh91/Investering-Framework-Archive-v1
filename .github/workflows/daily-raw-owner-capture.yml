name: Daily Raw Owner Capture

on:
  push:
    paths:
      - '.github/workflows/daily-raw-owner-capture.yml'
  schedule:
    - cron: '13 6 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '47 10 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '22 15 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '38 19 * * *'
      timezone: 'Europe/Copenhagen'
    - cron: '11 23 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CFGI_API_KEY: ${{ secrets.CFGI_API_KEY }}
      CFGI_ENABLED: ${{ vars.CFGI_ENABLED }}
      SCHEDULE_ID: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Initialize source status
        run: echo '{}' > collector-status.json
      - name: Run owner collectors fail-closed but independently
        shell: bash
        run: |
          set +e
          record_code() {
            python - "$1" "$2" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path('collector-status.json');data=json.loads(p.read_text());data[sys.argv[1]]=int(sys.argv[2]);p.write_text(json.dumps(data,sort_keys=True)+'\n')
          PY
          }
          run_owner() { key="$1"; shift; "$@"; record_code "$key" "$?"; }
          run_owner fred_macro python scripts/data_terminal/fred_multiseries_live_adapter.py --series DGS2,DGS10,DTWEXBGS,VIXCLS --output-dir fred-owner-output
          run_owner binance_spot python scripts/data_terminal/binance_spot_owner_collector.py --output-dir binance-spot-owner-output
          run_owner binance_microstructure python scripts/data_terminal/binance_spot_microstructure_source.py --output-dir binance-spot-microstructure-output
          run_owner okx_swap python scripts/data_terminal/okx_swap_owner_collector.py --output-dir okx-swap-owner-output
          run_owner top100_breadth python scripts/data_terminal/top100_breadth_owner_collector.py --output-dir top100-breadth-owner-output
          if [ "${CFGI_ENABLED}" = "true" ]; then
            CFGI_FIELDS="score,volatility,volume,impulse,technical,social,dominance,trends,whales,orders"
            run_owner cfgi_sentiment python scripts/data_terminal/cfgi_owner_collector.py --output-dir cfgi-owner-output --symbols MARKET,BTC,ETH --timeframe 4h --fields "${CFGI_FIELDS}" --limit 1
            if [ "${SCHEDULE_ID}" = "13 6 * * *" ]; then
              python scripts/data_terminal/cfgi_owner_collector.py --output-dir cfgi-1d-owner-output --symbols MARKET,BTC,ETH --timeframe 1d --fields score --limit 1
              record_code cfgi_sentiment_1d "$?"
            fi
          else
            record_code cfgi_sentiment 78
          fi
      - name: Persist compressed raw payloads permanently
        run: |
          python scripts/daily_capture/persist_raw_payloads.py \
            --run-id "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output-root 03_DAILY_CAPTURE_LOGS/raw \
            --max-owner-bytes 12000000 \
            --max-monthly-compressed-bytes 20000000 \
            fred-owner-output binance-spot-owner-output binance-spot-microstructure-output okx-swap-owner-output top100-breadth-owner-output cfgi-owner-output cfgi-1d-owner-output
      - name: Build compact permanent capture index
        run: python scripts/daily_capture/build_capture_index.py --status-file collector-status.json --output-root 03_DAILY_CAPTURE_LOGS/captures --run-id "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --trigger "${GITHUB_EVENT_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-raw-owner-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fred-owner-output/
            binance-spot-owner-output/
            binance-spot-microstructure-output/
            okx-swap-owner-output/
            top100-breadth-owner-output/
            cfgi-owner-output/
            cfgi-1d-owner-output/
            collector-status.json
            03_DAILY_CAPTURE_LOGS/raw/incidents/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit compact index and cold evidence with verified readback
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 03_DAILY_CAPTURE_LOGS/captures 03_DAILY_CAPTURE_LOGS/raw
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: log daily raw capture ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  notify:
    needs: capture
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Publish sanitized incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 09_SOURCE_QA/incidents
          FILE="09_SOURCE_QA/incidents/INCIDENT_daily-raw-owner-capture-${GITHUB_RUN_ID}.md"
          printf '# AUTOMATION INCIDENT\n\nWorkflow: Daily Raw Owner Capture\nRun: %s\nTimestamp UTC: %s\nStatus: FAILED\nInspect Actions logs. No secrets are included.\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > "$FILE"
          git config user.name framework-incident-bot
          git config user.email framework-incident-bot@users.noreply.github.com
          git add "$FILE" && git commit -m "incident: daily capture ${GITHUB_RUN_ID}" && git pull --rebase origin main && git push origin HEAD:main
          gh issue create --title "AUTOMATION FAILURE: Daily Raw Owner Capture ${GITHUB_RUN_ID}" --body-file "$FILE" || true
