name: Meme Alpha Runtime Gate

on:
  pull_request:
    paths:
      - 'scripts/api_agent/meme_alpha_runtime.py'
      - 'scripts/api_agent/meme_alpha_runtime_v1_1.py'
      - 'scripts/api_agent/meme_alpha_runtime_v1_2.py'
      - 'scripts/api_agent/meme_alpha_source_auth.py'
      - 'scripts/api_agent/meme_alpha_prospective.py'
      - 'scripts/api_agent/typesafe_jev_replay.py'
      - 'scripts/api_agent/meme_alpha_url_provenance.py'
      - 'scripts/api_agent/meme_alpha_lifecycle_v1.py'
      - 'tests/api_agent/test_meme_alpha_runtime.py'
      - 'tests/api_agent/test_meme_alpha_runtime_v1_1.py'
      - 'tests/api_agent/test_meme_alpha_runtime_v1_2_hardening.py'
      - 'tests/api_agent/test_meme_alpha_source_auth.py'
      - 'tests/api_agent/test_meme_alpha_prospective.py'
      - 'tests/api_agent/test_typesafe_jev_replay.py'
      - 'tests/api_agent/test_meme_alpha_url_provenance.py'
      - 'tests/api_agent/test_meme_alpha_lifecycle_v1.py'
      - 'research/api_agent/meme_alpha/**'
      - '.agents/skills/meme-alpha-supervisor/**'
      - '.github/workflows/meme-alpha-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meme-alpha-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile deterministic runtime
        run: >-
          python -m py_compile
          scripts/api_agent/meme_alpha_runtime.py
          scripts/api_agent/meme_alpha_runtime_v1_1.py
          scripts/api_agent/meme_alpha_runtime_v1_2.py
          scripts/api_agent/meme_alpha_source_auth.py
          scripts/api_agent/meme_alpha_prospective.py
          scripts/api_agent/typesafe_jev_replay.py
          scripts/api_agent/meme_alpha_url_provenance.py
          scripts/api_agent/meme_alpha_lifecycle_v1.py
          tests/api_agent/test_meme_alpha_runtime.py
          tests/api_agent/test_meme_alpha_runtime_v1_1.py
          tests/api_agent/test_meme_alpha_runtime_v1_2_hardening.py
          tests/api_agent/test_meme_alpha_source_auth.py
          tests/api_agent/test_meme_alpha_prospective.py
          tests/api_agent/test_typesafe_jev_replay.py
          tests/api_agent/test_meme_alpha_url_provenance.py
          tests/api_agent/test_meme_alpha_lifecycle_v1.py
      - name: Run focused tests
        run: >-
          python -m unittest
          tests.api_agent.test_meme_alpha_runtime
          tests.api_agent.test_meme_alpha_runtime_v1_1
          tests.api_agent.test_meme_alpha_runtime_v1_2_hardening
          tests.api_agent.test_meme_alpha_source_auth
          tests.api_agent.test_meme_alpha_prospective
          tests.api_agent.test_typesafe_jev_replay
          tests.api_agent.test_meme_alpha_url_provenance
          tests.api_agent.test_meme_alpha_lifecycle_v1
          -v
      - name: Validate policy authority, budget and source-auth gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/api_agent/meme_alpha/MEME_ALPHA_RUNTIME_POLICY_v1.json').read_text())
          assert p['contract']=='MEME_ALPHA_RUNTIME_POLICY_v1'
          assert p['status']=='ACTIVE_RESEARCH_ONLY'
          assert p['cadence']['max_tasks_per_run']==1
          assert p['cadence']['empty_queue_behavior']=='NOOP_NO_MODEL_CALL'
          assert p['budget']['single_task_hard_cap_usd'] <= 0.75
          assert p['budget']['monthly_shared_api_hard_stop_usd'] <= 20.0
          assert 0 < p['budget']['max_web_search_calls_per_task'] <= 4
          assert p['budget']['web_search_tool_call_cost_usd_snapshot'] >= 0.01
          assert p['failure_policy']['infrastructure_failures_do_not_consume_task_attempts'] is True
          assert p['adaptive_development']['may_modify_production_code_directly'] is False
          assert p['adaptive_development']['may_auto_merge'] is False
          assert p['adaptive_development']['codex_is_required_for_research'] is False
          sa=p['source_authentication']
          assert sa['enabled'] is True
          assert sa['minimum_external_trust_anchors'] >= 2
          assert sa['minimum_independent_anchor_categories'] >= 2
          assert sa['minimum_independent_control_roots'] >= 2
          assert sa['require_structured_provenance_claim_types'] is True
          assert sa['verified_commit_counts_as_ownership'] is False
          assert sa['repository_self_description_counts_as_ownership'] is False
          assert sa['require_high_confidence_onchain_binding_for_token_ca_claim'] is True
          assert sa['revocation_must_propagate_to_descendants'] is True
          assert all(v is False for v in p['authority'].values())
          print('MEME_ALPHA_RUNTIME_POLICY_PASS')
          PY
      - name: Validate prospective hardening contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/api_agent/meme_alpha/MEME_ALPHA_PROSPECTIVE_HARDENING_v1.json').read_text())
          assert p['contract']=='MEME_ALPHA_PROSPECTIVE_HARDENING_v1'
          assert p['trial_state_machine']['discovery_complete_is_not_outcome_matured'] is True
          assert p['trial_state_machine']['minimum_unique_ecosystem_trials_for_review'] >= 20
          assert p['hierarchical_identity']['method_denominator_unit']=='UNIQUE_ECOSYSTEM_TRIAL'
          assert p['cohort_selection']['manifest_must_precede_token_search'] is True
          assert p['alpha_measurement_contract']['positive_alpha_requires_sellability'] is True
          assert p['matched_control']['selection_must_be_frozen_before_outcome'] is True
          assert p['missed_winner_audit']['required_for_every_outcome_matured_ecosystem_trial'] is True
          assert p['queue_slo']['P0_event_driven_max_queue_age_minutes'] <= 60
          assert p['kill_criteria']['evaluate_only_after_minimum_matured_trials'] >= 20
          assert all(v is False for v in p['authority'].values())
          print('MEME_ALPHA_PROSPECTIVE_HARDENING_PASS')
          PY
      - name: Validate lifecycle and Phoenix research contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lifecycle=json.loads(Path('research/api_agent/meme_alpha/ALPHA_LAB_LIFECYCLE_ENGINE_v1.json').read_text())
          phoenix=json.loads(Path('research/api_agent/meme_alpha/PHOENIX_RECLAIM_EXPERIMENT_v1.json').read_text())
          assert lifecycle['contract']=='ALPHA_LAB_LIFECYCLE_ENGINE_v1'
          assert lifecycle['identity']['primary_key']=='chain + exact token contract address'
          assert lifecycle['anti_leakage']['moonshot_and_phoenix_training_populations_separate'] is True
          assert lifecycle['regime_context']['may_veto_candidate'] is False
          assert all(v is False for v in lifecycle['authority'].values())
          assert phoenix['contract']=='PHOENIX_RECLAIM_EXPERIMENT_v1'
          assert phoenix['pullback_retest']['mandatory_before_phoenix_gamble_candidate'] is True
          assert phoenix['wallet_alpha']['single_wallet_is_sufficient_for_user_alert'] is False
          assert phoenix['matched_control']['freeze_before_outcome'] is True
          assert phoenix['historical_benchmarks']['may_not_directly_set_live_thresholds'] is True
          assert phoenix['adaptive_evolution']['separate_champion_from_moonshot'] is True
          assert all(v is False for v in phoenix['authority'].values())
          print('MEME_ALPHA_LIFECYCLE_PHOENIX_PASS')
          PY
      - name: Dry-run v1.2 worker smoke
        run: |
          mkdir -p runtime-smoke/private_research/memes_alpha/research_leads runtime-smoke/state runtime-smoke/out
          cat > runtime-smoke/private_research/memes_alpha/research_leads/test.json <<'EOF'
          {"status":"QUEUED_FOR_INDEPENDENT_REPLAY","priority":"P0","subject":"synthetic official GitHub provenance smoke"}
          EOF
          cat > runtime-smoke/state/LATEST_RUNTIME_STATE.json <<'EOF'
          {"contract":"MEME_ALPHA_RUNTIME_STATE_v1","processed_inputs":{},"failure_counts":{}}
          EOF
          python scripts/api_agent/meme_alpha_runtime_v1_2.py plan \
            --workspace runtime-smoke \
            --policy research/api_agent/meme_alpha/MEME_ALPHA_RUNTIME_POLICY_v1.json \
            --state runtime-smoke/state/LATEST_RUNTIME_STATE.json \
            --output runtime-smoke/plan.json
          python scripts/api_agent/meme_alpha_runtime_v1_2.py analyze \
            --task runtime-smoke/private_research/memes_alpha/research_leads/test.json \
            --policy research/api_agent/meme_alpha/MEME_ALPHA_RUNTIME_POLICY_v1.json \
            --output-dir runtime-smoke/out \
            --dry-run
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('runtime-smoke/plan.json').read_text())
          receipt=json.loads(Path('runtime-smoke/out/receipt.json').read_text())
          output=json.loads(Path('runtime-smoke/out/output.json').read_text())
          assert plan['no_op'] is False
          assert receipt['estimated_model_cost_usd']==0.0
          assert receipt['estimated_web_tool_cost_usd']==0.0
          assert receipt['estimated_total_cost_usd']==0.0
          assert receipt['web_search_call_count']==0
          assert receipt['authority']['portfolio_action'] is False
          assert receipt['runtime_contract']=='MEME_ALPHA_RUNTIME_v1_2_SOURCE_AUTH'
          assert receipt['first_party_claim_allowed'] is False
          assert output['source_authentication']['state']=='CANDIDATE'
          print('MEME_ALPHA_V1_2_DRY_RUN_PASS')
          PY
