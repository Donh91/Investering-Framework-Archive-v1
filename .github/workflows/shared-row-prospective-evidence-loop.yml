name: Shared Row Prospective Evidence Loop

on:
  schedule:
    - cron: '50 0,6,12,18 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  research-loop:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python 06_RESEARCH_LAB/shared_row_model_tournament_v1/pipeline/validate_tournament_contract.py
      - name: Materialize latest eligible core row
        shell: bash
        run: |
          rm -f /tmp/shared-row.json
          python scripts/research/core_shared_row_materializer.py --output /tmp/shared-row.json
          if [ -s /tmp/shared-row.json ]; then
            python scripts/research/prospective_evidence_controller.py --ingest-row /tmp/shared-row.json
          else
            python scripts/research/prospective_evidence_controller.py --status-only
          fi
      - name: Mature frozen prospective outcomes
        run: |
          python scripts/research/shared_row_outcome_owner.py
          python scripts/research/shared_row_tournament_maturation.py
      - run: python scripts/research/shared_row_tournament_relevance.py
      - run: python scripts/research/shared_row_tournament_monitor.py
      - name: Commit research-only state changes with verified readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          git add 06_RESEARCH_LAB/shared_row_model_tournament_v1/data/PROSPECTIVE_SHARED_ROW_LEDGER.csv \
                  06_RESEARCH_LAB/shared_row_model_tournament_v1/data/OUTCOME_DETAIL_LEDGER.csv \
                  06_RESEARCH_LAB/shared_row_model_tournament_v1/14_DIVERGENCE_FNP_LEDGER.csv \
                  06_RESEARCH_LAB/shared_row_model_tournament_v1/RELEVANCE_STATE.json \
                  06_RESEARCH_LAB/shared_row_model_tournament_v1/monitor
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: accumulate prospective shared-row evidence"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
