name: Automation Health Refresh Once

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[AH_REFRESH]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch current-main Automation Production Health
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run automation-production-health.yml --repo "$GITHUB_REPOSITORY" --ref main
