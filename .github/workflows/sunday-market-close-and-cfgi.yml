name: Sunday Market Close and CFGI

on:
  schedule:
    - cron: '35 23 * * 0'
      timezone: 'Europe/Copenhagen'
    - cron: '5 2 * * 1'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunday-market-close-and-cfgi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect CFGI fail-closed independently
        env:
          CFGI_API_KEY: ${{ secrets.CFGI_API_KEY }}
        shell: bash
        run: |
          set +e
          python scripts/data_terminal/cfgi_owner_collector.py --output-dir cfgi-owner-output
          echo "cfgi_exit=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Build verified weekly price ranges
        run: |
          python scripts/daily_capture/build_weekly_market_close_package.py \
            --output-root 03_DAILY_CAPTURE_LOGS/weekly_close
      - name: Copy compact CFGI owner output when available
        shell: bash
        run: |
          mkdir -p 03_DAILY_CAPTURE_LOGS/cfgi
          if [ -f cfgi-owner-output/owner_snapshot.json ]; then
            cp cfgi-owner-output/owner_snapshot.json 03_DAILY_CAPTURE_LOGS/cfgi/LATEST_CFGI_OWNER.json
            cp cfgi-owner-output/receipt.json 03_DAILY_CAPTURE_LOGS/cfgi/LATEST_CFGI_RECEIPT.json
          else
            printf '{"contract":"CFGI_OWNER_STATUS_v1","status":"SOURCE_UNAVAILABLE","reason":"CFGI_API_KEY_missing_or_source_failed"}\n' > 03_DAILY_CAPTURE_LOGS/cfgi/LATEST_CFGI_STATUS.json
          fi
      - name: Commit compact weekly handoff
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 03_DAILY_CAPTURE_LOGS/weekly_close 03_DAILY_CAPTURE_LOGS/cfgi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add weekly market close and CFGI handoff"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
