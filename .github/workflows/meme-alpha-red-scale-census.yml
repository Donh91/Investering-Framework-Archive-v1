name: Meme Alpha RED Scale Census

on:
  pull_request:
    paths:
      - 'research/api_agent/meme_alpha/experiments/red_recurring_pair_scale_census_v1.py'
      - '.github/workflows/meme-alpha-red-scale-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned RED release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/red-cohort /tmp/red-census
          URL='https://zenodo.org/records/21765387/files/RED-COHORT-2026-v1_1_1.zip?download=1'
          curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 20 "$URL" -o /tmp/red-cohort/RED-COHORT-2026-v1_1_1.zip
          echo '172198eade99f702f1da0bfdd4cf3079  /tmp/red-cohort/RED-COHORT-2026-v1_1_1.zip' | md5sum -c -
          sha256sum /tmp/red-cohort/RED-COHORT-2026-v1_1_1.zip | tee /tmp/red-census/SHA256SUMS
      - name: Build deterministic scale census
        run: |
          python research/api_agent/meme_alpha/experiments/red_recurring_pair_scale_census_v1.py \
            --zip /tmp/red-cohort/RED-COHORT-2026-v1_1_1.zip \
            --out /tmp/red-census/red_recurring_pair_scale_census_v1.json
      - name: Require selection continuity and non-outcome ordering
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/red-census/red_recurring_pair_scale_census_v1.json'))
          c=x['counts']; inv=x['invariants']
          assert c['candidate_pairs'] >= 2, c
          assert x['first_50_pair_hashes'][0] == '0013924fd62ac88c2d7c6f2e4d8ae8895d3cb1b783f989eb5e2d6f607d9cf8bd'
          assert x['first_50_pair_hashes'][1] == '00809f110dadd7f30ac21d868c2abf1e16066a409952018e37b6eb9d92108387'
          assert x['first_50_launch_counts'][0] == 6
          assert x['first_50_launch_counts'][1] == 4
          assert inv['selection_does_not_use_outcomes'] is True
          assert inv['qualification_launch_ordinal'] == 3
          assert inv['first_prediction_eligible_launch_ordinal'] == 4
          print(json.dumps({'counts':c,'prefix':x['prefix_compute_census'],'manifest_sha256':x['ordered_manifest_sha256']},sort_keys=True))
          PY
      - name: Upload census artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meme-alpha-red-scale-census-v1
          path: /tmp/red-census/
          retention-days: 30
