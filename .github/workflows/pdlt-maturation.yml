name: PDLT outcome maturation

on:
  schedule:
    - cron: '20 0 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  mature:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect free Binance 1h outcome evidence
        run: |
          mkdir -p runtime/pdlt-maturation
          python scripts/data_terminal/binance_spot_owner_collector.py \
            --output-dir runtime/pdlt-maturation/binance-1h --interval 1h --limit 1000
      - name: Mature due PDLT forecasts
        run: |
          python scripts/experiments/pdlt_maturation.py \
            --forecast-root research/framework_memory/forecast_memory/pdlt \
            --binance-owner runtime/pdlt-maturation/binance-1h/owner_snapshot.json \
            --output-root research/framework_memory/outcome_memory/pdlt | tee runtime/pdlt-maturation/summary.json
      - name: Commit matured outcomes with verified readback
        shell: bash
        run: |
          git config user.name framework-pdlt-bot
          git config user.email framework-pdlt-bot@users.noreply.github.com
          git add research/framework_memory/outcome_memory/pdlt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "pdlt: mature probabilistic outcomes ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt*5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdlt-maturation-${{ github.run_id }}
          path: runtime/pdlt-maturation/
          retention-days: 30
