name: Framework Learning Operations

on:
  schedule:
    - cron: '5 3 * * 1-5'
      timezone: 'Europe/Copenhagen'
    - cron: '20 3 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/learning/m6_warning_event_outcomes.py'
      - 'scripts/learning/edge001_tsunami_feature_ledger.py'
      - 'scripts/research/edge_compound_governor.py'
      - 'scripts/research/edge001_144_variant_pit_harness.py'
      - '06_RESEARCH_LAB/high_value_edge_research/EDGE-001_TSUNAMI/144_VARIANT_PIT_TOURNAMENT_PREREG_v1.md'
      - 'tests/learning/test_m6_warning_event_outcomes.py'
      - 'tests/learning/test_edge001_tsunami_feature_ledger.py'
      - 'tests/research/test_edge_compound_governor.py'
      - 'scripts/research/task2_protection_synthetic_v1.py'
      - 'tests/research/test_task2_protection_synthetic_v1.py'
      - 'scripts/research/task2_archive_price_only_stress_v1.py'
      - 'tests/research/test_task2_archive_price_only_stress_v1.py'
      - 'scripts/research/task2_matched_windows_v1.py'
      - 'tests/research/test_task2_matched_windows_v1.py'
      - 'scripts/research/task2_cfgi_capture_clock_audit_v1.py'
      - 'tests/research/test_task2_cfgi_capture_clock_audit_v1.py'
      - 'scripts/research/task2_hourly_source_window_clocks_v1.py'
      - 'tests/research/test_task2_hourly_source_window_clocks_v1.py'
      - 'scripts/learning/t6_rotation_survival.py'
      - 'tests/learning/test_t6_rotation_survival.py'
      - '.github/workflows/framework-learning-operations.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'framework-main-writer' }}
  queue: max
  cancel-in-progress: false

jobs:
  validate_edge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Edge deterministic owners
        run: |
          python -m py_compile scripts/learning/m6_warning_event_outcomes.py scripts/learning/edge001_tsunami_feature_ledger.py scripts/research/edge_compound_governor.py
      - name: Run EDGE-001 and M6 integrity regressions
        run: |
          python -m unittest tests.learning.test_m6_warning_event_outcomes tests.learning.test_edge001_tsunami_feature_ledger tests.research.test_edge_compound_governor -v
          python scripts/research/edge001_144_variant_pit_harness.py --self-test
          python -m unittest discover -s tests/research -p 'test_task2_protection_synthetic_v1.py' -v
      - name: Task2 archived price-only 1152-cell ex-post stress, research only
        run: |
          python -m unittest tests.research.test_task2_archive_price_only_stress_v1 -v
          python scripts/research/task2_archive_price_only_stress_v1.py --output /tmp/task2_price_only_dev.json > /tmp/task2_price_only_stdout.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/task2_price_only_dev.json'))
          assert x['contract']=='TASK2_PRICE_ONLY_ARCHIVE_STRESS_v1'
          assert x['era_cells_configured']==1152
          assert len(x['price_eras'])==2
          assert x['source_preflight']['cfgi']['market_hourly_slots']==0
          assert x['source_preflight']['cfgi']['original_vendor_first_publication_certified'] is False
          assert x['CFGI_predictive_edge_tested'] is False
          assert x['forecast_model_tested'] is False
          assert x['counterfactual_fill_certified'] is False
          assert x['holdout_untouched'] is False
          assert x['candidate_winner_selected'] is False
          print('TASK2_ARCHIVE_STRESS_ENGINE_PASS', {k:{'assessed_cells':v['assessed_cells'],'segments':v['price_segments'],'source_hours':v['sum_of_segment_hours'],'skipped_cells':v['skipped_cells'],'triggered_cells':v['cells_triggering_illustrative_trim'],'positive_vs_hold_cells_descriptive':v['cells_positive_vs_hold_descriptive']} for k,v in x['price_eras'].items()})
          print('NO_FORECAST_OR_CFGI_EDGE_EVALUATED')
          PY
      - name: Retain Task2 aggregate research-only stress receipt (PR artifact)
        uses: actions/upload-artifact@v4
        with:
          name: task2-price-only-expost-stress-${{ github.run_id }}
          path: /tmp/task2_price_only_dev.json
          retention-days: 7
          if-no-files-found: error
      - name: Task2 matched fixed 14-day price-only windows and adversarial controls
        run: |
          python -m unittest tests.research.test_task2_matched_windows_v1 -v
          python -m scripts.research.task2_matched_windows_v1 --output /tmp/task2_matched_fixed14d.json > /tmp/task2_matched_fixed14d_stdout.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/task2_matched_fixed14d.json'))
          assert x['contract']=='TASK2_MATCHED_FIXED_WINDOWS_PRICE_ONLY_v1'
          assert x['window_hours']==336 and x['warmup_hours']==48
          assert x['claim_of_compass_accuracy'] is False
          assert x['claim_of_cfgi_edge'] is False
          assert x['claim_of_out_of_sample_edge'] is False
          assert x['executable_after_cost_fill_verified'] is False
          assert x['chosen_best_parameter'] is None
          for era,v in x['eras'].items():
              n=v['fixed_full_14d_windows']
              assert n>0 and v['complete_window_comparisons']==n*576
              assert v['claimed_independent_shock_families']==0
              assert len(v['cost_scenarios'])==4
              for c in v['cost_scenarios']:
                  assert c['comparisons']==n*144
                  assert c['no_signal']+c['sale_attempts']==c['comparisons']
                  assert c['better_than_hold']+c['worse_than_hold']+c['equal_to_hold']==c['comparisons']
              print('TASK2_MATCHED_WINDOW_ERA_PASS',era,'windows',n,
                    'zero_cost',v['cost_scenarios'][0],
                    'high_cost',v['cost_scenarios'][-1])
          print('TASK2_NO_COMPASS_CFGI_PIT_OR_TRADING_CLAIM')
          PY
      - name: Retain Task2 fixed-window aggregate receipt (PR artifact)
        uses: actions/upload-artifact@v4
        with:
          name: task2-fixed14d-expost-${{ github.run_id }}
          path: /tmp/task2_matched_fixed14d.json
          retention-days: 7
          if-no-files-found: error
      - name: Task2 CFGI prospective four-hour capture clock audit, metadata only
        run: |
          python -m unittest tests.research.test_task2_cfgi_capture_clock_audit_v1 -v
          python -m scripts.research.task2_cfgi_capture_clock_audit_v1 --out /tmp/task2_cfgi_7d_source_clocks.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/task2_cfgi_7d_source_clocks.json'))
          assert x['contract']=='TASK2_CFGI_4H_CLOCK_READBACK_v1'
          assert x['original_capture_count']==42
          assert x['original_symbol_rows_count']==126
          assert x['source_timeframe']=='4h'
          assert x['declared_field_count']==10
          assert x['maximum_original_symbol_clock_skew_seconds']>=934
          assert x['symbol_clock_skewed_captures']>=1
          assert not x['cfgi_predictive_edge_tested']
          assert not x['compass_predictive_edge_tested']
          assert not x['future_outcomes_used']
          assert not x['market_values_emitted']
          assert not x['authority']['outcome_scoring']
          assert not x['authority']['hypothesis_testing']
          assert not x['authority']['source_provider_first_publication_verified']
          assert not x['original_signal_or_market_rule_changed']
          assert len(x['original_clock_receipts'])==42
          print('TASK2_CFGI_ORIGINAL_42_CAPTURE_CLOCKS_PASS',
                {'captures':x['original_capture_count'],
                 'symbol_receipts':x['original_symbol_rows_count'],
                 'clock_skewed':x['symbol_clock_skewed_captures'],
                 'max_skew_seconds':x['maximum_original_symbol_clock_skew_seconds']})
          PY
      - name: Retain Task2 CFGI clock-only source QA receipt (PR artifact)
        uses: actions/upload-artifact@v4
        with:
          name: task2-cfgi-source-clock-${{ github.run_id }}
          path: /tmp/task2_cfgi_7d_source_clocks.json
          retention-days: 7
          if-no-files-found: error
      - name: Task2 frozen 168 hourly batch-end clock source audit
        run: |
          python -m unittest tests.research.test_task2_hourly_source_window_clocks_v1 -v
          python -m scripts.research.task2_hourly_source_window_clocks_v1 --output /tmp/task2_hourly_batch_window_clock.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/task2_hourly_batch_window_clock.json'))
          assert x['contract']=='TASK2_HOURLY_BATCH_END_CLOCK_AUDIT_v1'
          assert x['original_hour_rows']==168
          assert x['batch_end_after_candle_end_count']==104
          assert x['batch_end_equals_candle_end_count']==64
          assert x['max_batch_end_minus_hour_start_hours']==6
          assert len(x['by_day'])==7
          assert x['source_semantics'].endswith('NOT_DETECTION_OR_VENDOR_FIRST_KNOWN')
          assert x['cfgi_or_compass_edge_tested'] is False
          assert x['values_disclosed'] is False
          assert x['per_row_provider_first_known_certified'] is False
          assert x['before_batch_end_data_available_proven'] is False
          assert x['after_batch_end_data_unavailable_proven'] is False
          print('TASK2_7DAY_SOURCE_BATCH_END_QA_PASS',
                {'rows':x['original_hour_rows'],
                 'batch_end_after_candle_close':x['batch_end_after_candle_end_count'],
                 'max_batch_span_h':x['max_batch_end_minus_hour_start_hours']})
          PY
      - name: Retain Task2 hourly batch-end source metadata receipt (PR artifact)
        uses: actions/upload-artifact@v4
        with:
          name: task2-hourly-source-batch-clock-${{ github.run_id }}
          path: /tmp/task2_hourly_batch_window_clock.json
          retention-days: 7
          if-no-files-found: error
      - name: Run prospective T6 exact-replay regressions (PR only)
        run: python -m unittest tests.learning.test_t6_rotation_survival -v
      - name: Run sensor relationship scientific-evidence fail-closed regressions (PR only)
        run: python -m unittest tests.experiments.test_sensor_relationship_compression -v
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ingest accepted DATA PING packets immutably
        run: |
          mkdir -p research/data_ping_bridge/{inbox,accepted,rejected,processed}
          python scripts/data_ping/accepted_data_ping_bridge.py \
            --inbox research/data_ping_bridge/inbox \
            --accepted-root research/data_ping_bridge/accepted \
            --rejected-root research/data_ping_bridge/rejected \
            --processed-root research/data_ping_bridge/processed \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Capture prospective T8 multi-ping source rows
        run: |
          python -m unittest tests.learning.test_t8_multi_ping_delay_cost -v
          python scripts/learning/t8_multi_ping_delay_cost.py scan \
            --accepted-root research/data_ping_bridge/accepted \
            --output-root research/framework_memory/t8_multi_ping_rows \
            --repo-root .

      - name: Capture prospective T6 rotation-survival observation
        run: |
          python -m unittest tests.learning.test_t6_rotation_survival -v
          POINTER=04_MARKET_LEARNING/entry_signals/auto_market_state/LATEST.json
          CADENCE=03_DAILY_CAPTURE_LOGS/cadence/LATEST.json
          test -f "$POINTER"
          test -f "$CADENCE"
          PACKET=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('04_MARKET_LEARNING/entry_signals/auto_market_state/LATEST.json').read_text())
          assert p['contract']=='AUTO_MARKET_STATE_LATEST_POINTER_v1'
          print(p['packet_path'])
          PY
          )
          test -f "$PACKET"
          python scripts/learning/t6_rotation_survival.py \
            --packet "$PACKET" \
            --cadence "$CADENCE" \
            --output-root research/framework_memory/rotation_survival_forward_rows
      - name: Capture prospective T5 FNP source rows
        run: |
          python -m unittest tests.learning.test_fnp_cumulative_forward -v
          python scripts/learning/fnp_cumulative_forward.py scan \
            --t2-receipt-root research/api_agent/coordination \
            --t2-maturity-root research/api_agent/coordination \
            --output-root research/framework_memory/fnp_forward_rows \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Capture Farside ETF owner
        continue-on-error: true
        run: |
          mkdir -p runtime/farside-etf
          python scripts/data_terminal/farside_etf_owner.py --output-dir runtime/farside-etf
          STAMP=$(date -u +%Y/%m/%d/%H%M%S)
          DEST="research/etf_owner/${STAMP}"
          mkdir -p "$DEST"
          cp runtime/farside-etf/*.json "$DEST/"
          cp runtime/farside-etf/owner_snapshot.json research/etf_owner/LATEST_FARSIDE_ETF_OWNER.json
      - name: Sync independent experiment execution receipts
        continue-on-error: true
        env:
          EXPERIMENT_BRIDGE_TOKEN: ${{ secrets.EXPERIMENT_BRIDGE_TOKEN }}
        run: |
          mkdir -p research/experiment_lifecycle/receipts
          python scripts/experiments/sync_experiment_receipts.py \
            --github-repo Donh91/Eksperimenter-framework- \
            --github-path experiment_bridge/LATEST_EXECUTION_RECEIPT_MANIFEST.json \
            --github-ref main \
            --receipt-root research/experiment_lifecycle/receipts \
            --sync-output research/experiment_lifecycle/LATEST_EXPERIMENT_RECEIPT_SYNC.json \
            --max-source-age-hours 24 \
            --allow-unavailable
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/experiment_lifecycle/LATEST_EXPERIMENT_RECEIPT_SYNC.json')
          row=json.loads(p.read_text())
          if row.get('failure_class')=='PRIVATE_SOURCE_AUTH_REQUIRED':
              print('::warning::Experiment execution plane is not publicly readable. Optional EXPERIMENT_BRIDGE_TOKEN may provide read-only fallback if the repo is private again.')
          print('EXPERIMENT_RECEIPT_SYNC', row.get('sync_state'), row.get('status'), row.get('source_transport'), row.get('failure_class'))
          PY
      - name: Resolve exact settlement evidence
        run: |
          mkdir -p research/framework_memory/{forecast_memory,outcome_memory,settlement_evidence,settlement_raw,settlement_bindings}
          python scripts/learning/forecast_settlement_price_owner.py \
            --forecast-root research/framework_memory/forecast_memory \
            --output-root research/framework_memory/settlement_evidence \
            --raw-root research/framework_memory/settlement_raw
      - name: Mature exact-settlement forecasts against forecast-bound evidence
        run: |
          python scripts/learning/mature_exact_settlement_forecasts.py \
            --forecast-root research/framework_memory/forecast_memory \
            --settlement-evidence-root research/framework_memory/settlement_evidence \
            --output-root research/framework_memory/outcome_memory \
            --binding-root research/framework_memory/settlement_bindings \
            --repo-root . \
            --max-evidence-lag-hours 24
      - name: Build non-exact legacy maturation subset
        run: |
          python scripts/learning/build_non_exact_forecast_subset.py \
            --forecast-root research/framework_memory/forecast_memory \
            --output-root runtime/non-exact-forecast-subset
      - name: Mature remaining due outcomes under strict legacy contract
        run: |
          python scripts/learning/outcome_maturation_engine.py \
            --forecast-root runtime/non-exact-forecast-subset \
            --evidence-root 03_DAILY_CAPTURE_LOGS/captures \
            --output-root research/framework_memory/outcome_memory \
            --max-evidence-lag-hours 24
      - name: Replay superseded legacy price outcomes append-only
        continue-on-error: true
        run: |
          mkdir -p research/framework_memory/{outcome_replay_evidence,outcome_replay_raw,outcome_replays,outcome_supersession}
          python scripts/learning/replay_superseded_forecast_outcomes.py \
            --forecast-root research/framework_memory/forecast_memory \
            --original-outcome-root research/framework_memory/outcome_memory \
            --evidence-root research/framework_memory/outcome_replay_evidence \
            --raw-root research/framework_memory/outcome_replay_raw \
            --replay-outcome-root research/framework_memory/outcome_replays \
            --overlay-root research/framework_memory/outcome_supersession \
            --repo-root . \
            --max-new-replays 10 \
            | tee research/framework_memory/outcome_supersession/LATEST_REPLAY_RUN.json
      - name: Validate Action Compass receipts and mature continuous sidecars
        run: |
          mkdir -p research/framework_memory/{action_compass_receipts,action_compass_outcomes}
          python scripts/learning/action_compass_accountability.py validate-repository \
            --receipt-root research/framework_memory/action_compass_receipts \
            --repo-root .
          python scripts/learning/action_compass_accountability.py mature \
            --receipt-root research/framework_memory/action_compass_receipts \
            --evidence-root 03_DAILY_CAPTURE_LOGS/captures \
            --output-root research/framework_memory/action_compass_outcomes \
            --repo-root . \
            --max-terminal-lag-hours 24
      - name: Build descriptive exit-warning calibration
        run: |
          # Run in module mode so repo root stays on sys.path; direct script mode
          # sets sys.path to tests/learning and breaks imports from scripts/.
          python -m unittest tests.learning.test_action_compass_exit_calibration -q
          python scripts/learning/action_compass_exit_calibration.py \
            --repo-root . \
            --outcome-root 04_MARKET_LEARNING/handlekompas/official/outcomes \
            --output research/framework_memory/action_compass_calibration/LATEST_EXIT_WARNING_CALIBRATION.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/framework_memory/action_compass_calibration/LATEST_EXIT_WARNING_CALIBRATION.json')
          row=json.loads(p.read_text())
          print('PROTECTION_CALIBRATION', row.get('status'), 'eligible=', row.get('eligible_series_row_count'), 'warnings=', row.get('warning_series_row_count'), 'excluded=', row.get('excluded_outcome_counts'))
          PY
      - name: Build prospective M6 warning-event research outcomes
        run: |
          python -m unittest tests.learning.test_m6_warning_event_outcomes -q
          python scripts/learning/m6_warning_event_outcomes.py \
            --repo-root . \
            --output research/framework_memory/m6_warning_events/LATEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('research/framework_memory/m6_warning_events/LATEST.json').read_text())
          assert row['warning_is_sell'] is False
          assert row['live_exit_rule']=='NONE'
          print('M6_WARNING_EVENTS', 'events=', row['event_count'], 'provisional_families=', row['provisional_independent_family_count'])
          PY
      - name: Capture EDGE-001 Tsunami point-in-time feature ledger
        run: |
          python -m unittest tests.learning.test_edge001_tsunami_feature_ledger -q
          python scripts/learning/edge001_tsunami_feature_ledger.py \
            --repo-root . \
            --output research/framework_memory/edge001_tsunami_features/LATEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('research/framework_memory/edge001_tsunami_features/LATEST.json').read_text())
          assert row['outcome_joined'] is False
          assert row['warning_is_sell'] is False
          assert row['live_exit_rule']=='NONE'
          print('EDGE001_TSUNAMI_FEATURES', 'rows=', row['row_count'], 'collection_only=', row['collection_only'])
          PY
      - name: Evaluate deterministic Edge Compound Governor
        run: |
          python -m unittest tests.research.test_edge_compound_governor -q
          python scripts/research/edge_compound_governor.py \
            --repo-root . \
            --output research/framework_memory/edge_compound_governor/LATEST.json \
            --history-root research/framework_memory/edge_compound_governor/history
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/framework_memory/edge_compound_governor/LATEST.json')
          if p.exists():
              row=json.loads(p.read_text())
              assert row['authority']['portfolio_action'] is False
              assert row['external_routing']['automatic_dispatch'] is False
              assert row['rules']['warning_is_sell'] is False
              assert row['rules']['live_exit_rule']=='NONE'
              print('EDGE_COMPOUND_GOVERNOR', row['decision'], row['semantic_fingerprint'][:16], row['external_routing'])
          else:
              print('EDGE_COMPOUND_GOVERNOR NO_PERSISTED_DELTA')
          PY
      - name: Build DEL segment-return research foundation
        run: |
          python -m unittest tests.learning.test_segment_return_foundation -q
          python scripts/learning/segment_return_foundation.py \
            --snapshot-root 03_DAILY_CAPTURE_LOGS/breadth_rich \
            --output-json research/decision_economics/LATEST_SEGMENT_RETURN_FOUNDATION.json \
            --output-csv research/decision_economics/SEGMENT_RETURN_RANK_PROXY_RESEARCH.csv
      - name: Refresh experiment registry after receipt sync and maturation
        run: |
          mkdir -p research/experiment_lifecycle/{candidates,observations,receipts}
          python scripts/experiments/rebuild_experiment_registry.py \
            --candidate-root research/experiment_lifecycle/candidates \
            --observation-root research/experiment_lifecycle/observations \
            --forecast-root research/framework_memory/forecast_memory \
            --outcome-root research/framework_memory/outcome_memory \
            --receipt-root research/experiment_lifecycle/receipts \
            --output research/experiment_lifecycle/LATEST_EXPERIMENT_REGISTRY.json
      - name: Regenerate research-only sensor relationships from current experiment registry
        run: |
          python -m unittest tests.experiments.test_sensor_relationship_compression -q
          python scripts/experiments/sensor_relationship_compression.py \
            --registry research/experiment_lifecycle/LATEST_EXPERIMENT_REGISTRY.json \
            --historical-audit 06_RESEARCH_LAB/audit_summaries/2026-07-22__public-repo-methods-closed-lab-audit__shadow.md \
            --output 06_RESEARCH_LAB/current_relationship_compression/CURRENT_SENSOR_RELATIONSHIP_COMPRESSION.json
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path("research/experiment_lifecycle/LATEST_EXPERIMENT_REGISTRY.json").read_text())
          readout = json.loads(Path("06_RESEARCH_LAB/current_relationship_compression/CURRENT_SENSOR_RELATIONSHIP_COMPRESSION.json").read_text())
          assert registry["contract"] == "EXPERIMENT_LIFECYCLE_REGISTRY_v1"
          assert registry["outcome_count_contract"] == "EXPERIMENT_OUTCOME_COUNTS_v2"
          assert readout["generated_from_registry_at_utc"] == registry["generated_at_utc"]
          assert readout["authority"]["research_only"] is True
          assert readout["authority"]["canonical_market_state"] is False
          assert readout["authority"]["portfolio_action"] is False
          assert all(row["current_prospective_validation"] is False for row in readout["prospective_rows"])
          assert all(row["sample_status"]["prospective_skill_evidence"] == "NOT_ADMITTED" for row in readout["prospective_rows"])
          print("SENSOR_RELATIONSHIP_NATURAL_READBACK", "registry_utc=", registry["generated_at_utc"], "sensor_rows=", len(readout["prospective_rows"]), "current_validation_true=", 0)
          PY
      - name: Build architecture and automation health
        run: |
          python scripts/health/build_architecture_health.py \
            --repo-root . \
            --json-output research/architecture_health/LATEST_ARCHITECTURE_HEALTH.json \
            --md-output research/architecture_health/LATEST_ARCHITECTURE_HEALTH.md
          # This job has no actions:read token, so the automation report built
          # here is static-only (every workflow WORKFLOW_NOT_REGISTERED_OR_API_UNAVAILABLE).
          # Keep it as a non-canonical runtime check; the canonical
          # LATEST_AUTOMATION_HEALTH is owned by automation-production-health.yml.
          mkdir -p runtime/automation-health-static
          python scripts/health/build_automation_health.py \
            --workflow-root .github/workflows \
            --json-output runtime/automation-health-static/AUTOMATION_HEALTH_STATIC.json \
            --md-output runtime/automation-health-static/AUTOMATION_HEALTH_STATIC.md
      - name: Build downstream integration manifest
        run: |
          python scripts/orchestration/build_framework_handoff_manifest.py \
            --repo-root . \
            --output research/framework_handoffs/LATEST_FRAMEWORK_HANDOFF_MANIFEST.json
      - name: Build deterministic data-consumer index
        run: |
          python scripts/orchestration/build_data_consumer_index.py \
            --repo-root . \
            --output research/framework_handoffs/LATEST_DATA_CONSUMER_INDEX.json
      - name: Build experiment-yield shadow observation
        run: |
          python scripts/experiments/build_experiment_yield_shadow.py \
            --registry research/experiment_lifecycle/LATEST_EXPERIMENT_REGISTRY.json \
            --consumer-index research/framework_handoffs/LATEST_DATA_CONSUMER_INDEX.json \
            --output research/experiment_lifecycle/LATEST_EXPERIMENT_YIELD_SHADOW.json
      - name: Commit compact outputs and verify main readback
        shell: bash
        run: |
          git config user.name 'framework-operations-bot'
          git config user.email 'framework-operations-bot@users.noreply.github.com'
          git add research/data_ping_bridge research/etf_owner research/framework_memory research/experiment_lifecycle research/architecture_health research/framework_handoffs research/decision_economics 06_RESEARCH_LAB/current_relationship_compression/CURRENT_SENSOR_RELATIONSHIP_COMPRESSION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: update integrated learning and experiment receipts ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-learning-operations-${{ github.run_id }}
          path: runtime/
          retention-days: 7
          if-no-files-found: ignore
