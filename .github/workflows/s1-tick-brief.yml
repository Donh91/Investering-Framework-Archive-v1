name: S1 tick brief

# S1_TICK_BRIEF_V1: GitHub prepares the S1 tick (00_FMOS/S1/TICK.md). Evidence only, never authority.
# ONE build an hour. The job token's 1,000 API requests an hour are shared by every workflow of this repository, and a
# build is capped at 300 calls (a build that hits the cap publishes an INCOMPLETE brief).
# due:     read-only token. A workflow_run or push event is only a freshness fallback for a MISSED cron event (a
#          push to main still happens when GitHub fires no scheduled workflow): it builds only when the published
#          brief is older than 55 minutes AND this workflow had no cron run in the last 50 minutes and no build in
#          the last 60. One or two API calls per event as a rule, five at most. No data of the triggering run or
#          push is ever used.
# build:   read-only token. Reads GitHub natively and parses PR heads as data; it never runs PR code. It also decides:
#          S1_DECISION_V1 (scripts/governance/s1_decision_v1.py, pure functions) is the ONE next action of the lane.
# publish: issues:write only. Writes the one brief issue (label s1-tick-brief): the decision block, then the brief.
# execute: AGENTS.md section 0.2i ("S1 is GitHub"). Runs only on schedule and workflow_dispatch, only main's own
#          scripts, never PR code. It re-reads every fact of the decision's one action natively and acts ONLY when the
#          switch 00_FMOS/S1/REVIEWED_MERGE_LANE.json on main reads "executor": "LIVE" (missing or unknown: OFF) and
#          the repository variable S1_EXECUTOR_HOLD is empty. In this file it holds a READ-ONLY token: SHADOW can
#          print what it would do, and nothing here can merge or comment. Going LIVE is a separate owner-present PR
#          that gives this ONE job contents: write, pull-requests: write and issues: write and sets the switch.
# No secrets anywhere.

on:
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Hourly Sequence Capture', 'Native Market Recovery', 'Entry Signal Ledger', 'Native Handlekompas']
    types: [completed]
    branches: [main]
  push:
    branches: [main]

permissions: {}

# The build job is serialised in one group. The due job coalesces per event kind (see there), so a fallback run
# that is not due can never replace a pending cron build; a run that reaches build is always a real build.

jobs:
  due:
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'Donh91/Investering-Framework-Archive-v1' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Coalescing: a newer event of the same kind cancels an older due check that is still running (a push never
    # cancels the cron run's check: the group is per event kind).
    concurrency:
      group: s1-tick-brief-due-${{ github.event_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Is a new brief due
        id: due
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -e
          due="$(python scripts/governance/s1_tick_brief_v1.py due)"
          echo "due=$due" >> "$GITHUB_OUTPUT"
  build:
    needs: due
    if: github.ref == 'refs/heads/main' && needs.due.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: s1-tick-brief
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      brief: ${{ steps.build.outputs.brief }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the YAML parser (one wheel, pinned by hash)
        run: |
          printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/requirements.txt"
          python -m pip install --disable-pip-version-check --no-deps --only-binary :all: --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Build the brief from native reads
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -e
          # asked again AFTER the wait in the concurrency group: the build that ran meanwhile wrote a new brief
          again="$(python main/scripts/governance/s1_tick_brief_v1.py due)"
          if [ "$again" != "true" ]; then exit 0; fi
          python main/scripts/governance/s1_tick_brief_v1.py build "$GITHUB_WORKSPACE/main" "$RUNNER_TEMP/head" "$RUNNER_TEMP/brief.md"
          echo "brief=$(base64 -w0 "$RUNNER_TEMP/brief.md")" >> "$GITHUB_OUTPUT"
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.brief != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish the brief issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRIEF_B64: ${{ needs.build.outputs.brief }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          printf '%s' "$BRIEF_B64" | base64 -d > "$RUNNER_TEMP/brief.md"
          python scripts/governance/s1_tick_brief_v1.py publish "$RUNNER_TEMP/brief.md"
  execute:
    needs: [build, publish]
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'Donh91/Investering-Framework-Archive-v1' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.build.outputs.brief != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The brief is valid when due, build and publish succeed, and its readers (TICK.md T2, and the next build's C1b
    # anchor) require a SUCCESSFUL run. A failure of this job must therefore never fail the run: it shows as a failed
    # job, and an intent it left behind is settled by the next run. The job is not silent for that: the script writes
    # its result lines to the job summary and exits non-zero (a failed JOB in a green run) when an intent is left
    # without its outcome, a readback does not match, a read stops after a write, or anything unexpected is raised.
    continue-on-error: true
    # One executor at a time, never cancelled half way: an intent with no outcome is settled by the next run.
    concurrency:
      group: s1-executor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/governance
            00_FMOS
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the YAML parser (one wheel, pinned by hash; main's push filters are re-read here, fix round 5 D05)
        run: |
          printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/requirements.txt"
          python -m pip install --disable-pip-version-check --no-deps --only-binary :all: --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Execute the one decided action (re-verified natively; writes only when the switch on main is LIVE)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRIEF_B64: ${{ needs.build.outputs.brief }}
          S1_EXECUTOR_HOLD: ${{ vars.S1_EXECUTOR_HOLD }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          printf '%s' "$BRIEF_B64" | base64 -d > "$RUNNER_TEMP/brief.md"
          python scripts/governance/s1_executor_v1.py execute "$RUNNER_TEMP/brief.md"
