# framework-lifecycle: RETIRED
# framework-lifecycle-reason: PROVIDER_TERMINAL_MARKET_HISTORY_UNAVAILABLE_NO_ADDITIONAL_PAID_RETRY
# framework-lifecycle-since: 2026-08-21T09:30:00Z
name: Historical Altseason CFGI Reservation

on:
  workflow_run:
    workflows: ['Historical Altseason Free Publish']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-altseason-cfgi-reservation-retired
  cancel-in-progress: false

jobs:
  retired-terminal-noop:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify ratified terminal provider state and forbid paid reservation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          terminal_path=Path('00_ARCHIVE_CONTROL/research_runtime/CFGI_MARKET_PROVIDER_TERMINAL_RECEIPT.json')
          ledger_path=Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json')
          terminal=json.loads(terminal_path.read_text())
          ledger=json.loads(ledger_path.read_text())

          assert terminal['contract']=='CFGI_MARKET_PROVIDER_TERMINAL_RECEIPT_v1', terminal
          assert terminal['status']=='TERMINAL_PROVIDER_NO_HISTORICAL_ROWS', terminal
          assert terminal['no_additional_paid_retry_authorized'] is True, terminal
          assert terminal['no_fill'] is True, terminal
          assert terminal['no_interpolation'] is True, terminal
          assert terminal['no_proxy_substitution'] is True, terminal
          assert terminal['input_fingerprint_sha256']==ledger['input_fingerprint_sha256'], (terminal,ledger)
          assert ledger['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER_v2', ledger
          assert ledger['automatic_retry_after_failure'] is False, ledger
          print('CFGI_RESERVATION_RETIRED_TERMINAL_NOOP',terminal['input_fingerprint_sha256'])
          PY

      - name: Confirm no reservation, provider dispatch or secret access
        run: |
          echo 'CFGI_RESERVATION_RETIRED_NO_PAID_RETRY_PASS'
