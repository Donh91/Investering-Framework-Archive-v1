name: Source Provenance Recovery Loop

on:
  schedule:
    - cron: '5 7 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  source-recovery-loop:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/research/validate_source_provenance_recovery_controller.py
      - run: python scripts/research/source_provenance_recovery_controller.py
      - name: Commit research-only source recovery state with verified readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          git add 00_ARCHIVE_CONTROL/source_recovery_controller_v1/STATE.json \
                  00_ARCHIVE_CONTROL/source_recovery_controller_v1/ACTION_LEDGER.csv \
                  00_ARCHIVE_CONTROL/source_recovery_controller_v1/research_actions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: advance autonomous source provenance recovery"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
