name: Meme Alpha Ian G2-G3 Research

on:
  push:
    branches:
      - agent/task-alpha-g2g3
    paths:
      - 'research/api_agent/meme_alpha/experiments/ian_g2g3_backfill_v1.py'
      - '.github/workflows/meme-alpha-ian-g2g3-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empirical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=17,<22' 'duckdb>=1.1,<2' 'scikit-learn>=1.5,<2'

      - name: Download pinned public source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ian05012
          BASE='https://raw.githubusercontent.com/ian05012/solana-memecoin-dataset/7070d00e1e4492f8604d988549d91785cc5f43f7/data'
          for f in tokens.parquet trades-000.parquet trades-001.parquet trades-002.parquet trades-003.parquet wallet_funding.parquet; do
            echo "Downloading $f"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 20 "$BASE/$f" -o "/tmp/ian05012/$f"
          done
          ls -lh /tmp/ian05012
          sha256sum /tmp/ian05012/*.parquet | tee /tmp/ian05012/SHA256SUMS

      - name: Execute point-in-time G2 vs G3 test
        run: |
          mkdir -p /tmp/alpha-results
          python research/api_agent/meme_alpha/experiments/ian_g2g3_backfill_v1.py \
            --data-dir /tmp/ian05012 \
            --out-dir /tmp/alpha-results
          cp /tmp/ian05012/SHA256SUMS /tmp/alpha-results/SHA256SUMS

      - name: Emit machine-readable result to log
        if: always()
        run: |
          if [ -f /tmp/alpha-results/ian_g2g3_results_v1.json ]; then
            echo '--- RESULT JSON START ---'
            cat /tmp/alpha-results/ian_g2g3_results_v1.json
            echo '--- RESULT JSON END ---'
          fi

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-alpha-ian-g2g3-v1
          path: /tmp/alpha-results/
          retention-days: 30
