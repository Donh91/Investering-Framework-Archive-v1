name: Adaptive Gap Validation Gate

on:
  pull_request:
    paths:
      - 'research/evidence_gap/ADAPTIVE_EVIDENCE_GAP_VALIDATION_POLICY_v1_1.json'
      - 'scripts/api_agent/adaptive_decision_miss_auditor.py'
      - 'scripts/api_agent/decision_miss_registry.py'
      - 'scripts/api_agent/evidence_gap_validation_auditor.py'
      - 'scripts/api_agent/apply_evidence_gap_validation.py'
      - 'tests/api_agent/test_adaptive_gap_validation_v1_1.py'
      - '.github/workflows/adaptive-decision-miss-validation.yml'
      - '.github/workflows/adaptive-gap-validation-gate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile adaptive learning scripts
        run: python -m py_compile scripts/api_agent/adaptive_decision_miss_auditor.py scripts/api_agent/decision_miss_registry.py scripts/api_agent/evidence_gap_validation_auditor.py scripts/api_agent/apply_evidence_gap_validation.py
      - name: Run bounded regression tests
        run: python -m pytest -q tests/api_agent/test_adaptive_gap_validation_v1_1.py tests/api_agent/test_adaptive_evidence_gap.py
