name: One-Shot Master Monday W32 Final
# retry 4: ETF is now durable; rerun only corrected weekly context/calibration + readiness gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-master-monday-w32-final.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-final-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Dispatch and await corrected weekly calibration and publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run weekly-api-calibration-shadow.yml --ref main
          sleep 5
          RUN_ID=$(gh run list --workflow weekly-api-calibration-shadow.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          echo "WEEKLY_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status --interval 10

      - name: Refresh final Master Monday readiness gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run master-monday-remaining-gaps.yml --ref main
          sleep 5
          RUN_ID=$(gh run list --workflow master-monday-remaining-gaps.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          echo "GATE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status --interval 10

      - name: Record dispatched run IDs
        run: |
          printf 'WEEKLY=%s\nGATE=%s\n' "$WEEKLY_RUN_ID" "$GATE_RUN_ID"
