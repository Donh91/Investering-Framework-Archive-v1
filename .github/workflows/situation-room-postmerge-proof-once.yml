name: Situation Room Post-Merge Proof Once

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  dispatch-proof:
    if: contains(github.event.head_commit.message, '[SR638_PROOF]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current-main Situation Room Owner Live Gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run situation-room-owner-live-gate.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Dispatch current-main Situation Room production discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run situation-room-daily-static.yml --repo "$GITHUB_REPOSITORY" --ref main
