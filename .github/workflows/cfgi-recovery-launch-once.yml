name: Historical Altseason CFGI Recovery Launch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfgi-recovery-launch-once.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: historical-altseason-cfgi-recovery-launch-once
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify owner-authorized recovery contract and cumulative budget
        env:
          EXPECTED_FINGERPRINT: 6106f96285a66f03e324595b68c1777627f4d83e5e70dc6c64d9b1022e544a8f
        run: |
          set -euo pipefail
          python scripts/historical_lab/cfgi_recovery_budget_guard.py | tee /tmp/recovery_budget.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          fp=os.environ['EXPECTED_FINGERPRINT']
          ledger=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json').read_text())
          reservation=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION.json').read_text())
          budget=json.loads(Path('/tmp/recovery_budget.json').read_text())
          assert ledger['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER_v1'
          assert reservation['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION_v1'
          assert fp==ledger['input_fingerprint_sha256']==reservation['input_fingerprint_sha256']==budget['input_fingerprint_sha256']
          assert ledger['owner_authorized_recovery_attempts']==1
          assert ledger['automatic_retry_after_failure'] is False
          assert ledger['cumulative_actual_credits_used']==5259
          assert len(ledger['attempts'])==1 and ledger['attempts'][0]['run_id']==32419588422
          assert budget['status']=='PASS' and not budget['blockers']
          print('ONE_SHOT_RECOVERY_PRELAUNCH_PASS',fp,budget['projected_cumulative_credits'],budget['projected_credits_remaining'])
          PY

      - name: Refuse launch if any post-failure workflow-dispatch run already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow historical-altseason-cfgi-enrichment.yml --limit 20 --json databaseId,event,createdAt,status,conclusion,url > /tmp/runs.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          runs=json.loads(Path('/tmp/runs.json').read_text())
          cutoff=datetime.fromisoformat('2026-08-20T21:28:58+00:00')
          newer=[]
          for r in runs:
              if r.get('event')!='workflow_dispatch':
                  continue
              created=datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))
              if created>cutoff:
                  newer.append(r)
          if newer:
              raise SystemExit('RECOVERY_LAUNCH_REFUSED_EXISTING_POST_FAILURE_RUN '+json.dumps(newer,sort_keys=True))
          print('NO_POST_FAILURE_RECOVERY_RUN_EXISTS')
          PY

      - name: Dispatch exactly one recovery run
        env:
          GH_TOKEN: ${{ github.token }}
          FP: 6106f96285a66f03e324595b68c1777627f4d83e5e70dc6c64d9b1022e544a8f
        run: |
          set -euo pipefail
          gh workflow run historical-altseason-cfgi-enrichment.yml --repo "$GITHUB_REPOSITORY" --ref main -f fingerprint="$FP"
          sleep 3
          gh run list --repo "$GITHUB_REPOSITORY" --workflow historical-altseason-cfgi-enrichment.yml --limit 5 --json databaseId,event,createdAt,status,conclusion,url | tee /tmp/post_dispatch_runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/post_dispatch_runs.json').read_text())
          dispatched=[r for r in rows if r.get('event')=='workflow_dispatch' and int(r['databaseId'])!=32419588422]
          assert dispatched,'dispatch accepted but no new workflow_dispatch run visible'
          print('ONE_SHOT_RECOVERY_DISPATCH_CONFIRMED',dispatched[0]['databaseId'],dispatched[0]['status'],dispatched[0]['url'])
          PY
