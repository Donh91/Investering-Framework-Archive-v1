name: Historical Altseason CFGI Recovery Launch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfgi-recovery-launch-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify owner-authorized recovery contract and cumulative budget
        env:
          EXPECTED_FINGERPRINT: 6106f96285a66f03e324595b68c1777627f4d83e5e70dc6c64d9b1022e544a8f
        run: |
          set -euo pipefail
          python scripts/historical_lab/cfgi_recovery_budget_guard.py | tee /tmp/recovery_budget.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          fp=os.environ['EXPECTED_FINGERPRINT']
          ledger=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json').read_text())
          reservation=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION.json').read_text())
          budget=json.loads(Path('/tmp/recovery_budget.json').read_text())
          assert ledger['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER_v1'
          assert reservation['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION_v1'
          assert fp==ledger['input_fingerprint_sha256']==reservation['input_fingerprint_sha256']==budget['input_fingerprint_sha256']
          assert ledger['owner_authorized_recovery_attempts']==1
          assert ledger['automatic_retry_after_failure'] is False
          assert ledger['cumulative_actual_credits_used']==5259
          assert len(ledger['attempts'])==1 and ledger['attempts'][0]['run_id']==32419588422
          assert budget['status']=='PASS' and not budget['blockers']
          print('ONE_SHOT_RECOVERY_PRELAUNCH_PASS',fp,budget['projected_cumulative_credits'],budget['projected_credits_remaining'])
          PY

      - name: Find existing recovery or dispatch exactly once
        id: launch
        env:
          GH_TOKEN: ${{ github.token }}
          FP: 6106f96285a66f03e324595b68c1777627f4d83e5e70dc6c64d9b1022e544a8f
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow historical-altseason-cfgi-enrichment.yml --limit 20 --json databaseId,event,createdAt,status,conclusion,url,headSha > /tmp/runs_before.json
          existing="$(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          rows=json.loads(Path('/tmp/runs_before.json').read_text())
          cutoff=datetime.fromisoformat('2026-08-20T21:28:58+00:00')
          candidates=[]
          for r in rows:
              if r.get('event')!='workflow_dispatch': continue
              created=datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))
              if created>cutoff: candidates.append(r)
          candidates.sort(key=lambda r:r['createdAt'],reverse=True)
          print('' if not candidates else candidates[0]['databaseId'])
          PY
          )"
          if [ -z "$existing" ]; then
            gh workflow run historical-altseason-cfgi-enrichment.yml --repo "$GITHUB_REPOSITORY" --ref main -f fingerprint="$FP"
            sleep 4
            gh run list --repo "$GITHUB_REPOSITORY" --workflow historical-altseason-cfgi-enrichment.yml --limit 10 --json databaseId,event,createdAt,status,conclusion,url,headSha > /tmp/runs_after.json
            action=DISPATCHED_NOW
          else
            cp /tmp/runs_before.json /tmp/runs_after.json
            action=EXISTING_RECOVERY_FOUND
          fi
          ACTION="$action" FP="$FP" python - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          rows=json.loads(Path('/tmp/runs_after.json').read_text())
          cutoff=datetime.fromisoformat('2026-08-20T21:28:58+00:00')
          candidates=[]
          for r in rows:
              if r.get('event')!='workflow_dispatch': continue
              created=datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))
              if created>cutoff: candidates.append(r)
          candidates.sort(key=lambda r:r['createdAt'],reverse=True)
          assert candidates,'no post-failure recovery workflow_dispatch run visible'
          chosen=candidates[0]
          receipt={
            'contract':'HISTORICAL_ALTSEASON_CFGI_RECOVERY_LAUNCH_RECEIPT_v1',
            'input_fingerprint_sha256':os.environ['FP'],
            'owner_authorized_recovery_attempts':1,
            'automatic_retry_after_failure':False,
            'first_failed_paid_run_id':32419588422,
            'launch_action':os.environ['ACTION'],
            'recovery_run':chosen,
          }
          out=Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_RECOVERY_LAUNCH_RECEIPT.json')
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('RECOVERY_RUN_BOUND',chosen['databaseId'],chosen['status'],chosen.get('conclusion'),chosen['url'])
          PY

      - name: Commit bounded recovery launch receipt
        run: |
          set -euo pipefail
          path=00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_RECOVERY_LAUNCH_RECEIPT.json
          git config user.name framework-research-bot
          git config user.email framework-research-bot@users.noreply.github.com
          git add "$path"
          if git diff --cached --quiet; then
            echo 'RECOVERY_LAUNCH_RECEIPT_UNCHANGED'
            exit 0
          fi
          git commit -m "research: bind authorized CFGI recovery run"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          git show origin/main:"$path" >/tmp/remote_receipt.json
          test -s /tmp/remote_receipt.json
          echo 'RECOVERY_LAUNCH_RECEIPT_REMOTE_READBACK_PASS'
