name: Historical Altseason CFGI Recovery Launch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfgi-recovery-launch-once.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: historical-altseason-cfgi-recovery-launch-once
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded MARKET-only gap-fill authorization and budget
        run: |
          set -euo pipefail
          python scripts/historical_lab/cfgi_recovery_budget_guard.py | tee /tmp/budget.json
          python - <<'PY'
          import json
          from pathlib import Path
          fp='6106f96285a66f03e324595b68c1777627f4d83e5e70dc6c64d9b1022e544a8f'
          ledger=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json').read_text()); auth=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_MARKET_GAPFILL_AUTHORIZATION.json').read_text()); budget=json.loads(Path('/tmp/budget.json').read_text())
          assert ledger['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER_v2' and ledger['cumulative_actual_credits_used']==10518 and ledger['owner_authorized_market_gapfill_attempts']==1 and ledger['automatic_retry_after_failure'] is False
          assert auth['contract']=='HISTORICAL_ALTSEASON_CFGI_MARKET_GAPFILL_AUTHORIZATION_v1' and auth['owner_authorized'] is True and auth['allowed_symbols']==['MARKET'] and auth['forbidden_repurchase_symbols']==['BTC','ETH'] and auth['max_attempts']==1 and auth['automatic_retry_after_failure'] is False
          assert fp==ledger['input_fingerprint_sha256']==auth['input_fingerprint_sha256']==budget['input_fingerprint_sha256']; assert budget['status']=='PASS' and not budget['blockers']; assert budget['plan'] in {'MARKET_ONLY_GAPFILL','NO_FURTHER_PAID_CALL_REQUIRED'}
          print('MARKET_GAPFILL_PRELAUNCH_PASS',budget['plan'],budget['projected_cumulative_credits'],budget['projected_credits_remaining'])
          PY
      - name: Resolve or dispatch exactly one v3 MARKET gap-fill run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          FP: 6106f96285a66f03e324595b68c1777627f4d83e5e70dc6c64d9b1022e544a8f
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          from pathlib import Path
          p=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/RESEARCH_READINESS_MANIFEST.json')
          if p.exists():
              m=json.loads(p.read_text())
              if m.get('contract')=='RESEARCH_READINESS_MANIFEST_v3' and m.get('readiness_verdict')=='PASS' and not m.get('blockers') and all(int((m.get('cfgi',{}).get('symbol_coverage',{}).get(s) or {}).get('asof_available_slots') or 0)>0 for s in ['MARKET','BTC','ETH']):
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          then
            echo 'FINAL_V3_ALREADY_COMPLETE - no dispatch'
            echo 'receipt_required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          activation_time="$(git log -1 --format=%cI -- .github/workflows/cfgi-recovery-launch-once.yml)"
          test -n "$activation_time"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow historical-altseason-cfgi-enrichment.yml --limit 30 --json databaseId,event,createdAt,status,conclusion,url,headSha > /tmp/runs.json
          existing="$(ACTIVATION_TIME="$activation_time" python - <<'PY'
          import json, os
          from datetime import datetime
          rows=json.load(open('/tmp/runs.json')); cutoff=datetime.fromisoformat(os.environ['ACTIVATION_TIME'].replace('Z','+00:00'))
          c=[r for r in rows if r.get('event')=='workflow_dispatch' and datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))>=cutoff]
          c.sort(key=lambda r:r['createdAt'],reverse=True); print('' if not c else c[0]['databaseId'])
          PY
          )"
          dispatched=false
          if [ -z "$existing" ]; then
            gh workflow run historical-altseason-cfgi-enrichment.yml --repo "$GITHUB_REPOSITORY" --ref main -f fingerprint="$FP"
            dispatched=true
            sleep 4
            gh run list --repo "$GITHUB_REPOSITORY" --workflow historical-altseason-cfgi-enrichment.yml --limit 10 --json databaseId,event,createdAt,status,conclusion,url,headSha > /tmp/runs.json
            existing="$(ACTIVATION_TIME="$activation_time" python - <<'PY'
          import json, os
          from datetime import datetime
          rows=json.load(open('/tmp/runs.json')); cutoff=datetime.fromisoformat(os.environ['ACTIVATION_TIME'].replace('Z','+00:00'))
          c=[r for r in rows if r.get('event')=='workflow_dispatch' and datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))>=cutoff]
          c.sort(key=lambda r:r['createdAt'],reverse=True); assert c,'v3 MARKET gap-fill dispatch not visible'; print(c[0]['databaseId'])
          PY
            )"
          fi
          test -n "$existing"
          gh run view "$existing" --repo "$GITHUB_REPOSITORY" --json databaseId,event,createdAt,status,conclusion,url,headSha > /tmp/selected.json
          ACTIVATION_TIME="$activation_time" DISPATCHED="$dispatched" python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.load(open('/tmp/selected.json')); budget=json.load(open('/tmp/budget.json'))
          out={
            'contract':'CFGI_V3_MARKET_GAPFILL_LAUNCH_RECEIPT_v1',
            'input_fingerprint_sha256':'6106f96285a66f03e324595b68c1777627f4d83e5e70dc6c64d9b1022e544a8f',
            'launcher_activation_time':os.environ['ACTIVATION_TIME'],
            'enrichment_run_id':r['databaseId'],
            'enrichment_run_url':r['url'],
            'enrichment_run_created_at':r['createdAt'],
            'enrichment_run_head_sha':r['headSha'],
            'enrichment_run_status_at_receipt':r['status'],
            'enrichment_run_conclusion_at_receipt':r.get('conclusion'),
            'dispatched_by_this_launcher':os.environ['DISPATCHED']=='true',
            'budget_plan':budget['plan'],
            'expected_current_worst_case_credits':budget['expected_current_worst_case_credits'],
            'projected_cumulative_credits':budget['projected_cumulative_credits'],
            'projected_credits_remaining':budget['projected_credits_remaining'],
            'requested_symbols':['MARKET'],
            'forbidden_repurchase_symbols':['BTC','ETH'],
            'research_only':True,
          }
          Path('/tmp/CFGI_V3_MARKET_GAPFILL_LAUNCH_RECEIPT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('V3_MARKET_GAPFILL_RUN_BOUND',r['databaseId'],r['status'],r['url'])
          PY
          echo 'receipt_required=true' >> "$GITHUB_OUTPUT"
      - name: Upload durable launch receipt carrier
        if: steps.resolve.outputs.receipt_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cfgi-v3-market-gapfill-launch-receipt
          path: /tmp/CFGI_V3_MARKET_GAPFILL_LAUNCH_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
