name: Historical Altseason CFGI Recovery Launch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfgi-recovery-launch-once.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: historical-altseason-cfgi-recovery-launch-once
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify cumulative recovery authorization
        run: |
          set -euo pipefail
          python scripts/historical_lab/cfgi_recovery_budget_guard.py | tee /tmp/budget.json
          python - <<'PY'
          import json
          from pathlib import Path
          fp='6106f96285a66f03e324595b68c1777627f4d83e5e70dc6c64d9b1022e544a8f'
          ledger=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json').read_text())
          reservation=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION.json').read_text())
          budget=json.loads(Path('/tmp/budget.json').read_text())
          assert fp==ledger['input_fingerprint_sha256']==reservation['input_fingerprint_sha256']==budget['input_fingerprint_sha256']
          assert ledger['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER_v1'
          assert ledger['cumulative_actual_credits_used']==5259
          assert ledger['owner_authorized_recovery_attempts']==1
          assert ledger['automatic_retry_after_failure'] is False
          assert len(ledger['attempts'])==1 and ledger['attempts'][0]['run_id']==32419588422
          assert budget['status']=='PASS' and not budget['blockers']
          print('DIRECT_RECOVERY_PRELAUNCH_PASS',budget['projected_cumulative_credits'],budget['projected_credits_remaining'])
          PY

      - name: Dispatch only when no post-failure recovery run exists
        env:
          GH_TOKEN: ${{ github.token }}
          FP: 6106f96285a66f03e324595b68c1777627f4d83e5e70dc6c64d9b1022e544a8f
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow historical-altseason-cfgi-enrichment.yml --limit 20 --json databaseId,event,createdAt,status,conclusion,url > /tmp/runs.json
          existing="$(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          cutoff=datetime.fromisoformat('2026-08-20T21:28:58+00:00')
          rows=json.loads(Path('/tmp/runs.json').read_text())
          c=[r for r in rows if r.get('event')=='workflow_dispatch' and datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))>cutoff]
          c.sort(key=lambda r:r['createdAt'],reverse=True)
          if c:
              print(c[0]['databaseId'])
          PY
          )"
          if [ -n "$existing" ]; then
            echo "RECOVERY_ALREADY_EXISTS run_id=$existing - no dispatch"
            exit 0
          fi
          gh workflow run historical-altseason-cfgi-enrichment.yml --repo "$GITHUB_REPOSITORY" --ref main -f fingerprint="$FP"
          sleep 4
          gh run list --repo "$GITHUB_REPOSITORY" --workflow historical-altseason-cfgi-enrichment.yml --limit 10 --json databaseId,event,createdAt,status,conclusion,url | tee /tmp/post.json
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          cutoff=datetime.fromisoformat('2026-08-20T21:28:58+00:00')
          rows=json.loads(Path('/tmp/post.json').read_text())
          c=[r for r in rows if r.get('event')=='workflow_dispatch' and datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))>cutoff]
          c.sort(key=lambda r:r['createdAt'],reverse=True)
          assert c,'recovery dispatch not visible after request'
          print('DIRECT_RECOVERY_DISPATCH_CONFIRMED',c[0]['databaseId'],c[0]['status'],c[0]['url'])
          PY
