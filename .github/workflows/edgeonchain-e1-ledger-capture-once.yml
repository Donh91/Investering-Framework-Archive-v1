name: EdgeOnchain E1 Ledger Capture Once

on:
  push:
    branches:
      - agent/task-20260914-edge-e0-identity-probe
    paths:
      - '.github/workflows/edgeonchain-e1-ledger-capture-once.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture immutable public Polymarket ledger
        id: capture
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p out
          python scripts/experiments/polymarket_external_strategy_capture_v1.py \
            --query EdgeOnchain \
            --output-root out 2>&1 | tee capture.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build run receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('out')
          manifests = sorted(root.glob('*/MANIFEST.json'))
          identities = sorted(root.glob('*/identity.json'))
          receipt = {
              'contract': 'EDGEONCHAIN_E1_LEDGER_CAPTURE_RUN_v1',
              'authority': 'RESEARCH_READ_ONLY',
              'collector': 'scripts/experiments/polymarket_external_strategy_capture_v1.py',
              'capture_exit_code': '${{ steps.capture.outputs.exit_code }}',
              'manifest_present': bool(manifests),
              'identity_present': bool(identities),
              'portfolio_execution': False,
              'exchange_signing': False,
              'order_routing': False,
          }
          if manifests:
              b = manifests[-1].read_bytes()
              receipt['manifest_path'] = str(manifests[-1])
              receipt['manifest_sha256'] = hashlib.sha256(b).hexdigest()
              receipt['manifest'] = json.loads(b)
          if identities:
              b = identities[-1].read_bytes()
              receipt['identity_path'] = str(identities[-1])
              receipt['identity_sha256'] = hashlib.sha256(b).hexdigest()
              identity = json.loads(b)
              receipt['proxy_wallet'] = identity.get('proxy_wallet')
          Path('RUN_RECEIPT.json').write_text(json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n')
          print(json.dumps({k: receipt.get(k) for k in ['contract','capture_exit_code','manifest_present','identity_present','proxy_wallet','manifest_sha256']}, sort_keys=True))
          PY
      - name: Upload immutable ledger artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeonchain-e1-ledger-capture-${{ github.run_id }}
          path: |
            out/
            capture.log
            RUN_RECEIPT.json
          retention-days: 30
      - name: Fail closed when collector did not complete
        if: steps.capture.outputs.exit_code != '0'
        run: |
          echo 'Collector did not complete; partial bytes are retained for bounded repair.'
          exit 1
