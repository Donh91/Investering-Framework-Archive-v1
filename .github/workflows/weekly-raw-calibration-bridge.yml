name: Weekly Raw Calibration Bridge

on:
  schedule:
    - cron: '45 23 * * 0'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  build-weekly-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build weekly calibration pack
        run: python scripts/daily_capture/build_weekly_calibration.py --input-root 03_DAILY_CAPTURE_LOGS/captures --output-root 03_DAILY_CAPTURE_LOGS/weekly
      - name: Commit weekly handoff with verified readback
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 03_DAILY_CAPTURE_LOGS/weekly
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: build weekly raw calibration pack"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
