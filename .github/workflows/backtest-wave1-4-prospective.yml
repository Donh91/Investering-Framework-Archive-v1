name: Backtest Wave 1.4 Prospective Accumulation

on:
  pull_request:
    paths:
      - "backtest_engine/prospective.py"
      - "backtest_engine/source_resilience.py"
      - "backtest_engine/shadow_scoreboard.py"
      - "backtest_engine/repository_audit.py"
      - "backtest_engine/blind_dual_run.py"
      - "backtest_engine/cli.py"
      - "tests/backtest_engine/test_wave1_4_prospective.py"
      - "tests/backtest_engine/test_blind_dual_run_v2.py"
      - "04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/prospective_receipts/**"
      - "04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/live_source_resilience/**"
      - "04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/shadow_dual_run/**"
      - "04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/prospective_dual_run_v2/**"
      - ".github/workflows/backtest-wave1-4-prospective.yml"
  push:
    branches: [main]
    paths:
      - "04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/prospective_receipts/**"
      - "04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/live_source_resilience/**"
      - "04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/shadow_dual_run/**"
      - "04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/prospective_dual_run_v2/**"
  schedule:
    - cron: "35 17 * * *"
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-prospective-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run prospective accumulation and blinded collection tests
        run: |
          PYTHONPATH=. python -m unittest tests.backtest_engine.test_wave1_4_prospective tests.backtest_engine.test_blind_dual_run_v2 -v
      - name: Validate immutable v1 ledger structure without comparison scoring
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from backtest_engine.shadow_scoreboard import validate_shadow_run
          path=Path('04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/shadow_dual_run/RUN_LEDGER_v1.json')
          ledger=json.loads(path.read_text())
          runs=ledger.get('runs',[])
          errors=[]
          for group in runs:
              errors.extend(validate_shadow_run(group))
          assert not errors, errors
          print(json.dumps({'v1_run_groups':len(runs),'structure':'PASS','comparison_metrics_calculated':False},sort_keys=True))
          PY
      - name: Audit blinded v2 coverage metadata only
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from backtest_engine.blind_dual_run import coverage_progress, load_pair_receipts
          root=Path('04_MARKET_LEARNING/backtests/framework_backtest_readiness_build_v1/prospective_dual_run_v2/evidence/runs')
          rows=load_pair_receipts(root)
          result=coverage_progress(rows)
          result['engineering_status']='PASS_ACTIVE'
          result['comparison_metrics_calculated']=False
          result['b2_analysis_authorized']=False
          Path('prospective_audit.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-accumulation-audit
          path: prospective_audit.json
          retention-days: 14
          if-no-files-found: error
