name: Daily Director Recovery Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-director-recovery-dispatch-once.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-director:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-daily-director-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Dispatch current Daily Director definition
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(gh run list --workflow '.github/workflows/daily-director-shadow.yml' --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run '.github/workflows/daily-director-shadow.yml' --ref main
          for attempt in $(seq 1 30); do
            after="$(gh run list --workflow '.github/workflows/daily-director-shadow.yml' --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$after" != "0" ] && [ "$after" != "$before" ]; then
              echo "director_run_id=$after" >> "$GITHUB_OUTPUT"
              echo "DAILY_DIRECTOR_DISPATCHED run_id=$after"
              exit 0
            fi
            sleep 2
          done
          echo 'fresh Daily Director workflow_dispatch did not become visible' >&2
          exit 1
      - name: Record dispatched run identity
        env:
          RUN_ID: ${{ steps.dispatch.outputs.director_run_id }}
        run: |
          set -euo pipefail
          test -n "$RUN_ID"
          printf 'daily_director_run_id=%s\n' "$RUN_ID"
