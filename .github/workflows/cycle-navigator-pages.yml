name: Deploy Cycle Navigator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "05_CYCLE_NAVIGATOR/site/**"
      - "05_CYCLE_NAVIGATOR/LATEST_CYCLE_NAVIGATOR_POINTER.json"
      - "05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_MACHINE_PACKAGE.json"
      - "05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_SCORECARD.json"
      - "05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_FORECAST_FREEZE.json"
      - "05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_INTERNAL_PRECISION_FREEZE.json"
      - "05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_SITE_PUBLIC_FREEZE_RECEIPT.json"
      - "05_CYCLE_NAVIGATOR/forward_range_ledger/CN_FORWARD_RANGE_LEDGER_v2.jsonl"
      - "scripts/cycle_navigator/build_public_live_precision.py"
      - "05_CYCLE_NAVIGATOR/published/**"
      - "05_CYCLE_NAVIGATOR/public_series/**"
      - "05_CYCLE_NAVIGATOR/public_scorecards/**"
      - "05_CYCLE_NAVIGATOR/CANONICAL_SCORE_AND_LINEAGE.md"
      - "05_CYCLE_NAVIGATOR/track_record/CN_TRACK_RECORD_LEDGER.jsonl"
      - "scripts/cycle_navigator/validate_public_series.py"
      - "04_MARKET_LEARNING/handlekompas/LATEST.json"
      - "04_MARKET_LEARNING/handlekompas/official/**"
      - "04_MARKET_LEARNING/handlekompas/event_refresh/**"
      - "04_MARKET_LEARNING/entry_signals/LATEST.json"
      - ".github/workflows/cycle-navigator-pages.yml"
  workflow_run:
    # Rebuild after the successful hourly owner chain reaches Native Handlekompas.
    # This works even though framework-data-bot commits use GITHUB_TOKEN and therefore
    # cannot recursively trigger push-based workflows.
    workflows:
      - Native Handlekompas
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cycle-navigator-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_run'
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate public series identity and score lineage
        run: python3 scripts/cycle_navigator/validate_public_series.py
      - name: Validate public product contract
        run: node 05_CYCLE_NAVIGATOR/site/validate-v2.mjs
      - name: Build privacy-safe public bundle
        run: node 05_CYCLE_NAVIGATOR/site/build-public.mjs
      - name: Validate Compass bundle contract
        run: node 05_CYCLE_NAVIGATOR/site/validate-compass-site-v5.mjs
      - name: Bind canonical weekly scorecard
        run: node 05_CYCLE_NAVIGATOR/site/build-score-bundle.mjs
      - name: Add bounded live observation
        run: node 05_CYCLE_NAVIGATOR/site/build-live-observation.mjs
      - name: Build public live Price Range precision
        run: python3 scripts/cycle_navigator/build_public_live_precision.py
      - name: Build and verify social preview
        run: node 05_CYCLE_NAVIGATOR/site/build-social-card.mjs
      - name: Verify final investor-facing shell and privacy
        run: |
          grep -q 'public-product.js' 05_CYCLE_NAVIGATOR/site/dist/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/history-scoreboard.json
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/public-product.css
          test -f 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.css
          test -f 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          test -f 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.css
          test -f 05_CYCLE_NAVIGATOR/site/dist/data/public-freezes/index.json
          grep -q 'precision-accountability.js' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'Frozen Monday. Scored live. Verified after close.' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'WEEKLY TRACK RECORD' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'SITE SOURCE OF RECORD' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'FROZEN MONDAY PATH' 05_CYCLE_NAVIGATOR/site/dist/precision-accountability.js
          grep -q 'CN_PUBLIC_LIVE_PRICE_PRECISION_v1' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          grep -q '"freshness_sla_minutes": 90' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          grep -q '"refresh_cadence": "HOURLY_OWNER_CHAIN"' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
          ! grep -q 'weekly-score.js' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'market-compass-premium.js' 05_CYCLE_NAVIGATOR/site/dist/index.html
          grep -q 'CYCLE NAVIGATOR · CONCLUSION' 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.js
          grep -q 'HOW THIS READING IS BUILT' 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.js
          grep -q '2–3 WEEKS' 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.js
          grep -q 'SO WHAT?' 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.js
          grep -q 'MEME RISK' 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.js
          grep -q "MICROCAPS','MEMES" 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.js
          grep -q 'premium-compass-installed>.action-hero' 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.css
          grep -q 'APPLIES NOW · NEXT GOVERNED REVIEW' 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.js
          grep -q 'premium-action-window' 05_CYCLE_NAVIGATOR/site/dist/market-compass-premium.css
          grep -q 'data-tab="now"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'data-tab="path"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'data-tab="proof"' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'MARKET COMPASS' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Bitcoin → microcaps' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'WEEKLY STRUCTURAL ROTATION CONTEXT' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'CAPITAL ROTATION · HERE AND NOW' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'MARKET COMPASS UPDATED' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'completed forecasts with score evidence' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'SINCE LAST CN' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'WHY THIS CALL' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'LAST COMPLETED FORECAST' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'HISTORICAL WEEKLY AVERAGE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Price Range' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'MARKET / STRUCTURE' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'Waiting for evidence' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          grep -q 'What the system actually watches' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'HANDLEKOMPAS ·' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -q 'MASTER MONDAY →' 05_CYCLE_NAVIGATOR/site/dist/public-product.js
          ! grep -R 'Donh91\|Investering-Framework-Archive-v1\|week_dir' 05_CYCLE_NAVIGATOR/site/dist/data/latest.json
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Cycle Navigator public bundle only
        uses: actions/upload-pages-artifact@v4
        with:
          path: 05_CYCLE_NAVIGATOR/site/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
