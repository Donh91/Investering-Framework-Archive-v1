name: Deploy Cycle Navigator to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "05_CYCLE_NAVIGATOR/site/**"
      - "05_CYCLE_NAVIGATOR/LATEST_CYCLE_NAVIGATOR_POINTER.json"
      - "05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_MACHINE_PACKAGE.json"
      - "05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_SCORECARD.json"
      - "05_CYCLE_NAVIGATOR/weekly/**/CYCLE_NAVIGATOR_INTERNAL_PRECISION_FREEZE.json"
      - "05_CYCLE_NAVIGATOR/published/**"
      - "05_CYCLE_NAVIGATOR/track_record/CN_TRACK_RECORD_LEDGER.jsonl"
      - ".github/workflows/cycle-navigator-pages.yml"
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cycle-navigator-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build privacy-safe public bundle
        run: node 05_CYCLE_NAVIGATOR/site/build-public.mjs

      - name: Add bounded current-week evidence observation
        run: node 05_CYCLE_NAVIGATOR/site/build-live-precision.mjs

      - name: Bind canonical weekly scorecard to public snapshot
        run: node 05_CYCLE_NAVIGATOR/site/build-score-bundle.mjs

      - name: Add hidden Apple design prototype
        run: node 05_CYCLE_NAVIGATOR/site/build-apple-prototype.mjs

      - name: Add shortcut, live evidence and Path to Mania layer
        run: node 05_CYCLE_NAVIGATOR/site/build-shortcut.mjs

      - name: Validate live evidence authority firewall
        run: node 05_CYCLE_NAVIGATOR/site/validate-live-precision.mjs

      - name: Build and verify social preview
        run: node 05_CYCLE_NAVIGATOR/site/build-social-card.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Cycle Navigator public bundle only
        uses: actions/upload-pages-artifact@v4
        with:
          path: 05_CYCLE_NAVIGATOR/site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
