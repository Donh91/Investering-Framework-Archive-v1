name: Cycle Navigator Post-Merge Proof Once

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  dispatch-proof:
    if: contains(github.event.head_commit.message, '[CN706_PROOF]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current-main Cycle Navigator weekly publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cycle-navigator-weekly-publication.yml --repo "$GITHUB_REPOSITORY" --ref main
