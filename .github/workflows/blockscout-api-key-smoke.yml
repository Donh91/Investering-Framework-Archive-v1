name: Blockscout API key smoke

on:
  push:
    paths:
      - ".github/workflows/blockscout-api-key-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
    steps:
      - name: Test Blockscout PRO API key
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, urllib.error

          key = os.environ.get("BLOCKSCOUT_API_KEY", "")
          if not key:
              print("BLOCKSCOUT_API_KEY_MISSING")
              raise SystemExit(2)

          base = "https://api.blockscout.com/1/api/v2/addresses/0xd8da6bf26964af9d7eed9e03e53415d37aa96045/transactions"
          url = base + "?" + urllib.parse.urlencode({"apikey": key})
          req = urllib.request.Request(url, headers={"User-Agent": "Investering-Framework-Blockscout-Smoke/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  status = resp.status
                  body = resp.read()
          except urllib.error.HTTPError as exc:
              status = exc.code
              body = exc.read()
          except Exception as exc:
              print("BLOCKSCOUT_REQUEST_ERROR", type(exc).__name__, str(exc)[:300])
              raise

          print("HTTP_STATUS", status)
          try:
              payload = json.loads(body)
          except Exception:
              print("NON_JSON_RESPONSE", body[:300].decode("utf-8", "replace"))
              raise SystemExit(3)

          if isinstance(payload, dict):
              print("TOP_LEVEL_KEYS", sorted(payload.keys()))
              items = payload.get("items")
              if isinstance(items, list):
                  print("ITEM_COUNT_PAGE", len(items))
                  if items and isinstance(items[0], dict):
                      print("FIRST_TX_HASH", items[0].get("hash"))
              if payload.get("message") is not None:
                  print("MESSAGE", str(payload.get("message"))[:300])
              if payload.get("error") is not None:
                  print("ERROR", str(payload.get("error"))[:300])

          if status != 200:
              raise SystemExit(4)
          if not isinstance(payload, dict) or not isinstance(payload.get("items"), list):
              raise SystemExit(5)

          print("BLOCKSCOUT_PRO_API_SMOKE_PASS")
          PY
