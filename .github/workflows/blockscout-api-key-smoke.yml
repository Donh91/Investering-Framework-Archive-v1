name: Blockscout API key smoke

on:
  push:
    paths:
      - ".github/workflows/blockscout-api-key-smoke.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Test Blockscout PRO API key
        id: smoke
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          out = {
              "contract": "BLOCKSCOUT_API_KEY_SMOKE_v1",
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "endpoint": "https://api.blockscout.com/1/api/v2/addresses/0xd8da6bf26964af9d7eed9e03e53415d37aa96045/transactions",
              "secret_present": bool(os.environ.get("BLOCKSCOUT_API_KEY")),
              "http_status": None,
              "json_response": False,
              "items_count_page": None,
              "success": False,
              "error": None,
          }

          key = os.environ.get("BLOCKSCOUT_API_KEY", "")
          if not key:
              out["error"] = "BLOCKSCOUT_API_KEY_MISSING"
          else:
              url = out["endpoint"] + "?" + urllib.parse.urlencode({"apikey": key})
              req = urllib.request.Request(url, headers={"User-Agent": "Investering-Framework-Blockscout-Smoke/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      out["http_status"] = resp.status
                      body = resp.read()
              except urllib.error.HTTPError as exc:
                  out["http_status"] = exc.code
                  body = exc.read()
              except Exception as exc:
                  out["error"] = f"{type(exc).__name__}: {str(exc)[:200]}"
                  body = b""

              if body:
                  try:
                      payload = json.loads(body)
                      out["json_response"] = True
                      if isinstance(payload, dict):
                          out["top_level_keys"] = sorted(payload.keys())
                          items = payload.get("items")
                          if isinstance(items, list):
                              out["items_count_page"] = len(items)
                          if payload.get("message") is not None:
                              out["message"] = str(payload.get("message"))[:200]
                          if payload.get("error") is not None:
                              out["api_error"] = str(payload.get("error"))[:200]
                  except Exception:
                      out["error"] = out["error"] or "NON_JSON_RESPONSE"

              out["success"] = (
                  out["secret_present"]
                  and out["http_status"] == 200
                  and out["json_response"]
                  and isinstance(out["items_count_page"], int)
              )

          path = pathlib.Path("research/api_agent/mcp/BLOCKSCOUT_API_KEY_SMOKE_LATEST.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, indent=2, sort_keys=True) + "\n")
          print(json.dumps({k: v for k, v in out.items() if k != "endpoint"}, sort_keys=True))
          PY

      - name: Commit smoke receipt
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/api_agent/mcp/BLOCKSCOUT_API_KEY_SMOKE_LATEST.json
          git diff --cached --quiet && exit 0
          git commit -m "test: record Blockscout API key smoke"
          git push
