name: Intraday Execution Gate

on:
  pull_request:
    paths:
      - '02_DATA_PING/protocols/2026-08-30__raw-shadow-direction-confidence-indicator-v1__canonical.md'
      - '04_MARKET_LEARNING/intraday_execution/**'
      - 'scripts/intraday_execution/**'
      - 'scripts/daily_capture/build_hourly_sequence.py'
      - 'tests/learning/test_intraday_execution_row_shape.py'
      - 'tests/learning/test_direction_confidence_validator.py'
      - 'tests/learning/test_intraday_research_eligibility.py'
      - '.github/workflows/hourly-sequence-capture.yml'
      - '.github/workflows/intraday-execution-research.yml'
      - '.github/workflows/intraday-execution-gate.yml'
      - '06_RESEARCH_LAB/forward_tests/2026-07-10__active-test-registry__canonical.md'
      - '06_RESEARCH_LAB/historical_altseason_pullback_v1/INTRADAY_EXECUTION_COWORK_ADDENDUM.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Compile intraday, validator and hourly owner engines
        run: |
          python -m py_compile scripts/daily_capture/build_hourly_sequence.py
          python -m py_compile scripts/intraday_execution/intraday_execution_research.py
          python -m py_compile scripts/intraday_execution/shadow_direction_confidence.py
          python -m py_compile scripts/intraday_execution/validate_direction_confidence.py
      - name: Run focused intraday direction, calibration, validator and eligibility tests
        run: |
          python -m pytest \
            tests/learning/test_intraday_execution_row_shape.py \
            tests/learning/test_direction_confidence_validator.py \
            tests/learning/test_intraday_research_eligibility.py -q
      - name: Validate registered prospective owner against repository state
        run: python scripts/intraday_execution/validate_direction_confidence.py --root .
      - name: Validate research-only contracts and cadence ordering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('04_MARKET_LEARNING/intraday_execution/config.json').read_text())
          assert cfg['contract']=='INTRADAY_EXECUTION_RESEARCH_CONFIG_v1'
          a=cfg['authority']
          assert a == {
              'research_only': True,
              'portfolio_execution': False,
              'canonical_market_state': False,
              'automatic_rule_changes': False,
              'promotion_requires_separate_review': True,
              'historical_findings_max_classification': 'FORWARD_TEST',
          }

          eligibility=cfg['research_eligibility']
          assert eligibility['status']=='ENTRY_LEDGER_FORWARD_ONLY_OBSERVATION_CONTEXT_v1'
          assert eligibility['eligibility_semantics']=='COLLECTION_ELIGIBILITY_ONLY_NOT_MARKET_PERMISSION'
          assert eligibility['required_source_owner']=='HOURLY_SEQUENCE_COMPLETED_UTC_1H'
          assert eligibility['required_entry_contract']=='ENTRY_SIGNAL_LATEST_v1'
          assert eligibility['required_entry_state']=='WAIT'
          assert eligibility['required_promotion_status']=='FORWARD_ONLY_NOT_PROMOTION_READY'
          assert eligibility['required_permits_active_state'] is False
          assert eligibility['required_breadth_entry_permission']=='RETIRED_ZERO_WEIGHT'
          assert eligibility['entry_signal_role']=='FORWARD_ONLY_OBSERVATION_CONTEXT_NO_ELIGIBILITY_FROM_LEGACY_ACTIVE'
          assert eligibility['breadth_role']=='DESCRIPTIVE_RESEARCH_CONTEXT_ZERO_EXECUTION_WEIGHT'
          assert eligibility['direction_confidence_role']=='SHADOW_DIAGNOSTIC_ONLY_NO_REGIME_OR_ENTRY_PERMISSION'
          assert eligibility['canonical_market_permission_required'] is False
          assert eligibility['fail_closed_on_missing_or_incompatible_entry_owner'] is True

          legacy=cfg['legacy_execution_event_ledger']
          assert legacy['status']=='FROZEN_PENDING_SEPARATE_REGISTERED_TEST'
          assert legacy['new_event_creation'] is False
          assert legacy['outcome_maturation'] is False
          assert legacy['historical_rows_preserved'] is True

          shadow=cfg['shadow_direction_confidence']
          assert shadow['status']=='SHADOW_ONLY_PROSPECTIVE'
          assert shadow['registered_test_id']=='INTRADAY_DIRECTION_CONFIDENCE_V1'
          assert shadow['active_test_registry_path']=='06_RESEARCH_LAB/forward_tests/2026-07-10__active-test-registry__canonical.md'
          assert shadow['validator_path']=='scripts/intraday_execution/validate_direction_confidence.py'
          assert shadow['scorer_path']=='scripts/intraday_execution/shadow_direction_confidence.py'
          assert shadow['benchmark']=='NO_SKILL_DIRECTION_PROBABILITY_0_50_BRIER_0_25'
          assert shadow['forward_eligibility_rule']=='POST_REGISTRATION_CANONICAL_MAIN_ONLY'
          assert shadow['pre_registration_rows']=='INELIGIBLE_QA_OR_INITIALIZATION_ONLY'
          assert shadow['source_owner_required_cadence_hours']==1
          assert shadow['source_owner_required_semantics']=='COMPLETED_UTC_1H_CANDLES'
          assert shadow['forecast_horizon_semantics']=='CLOSED_1H_CANDLE_CLOSE_OBSERVATION_TO_EXACT_HORIZON_DUE'
          assert shadow['outcome_evidence_rule']=='EXACT_DUE_CLOSED_1H_OWNER_CANDLE_ONLY_NO_LATER_PRICE_SUBSTITUTION'
          assert shadow['probability_rule']=='NO_NUMERIC_PROBABILITY_BEFORE_MINIMUM_INDEPENDENT_SAMPLE'
          assert shadow['automatic_signal_reweighting'] is False
          assert shadow['microcap_direction']=='NO_EDGE_UNTIL_ELIGIBLE_OWNER_EXISTS'

          registry=Path(shadow['active_test_registry_path']).read_text()
          for token in [
              'test_id: INTRADAY_DIRECTION_CONFIDENCE_V1',
              'status: ACTIVE_REGISTRATION_REPAIR_WARMUP',
              'benchmark: NO_SKILL_DIRECTION_PROBABILITY_0_50_BRIER_0_25',
              'validator_path: scripts/intraday_execution/validate_direction_confidence.py',
              'scorer_path: scripts/intraday_execution/shadow_direction_confidence.py',
              'authority: SHADOW_ONLY_RESEARCH_NON_CANONICAL',
              'FIRST_CANONICAL_MAIN_RUN_AFTER_REGISTRATION_MERGE_AND_VALIDATOR_PASS',
          ]:
              assert token in registry, token

          research=Path('scripts/intraday_execution/intraday_execution_research.py').read_text()
          assert 'obs.get("entry_state") != "GRADUATED_ALTCOIN_TOPUP_ACTIVE"' not in research
          assert 'research_context_eligibility' in research
          assert 'ENTRY_OWNER_NOT_FORWARD_ONLY_WAIT_CONTEXT' in research
          assert 'BREADTH_ENTRY_PERMISSION_NOT_RETIRED_ZERO_WEIGHT' in research
          assert 'if event_policy["outcome_maturation"]: mature_events' in research
          assert 'if event_policy["new_event_creation"]: open_event' in research

          hourly=Path('.github/workflows/hourly-sequence-capture.yml').read_text()
          intraday=Path('.github/workflows/intraday-execution-research.yml').read_text()
          assert "cron: '5 * * * *'" in hourly
          assert "timezone: 'UTC'" in hourly
          assert 'Materialize each newly completed UTC 1H owner candle' in hourly
          assert "cron: '15 * * * *'" in intraday
          assert "timezone: 'UTC'" in intraday
          assert 'Run after the UTC-aligned hourly owner' in intraday
          assert 'validate_direction_confidence.py --root . --write-receipt' in intraday
          assert intraday.index('Validate prospective direction rows before persistence') < intraday.index('Commit prospective observations')

          text=Path('04_MARKET_LEARNING/intraday_execution/README.md').read_text()
          assert 'research_only: true' in text
          assert 'portfolio_execution: false' in text
          addendum=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/INTRADAY_EXECUTION_COWORK_ADDENDUM.md').read_text()
          for token in ['HOLD','false-trim','FORWARD_TEST','Top100']:
              assert token in addendum, token
          protocol=Path('02_DATA_PING/protocols/2026-08-30__raw-shadow-direction-confidence-indicator-v1__canonical.md').read_text()
          for token in [
              'NO_EDGE',
              'IKKE KALIBRERET',
              'microcap',
              'HIGH_ASSURANCE_99_ELIGIBLE',
              'candle-open timestamp',
              'exact closed owner candle ending at `due_at_utc`',
              'later price substitution for exact horizon: FORBIDDEN',
          ]:
              assert token in protocol, token
          print('INTRADAY_EXECUTION_GATE_PASS')
          PY
