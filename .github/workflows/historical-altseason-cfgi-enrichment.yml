name: Historical Altseason CFGI Enrichment

on:
  workflow_dispatch:
    inputs:
      fingerprint:
        description: Exact deterministic paid-input fingerprint already reserved on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: historical-altseason-cfgi-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify fingerprint, frozen free stage and paid provenance before secret access
        env:
          DISPATCH_FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          set -euo pipefail
          root=06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts
          reservation=00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION.json
          ledger=00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json
          for f in FREE_BULK_ARTIFACT_POINTER.json EPISODE_CATALOG.json FREE_SOURCE_AUDIT.json TIME_INTEGRITY_AUDIT.json FREE_EVENT_PATHS.jsonl.gz FREE_EVENT_PATHS_COVERAGE.json; do test -s "$root/$f"; done
          test -s "$reservation"; test -s "$ledger"; test ! -e "$root/alt_hourly_panel.csv.gz"; test -n "$DISPATCH_FINGERPRINT"
          python scripts/historical_lab/cfgi_idempotency_guard.py --mode check > /tmp/cfgi_reservation_guard.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts')
          cfg=json.loads(Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/config.json').read_text())
          ti=json.loads((root/'TIME_INTEGRITY_AUDIT.json').read_text()); src=json.loads((root/'FREE_SOURCE_AUDIT.json').read_text()); pc=json.loads((root/'FREE_EVENT_PATHS_COVERAGE.json').read_text()); pointer=json.loads((root/'FREE_BULK_ARTIFACT_POINTER.json').read_text())
          reservation=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION.json').read_text()); ledger=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json').read_text()); guard=json.loads(Path('/tmp/cfgi_reservation_guard.json').read_text()); dispatched=os.environ['DISPATCH_FINGERPRINT']
          assert reservation['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_RESERVATION_v1'
          assert dispatched==reservation['input_fingerprint_sha256']==guard['input_fingerprint_sha256']==ledger['input_fingerprint_sha256']
          assert ledger['contract']=='HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER_v2'
          assert ledger['automatic_retry_after_failure'] is False and ledger['owner_authorized_market_gapfill_attempts']==1
          assert sum(int(x.get('actual_credits_used_from_headers') or 0) for x in ledger['attempts'])==ledger['cumulative_actual_credits_used']==10518
          assert reservation['authority']['research_only'] is True and reservation['authority']['portfolio_execution'] is False and reservation['authority']['automatic_promotion'] is False
          assert pointer['contract']=='HISTORICAL_ALTSEASON_FREE_BULK_POINTER_v1' and pointer['storage_class']=='GITHUB_ACTIONS_ARTIFACT_BULK_NOT_GIT' and pointer['required_for_cowork_bundle'] is True
          assert ti['status']=='PASS' and ti['strict_timestamp_lags'] is True and ti['cross_window_lags_forbidden'] is True and ti['row_offsets_treated_as_hours'] is False
          assert src['authority']['research_only'] is True and src['authority']['portfolio_execution'] is False
          transport=src.get('historical_transport_policy') or {}; assert transport.get('contract')=='BINANCE_VISION_ARCHIVE_FIRST_TRANSPORT_v1' and transport.get('archive_first') is True and transport.get('pre_2022_resolution')=='DAILY_ARCHIVES_PREFERRED' and transport.get('deterministic_timestamp_reordering') is True and transport.get('analysis_semantics_changed') is False
          assert pc['events']; a=cfg['authority']; assert a['research_only'] is True and a['portfolio_execution'] is False and a['canonical_market_state'] is False and a['automatic_rule_changes'] is False and a['promotion_requires_separate_review'] is True
          print('FINAL_DISPATCH_BOUND_RESERVED_FREE_STAGE_READY_FOR_CFGI',dispatched,len(pc['events']))
          PY

      - name: Enforce cumulative gap-fill budget before secret access
        run: python scripts/historical_lab/cfgi_recovery_budget_guard.py | tee /tmp/cfgi_recovery_budget_guard.json

      - name: Verify CFGI secret only after provenance and budget gates pass
        env:
          CFGI_API_KEY: ${{ secrets.CFGI_API_KEY }}
        run: test -n "$CFGI_API_KEY"

      - name: Check v3 paid-input idempotency
        id: idempotency
        run: |
          set -euo pipefail
          python scripts/historical_lab/cfgi_idempotency_guard.py --mode check | tee /tmp/cfgi_idempotency.json
          skip_paid="$(python - <<'PY'
          import json
          print(str(json.loads(open('/tmp/cfgi_idempotency.json').read())['skip_paid']).lower())
          PY
          )"
          echo "skip_paid=$skip_paid" >> "$GITHUB_OUTPUT"

      - name: Run only the authorized missing-symbol paid work
        id: paid
        if: steps.idempotency.outputs.skip_paid != 'true'
        env:
          CFGI_API_KEY: ${{ secrets.CFGI_API_KEY }}
        run: |
          python scripts/historical_lab/cfgi_targeted_backfill.py
          python scripts/historical_lab/cfgi_idempotency_guard.py --mode stamp

      - name: Reuse complete v3 enrichment without new paid calls
        if: steps.idempotency.outputs.skip_paid == 'true'
        run: echo 'CFGI_IDEMPOTENT_REUSE_V3_PASS - no paid CFGI request executed'

      - name: Materialize no-lookahead 1h as-of CFGI event paths
        if: steps.paid.outcome == 'success' || steps.idempotency.outputs.skip_paid == 'true'
        run: python scripts/historical_lab/cfgi_readiness_postprocess_v3.py

      - name: Rebuild cumulative billing receipt from durable prior-attempt ledger
        if: steps.paid.outcome == 'success' || steps.idempotency.outputs.skip_paid == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts'); ledger=json.loads(Path('00_ARCHIVE_CONTROL/research_runtime/HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json').read_text()); billing=json.loads((root/'CFGI_BILLING.json').read_text())
          prior=int(ledger['cumulative_actual_credits_used']); current=int(billing.get('actual_credits_used_from_headers') or 0); cumulative=prior+current
          out={'contract':'HISTORICAL_ALTSEASON_CFGI_CUMULATIVE_BILLING_v1','input_fingerprint_sha256':ledger['input_fingerprint_sha256'],'prior_actual_credits_used':prior,'current_actual_credits_used':current,'cumulative_actual_credits_used':cumulative,'hard_cap_credits':ledger['hard_cap_credits'],'final_credits_remaining':billing.get('final_credits_remaining'),'minimum_reserve_credits':ledger['minimum_reserve_credits'],'prior_attempt_count':len(ledger['attempts']),'current_attempt_scope':billing.get('billing_scope'),'current_run_id':'${{ github.run_id }}','status':'PASS' if cumulative<=ledger['hard_cap_credits'] and int(billing.get('final_credits_remaining') or -1)>=ledger['minimum_reserve_credits'] else 'FAIL'}
          assert out['status']=='PASS',out; (root/'CFGI_CUMULATIVE_BILLING.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload paid diagnostics before final assertion
        if: steps.paid.outcome == 'success' || steps.idempotency.outputs.skip_paid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: historical-altseason-cfgi-paid-diagnostics-${{ github.run_id }}
          path: 06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Validate v3 no-lookahead readiness and governance
        if: steps.paid.outcome == 'success' || steps.idempotency.outputs.skip_paid == 'true'
        run: |
          python - <<'PY'
          import gzip,json
          from datetime import datetime
          from pathlib import Path
          root=Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts'); cfg=json.loads(Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/config.json').read_text()); g=cfg['cfgi']; a=cfg['authority']; b=json.loads((root/'CFGI_BILLING.json').read_text()); cb=json.loads((root/'CFGI_CUMULATIVE_BILLING.json').read_text()); fc=json.loads((root/'CFGI_FIELD_COVERAGE.json').read_text()); m=json.loads((root/'RESEARCH_READINESS_MANIFEST.json').read_text())
          assert b['status']=='PASS' and b.get('input_fingerprint_sha256'); assert cb['status']=='PASS' and cb['cumulative_actual_credits_used']<=g['expected_credit_hard_cap'] and cb['final_credits_remaining']>=g['minimum_credits_reserve']
          assert fc['contract']=='CFGI_FIELD_COVERAGE_v3' and fc['time_alignment_contract']=='CFGI_ASOF_1H_NO_LOOKAHEAD_v1' and fc['diagnostics']['no_lookahead'] is True and fc['diagnostics']['no_interpolation'] is True and fc['diagnostics']['no_silent_fallback'] is True
          with gzip.open(root/'CFGI_EVENT_PATHS.jsonl.gz','rt',encoding='utf-8') as fh: rows=[json.loads(x) for x in fh if x.strip()]
          assert len(rows)==fc['expected_symbol_hours']==726
          for r in rows:
              if r['observed_asof_available']:
                  exp=datetime.fromisoformat(r['expected_timestamp_utc'].replace('Z','+00:00')); obs=datetime.fromisoformat(r['observed_timestamp_utc'].replace('Z','+00:00')); assert obs<=exp; assert 0<=r['availability_age_seconds']<3600; assert r['lookahead_seconds']==0
          assert m['contract']=='RESEARCH_READINESS_MANIFEST_v3' and m['readiness_verdict']=='PASS' and not m['blockers']; assert m['cfgi']['time_alignment_contract']=='CFGI_ASOF_1H_NO_LOOKAHEAD_v1' and m['cfgi']['no_lookahead'] is True
          for sym in g['symbols']: assert m['cfgi']['symbol_coverage'][sym]['asof_available_slots']>0,sym
          assert m['automatic_promotion'] is False and m['historical_findings_max_classification']=='FORWARD_TEST'; assert a['research_only'] is True and a['portfolio_execution'] is False and a['canonical_market_state'] is False and a['automatic_rule_changes'] is False
          print('CFGI_RESEARCH_READINESS_V3_PASS',m['cfgi']['asof_available_symbol_hours'],m['cfgi']['missing_asof_symbol_hours'],cb['cumulative_actual_credits_used'],cb['final_credits_remaining'])
          PY

      - name: Upload validated CFGI v3 research stage
        if: steps.paid.outcome == 'success' || steps.idempotency.outputs.skip_paid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: historical-altseason-cfgi-stage
          path: 06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
