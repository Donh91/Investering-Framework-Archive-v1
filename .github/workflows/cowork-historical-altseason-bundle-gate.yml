name: Cowork Historical Altseason Bundle Gate

on:
  pull_request:
    paths:
      - 'scripts/cowork/build_historical_altseason_bundle.py'
      - 'scripts/cowork/build_historical_altseason_bundle_max_value.py'
      - '07_PROMPTS_AND_AGENTS/historical_altseason_pullback/**'
      - '.github/workflows/cowork-historical-altseason-bundle.yml'
      - '.github/workflows/cowork-historical-altseason-bundle-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Cowork builders
        run: |
          python -m py_compile scripts/cowork/build_historical_altseason_bundle.py
          python -m py_compile scripts/cowork/build_historical_altseason_bundle_max_value.py
      - name: Validate provider-bounded compact handoff contract statically
        run: |
          python - <<'PY'
          from pathlib import Path
          wrapper=Path('scripts/cowork/build_historical_altseason_bundle_max_value.py').read_text()
          workflow=Path('.github/workflows/cowork-historical-altseason-bundle.yml').read_text()
          limitation=Path('07_PROMPTS_AND_AGENTS/historical_altseason_pullback/COWORK_CFGI_PROVIDER_LIMITATION.md').read_text()
          research_map=Path('07_PROMPTS_AND_AGENTS/historical_altseason_pullback/COWORK_GITHUB_RESEARCH_MAP.md').read_text()
          sidecar=Path('07_PROMPTS_AND_AGENTS/historical_altseason_pullback/COWORK_OPUS5_MAX_VALUE_SIDECARS.md').read_text()
          launch=Path('07_PROMPTS_AND_AGENTS/historical_altseason_pullback/COWORK_OPUS5_LAUNCH_INSTRUCTION.md').read_text()
          for token in ['COWORK_GITHUB_NATIVE_HANDOFF_MANIFEST_v3_1_PROVIDER_BOUNDED','CFGI_MARKET_PROVIDER_TERMINAL_RECEIPT.json','NOT_TESTABLE_PROVIDER_UNAVAILABLE','conservative_cumulative_credit_upper_bound','base.validate_readiness','CFGI_ASOF_1H_NO_LOOKAHEAD_v1']:
              assert token in wrapper,token
          for token in ['NOT_TESTABLE_PROVIDER_UNAVAILABLE','Do not fill','Do not request or recommend another paid CFGI retry','13,181','FORWARD_TEST']:
              assert token in limitation,token
          for token in ['GitHub is the authoritative research universe','FREE_BULK_ARTIFACT_POINTER.json','04_MARKET_LEARNING/intraday_execution/','scripts/intraday_execution/']:
              assert token in research_map,token
          for token in ['Signal Interaction Atlas','Lead/Lag and Information Timing Atlas','Failure and Opportunity-Cost Laboratory','Minimal Sufficient Signal Stack','Research Opportunity Register','PRE_SPECIFIED','POST_HOC_DISCOVERY']:
              assert token in sidecar,token
          for token in ['COWORK_GITHUB_RESEARCH_MAP.md','COWORK_OPUS5_MASTER_RESEARCH_PROMPT.md','COWORK_OPUS5_MAX_VALUE_SIDECARS.md','INTRADAY_EXECUTION_COWORK_ADDENDUM.md','HISTORICAL_ALTSEASON_COWORK_OPUS5_RESEARCH_PACKAGE.zip','FORWARD_TEST']:
              assert token in launch,token
          assert 'COWORK_GITHUB_NATIVE_HANDOFF_V3_1_PROVIDER_BOUNDED_PASS' in workflow
          assert 'COWORK_CFGI_PROVIDER_LIMITATION.md' in workflow
          assert 'CFGI_MARKET_PROVIDER_TERMINAL_RECEIPT.json' in workflow
          assert "endswith('alt_hourly_panel.csv.gz')" in workflow
          base=Path('scripts/cowork/build_historical_altseason_bundle.py').read_text()
          for token in ['RESEARCH_READINESS_MANIFEST.json','CFGI_BILLING.json','readiness_verdict','FORWARD_TEST','minimum_credits_reserve','expected_credit_hard_cap']:
              assert token in base,token
          print('COWORK_GITHUB_NATIVE_STATIC_GATE_V3_1_PROVIDER_BOUNDED_PASS')
          PY
