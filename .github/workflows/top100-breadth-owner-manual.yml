name: Top100 Breadth Owner Manual
on:
  pull_request:
    paths:
      - 'scripts/data_terminal/top100_breadth_owner_collector.py'
      - 'tests/data_terminal/test_top100_breadth_owner_collector.py'
      - '.github/workflows/top100-breadth-owner-manual.yml'
      - 'research/programs/MARKET_ANTICIPATION_RESEARCH_PROGRAM_v1/WP04C5E_EXECUTION_STATE_v1.json'
  workflow_dispatch:
    inputs:
      mode:
        description: tests or explicit live breadth owner capture
        required: true
        default: tests
        type: choice
        options: [tests, live]
permissions:
  contents: read
jobs:
  owner-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.data_terminal.test_top100_breadth_owner_collector
      - run: python -m py_compile scripts/data_terminal/top100_breadth_owner_collector.py
      - name: Run explicit live capture
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
        run: python scripts/data_terminal/top100_breadth_owner_collector.py --output-dir top100-breadth-owner-output
      - name: Verify live artifact
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
        run: python -c "import importlib.util,pathlib; p=pathlib.Path('scripts/data_terminal/top100_breadth_owner_collector.py'); s=importlib.util.spec_from_file_location('m',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); r=m.verify(pathlib.Path('top100-breadth-owner-output')); print(r); raise SystemExit(0 if r['status']=='PASS' else 1)"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
        with:
          name: top100-breadth-owner-${{ github.run_id }}
          path: top100-breadth-owner-output/
          retention-days: 14
