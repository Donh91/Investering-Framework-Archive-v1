# framework-lifecycle: RETIRED
# framework-lifecycle-reason: CFGI_PROVIDER_TERMINAL_STATE_NO_ADDITIONAL_PAID_RETRY
# framework-lifecycle-since: 2026-08-21T09:30:00Z
name: Historical Altseason CFGI Recovery Trigger (retired verification)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-altseason-cfgi-recovery-retired-verification
  cancel-in-progress: false

jobs:
  verify-terminal-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify paid recovery is terminal and no retry is authorized
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          runtime = Path('00_ARCHIVE_CONTROL/research_runtime')
          terminal = json.loads((runtime / 'CFGI_MARKET_PROVIDER_TERMINAL_RECEIPT.json').read_text())
          ledger = json.loads((runtime / 'HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER.json').read_text())
          auth = json.loads((runtime / 'HISTORICAL_ALTSEASON_CFGI_MARKET_GAPFILL_AUTHORIZATION.json').read_text())
          readiness = json.loads(Path('06_RESEARCH_LAB/historical_altseason_pullback_v1/artifacts/RESEARCH_READINESS_MANIFEST.json').read_text())

          assert terminal['contract'] == 'CFGI_MARKET_PROVIDER_TERMINAL_RECEIPT_v1'
          assert terminal['status'] == 'TERMINAL_PROVIDER_NO_HISTORICAL_ROWS'
          assert terminal['no_additional_paid_retry_authorized'] is True
          assert terminal['no_fill'] is True
          assert terminal['no_interpolation'] is True
          assert terminal['no_proxy_substitution'] is True

          assert ledger['contract'] == 'HISTORICAL_ALTSEASON_CFGI_PAID_ATTEMPT_LEDGER_v2'
          assert ledger['automatic_retry_after_failure'] is False
          assert ledger['owner_authorized_recovery_attempts'] == 1
          assert ledger['cumulative_actual_credits_used'] == 10518

          assert auth['automatic_retry_after_failure'] is False
          assert auth['max_attempts'] == 1
          assert auth['allowed_symbols'] == ['MARKET']

          assert readiness['contract'] == 'RESEARCH_READINESS_MANIFEST_v3_1_PROVIDER_BOUNDED'
          assert readiness['readiness_verdict'] == 'PASS'
          assert readiness['blockers'] == []
          assert readiness['cfgi']['market_historical_availability'] == 'NOT_TESTABLE_PROVIDER_UNAVAILABLE'

          print('CFGI_RECOVERY_TERMINAL_NO_RETRY_PASS')
          PY
