name: Temporary Automation Health Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/health/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print exact automation health blockers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/health/build_automation_health.py \
            --workflow-root .github/workflows \
            --json-output /tmp/automation-health.json \
            --md-output /tmp/automation-health.md || true
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/automation-health.json').read_text())
          print('STATUS=', data.get('status'))
          print('BLOCKER_COUNT=', len(data.get('blockers', [])))
          print('WARNING_COUNT=', len(data.get('warnings', [])))
          print('BLOCKERS_BEGIN')
          for blocker in data.get('blockers', []):
              print(blocker)
          print('BLOCKERS_END')
          PY
