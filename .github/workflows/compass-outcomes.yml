name: Official Compass Outcomes

on:
  pull_request:
    paths:
      - '.github/workflows/compass-outcomes.yml'
      - 'scripts/learning/compass_outcomes.py'
      - 'scripts/data_ping/native_handlekompas.py'
      - 'scripts/learning/shadow_compass_v2.py'
      - 'tests/learning/test_shadow_compass_v2.py'
      - 'scripts/learning/strategic_compass.py'
      - 'scripts/learning/strategic_compass_outcomes.py'
      - 'scripts/learning/shadow_compass_v2_outcomes.py'
      - 'scripts/learning/shadow_compass_v2_compare.py'
      - 'scripts/api_agent/build_weekly_calibration_context.py'
      - 'tests/api_agent/test_weekly_calibration_context_v4.py'
      - 'tests/learning/test_compass_outcomes.py'
      - 'scripts/learning/compass_rolling_14d_audit.py'
      - 'tests/learning/test_compass_rolling_14d_audit.py'
      - '04_MARKET_LEARNING/handlekompas/research/rolling_14d/**'
      - '04_MARKET_LEARNING/handlekompas/research/2026-10-12__task2_synthetic_oracle_v1.mjs'
      - '04_MARKET_LEARNING/handlekompas/research/2026-10-13__task2_r1_no_hindsight_admission_oracle_v1.mjs'
      - '04_MARKET_LEARNING/handlekompas/research/2026-10-13__TASK2_R0_PINNED_PUBLIC_SOURCE_INVENTORY_v1.json'
      - '04_MARKET_LEARNING/handlekompas/research/2026-10-13__TASK2_R0_PUBLIC_SOURCE_CENSUS_AND_R1_ORACLE_RECEIPT_v1.json'
      - '04_MARKET_LEARNING/handlekompas/research/2026-10-13__TASK2_FULL_STACK_AUDIT_EXECUTION_GATE_v1.json'
      - 'tests/learning/test_strategic_compass.py'
      - 'tests/learning/test_strategic_compass_outcomes.py'
      - 'tests/learning/test_shadow_compass_v2_outcomes.py'
      - 'tests/learning/test_shadow_compass_v2_compare.py'
      - '04_MARKET_LEARNING/handlekompas/SCORING_CONTRACT_v1.md'
      - '04_MARKET_LEARNING/handlekompas/SCORING_CONTRACT_v3.md'
      - '04_MARKET_LEARNING/handlekompas/STRATEGIC_COMPASS_SCORING_CONTRACT_v1_1.md'
      - '04_MARKET_LEARNING/handlekompas/shadow_v2/SCORING_CONTRACT_v1.md'
      - '04_MARKET_LEARNING/handlekompas/shadow_v2/SCORING_CONTRACT_v2.md'
      - '04_MARKET_LEARNING/handlekompas/shadow_v2/SCORING_CONTRACT_v3.md'
  schedule:
    # Mature eligible 12h/72h/168h outcomes after the hourly owner sequence settles.
    - cron: '27 * * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Read-only PR validation must never consume the single serialized production-writer slot.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'framework-main-writer' }}
  queue: max
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test maturity guardrails
        run: |
          python -m py_compile scripts/learning/compass_outcomes.py scripts/learning/strategic_compass.py scripts/learning/strategic_compass_outcomes.py scripts/learning/shadow_compass_v2_outcomes.py scripts/learning/shadow_compass_v2_compare.py
          python -m unittest tests.learning.test_compass_outcomes -v
          python -m unittest tests.learning.test_compass_rolling_14d_audit -v
          python -m unittest tests.learning.test_strategic_compass -v
          python -m unittest tests.learning.test_strategic_compass_outcomes -v
          python -m unittest tests.learning.test_shadow_compass_v2_outcomes -v
          python -m unittest tests.learning.test_shadow_compass_v2 -v
          python -m unittest tests.learning.test_shadow_compass_v2_compare -v
          python -m unittest tests.api_agent.test_weekly_calibration_context_v4 -v
          python scripts/learning/compass_outcomes.py --dry-run > /tmp/compass-maturity.json
          python scripts/learning/shadow_compass_v2_outcomes.py --now-utc 1970-01-01T00:00:00Z > /tmp/shadow-direct-exec.json
          python scripts/learning/shadow_compass_v2_compare.py > /tmp/shadow-official-compare-pr.json
          python scripts/learning/compass_rolling_14d_audit.py --scope rolling14 --asof 2026-10-31T07:00:00Z --output 04_MARKET_LEARNING/handlekompas/research/rolling_14d/ci/CI_ROLLING14.json
          python scripts/learning/compass_rolling_14d_audit.py --scope all --asof 2026-10-31T07:00:00Z --output 04_MARKET_LEARNING/handlekompas/research/rolling_14d/ci/CI_ALL_HISTORY.json
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("04_MARKET_LEARNING/handlekompas/research/rolling_14d/ci")
          for name in ("CI_ROLLING14","CI_ALL_HISTORY"):
              r=json.loads((base/f"{name}.json").read_text())
              assert r["automatic_model_reweighting"] is False
              assert r["trade_permission"]=="NONE"
              assert r["first_known_publication_verified"] is False
              assert r["scientific_decision"]["admissible_automatic_calibration_changes"]==[]
              assert r["all_issuances"]["forecasts"] >= r["deduplicated_12h_slots"]["forecasts"]
              print(json.dumps({"audit":name,
                 "files":r["all_issuances"]["forecasts"],
                 "dedup_12h":r["deduplicated_12h_slots"]["forecasts"],
                 "actions":r["all_issuances"]["actions"],
                 "risk_states":r["all_issuances"]["risk_states"],
                 "horizons":r["deduplicated_12h_slots"]["horizons"]},
                 sort_keys=True))
          PY
          python - <<'PY'
          import json
          d=json.load(open('/tmp/compass-maturity.json'))
          assert d['contract']=='OFFICIAL_DAILY_COMPASS_MATURITY_RUN_v1'
          s=json.load(open('/tmp/shadow-direct-exec.json'))
          assert s['contract']=='SHADOW_COMPASS_V2_MATURITY_RUN_v1'
          cmp=json.load(open('/tmp/shadow-official-compare-pr.json'))
          assert cmp['contract']=='SHADOW_OFFICIAL_COMPASS_COMPARISON_REPORT_v1'
          assert cmp['pairing_contract']=='SHADOW_OFFICIAL_PAIRING_v1'
          assert cmp['authority']['automatic_promotion'] is False
          for pair in cmp.get('pairs',[]):
              assert pair['integrity']['status']=='PASS'
              assert pair['integrity']['selection_used_outcome_correctness'] is False
              assert pair['integrity']['selection_used_realized_return'] is False
          from pathlib import Path
          shadow_v2=Path('04_MARKET_LEARNING/handlekompas/shadow_v2/SCORING_CONTRACT_v2.md').read_text()
          assert 'SHADOW_COMPASS_V2_SCORING_v2' in shadow_v2
          assert 'closest completed hourly close within one hour of target' in shadow_v2
          assert 'No automatic promotion.' in shadow_v2
          official_v3=Path('04_MARKET_LEARNING/handlekompas/SCORING_CONTRACT_v3.md').read_text()
          shadow_v3=Path('04_MARKET_LEARNING/handlekompas/shadow_v2/SCORING_CONTRACT_v3.md').read_text()
          assert 'OFFICIAL_DAILY_COMPASS_SCORING_v3' in official_v3
          assert 'SHADOW_COMPASS_V2_SCORING_v3' in shadow_v3
          for document in (official_v3, shadow_v3):
              assert 'timestamp_utc + 1h' in document
              assert 'source_window_end_utc' in document
              assert 'batch' in document.lower()
              assert 'first-knowledge' in document.lower()
          from scripts.learning.compass_outcomes import SCORING_CONTRACT as official_id
          from scripts.learning.shadow_compass_v2_outcomes import SCORING_CONTRACT as shadow_id
          assert official_id == 'OFFICIAL_DAILY_COMPASS_SCORING_v3'
          assert shadow_id == 'SHADOW_COMPASS_V2_SCORING_v3'
          from pathlib import Path
          native_source=Path('scripts/data_ping/native_handlekompas.py').read_text()
          shadow_source=Path('scripts/learning/shadow_compass_v2.py').read_text()
          assert '"scoring_contract": "OFFICIAL_DAILY_COMPASS_SCORING_v3"' in native_source
          assert '"scoring_contract": "SHADOW_COMPASS_V2_SCORING_v3"' in shadow_source
          assert 'PENDING_SCORING_CONTRACT_MISMATCH' in Path('scripts/learning/compass_outcomes.py').read_text()
          assert 'PENDING_SCORING_CONTRACT_MISMATCH' in Path('scripts/learning/shadow_compass_v2_outcomes.py').read_text()
          PY

  mature:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mature eligible outcomes only
        run: |
          python -m unittest tests.learning.test_compass_outcomes -v
          python -m unittest tests.learning.test_strategic_compass_outcomes -v
          python scripts/learning/compass_outcomes.py | tee /tmp/compass-outcomes.json
          python scripts/learning/strategic_compass_outcomes.py | tee /tmp/strategic-compass-outcomes.json
          python scripts/learning/shadow_compass_v2_outcomes.py | tee /tmp/shadow-compass-v2-outcomes.json
          python scripts/learning/shadow_compass_v2_compare.py | tee /tmp/shadow-official-comparison.json
      - name: Publish bounded daily rolling 14d and Sunday full-history research
        shell: bash
        run: |
          set -euo pipefail
          local_day=$(TZ=Europe/Copenhagen date +%F)
          year=$(TZ=Europe/Copenhagen date +%Y)
          month=$(TZ=Europe/Copenhagen date +%m)
          day=$(TZ=Europe/Copenhagen date +%d)
          iso_asof=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base="04_MARKET_LEARNING/handlekompas/research/rolling_14d"
          target="$base/daily/$year/$month/$day/${local_day}_ROLLING14.json"
          if [ ! -f "$target" ]; then
            python scripts/learning/compass_rolling_14d_audit.py --scope rolling14 --asof "$iso_asof" --output "$target" | tee /tmp/compass-rolling14.json
          else
            echo "{\"status\":\"ALREADY_PUBLISHED\",\"scope\":\"rolling14\"}" > /tmp/compass-rolling14.json
          fi
          if [ "$(TZ=Europe/Copenhagen date +%u)" = "7" ]; then
            weekly="$base/all_history/$year/$month/$day/${local_day}_FULL_HISTORY.json"
            if [ ! -f "$weekly" ]; then
              python scripts/learning/compass_rolling_14d_audit.py --scope all --asof "$iso_asof" --output "$weekly" | tee /tmp/compass-all-history.json
            fi
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("04_MARKET_LEARNING/handlekompas/research/rolling_14d").rglob("*.json"):
              if not ("daily" in p.parts or "all_history" in p.parts):
                  continue
              if p.stat().st_size > 8_000_000:
                  raise SystemExit("OVERSIZE_RESEARCH_REPORT")
          PY
      - name: Verify forecasts were not rewritten
        shell: bash
        run: |
          git diff --exit-code -- 04_MARKET_LEARNING/handlekompas/official/daily 04_MARKET_LEARNING/handlekompas/strategic/anchors 04_MARKET_LEARNING/handlekompas/shadow_v2/forecasts || {
            echo 'Forecast freeze changed during scoring'; exit 1;
          }
          python - <<'PY'
          import json
          d=json.load(open('/tmp/compass-outcomes.json'))
          for row in d.get('results',[]):
              if row.get('status')=='MATURED':
                  assert row.get('horizon') in {'12h','72h','168h'}
                  assert row.get('outcome_sha256')
          cmp=json.load(open('/tmp/shadow-official-comparison.json'))
          assert cmp['contract']=='SHADOW_OFFICIAL_COMPASS_COMPARISON_REPORT_v1'
          assert cmp['pairing_contract']=='SHADOW_OFFICIAL_PAIRING_v1'
          assert cmp['authority']['automatic_promotion'] is False
          assert cmp['authority']['portfolio_execution'] is False
          for pair in cmp.get('pairs',[]):
              assert pair['integrity']['selection_used_outcome_correctness'] is False
              assert pair['integrity']['selection_used_realized_return'] is False
              assert pair['cautions']['aggregate_winner_authorized'] is False
          PY
      - name: Commit mature outcomes with remote readback
        shell: bash
        run: |
          git config user.name framework-learning-bot
          git config user.email framework-learning-bot@users.noreply.github.com
          if [ -d 04_MARKET_LEARNING/handlekompas/official/outcomes ]; then
            git add 04_MARKET_LEARNING/handlekompas/official/outcomes
          fi
          if [ -d 04_MARKET_LEARNING/handlekompas/strategic/outcomes ]; then
            git add 04_MARKET_LEARNING/handlekompas/strategic/outcomes
          fi
          if [ -d 04_MARKET_LEARNING/handlekompas/shadow_v2/outcomes ]; then
            git add 04_MARKET_LEARNING/handlekompas/shadow_v2/outcomes
          fi
          if [ -d 04_MARKET_LEARNING/handlekompas/research/rolling_14d/daily ]; then
            git add 04_MARKET_LEARNING/handlekompas/research/rolling_14d/daily
          fi
          if [ -d 04_MARKET_LEARNING/handlekompas/research/rolling_14d/all_history ]; then
            git add 04_MARKET_LEARNING/handlekompas/research/rolling_14d/all_history
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "learning: mature Compass outcomes ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-compass-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-outcomes.json
            /tmp/strategic-compass-outcomes.json
            /tmp/shadow-compass-v2-outcomes.json
            /tmp/shadow-official-comparison.json
            /tmp/compass-rolling14.json
            /tmp/compass-all-history.json
          retention-days: 30
          if-no-files-found: warn

  incident:
    needs: mature
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Open Compass outcome incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "AUTOMATION FAILURE: Official Compass Outcomes ${GITHUB_RUN_ID}" --body "Compass maturity/scoring failed. Frozen forecasts must remain unchanged. Run: ${GITHUB_RUN_ID}" || true
