name: Remediation Maturation Gate

on:
  pull_request:
    paths:
      - 'scripts/remediation/**'
      - 'tests/remediation/**'
      - 'research/codex/transitions/*.json'
      - '.github/workflows/remediation-maturation*.yml'
      - '00_FMOS/REMEDIATION_MATURATION_ENGINE_v1.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.remediation.test_remediation_maturation -v
      - run: python -m unittest tests.remediation.test_remediation_maturation_api_blind_health -v
      - run: python -m unittest tests.remediation.test_codex_research_merge_reconciliation -v
      - run: python -m unittest tests.remediation.test_reconcile_direct_landing -v
      - run: python -m unittest tests.remediation.test_mission_convergence -v
      - run: python scripts/remediation/mission_convergence.py validate-active-completions --repo-root .
      - run: python -m py_compile scripts/remediation/build_remediation_maturation.py scripts/remediation/write_transition_receipt.py scripts/remediation/merge_codex_research_intake.py scripts/remediation/reconcile_codex_research_merges.py scripts/remediation/mission_convergence.py
