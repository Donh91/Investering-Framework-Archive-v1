name: Daily Slow Cycle Shadow

on:
  schedule:
    - cron: '37 6 * * *'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-main-writer
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect World Bank Copper/Gold shadow owner
        run: |
          python scripts/data_terminal/world_bank_copper_gold_owner.py \
            --output-root 03_DAILY_CAPTURE_LOGS/slow_cycle/copper_gold
      - name: Collect NFCICREDIT live shadow context
        run: |
          python scripts/data_terminal/fred_csv_collector.py \
            --series NFCICREDIT \
            --output-dir /tmp/nfcicredit
          mkdir -p 03_DAILY_CAPTURE_LOGS/slow_cycle/nfcicredit
          cp /tmp/nfcicredit/latest_terminal_state.json 03_DAILY_CAPTURE_LOGS/slow_cycle/nfcicredit/LATEST.json
      - name: Run preregistered NFCICREDIT ALFRED T-1 once when key is available
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        shell: bash
        run: |
          if [ -z "${FRED_API_KEY:-}" ]; then
            echo 'FRED_API_KEY unavailable; T-1 remains NOT_RUN rather than fabricating history.'
            exit 0
          fi
          if [ -f 03_DAILY_CAPTURE_LOGS/slow_cycle/nfcicredit/T1_PRE_TOP_v1.json ]; then
            echo 'Frozen T-1 result already exists; not rerunning against moving vintages.'
            exit 0
          fi
          python scripts/research/fetch_nfcicredit_alfred_vintages.py \
            --output-csv /tmp/nfcicredit_t1_vintages.csv \
            --provenance 03_DAILY_CAPTURE_LOGS/slow_cycle/nfcicredit/T1_ALFRED_PROVENANCE_v1.json
          python scripts/research/nfcicredit_t1_pre_top_falsification.py \
            --csv /tmp/nfcicredit_t1_vintages.csv \
            --output 03_DAILY_CAPTURE_LOGS/slow_cycle/nfcicredit/T1_PRE_TOP_v1.json
      - name: Run deterministic tests
        run: python -m pytest -q tests/data_terminal/test_world_bank_copper_gold_owner.py tests/research/test_hy_oas_pre_top_falsification.py tests/research/test_copper_gold_slow_cycle_event_study.py tests/research/test_nfcicredit_t1_pre_top_falsification.py
      - name: Commit only changed slow-cycle evidence
        shell: bash
        run: |
          git config user.name 'framework-data-bot'
          git config user.email 'framework-data-bot@users.noreply.github.com'
          git add 03_DAILY_CAPTURE_LOGS/slow_cycle
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update slow-cycle shadow evidence ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
