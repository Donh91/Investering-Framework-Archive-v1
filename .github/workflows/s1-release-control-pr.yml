name: S1 Release Control PR validation

on:
  pull_request:
    paths:
      - "tools/s1-release-control/**"
      - ".github/workflows/s1-release-control-pr.yml"

permissions:
  contents: read

concurrency:
  group: s1-release-control-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-and-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only browser boundaries
        run: node --test tools/s1-release-control/test-static.mjs
      - name: Assert read-only versioned machine schemas
        run: node --test tools/s1-release-control/test-contract-schema-v1.mjs
      - name: Validate eight research lanes contract without dispatch
        run: python3 scripts/research/validate_parallel_research_manifest_v1.py tools/s1-release-control/RESEARCH_PARALLEL_LANES_V1.json
  projection-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-bound fail-closed projection
        run: node --test tools/s1-release-control/test-projection-v1.mjs
      - name: Verify immutable canonical agent source packet and adversarial negatives
        run: node --test tools/s1-release-control/test-agent-context-v1.mjs
      - name: Verify agent-first action brief never grants release or autonomous S1 credit
        run: node --test tools/s1-release-control/test-agent-brief-v1.mjs
      - name: Real integrated original-owner agent brief readback, advisory-only
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import {buildAgentBrief} from './tools/s1-release-control/agent-brief-v1.mjs';
          const brief=await buildAgentBrief();
          const receipt={
            schema:brief.schema,
            state:brief.state,
            source_alignment:brief.source_alignment,
            archive_main_sha:brief.archive_main_sha,
            canonical_source_count:brief.source_coverage.canonical_sources.length,
            original_action_hint_count:brief.original_actions.length,
            codex_ready_hint_count:brief.original_codex_ready_hints.length,
            pr_triage_count:brief.public_pr_triage.length,
            original_s1_action_limit:brief.existing_s1_action_limit,
            release_authority:brief.invariant.release_permission,
            natural_S1_closure_proven:brief.existing_actors.S1.natural_closure_proven,
            bridge:brief.source_coverage.private_bridge
          };
          console.log('S1_AGENT_BRIEF_LIVE_READBACK',JSON.stringify(receipt));
          if(brief.state!=='OBSERVED_ADVISORY'||brief.invariant.release_permission!==false)process.exitCode=1;
          NODE
      - name: Source-bound live S1 agent brief, public GET only and advisory
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import {buildAgentBrief} from './tools/s1-release-control/agent-brief-v1.mjs';
          const b=await buildAgentBrief({sources:['handoff','codex_ready'],maxPerRepo:1});
          const report={
            schema:b.schema,
            source_alignment:b.source_alignment,
            state:b.state,
            archive_main_sha:b.archive_main_sha,
            observed_at_utc:b.observed_at_utc,
            original_sources:b.source_coverage.canonical_sources.map(x=>({id:x.id,status:x.status,freshness:x.freshness,blob_sha:x.blob_sha})),
            original_codex_ready_hint_count:b.original_codex_ready_hints.length,
            original_pr_sample_count:b.public_pr_triage.length,
            source_issues:b.source_coverage.public_github_repository?.source_issues||[],
            strict_action_limit:b.existing_s1_action_limit,
            standalone_release_permission:b.invariant.release_permission,
            private_bridge:b.source_coverage.private_bridge,
            natural_s1_proven:b.existing_actors.S1.natural_closure_proven
          };
          console.log('S1_PUBLIC_AGENT_BRIEF_READBACK',JSON.stringify(report));
          // This is an advisory source observation, not a required CI/merge gate.
          // For an accessible exact-source sample, require a real canonical blob.
          if(b.source_alignment!=='MATCHED'||report.original_sources.some(x=>x.status!=='OBSERVED')||
             report.original_pr_sample_count<1)process.exitCode=1;
          NODE

  standalone-browser-and-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate S1 standalone source, independent from Cycle Navigator
        run: |
          test -f tools/s1-release-control/index.html
          test -f tools/s1-release-control/release-core.js
          ! grep -q "05_CYCLE_NAVIGATOR/site/dist" tools/s1-release-control/test-browser.mjs
          ! grep -q "s1-release-control" 05_CYCLE_NAVIGATOR/site/build-public.mjs
      - name: Actual Chrome desktop and mobile behavior with API unavailable
        run: node tools/s1-release-control/test-browser.mjs
      - name: Actual Chrome desktop and mobile behavior with deterministic GitHub success
        env:
          S1_BROWSER_MODE: mock
        run: node tools/s1-release-control/test-browser.mjs
      - name: Prepare standalone public bundle only
        env:
          GITHUB_HEAD_REF_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p /tmp/s1-site
          cp tools/s1-release-control/index.html /tmp/s1-site/index.html
          cp tools/s1-release-control/release-core.js /tmp/s1-site/release-core.js
          touch /tmp/s1-site/.nojekyll
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const sourceHead=process.env.GITHUB_HEAD_REF_SHA;
          if(!/^[a-f0-9]{40}$/i.test(sourceHead||''))throw Error('SOURCE_HEAD_SHA40_MISSING');
          const files=['index.html','release-core.js'];
          const bytes=Object.fromEntries(files.map(file=>[file,createHash('sha256')
             .update(readFileSync('/tmp/s1-site/'+file)).digest('hex')]));
          const packet={contract:'S1_STANDALONE_STATIC_BUNDLE_v1',source_repo:'Donh91/Investering-Framework-Archive-v1',
            source_head_sha:sourceHead,content_sha256:bytes,read_only:true,agent_authority:false,
            production_deployed:false,private_data_included:false};
          writeFileSync('/tmp/s1-site/release-identity.json',JSON.stringify(packet,null,2)+'\\n');
          NODE
          (cd /tmp/s1-site && sha256sum index.html release-core.js release-identity.json > SHA256SUMS)
          test -f /tmp/s1-site/SHA256SUMS
      - name: Attach independent GitHub Pages candidate, not deployed
        uses: actions/upload-artifact@v4
        with:
          name: s1-standalone-site-${{ github.event.pull_request.head.sha }}
          path: /tmp/s1-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
