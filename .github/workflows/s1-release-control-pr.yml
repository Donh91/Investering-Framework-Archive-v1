name: S1 Release Control PR validation

on:
  pull_request:
    paths:
      - "tools/s1-release-control/**"
      - ".github/workflows/s1-release-control-pr.yml"
      - "05_CYCLE_NAVIGATOR/site/build-public.mjs"

permissions:
  contents: read

concurrency:
  group: s1-release-control-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-and-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only browser boundaries
        run: node --test tools/s1-release-control/test-static.mjs
      - name: Validate eight research lanes contract without dispatch
        run: python3 scripts/research/validate_parallel_research_manifest_v1.py tools/s1-release-control/RESEARCH_PARALLEL_LANES_V1.json
  projection-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-bound fail-closed projection
        run: node --test tools/s1-release-control/test-projection-v1.mjs
      - name: Public GitHub live readback, advisory and quota-aware
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import {buildProjection} from './tools/s1-release-control/projection-v1.mjs';
          const report=await buildProjection({
            repositories:['Donh91/Investering-Framework-Archive-v1'],
            maxPerRepo:1
          });
          const x=report.source_repositories[0];
          console.log('S1_PUBLIC_LIVE_SOURCE_READBACK',JSON.stringify({
            observed:x.observed,
            main_sha:x.main_sha,
            observed_at:report.observed_at,
            item_count:report.items.length,
            source_issues:x.source_issues,
            partial:report.partial,
            credential_mode:'ANONYMOUS_GET_ONLY',
            merge_authority:report.release_authority
          }));
          if(!x.observed||report.partial||!report.items.length)process.exitCode=1;
          NODE

  pages-isolation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build existing Cycle Navigator without publishing
        run: node 05_CYCLE_NAVIGATOR/site/build-public.mjs
      - name: Assert isolated S1 bundle and unchanged CN routes
        run: |
          test -f 05_CYCLE_NAVIGATOR/site/dist/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/legacy/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/vnext/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/s1-release-control/index.html
          test -f 05_CYCLE_NAVIGATOR/site/dist/s1-release-control/release-core.js
          cmp tools/s1-release-control/index.html 05_CYCLE_NAVIGATOR/site/dist/s1-release-control/index.html
          cmp tools/s1-release-control/release-core.js 05_CYCLE_NAVIGATOR/site/dist/s1-release-control/release-core.js
          grep -q 'RELEASE CONTROL' 05_CYCLE_NAVIGATOR/site/dist/s1-release-control/index.html
      - name: Verify actual desktop and mobile Chrome runtime with denied GitHub API
        run: node tools/s1-release-control/test-browser.mjs
      - name: Attach isolated S1 static release candidate, not published
        uses: actions/upload-artifact@v4
        with:
          name: s1-release-control-${{ github.event.pull_request.head.sha }}
          path: 05_CYCLE_NAVIGATOR/site/dist/s1-release-control/
          if-no-files-found: error
          retention-days: 3
